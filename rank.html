        .line-btn {

        /* 分頁：比什麼、哪個部門 */

        .book button {

        /* 四本（身價・榜出現以後）：375 寬放不下原本的字距，縮一點 */

        @media (min-width: 400px) { .book.four { gap: 1rem; } .book.four button { letter-spacing: .2em; } }

        /* 部門：七個一排擠不下，排成兩排（一排四個） */
        .seg.is-small { display: grid; grid-template-columns: repeat(5, 1fr); }   /* 九個部門加「全部」：五個一排，兩排 */
        .seg.is-small button {

            letter-spacing: 0.05em;

        .seg.is-small button:nth-child(n+6) { border-top: 1px solid rgb(var(--wabi-sub)); }

        /* 一列一個人 */
        .row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.8rem 0.5rem;
            border-top: 1px solid rgb(var(--wabi-sub) / 0.6);

            text-align: center;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.85rem;

        /* 前三名蓋朱印 */
        .rank.is-top {
            width: 2rem;
            height: 2rem;
            line-height: 1.85rem;
            border: 2px solid rgb(var(--wabi-shu));
            border-radius: 3px;
            color: rgb(var(--wabi-shu));
            font-family: 'Noto Serif TC', serif;
            font-weight: 700;
            font-size: 1rem;
            transform: rotate(-6deg);
        }

        .avatar {
            flex-shrink: 0;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 9999px;
            border: 1px solid rgb(var(--wabi-sub));
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgb(var(--wabi-accent));
            background: rgb(var(--wabi-bg));
            font-size: 0.95rem;
        }

        /* ===== 前三名：金、銀、銅（金屬是實物，顏色固定；夜裡只把字調亮） ===== */
        .p1 { --m1: #fff3b0; --m2: #e8c252; --m3: #a77b0c; --ink: #9a6f05; --tint: rgba(232, 194, 82, .16); --d: 0.6s; }
        .p2 { --m1: #ffffff; --m2: #c4ccd4; --m3: #6f7a86; --ink: #5f6a76; --tint: rgba(170, 180, 192, .14); --d: 0.38s; }
        .p3 { --m1: #ffd9b3; --m2: #d08a4e; --m3: #8a4f22; --ink: #8a4f22; --tint: rgba(208, 138, 78, .13); --d: 0.16s; }
        html.night .p1 { --ink: #f2d16b; --m3: #c99a2a; }
        html.night .p2 { --ink: #d4dbe2; --m3: #9aa5b1; }
        html.night .p3 { --ink: #e2a46c; --m3: #b06a33; }

        .row { animation: row-in .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--i, 0s); }
        @keyframes row-in { from { opacity: 0; transform: translateY(8px); } }

        .row.top { position: relative; overflow: hidden; isolation: isolate; }
        .row.p1 { padding-top: 1.15rem; padding-bottom: 1.15rem; }
        /* 金箔底＋左邊一條金屬 */
        .row.top::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background: linear-gradient(100deg, var(--tint) 0%, transparent 75%),
                linear-gradient(180deg, var(--m1), var(--m2) 45%, var(--m3)) left / 3px 100% no-repeat;
        }
        /* 一道光掃過去 */
        .row.top::after {
            content: ''; position: absolute; top: -10%; bottom: -10%; left: -50%; width: 40%; z-index: 2; pointer-events: none;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .6), transparent);
            transform: skewX(-18deg); animation: sheen 4.5s ease-in-out infinite; animation-delay: calc(var(--d) + 0.8s);
        }
        html.night .row.top::after { background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .22), transparent); }
        @keyframes sheen { 0%, 60% { transform: translateX(0) skewX(-18deg); } 90%, 100% { transform: translateX(420%) skewX(-18deg); } }

        /* 名次章蓋下來：銅、銀、金依序 */
        .row.top .rank { animation: stamp .55s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: var(--d); }
        @keyframes stamp {
            0% { transform: scale(2.6) rotate(-24deg); opacity: 0; }
            60% { transform: scale(.88) rotate(-4deg); opacity: 1; }
            100% { transform: scale(1) rotate(-6deg); opacity: 1; }
        }
        .row.p1 .rank.is-top { background: rgb(var(--wabi-shu)); color: #fff; box-shadow: 0 0 0 2px rgb(var(--wabi-bg)), 0 0 0 3.5px var(--m2), 0 0 14px var(--m2); }

        /* 大頭貼外圈：金屬光圈在轉 */
        .halo { position: relative; flex-shrink: 0; width: 2.5rem; height: 2.5rem; }
        .halo::before {
            content: ''; position: absolute; inset: -3px; border-radius: 9999px;
            background: conic-gradient(var(--m3), var(--m1), var(--m2), var(--m3), var(--m1), var(--m3));
            animation: spin 3.2s linear infinite;
        }
        .p1 .halo { width: 2.9rem; height: 2.9rem; }
        .p1 .halo::before { inset: -4px; box-shadow: 0 0 14px var(--m2); }
        .halo .avatar { position: relative; width: 100%; height: 100%; border: 2px solid rgb(var(--wabi-bg)); }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* 第一名的王冠 */
        .crown { position: absolute; left: 50%; top: -15px; width: 26px; margin-left: -13px; z-index: 3; transform-origin: 50% 100%; animation: crown 2.6s ease-in-out infinite; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .25)); }
        @keyframes crown { 0%, 100% { transform: rotate(-12deg) translateY(0); } 50% { transform: rotate(-6deg) translateY(-2px); } }

        /* 名字、數字：金屬字，第一名會流光 */
        .gname { color: var(--ink); font-weight: 600; }
        .p1 .gname {
            background: linear-gradient(90deg, var(--ink) 0%, var(--ink) 30%, var(--m1) 45%, var(--m2) 55%, var(--ink) 70%, var(--ink) 100%);
            background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: shimmer 3.6s linear infinite;
        }
        @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
        .gval { color: var(--ink); font-weight: 500; }
        .p1 .gval { font-size: 1.1em; }

        /* 金粉 */
        .spark {
            position: absolute; z-index: 1; width: var(--ss); height: var(--ss); pointer-events: none;
            background: radial-gradient(circle, #fff 0 12%, var(--m2) 32%, var(--m3) 52%, transparent 74%);
            clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
            opacity: 0; animation: twinkle var(--sd) ease-in-out infinite; animation-delay: var(--sdl);
        }
        @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 70% { opacity: .2; transform: scale(.6) rotate(70deg); } }

        @media (prefers-reduced-motion: reduce) {
            .row, .row *, .halo::before { animation: none !important; }
            .row.top::after, .spark { display: none; }
            .row.top .rank { transform: rotate(-6deg); }
        }

        .me-tag {
            display: inline-block;
            margin-left: 0.35rem;
            padding: 0 0.3rem;

        .at-row { display: flex; align-items: center; justify-content: flex-end; gap: .7rem; margin-top: .5rem; margin-bottom: .25rem; }
        .refresh-btn { min-height: 32px; padding: 0 .85rem; border: 1px solid rgb(var(--wabi-sub)); border-radius: 999px; font-family: 'Noto Sans TC', sans-serif; font-size: .68rem; letter-spacing: .2em; color: rgb(var(--wabi-text)); background: transparent; touch-action: manipulation; -webkit-user-select: none; user-select: none; }

        #boardBusy { position: fixed; inset: 0; z-index: 85; display: flex; align-items: center; justify-content: center; background: rgba(30, 25, 20, .74); opacity: 0; pointer-events: none; transition: opacity .18s; -webkit-user-select: none; user-select: none; touch-action: none; }
        #boardBusy.on { opacity: 1; pointer-events: auto; }
        #boardBusy .bb { width: min(19rem, 86vw); display: flex; flex-direction: column; align-items: center; }
        #boardBusy .scroll { position: relative; width: 14rem; padding: 1rem 1.1rem 1.1rem; background: #fbf7ec; border: 1px solid #d9cdb4; color: #3b342e; box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .6); transform: rotate(-1.5deg); }
        #boardBusy .scroll::before, #boardBusy .scroll::after { content: ''; position: absolute; left: -.45rem; right: -.45rem; height: .55rem; border-radius: 999px; background: #7a5c3e; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); }
        #boardBusy .scroll::before { top: -.35rem; } #boardBusy .scroll::after { bottom: -.35rem; }
        #boardBusy.on .scroll { animation: bbUnroll .7s cubic-bezier(.3, .8, .3, 1) both; }
        #boardBusy .bh { text-align: center; font-family: 'Noto Serif TC', serif; font-weight: 700; letter-spacing: .6em; font-size: .95rem; padding-bottom: .35rem; border-bottom: 1.5px solid #3b342e; }

        #boardBusy li i { display: block; height: .32rem; width: 0; border-radius: 2px; background: #3b342e; opacity: .85; }
        #boardBusy.on li i { animation: bbInk 3.2s ease-in-out infinite; }

        #boardBusy .stamp { position: absolute; right: .9rem; bottom: .9rem; width: 3.2rem; height: 3.2rem; border: 3px solid #b33a2f; border-radius: 6px; color: #b33a2f; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 1.25rem; opacity: 0; transform: scale(1.9) rotate(-14deg); }

        @keyframes bbUnroll { from { transform: translateY(18px) rotate(-5deg) scaleY(.2); opacity: 0; } to { transform: rotate(-1.5deg); opacity: 1; } }
        @keyframes bbInk { 0% { width: 0; opacity: .85; } 30% { width: var(--w); } 82% { width: var(--w); opacity: .85; } 100% { width: var(--w); opacity: 0; } }
        @keyframes bbStamp { from { opacity: 0; transform: scale(1.9) rotate(-14deg); } to { opacity: .92; transform: scale(1) rotate(-10deg); } }

    <script>
        const API_URL = (window.Line && Line.API_URL) || "https://script.google.com/macros/s/AKfycbz6TWDms090u7iS_Xk0lmbbz6mlpfbCoK2mffmpRootu2Hv2lYiASpDbb7n8COwnr_K/exec";
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        const fmt = n => '$' + Number(n || 0).toLocaleString('en-US');
        const secs = ms => ms ? `${(ms / 1000).toFixed(1)} 秒` : '';
        const TOP = ['壹', '貳', '參'];
        const DEPT = { xitou: '坐洗部', clean: '房務部', farm: '菜園部', wifi: '蹭網部', zaocan: '早餐部', ship: '貨運部', dessert: '甜點部', stack: '疊巢部', mine: '礦坑部' };
        // 第一名頭上的王冠（金色，畫在大頭貼上面）
        const CROWN = '<svg class="crown" viewBox="0 0 26 18" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#e8c252"/><stop offset="1" stop-color="#a77b0c"/></linearGradient></defs><path d="M2 16 L1 5 L7.5 10 L13 1.5 L18.5 10 L25 5 L24 16 Z" fill="url(#cg)" stroke="#8a6408" stroke-width="1" stroke-linejoin="round"/><circle cx="13" cy="11" r="1.8" fill="#b33a2f"/><circle cx="1" cy="5" r="1.3" fill="#e8c252"/><circle cx="25" cy="5" r="1.3" fill="#e8c252"/><circle cx="13" cy="1.5" r="1.3" fill="#e8c252"/></svg>';
        // 金粉：第一名七顆、第二名四顆、第三名三顆，位置隨機，避開最左邊的名次章
        function sparks(place) {
            return Array.from({ length: [0, 7, 4, 3][place] }, () => {
                const x = 22 + Math.random() * 74, y = 8 + Math.random() * 80, size = 8 + Math.random() * (place === 1 ? 9 : 6);
                return `<i class="spark" aria-hidden="true" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;--ss:${size.toFixed(1)}px;--sd:${(1.8 + Math.random() * 1.8).toFixed(2)}s;--sdl:${(Math.random() * 2.5).toFixed(2)}s"></i>`;
            }).join('');
        }
        const SCORE = { xitou: '爽度', clean: '乾淨度' };

        const badPic = new Set();  // 載不到的大頭貼，下次直接用字
        let stale = false;         // 現在畫的是上次存在手機裡的榜，後端還沒回來
        let players = null, at = '', book = 'work', metric = 'money', dept = 'all', cat = 'all', edept = 'wifi', emetric = 'far', loading = false, failed = '';
        try { const s = JSON.parse(sessionStorage.getItem('dongbuli-rank-tab') || '{}'); if (s.book) book = s.book; if (s.metric) metric = s.metric; if (s.dept) dept = s.dept; if (s.cat) cat = s.cat; if (s.edept) edept = s.edept; if (s.emetric) emetric = s.emetric; } catch (e) { }
        if (metric === 'alive') { book = 'endless'; edept = 'wifi'; emetric = 'far'; metric = 'best'; }  // 以前「撐最久」在打工・榜，現在搬到無盡・榜
        if (!['work', 'spend', 'endless'].includes(book)) book = 'work';
        if (!['wifi', 'ship', 'stack'].includes(edept)) edept = 'wifi';
        if (!['far', 'money'].includes(emetric)) emetric = 'far';
        if (location.hash === '#spend') book = 'spend'; else if (location.hash === '#work') book = 'work';
        else if (location.hash === '#endless') book = 'endless';
        else if (location.hash === '#worth') book = 'worth';   // 我的小島的連結（小島開放、後端接好才有這本）
        else if (location.hash === '#endless-ship') { book = 'endless'; edept = 'ship'; }
        else if (location.hash === '#endless-stack') { book = 'endless'; edept = 'stack'; }   // 疊巢無盡模式結果區的連結
        else if (location.hash === '#dessert') { book = 'work'; dept = 'dessert'; metric = 'served'; }   // 甜點店結果區的連結：直接看甜點部出餐最多
        else if (location.hash === '#stack') { book = 'work'; dept = 'stack'; metric = 'layers'; }   // 疊巢結果區的連結：直接看疊最高
        else if (location.hash === '#mine') { book = 'work'; dept = 'mine'; metric = 'best'; }   // 礦坑的連結：直接看挖最深
        else if (location.hash === '#endless-wifi') { book = 'endless'; edept = 'wifi'; }
        const BOOKS = {
            work: { title: '打工・榜', tag: '誰在二十七樓最勤勞，<br>牆上寫得清清楚楚。', go: [['xitou.html', '去坐洗部'], ['fangwu.html', '去房務部'], ['caiyuan.html', '去菜園部'], ['cengwang.html', '去蹭網部'], ['zaocan.html', '去早餐部'], ['huoyun.html', '去貨運部'], ['tiandian.html', '去甜點部'], ['diechao.html', '去疊巢部'], ['kuangkeng.html', '去礦坑部']], join: '打工' },
            spend: { title: '花錢・榜', tag: '錢不是賺來的，<br>是花出去才算數。', go: [['scratch.html', '去彩券行'], ['gongde.html', '去功德箱'], ['zaocan.html', '去早餐店']], join: '花錢' },
            worth: { title: '身價・榜', tag: '島上的一草一木，<br>都是一筆一筆買來的。', go: [['xiaodao.html', '去我的小島']], join: '買地蓋房子' },
            endless: { title: '無盡・榜', tag: '沒有時間限制，<br>撐得越久，名字寫得越大。', go: [['cengwang.html', '去蹭網部'], ['huoyun.html', '去貨運部'], ['diechao.html', '去疊巢部']], join: '玩無盡模式' },
        };
        // 無盡・榜：每個部門兩個分頁怎麼叫、小字寫什麼
        const ENDLESS = {
            wifi: { far: '撐最久', money: '一輪省最多', notes: { far: '蹭網無盡模式：比一輪裡真的連著 28 樓多久（放開、發呆的時間不算）。', money: '蹭網無盡模式：比一輪省最多少錢。' } },
            ship: { far: '航最遠', money: '一趟賺最多', notes: { far: '貨運無盡模式：比一趟開多遠（海里），一樣遠比運費多。', money: '貨運無盡模式：比一趟賺最多少錢。' } },
            stack: { far: '疊最高', money: '一場賺最多', notes: { far: '疊巢無盡模式：比一場疊幾層（掉三本收工），一樣高比「正」多。', money: '疊巢無盡模式：比一場賺最多少錢。' } },
        };
        const ZN = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
        const zn = z => z <= 10 ? ZN[z] : String(z);
        const nmi = d => `${(d / 100).toFixed(2)} 海里`;
        const mss = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
        function endlessEntry(p) {
            const d = (p[edept] || {}).endless;
            if (!d) return null;
            if (edept === 'wifi') {
                if (emetric === 'far') { const a = d.alive; return a && a.ms ? { v: a.ms, main: clock(a.ms), sub: `連著 28 樓・撐了 ${mss(a.all)}・第 ${a.season} 季・省 ${fmt(a.total)}` } : null; }
                const m = d.money; return m && m.total ? { v: m.total, main: fmt(m.total), sub: `撐了 ${mss(m.ms)}・第 ${m.season} 季` } : null;
            }
            if (edept === 'stack') {
                const fl = n => `${26 + Math.floor(n / 11)}F`;
                if (emetric === 'far') { const f = d.far; return f && f.n ? { v: f.n, tie: -(f.perfect * 1e7 + f.total), main: `${f.n} 層`, sub: `${fl(f.n)}・「正」${f.perfect} 次・撐了 ${mss(f.ms)}・${fmt(f.total)}` } : null; }
                const m = d.money; return m && m.total ? { v: m.total, main: fmt(m.total), sub: `疊 ${m.n} 層・撐了 ${mss(m.ms)}` } : null;
            }
            if (emetric === 'far') { const f = d.far; return f && f.dist ? { v: f.dist, tie: -f.total, main: nmi(f.dist), sub: `第${zn(f.zone)}海域・${mss(f.ms)}・運費 ${fmt(f.total)}` } : null; }
            const m = d.money; return m && m.total ? { v: m.total, main: fmt(m.total), sub: `${nmi(m.dist)}・第${zn(m.zone)}海域・${mss(m.ms)}` } : null;
        }
        // 花錢榜：每一類多少錢、小字寫什麼
        const CATS = {
            all: { note: '花掉的錢加起來：刮刮樂、捐香油錢、點燈、升級洗頭店、菜園和早餐店。', empty: '還沒有人花錢。<br>錢放著不會變多。' },
            scratch: { note: '買刮刮樂花掉的（小字是刮中拿回來的，含財神加碼）。', empty: '還沒有人買刮刮樂。' },
            gongde: { note: '捐香油錢加點燈。神明都有記下來。', empty: '還沒有人做功德。' },
            shop: { note: '坐洗部的店面、菜園的農具、早餐店的設備升級花掉的。', empty: '還沒有人升級。' },
        };
        function spendEntry(p) {
            const s = p.spend;
            if (!s) return null;
            if (cat === 'all') {
                const parts = [[s.scratch, '刮刮樂'], [s.donate + s.lamp, '功德'], [s.shop, '升級']].filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]);
                return s.total ? { v: s.total, main: fmt(s.total), sub: parts.map(x => `${x[1]} ${fmt(x[0])}`).join('・') } : null;
            }
            if (cat === 'scratch') {
                if (!s.scratch) return null;
                const net = s.won - s.scratch;
                return { v: s.scratch, main: fmt(s.scratch), sub: `刮中 ${fmt(s.won)}・${net >= 0 ? '賺' : '虧'} ${fmt(Math.abs(net))}` };
            }
            if (cat === 'gongde') {
                const v = s.donate + s.lamp;
                return v ? { v, main: fmt(v), sub: [s.donate ? `捐 ${fmt(s.donate)}` : '', s.lamp ? `點燈 ${fmt(s.lamp)}` : ''].filter(Boolean).join('・') } : null;
            }
            return s.shop ? { v: s.shop, main: fmt(s.shop), sub: '洗頭店、菜園、早餐店升級' } : null;
        }

        // 每個人在這個榜的成績：{ v 排名用的數字, tie 同分再比（越小越前面）, main 大字, sub 小字 }，沒成績回 null
        // 身價・榜：我的小島上每一樣照買價加起來（後端算好給 island: { worth, tier, plots, house }）
        const TIER_N = ['壹', '貳', '參', '肆', '伍'];
        function worthEntry(p) { const d = p.island; return d && d.worth ? { v: d.worth, main: fmt(d.worth), sub: [`島 ${TIER_N[d.tier] || ''}`, d.plots ? `${d.plots} 塊地` : '', d.house || ''].filter(Boolean).join('・') } : null; }
        const hasWorth = () => !!(players && players.some(p => 'island' in p));
        function entry(p) {
            if (book === 'worth') return worthEntry(p);
            if (book === 'spend') return spendEntry(p);
            if (book === 'endless') return endlessEntry(p);
            const x = p.xitou || {}, c = p.clean || {}, fm = p.farm || {}, wf = p.wifi || {}, zc = p.zaocan || {}, sh = p.ship || {}, ds = p.dessert || {}, sk = p.stack || {}, mn = p.mine || {};
            const UNIT = { xitou: ['洗', '顆頭', '顆'], clean: ['掃', '間', '間'], farm: ['拔', '輪', '輪'], wifi: ['蹭', '輪', '輪'], zaocan: ['煎', '天', '天'], ship: ['運', '趟', '趟'], dessert: ['轉', '輪', '輪'], stack: ['疊', '場', '場'], mine: ['挖', '關', '關'] };
            if (metric === 'money') {
                if (dept === 'all') { const v = (x.money || 0) + (c.money || 0) + (fm.money || 0) + (wf.money || 0) + (zc.money || 0) + (sh.money || 0) + (ds.money || 0) + (sk.money || 0) + (mn.money || 0); return v ? { v, main: fmt(v), sub: [x.money ? `洗 ${fmt(x.money)}` : '', c.money ? `掃 ${fmt(c.money)}` : '', fm.money ? `拔 ${fmt(fm.money)}` : '', wf.money ? `蹭 ${fmt(wf.money)}` : '', zc.money ? `煎 ${fmt(zc.money)}` : '', sh.money ? `運 ${fmt(sh.money)}` : '', ds.money ? `甜 ${fmt(ds.money)}` : '', sk.money ? `疊 ${fmt(sk.money)}` : '', mn.money ? `挖 ${fmt(mn.money)}` : ''].filter(Boolean).join('・') } : null; }
                const d = p[dept] || {};
                return d.money ? { v: d.money, main: fmt(d.money), sub: dept === 'xitou' ? `洗了 ${d.n} 顆頭` : dept === 'clean' ? `打掃了 ${d.n} 間` : dept === 'wifi' ? `蹭了 ${d.n} 輪` : dept === 'zaocan' ? `開了 ${d.n} 天店` : dept === 'ship' ? `出航 ${d.n} 趟` : dept === 'dessert' ? `開了 ${d.n} 輪店` : dept === 'stack' ? `疊了 ${d.n} 場` : dept === 'mine' ? `挖了 ${d.n} 關` : `拔了 ${d.n} 輪` } : null;
            }
            if (metric === 'count') {
                if (dept === 'all') { const v = (x.n || 0) + (c.n || 0) + (fm.n || 0) + (wf.n || 0) + (zc.n || 0) + (sh.n || 0) + (ds.n || 0) + (sk.n || 0) + (mn.n || 0); return v ? { v, main: `${v} 次`, sub: [x.n ? `洗 ${x.n} 顆頭` : '', c.n ? `掃 ${c.n} 間` : '', fm.n ? `拔 ${fm.n} 輪` : '', wf.n ? `蹭 ${wf.n} 輪` : '', zc.n ? `煎 ${zc.n} 天` : '', sh.n ? `運 ${sh.n} 趟` : '', ds.n ? `甜 ${ds.n} 輪` : '', sk.n ? `疊 ${sk.n} 場` : '', mn.n ? `挖 ${mn.n} 關` : ''].filter(Boolean).join('・') } : null; }
                const d = p[dept] || {};
                return d.n ? { v: d.n, main: `${d.n} ${UNIT[dept][2]}`, sub: `賺 ${fmt(d.money)}` } : null;
            }
            // 菜園的最高分是一輪賣最多少錢（跟爽度、乾淨度不同單位，不放進「全部」）
            if (dept === 'farm') return fm.best != null && fm.best ? { v: fm.best, main: fmt(fm.best), sub: '一輪賣最多' } : null;
            if (dept === 'wifi') return wf.best != null && wf.best ? { v: wf.best, main: fmt(wf.best), sub: '一般模式一輪省最多' } : null;
            // 甜點店：出餐最多的一輪（同樣多比氣走少、再比報廢少）；最高分是一輪賺最多
            if (metric === 'served' && dept === 'dessert') {
                const sv = ds.served;
                return sv && sv.n ? { v: sv.n, tie: sv.angry * 1000 + sv.scrapped, main: `${sv.n} 盤`, sub: `${sv.angry ? `氣走 ${sv.angry} 位・` : ''}${sv.scrapped ? `報廢 ${sv.scrapped} 盤・` : ''}那輪 ${fmt(sv.total)}` } : null;
            }
            if (dept === 'dessert') return ds.best != null && ds.best ? { v: ds.best, main: fmt(ds.best), sub: '一輪賺最多' } : null;
            // 疊巢：疊最高的一場（同樣高比「正」多、再比賺多）；最高分是一場賺最多
            if (metric === 'layers' && dept === 'stack') {
                const ly = sk.layers;
                return ly && ly.n ? { v: ly.n, tie: -(ly.perfect * 100000 + ly.total), main: `${ly.n} 層`, sub: `「正」${ly.perfect} 次・那場 ${fmt(ly.total)}` } : null;
            }
            if (dept === 'stack') return sk.best != null && sk.best ? { v: sk.best, main: fmt(sk.best), sub: '一場賺最多' } : null;
            // 礦坑：挖最深（過到第幾關），一樣深比那時累積的兩多
            if (dept === 'mine') { const dp = mn.deep; return dp && dp.lv ? { v: dp.lv, tie: -dp.liang, main: dp.lv >= 10 ? '破關' : `第 ${dp.lv} 關`, sub: [`${dp.liang.toLocaleString('zh-TW')} 兩`, mn.clears ? `破關 ${mn.clears} 次` : ''].filter(Boolean).join('・') } : null; }
            // 早餐店：出餐最多的一天（只有早餐部有這個分頁）；最高分是一天賺最多
            if (metric === 'served') {
                const sv = zc.served;
                return sv && sv.n ? { v: sv.n, tie: sv.angry, main: `${sv.n} 位`, sub: `賣 ${sv.items} 份・${sv.angry ? `氣走 ${sv.angry} 位・` : ''}那天 ${fmt(sv.total)}` } : null;
            }
            if (dept === 'zaocan') return zc.best != null && zc.best ? { v: zc.best, main: fmt(zc.best), sub: '一天賺最多' } : null;
            // 貨運：最長連撈（只有貨運部有這個分頁），一樣長比運費；最高分是一趟賺最多
            if (metric === 'combo') {
                const cb = sh.combo;
                return cb && cb.n ? { v: cb.n, tie: -cb.total, main: `${cb.n} 連撈`, sub: `那趟撈了 ${cb.picked} 份・運費 ${fmt(cb.total)}` } : null;
            }
            if (dept === 'ship') return sh.best != null && sh.best ? { v: sh.best, main: fmt(sh.best), sub: '一般模式一趟賺最多' } : null;
            // 最高分：同分比快
            const pickDept = dept === 'all'
                ? ['xitou', 'clean'].filter(k => p[k] && p[k].best != null).sort((a, b) => p[b].best - p[a].best || (p[a].ms || 9e9) - (p[b].ms || 9e9))[0]
                : (p[dept] && p[dept].best != null ? dept : null);
            if (!pickDept) return null;
            const d = p[pickDept];
            return { v: d.best, tie: d.ms || 9e9, main: `${d.best}`, sub: [dept === 'all' ? `${DEPT[pickDept]}${SCORE[pickDept]}` : SCORE[pickDept], secs(d.ms)].filter(Boolean).join('・') };
        }

        const clock = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)} 分 ${String(s % 60).padStart(2, '0')} 秒`; };
        // ===== 打開就有榜：上次讀到的榜存在這支手機（兩天內才用），先畫，後端回來再換 =====
        const LAST_KEY = 'dongbuli-rank-last';
        const sessionNow = () => { try { return localStorage.getItem('dongbuli-session') || ''; } catch (e) { return ''; } };
        function saveLast(list, when) {
            try { localStorage.setItem(LAST_KEY, JSON.stringify({ t: Date.now(), at: when, who: sessionNow().slice(0, 8), players: list })); } catch (e) { }
        }
        function loadLast() {
            try {
                const c = JSON.parse(localStorage.getItem(LAST_KEY) || 'null');
                if (!c || !Array.isArray(c.players) || Date.now() - c.t > 2 * 86400000) return;
                const same = !!c.who && c.who === sessionNow().slice(0, 8);   // 換了帳號（或登出了），「我」那格不算數
                players = withMe(c.players.map(p => same ? p : { ...p, me: false })); at = c.at || ''; stale = true;
            } catch (e) { }
        }
        // ===== 自己剛破的紀錄馬上出現：這支手機的錢包比榜上新，就先把自己那格換成錢包的數字（只會變大） =====
        const EARN_SRC = { xitou: 'xitou', clean: 'clean', farm: 'farm', wifi: 'wifi', zaocan: 'zaocan', ship: 'ship', dessert: 'dessert', stack: 'stack', mine: 'mine' };
        const MONEY_BEST = ['farm', 'zaocan', 'dessert'];   // 這三個部門的「最高」就是一輪賺最多（錢包的 best）；坐洗、房務比分數，蹭網、貨運只算一般模式，手機算不出來
        function withMe(list) {
            if (!list || !Line.loggedIn) return list;
            let w; try { w = Wallet.stats(); } catch (e) { return list; }
            const earned = w.earned || {}, num = v => Math.max(0, Math.round(Number(v) || 0));
            let me = list.find(p => p.me), add = false;
            if (!me) {
                if (!Object.values(EARN_SRC).some(k => earned[k] && earned[k].times) && !num(w.spent)) return list;   // 什麼都還沒做：不用加
                let nick = {}; try { nick = JSON.parse(localStorage.getItem('dongbuli-me') || 'null') || {}; } catch (e) { }
                const pf = Line.profile || {};
                me = { name: (nick.nick || pf.name || '你').slice(0, 20), avatar: nick.avatar || '', picture: !nick.avatar && /^https:\/\//.test(pf.picture || '') ? pf.picture : '', me: true };
                add = true;
            } else me = { ...me };
            Object.entries(EARN_SRC).forEach(([dep, src]) => {
                const e = earned[src], d = { n: 0, money: 0, best: null, ms: 0, ...(me[dep] || {}) };
                if (e) {
                    d.n = Math.max(d.n || 0, num(e.times)); d.money = Math.max(d.money || 0, num(e.total));
                    if (MONEY_BEST.includes(dep) && num(e.best)) d.best = Math.max(d.best || 0, num(e.best));
                }
                me[dep] = d;
            });
            const g = w.gongde || {}, sh = w.shop || {}, sp = { total: 0, shop: 0, donate: 0, lamp: 0, scratch: 0, won: 0, ...(me.spend || {}) };
            sp.total = Math.max(sp.total, num(w.spent)); sp.shop = Math.max(sp.shop, num(sh.spent));
            sp.donate = Math.max(sp.donate, num(g.donated)); sp.lamp = Math.max(sp.lamp, num(g.lit));
            sp.scratch = Math.max(0, sp.total - sp.shop - sp.donate - sp.lamp);
            sp.won = Math.max(sp.won, num((earned.scratch || {}).total) + num((earned.caishen || {}).total));
            me.spend = sp;
            return add ? list.concat([me]) : list.map(p => p.me ? me : p);
        }

        function renderBoard() {
            // 「出餐最多」只有早餐部有、「最長連撈」只有貨運部有；換到別的部門就回「最高分」

            const endOld = book === 'endless' && players && players.length && players.every(p => !p[edept] || !('endless' in p[edept]));
            const zcOld = dept === 'zaocan' && players && players.length && players.every(p => !('zaocan' in p));
            const shipOld = dept === 'ship' && players && players.length && players.every(p => !('ship' in p));
            const dsOld = dept === 'dessert' && players && players.length && players.every(p => !('dessert' in p));
            const skOld = dept === 'stack' && players && players.length && players.every(p => !('stack' in p));

                : book === 'spend' ? CATS[cat].note

                ? (dept === 'farm' ? '菜園比的是一輪賣最多少錢（單位跟坐洗、房務不同，「全部」那頁不算菜園）。' : dept === 'zaocan' ? '早餐店比的是一天賺最多少錢（單位跟坐洗、房務不同，「全部」那頁不算早餐店）。' : dept === 'dessert' ? '甜點店比的是一輪賺最多少錢（單位跟坐洗、房務不同，「全部」那頁不算甜點店）。' : dept === 'mine' ? '礦坑比的是挖最深：過到第幾關（十關挖完叫破關），一樣深比那時累積的兩多。要用 LINE 登入，收工後最多五分鐘上榜（或按刷新）。' : dept === 'stack' ? '疊・巢比的是一般模式一場賺最多少錢（無盡模式在「無盡・榜」；單位跟坐洗、房務不同，「全部」那頁不算疊巢）。' : dept === 'ship' ? '貨運比的是一般模式一趟賺最多少錢（無盡模式在「無盡・榜」；單位跟坐洗、房務不同，「全部」那頁不算貨運）。' : dept === 'wifi' ? '蹭網比的是一般模式一輪省最多少錢（無盡模式在「無盡・榜」；單位跟坐洗、房務不同，「全部」那頁不算蹭網）。' : '一場的最高分（爽度、乾淨度都是滿分 100），同分比誰快。從洗完、打掃完存到雲端開始算。')
                : metric === 'money' ? '打工賺的錢加起來（工資、小費、失物招領、加成都算）。' : '洗幾顆頭、打掃幾間、拔幾輪、蹭幾輪、開幾天早餐店、跑幾趟貨運、轉幾輪甜點店、疊幾場書、挖幾關礦。';
            const box = $('board');
            if (!players) {

                    ? `<p class="py-8 text-center text-xs font-sans tracking-wider text-stone-500 leading-relaxed">${esc(failed)}</p><div class="text-center pb-4"><button type="button" data-retry class="min-h-[44px] px-6 border border-stone-300 text-xs font-sans tracking-widest text-wabi-dark">再試一次</button></div>`
                    : '<p class="py-10 text-center text-xs font-sans tracking-widest text-stone-400">翻名冊中…</p>';
                $('boardAt').textContent = '';

            }
            const list = players.map(p => ({ p, e: entry(p) })).filter(r => r.e)
                .sort((a, b) => b.e.v - a.e.v || (a.e.tie || 0) - (b.e.tie || 0));
            // 同分（最高分還要同秒）同名次
            let rank = 0;
            list.forEach((r, i) => { const prev = list[i - 1]; rank = prev && prev.e.v === r.e.v && (prev.e.tie || 0) === (r.e.tie || 0) ? rank : i + 1; r.rank = rank; });
            const shown = list.slice(0, 50), mine = list.find(r => r.p.me);
            if (mine && !shown.includes(mine)) shown.push(mine);
            box.innerHTML = shown.length ? shown.map((r, i) => {

                    ? `<img class="avatar" src="${esc(r.p.picture)}" alt="" referrerpolicy="no-referrer" loading="lazy" data-initial="${esc((r.p.name || '旅')[0])}">`
                    : `<span class="avatar" aria-hidden="true">${esc((r.p.name || '旅')[0])}</span>`;
                const pic = place ? `<span class="halo">${pic0}${place === 1 ? CROWN : ''}</span>` : pic0;
                return `<div class="row${place ? ` top p${place}` : ''}${r.p.me ? ' is-me' : ''}" style="--i:${Math.min(i, 12) * 0.04}s">
                    ${place ? sparks(place) : ''}
                    <span class="rank${place ? ' is-top' : ''}">${place ? TOP[place - 1] : r.rank}</span>
                    ${pic}
                    <span class="flex-1 min-w-0">
                        <span class="flex items-baseline text-sm text-wabi-dark tracking-wider"><span class="truncate min-w-0 ${place ? 'gname' : ''}">${esc(r.p.name)}</span>${r.p.me ? '<span class="me-tag shrink-0">我</span>' : ''}</span>
                        <span class="block text-[11px] font-sans tracking-wide leading-snug text-stone-400">${esc(r.e.sub)}</span>
                    </span>
                    <span class="shrink-0 font-sans ${place ? 'gval' : 'text-wabi-dark'} ${book === 'work' && metric === 'best' ? 'text-xl font-light' : book === 'endless' ? 'text-base' : 'text-sm'}">${esc(r.e.main)}</span>

            }).join('') : `<p class="py-10 text-center text-xs font-sans tracking-wider text-stone-400 leading-relaxed">${
                book === 'worth' ? '還沒有人買地蓋房子。<br>第一座島在等你。'
                : book === 'spend' ? (players.length && !players.some(p => p.spend) ? '花錢・榜要等後端重新部署「新版本」才有。' : CATS[cat].empty)
                : book === 'endless' ? (players.length && players.every(p => !p[edept] || !('endless' in p[edept])) ? '無盡・榜要等後端重新部署「新版本」才有。' : `${DEPT[edept]}還沒有人玩過無盡模式。<br>第一名在等你。`)
                : dept === 'zaocan' && players.length && players.every(p => !('zaocan' in p)) ? '早餐部要等後端重新部署「新版本」才有。'
                : dept === 'ship' && players.length && players.every(p => !('ship' in p)) ? '貨運部要等後端重新部署「新版本」才有。'
                : dept === 'dessert' && players.length && players.every(p => !('dessert' in p)) ? '甜點部要等後端重新部署「新版本」才有。'
                : dept === 'stack' && players.length && players.every(p => !('stack' in p)) ? '疊巢部要等後端重新部署「新版本」才有。'
                : dept === 'mine' && players.length && players.every(p => !('mine' in p)) ? '礦坑部要等後端重新部署「新版本」才有。'
                : `${DEPT[dept] || '二十七樓'}還沒有人上榜。<br>第一名在等你。`}</p>`;
            box.querySelectorAll('img.avatar').forEach(img => img.addEventListener('error', () => {

        function renderJoin() {

            box.innerHTML = `
                <h2 class="text-sm tracking-[0.3em] text-wabi-dark">還沒登入</h2>
                <p class="mt-2 text-xs font-sans tracking-wider text-stone-500 leading-relaxed">沒登入的人打工、花錢只記在這支手機，不會上榜。用 LINE 登入以後就會寫上去。</p>
                <button type="button" data-login class="line-btn mt-4 w-full">用 LINE 登入</button>`;
        }

        // 回傳：'fresh' 後端當場重算了／'cached' 只拿快取（沒按刷新）／'old' 後端還沒部署新版本／'fail'
        async function load(fresh) {
            if (loading) return 'busy';
            loading = true; failed = '';
            let status = 'fail';
            if (!players || stale) renderBoard();   // 先畫的是上次的榜：寫上「更新中」
            try {
                let session = '';
                try { session = localStorage.getItem('dongbuli-session') || ''; } catch (e) { }
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ type: 'leaderboard', session: session || undefined, fresh: fresh || undefined }) });
                const r = await res.json();
                if (r.result !== 'success') {
                    failed = /不認得的請求/.test(r.error || '') ? '排行榜還沒開張：後端要重新部署「新版本」。' : `讀不到排行榜（${r.error || r.result}）。`;
                } else { players = withMe(r.players || []); at = r.at || ''; stale = false; saveLast(r.players || [], at); status = r.refreshed === undefined ? 'old' : r.refreshed ? 'fresh' : 'cached'; }
            } catch (e) {
                failed = '連不到後端，可能是網路不穩。';
            }
            loading = false;
            renderBoard();
            return status;
        }

        // ===== 刷新：後端當場重抄榜單＋蓋板。同一支手機一分鐘只能按一次（記在 localStorage，重新整理也一樣） =====
        const FRESH_GAP = 60000, FRESH_KEY = 'dongbuli-rank-fresh';
        const BUSY_LINES = ['蘋果鴨在重抄榜單…', '浣熊大王想偷改名次，被請出去了…', '茱莉鴨在數誰被抓最多次…', '青江菜船長在核對貨單…', '店貓趴在榜單上，正在搬開…', '墨還沒乾，吹一下…'];
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        let busyTimer = null, lastFresh = 0;
        try { lastFresh = Number(localStorage.getItem(FRESH_KEY)) || 0; } catch (e) { }
        function showBusy(on) {
            const el = $('boardBusy');
            clearInterval(busyTimer);
            if (!on) { el.classList.remove('on', 'done'); return; }
            let i = 0; $('bbMsg').textContent = BUSY_LINES[0];
            busyTimer = setInterval(() => { i = (i % (BUSY_LINES.length - 1)) + 1; $('bbMsg').textContent = BUSY_LINES[i]; }, 1300);
            el.classList.remove('done'); el.classList.add('on');
        }
        async function refresh() {
            if (loading) return showToast('榜正在讀，等一下');
            const wait = FRESH_GAP - (Date.now() - lastFresh);
            if (wait > 0 && wait <= FRESH_GAP) return showToast(`剛刷新過，${Math.ceil(wait / 1000)} 秒後再按`);
            lastFresh = Date.now();
            try { localStorage.setItem(FRESH_KEY, String(lastFresh)); } catch (e) { }
            $('refreshBtn').disabled = true;
            showBusy(true);
            const t0 = Date.now(), r = await load(true);
            await sleep(Math.max(0, 1200 - (Date.now() - t0)));   // 太快回來也讓人看一下
            clearInterval(busyTimer);
            if (r === 'fresh') { $('bbMsg').textContent = '抄好了'; $('boardBusy').classList.add('done'); await sleep(750); }
            showBusy(false);
            $('refreshBtn').disabled = false;
            if (r === 'fresh') showToast('榜重新抄好了');
            else if (r === 'fail') showToast('沒抄成，等一下再試');
            else if (r === 'old') showToast('後端還是舊版，要重新部署「新版本」才能刷新');
        }
        $('refreshBtn').addEventListener('click', refresh);
        $('boardBusy').addEventListener('contextmenu', e => e.preventDefault());

        document.querySelectorAll('[data-metric]').forEach(b => b.addEventListener('click', () => { metric = b.dataset.metric; save(); renderBoard(); }));
        document.querySelectorAll('[data-dept]').forEach(b => b.addEventListener('click', () => { dept = b.dataset.dept; save(); renderBoard(); }));
        document.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => { cat = b.dataset.cat; save(); renderBoard(); }));
        document.querySelectorAll('[data-edept]').forEach(b => b.addEventListener('click', () => { edept = b.dataset.edept; save(); renderBoard(); }));
        document.querySelectorAll('[data-emetric]').forEach(b => b.addEventListener('click', () => { emetric = b.dataset.emetric; save(); renderBoard(); }));
        document.querySelectorAll('[data-book]').forEach(b => b.addEventListener('click', () => {
            book = b.dataset.book; save(); renderBoard();
            try { history.replaceState(null, '', '#' + book); } catch (e) { }
        }));
        function save() { try { sessionStorage.setItem('dongbuli-rank-tab', JSON.stringify({ book, metric, dept, cat, edept, emetric })); } catch (e) { } }
        $('board').addEventListener('click', e => { if (e.target.closest('[data-retry]')) load(); });
        $('join').addEventListener('click', e => { if (e.target.closest('[data-login]')) Line.login(); });
        Wallet.on(type => {
            if (type === 'login' || type === 'logout') { renderJoin(); setTimeout(load, 2000); }  // 等錢包同步完再讀
        });
        document.addEventListener('visibilitychange', () => { if (!document.hidden && players) load(); });

        renderJoin();
        loadLast();
        renderBoard();
        load();
    </script>
</body>

</html>
