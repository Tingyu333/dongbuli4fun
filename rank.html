    <style>
        .line-btn {
            min-height: 44px;
            padding: 0 1.4rem;
            border-radius: 6px;
            background: #06c755;
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            touch-action: manipulation;
        }

        /* 分頁：比什麼、哪個部門 */
        .seg {
            display: flex;
            border: 1px solid rgb(var(--wabi-sub));
            border-radius: 2px;
        }

        .seg button {
            flex: 1;
            min-height: 44px;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.15em;
            color: rgb(var(--wabi-accent));
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .seg button+button {
            border-left: 1px solid rgb(var(--wabi-sub));
        }

        .seg button[aria-pressed="true"] {
            background: rgb(var(--wabi-dark));
            color: rgb(var(--wabi-bg));
        }

        .seg.is-small button {
            min-height: 36px;
            font-size: 0.72rem;
        }

        /* 一列一個人 */
        .row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.8rem 0.5rem;
            border-top: 1px solid rgb(var(--wabi-sub) / 0.6);
        }

        .row.is-me {
            background: rgb(var(--wabi-shu) / 0.06);
            box-shadow: inset 3px 0 0 rgb(var(--wabi-shu));
        }

        .rank {
            flex-shrink: 0;
            width: 2rem;
            text-align: center;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.85rem;
            color: rgb(var(--wabi-accent));
        }

        /* 前三名蓋朱印 */
        .rank.is-top {
            width: 2rem;
            height: 2rem;
            line-height: 1.85rem;
            border: 2px solid rgb(var(--wabi-shu));
            border-radius: 3px;
            color: rgb(var(--wabi-shu));
            font-family: 'Noto Serif TC', serif;
            font-weight: 700;
            font-size: 1rem;
            transform: rotate(-6deg);
        }

        .avatar {
            flex-shrink: 0;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 9999px;
            border: 1px solid rgb(var(--wabi-sub));
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgb(var(--wabi-accent));
            background: rgb(var(--wabi-bg));
            font-size: 0.95rem;
        }

        /* ===== 前三名：金、銀、銅（金屬是實物，顏色固定；夜裡只把字調亮） ===== */
        .p1 { --m1: #fff3b0; --m2: #e8c252; --m3: #a77b0c; --ink: #9a6f05; --tint: rgba(232, 194, 82, .16); --d: 0.6s; }
        .p2 { --m1: #ffffff; --m2: #c4ccd4; --m3: #6f7a86; --ink: #5f6a76; --tint: rgba(170, 180, 192, .14); --d: 0.38s; }
        .p3 { --m1: #ffd9b3; --m2: #d08a4e; --m3: #8a4f22; --ink: #8a4f22; --tint: rgba(208, 138, 78, .13); --d: 0.16s; }
        html.night .p1 { --ink: #f2d16b; --m3: #c99a2a; }
        html.night .p2 { --ink: #d4dbe2; --m3: #9aa5b1; }
        html.night .p3 { --ink: #e2a46c; --m3: #b06a33; }

        .row { animation: row-in .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--i, 0s); }
        @keyframes row-in { from { opacity: 0; transform: translateY(8px); } }

        .row.top { position: relative; overflow: hidden; isolation: isolate; }
        .row.p1 { padding-top: 1.15rem; padding-bottom: 1.15rem; }
        /* 金箔底＋左邊一條金屬 */
        .row.top::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background: linear-gradient(100deg, var(--tint) 0%, transparent 75%),
                linear-gradient(180deg, var(--m1), var(--m2) 45%, var(--m3)) left / 3px 100% no-repeat;
        }
        /* 一道光掃過去 */
        .row.top::after {
            content: ''; position: absolute; top: -10%; bottom: -10%; left: -50%; width: 40%; z-index: 2; pointer-events: none;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .6), transparent);
            transform: skewX(-18deg); animation: sheen 4.5s ease-in-out infinite; animation-delay: calc(var(--d) + 0.8s);
        }
        html.night .row.top::after { background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .22), transparent); }
        @keyframes sheen { 0%, 60% { transform: translateX(0) skewX(-18deg); } 90%, 100% { transform: translateX(420%) skewX(-18deg); } }

        /* 名次章蓋下來：銅、銀、金依序 */
        .row.top .rank { animation: stamp .55s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: var(--d); }
        @keyframes stamp {
            0% { transform: scale(2.6) rotate(-24deg); opacity: 0; }
            60% { transform: scale(.88) rotate(-4deg); opacity: 1; }
            100% { transform: scale(1) rotate(-6deg); opacity: 1; }
        }
        .row.p1 .rank.is-top { background: rgb(var(--wabi-shu)); color: #fff; box-shadow: 0 0 0 2px rgb(var(--wabi-bg)), 0 0 0 3.5px var(--m2), 0 0 14px var(--m2); }

        /* 大頭貼外圈：金屬光圈在轉 */
        .halo { position: relative; flex-shrink: 0; width: 2.5rem; height: 2.5rem; }
        .halo::before {
            content: ''; position: absolute; inset: -3px; border-radius: 9999px;
            background: conic-gradient(var(--m3), var(--m1), var(--m2), var(--m3), var(--m1), var(--m3));
            animation: spin 3.2s linear infinite;
        }
        .p1 .halo { width: 2.9rem; height: 2.9rem; }
        .p1 .halo::before { inset: -4px; box-shadow: 0 0 14px var(--m2); }
        .halo .avatar { position: relative; width: 100%; height: 100%; border: 2px solid rgb(var(--wabi-bg)); }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* 第一名的王冠 */
        .crown { position: absolute; left: 50%; top: -15px; width: 26px; margin-left: -13px; z-index: 3; transform-origin: 50% 100%; animation: crown 2.6s ease-in-out infinite; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .25)); }
        @keyframes crown { 0%, 100% { transform: rotate(-12deg) translateY(0); } 50% { transform: rotate(-6deg) translateY(-2px); } }

        /* 名字、數字：金屬字，第一名會流光 */
        .gname { color: var(--ink); font-weight: 600; }
        .p1 .gname {
            background: linear-gradient(90deg, var(--ink) 0%, var(--ink) 30%, var(--m1) 45%, var(--m2) 55%, var(--ink) 70%, var(--ink) 100%);
            background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: shimmer 3.6s linear infinite;
        }
        @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
        .gval { color: var(--ink); font-weight: 500; }
        .p1 .gval { font-size: 1.1em; }

        /* 金粉 */
        .spark {
            position: absolute; z-index: 1; width: var(--ss); height: var(--ss); pointer-events: none;
            background: radial-gradient(circle, #fff 0 12%, var(--m2) 32%, var(--m3) 52%, transparent 74%);
            clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
            opacity: 0; animation: twinkle var(--sd) ease-in-out infinite; animation-delay: var(--sdl);
        }
        @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 70% { opacity: .2; transform: scale(.6) rotate(70deg); } }

        @media (prefers-reduced-motion: reduce) {
            .row, .row *, .halo::before { animation: none !important; }
            .row.top::after, .spark { display: none; }
            .row.top .rank { transform: rotate(-6deg); }
        }

        .me-tag {
            display: inline-block;
            margin-left: 0.35rem;
            padding: 0 0.3rem;
            border: 1px solid rgb(var(--wabi-shu));
            color: rgb(var(--wabi-shu));
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            line-height: 1.3;
            vertical-align: 0.15em;
        }
    </style>

    <footer

    <script>
        const API_URL = (window.Line && Line.API_URL) || "https://script.google.com/macros/s/AKfycbz6TWDms090u7iS_Xk0lmbbz6mlpfbCoK2mffmpRootu2Hv2lYiASpDbb7n8COwnr_K/exec";
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        const fmt = n => '$' + Number(n || 0).toLocaleString('en-US');
        const secs = ms => ms ? `${(ms / 1000).toFixed(1)} 秒` : '';
        const TOP = ['壹', '貳', '參'];
        const DEPT = { xitou: '坐洗部', clean: '房務部' };
        // 第一名頭上的王冠（金色，畫在大頭貼上面）
        const CROWN = '<svg class="crown" viewBox="0 0 26 18" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#e8c252"/><stop offset="1" stop-color="#a77b0c"/></linearGradient></defs><path d="M2 16 L1 5 L7.5 10 L13 1.5 L18.5 10 L25 5 L24 16 Z" fill="url(#cg)" stroke="#8a6408" stroke-width="1" stroke-linejoin="round"/><circle cx="13" cy="11" r="1.8" fill="#b33a2f"/><circle cx="1" cy="5" r="1.3" fill="#e8c252"/><circle cx="25" cy="5" r="1.3" fill="#e8c252"/><circle cx="13" cy="1.5" r="1.3" fill="#e8c252"/></svg>';
        // 金粉：第一名七顆、第二名四顆、第三名三顆，位置隨機，避開最左邊的名次章
        function sparks(place) {
            return Array.from({ length: [0, 7, 4, 3][place] }, () => {
                const x = 22 + Math.random() * 74, y = 8 + Math.random() * 80, size = 8 + Math.random() * (place === 1 ? 9 : 6);
                return `<i class="spark" aria-hidden="true" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;--ss:${size.toFixed(1)}px;--sd:${(1.8 + Math.random() * 1.8).toFixed(2)}s;--sdl:${(Math.random() * 2.5).toFixed(2)}s"></i>`;
            }).join('');
        }
        const SCORE = { xitou: '爽度', clean: '乾淨度' };

        const badPic = new Set();  // 載不到的大頭貼，下次直接用字
        let players = null, at = '', metric = 'money', dept = 'all', loading = false, failed = '';
        try { const s = JSON.parse(sessionStorage.getItem('dongbuli-rank-tab') || '{}'); if (s.metric) metric = s.metric; if (s.dept) dept = s.dept; } catch (e) { }

        // 每個人在這個榜的成績：{ v 排名用的數字, tie 同分再比（越小越前面）, main 大字, sub 小字 }，沒成績回 null
        function entry(p) {
            const x = p.xitou || {}, c = p.clean || {};
            if (metric === 'money') {
                if (dept === 'all') { const v = (x.money || 0) + (c.money || 0); return v ? { v, main: fmt(v), sub: [x.money ? `洗 ${fmt(x.money)}` : '', c.money ? `掃 ${fmt(c.money)}` : ''].filter(Boolean).join('・') } : null; }
                const d = p[dept] || {};
                return d.money ? { v: d.money, main: fmt(d.money), sub: dept === 'xitou' ? `洗了 ${d.n} 顆頭` : `打掃了 ${d.n} 間` } : null;
            }
            if (metric === 'count') {
                if (dept === 'all') { const v = (x.n || 0) + (c.n || 0); return v ? { v, main: `${v} 次`, sub: [x.n ? `洗 ${x.n} 顆頭` : '', c.n ? `掃 ${c.n} 間` : ''].filter(Boolean).join('・') } : null; }
                const d = p[dept] || {};
                return d.n ? { v: d.n, main: dept === 'xitou' ? `${d.n} 顆` : `${d.n} 間`, sub: `賺 ${fmt(d.money)}` } : null;
            }
            // 最高分：同分比快
            const pickDept = dept === 'all'
                ? ['xitou', 'clean'].filter(k => p[k] && p[k].best != null).sort((a, b) => p[b].best - p[a].best || (p[a].ms || 9e9) - (p[b].ms || 9e9))[0]
                : (p[dept] && p[dept].best != null ? dept : null);
            if (!pickDept) return null;
            const d = p[pickDept];
            return { v: d.best, tie: d.ms || 9e9, main: `${d.best}`, sub: [dept === 'all' ? `${DEPT[pickDept]}${SCORE[pickDept]}` : SCORE[pickDept], secs(d.ms)].filter(Boolean).join('・') };
        }

        function renderBoard() {
            document.querySelectorAll('[data-metric]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.metric === metric)));
            document.querySelectorAll('[data-dept]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dept === dept)));
            $('boardNote').textContent = metric === 'best'
                ? '一場的最高分（爽度、乾淨度都是滿分 100），同分比誰快。從洗完、打掃完存到雲端開始算。'
                : metric === 'money' ? '打工賺的錢加起來（工資、小費、失物招領、加成都算）。' : '洗幾顆頭、打掃幾間。';
            const box = $('board');
            if (!players) {
                box.innerHTML = failed
                    ? `<p class="py-8 text-center text-xs font-sans tracking-wider text-stone-500 leading-relaxed">${esc(failed)}</p><div class="text-center pb-4"><button type="button" data-retry class="min-h-[44px] px-6 border border-stone-300 text-xs font-sans tracking-widest text-wabi-dark">再試一次</button></div>`
                    : '<p class="py-10 text-center text-xs font-sans tracking-widest text-stone-400">翻名冊中…</p>';
                $('boardAt').textContent = '';
                return;
            }
            const list = players.map(p => ({ p, e: entry(p) })).filter(r => r.e)
                .sort((a, b) => b.e.v - a.e.v || (a.e.tie || 0) - (b.e.tie || 0));
            // 同分（最高分還要同秒）同名次
            let rank = 0;
            list.forEach((r, i) => { const prev = list[i - 1]; rank = prev && prev.e.v === r.e.v && (prev.e.tie || 0) === (r.e.tie || 0) ? rank : i + 1; r.rank = rank; });
            const shown = list.slice(0, 50), mine = list.find(r => r.p.me);
            if (mine && !shown.includes(mine)) shown.push(mine);
            box.innerHTML = shown.length ? shown.map((r, i) => {
                const place = r.rank <= 3 ? r.rank : 0;
                const pic0 = r.p.picture && !badPic.has(r.p.picture)
                    ? `<img class="avatar" src="${esc(r.p.picture)}" alt="" referrerpolicy="no-referrer" loading="lazy" data-initial="${esc((r.p.name || '旅')[0])}">`
                    : `<span class="avatar" aria-hidden="true">${esc((r.p.name || '旅')[0])}</span>`;
                const pic = place ? `<span class="halo">${pic0}${place === 1 ? CROWN : ''}</span>` : pic0;
                return `<div class="row${place ? ` top p${place}` : ''}${r.p.me ? ' is-me' : ''}" style="--i:${Math.min(i, 12) * 0.04}s">
                    ${place ? sparks(place) : ''}
                    <span class="rank${place ? ' is-top' : ''}">${place ? TOP[place - 1] : r.rank}</span>
                    ${pic}
                    <span class="flex-1 min-w-0">
                        <span class="block truncate text-sm text-wabi-dark tracking-wider"><span class="${place ? 'gname' : ''}">${esc(r.p.name)}</span>${r.p.me ? '<span class="me-tag">我</span>' : ''}</span>
                        <span class="block text-[11px] font-sans tracking-wide leading-snug text-stone-400">${esc(r.e.sub)}</span>
                    </span>
                    <span class="shrink-0 font-sans ${place ? 'gval' : 'text-wabi-dark'} ${metric === 'best' ? 'text-xl font-light' : 'text-sm'}">${esc(r.e.main)}</span>
                </div>`;
            }).join('') : `<p class="py-10 text-center text-xs font-sans tracking-wider text-stone-400 leading-relaxed">${dept === 'clean' ? '房務部' : dept === 'xitou' ? '坐洗部' : '二十七樓'}還沒有人上榜。<br>第一名在等你。</p>`;
            box.querySelectorAll('img.avatar').forEach(img => img.addEventListener('error', () => {
                badPic.add(img.getAttribute('src'));
                const s = document.createElement('span'); s.className = 'avatar'; s.textContent = img.dataset.initial; img.replaceWith(s);
            }, { once: true }));
            if (Line.loggedIn && players.length && !players.some(p => p.me)) {
                box.insertAdjacentHTML('beforeend', '<p class="pt-3 text-center text-[11px] font-sans tracking-wider text-stone-400">你還沒上榜：去打一次工，五分鐘內就會出現。</p>');
            }
            const d = at ? new Date(at) : null;
            $('boardAt').textContent = d && !isNaN(d) ? `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')} 寫的榜` : '';
        }

        function renderJoin() {
            const box = $('join');
            box.classList.toggle('hidden', Line.loggedIn);
            if (Line.loggedIn) return;
            box.innerHTML = `
                <h2 class="text-sm tracking-[0.3em] text-wabi-dark">還沒登入</h2>
                <p class="mt-2 text-xs font-sans tracking-wider text-stone-500 leading-relaxed">沒登入的人打工只記在這支手機，不會上榜。用 LINE 登入以後，打工的成績就會寫上去。</p>
                <button type="button" data-login class="line-btn mt-4 w-full">用 LINE 登入</button>`;
        }

        async function load() {
            if (loading) return;
            loading = true; failed = '';
            if (!players) renderBoard();
            try {
                let session = '';
                try { session = localStorage.getItem('dongbuli-session') || ''; } catch (e) { }
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ type: 'leaderboard', session: session || undefined }) });
                const r = await res.json();
                if (r.result !== 'success') {
                    failed = /不認得的請求/.test(r.error || '') ? '排行榜還沒開張：後端要重新部署「新版本」。' : `讀不到排行榜（${r.error || r.result}）。`;
                } else { players = r.players || []; at = r.at || ''; }
            } catch (e) {
                failed = '連不到後端，可能是網路不穩。';
            }
            loading = false;
            renderBoard();
        }

        document.querySelectorAll('[data-metric]').forEach(b => b.addEventListener('click', () => { metric = b.dataset.metric; save(); renderBoard(); }));
        document.querySelectorAll('[data-dept]').forEach(b => b.addEventListener('click', () => { dept = b.dataset.dept; save(); renderBoard(); }));
        function save() { try { sessionStorage.setItem('dongbuli-rank-tab', JSON.stringify({ metric, dept })); } catch (e) { } }
        $('board').addEventListener('click', e => { if (e.target.closest('[data-retry]')) load(); });
        $('join').addEventListener('click', e => { if (e.target.closest('[data-login]')) Line.login(); });
        Wallet.on(type => {
            if (type === 'login' || type === 'logout') { renderJoin(); setTimeout(load, 2000); }  // 等錢包同步完再讀
        });
        document.addEventListener('visibilitychange', () => { if (!document.hidden && players) load(); });

        renderJoin();
        load();
    </script>
</body>

</html>
