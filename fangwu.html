    <style>
        /* 房間：手指在上面拖、擦，不能捲動頁面，長按也不能跳出系統選單 */
        .room {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #cv {
            display: block;
            width: 100%;
            aspect-ratio: 360 / 400;
            touch-action: none;
            border-radius: 4px;
        }

        .step {
            width: 1.7rem;
            height: 1.7rem;
            border-radius: 9999px;
            border: 1px solid rgb(var(--wabi-sub));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            line-height: 1;
            color: rgb(var(--wabi-accent));
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .step.is-now {
            background: rgb(var(--wabi-dark));
            border-color: rgb(var(--wabi-dark));
            color: rgb(var(--wabi-bg));
        }

        .step.is-done {
            border-color: rgb(var(--wabi-accent) / 0.5);
            color: rgb(var(--wabi-accent) / 0.5);
        }

        .meter {
            position: relative;
            height: 0.5rem;
            border-radius: 9999px;
            background: rgb(var(--wabi-sub) / 0.6);
            overflow: hidden;
        }

        .meter-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            border-radius: 9999px;
            background: rgb(var(--wabi-accent));
            transition: width 0.2s;
        }

        .act-round {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 4.75rem;
            height: 4.75rem;
            border-radius: 9999px;
            background: rgb(var(--wabi-dark));
            color: rgb(var(--wabi-bg));
            font-family: 'Noto Serif TC', serif;
            font-size: 1.5rem;
            box-shadow: 0 14px 30px -12px rgba(0, 0, 0, 0.45);
            transition: transform 0.08s ease;
            touch-action: manipulation;
        }

        .act-round:active {
            transform: scale(0.92);
        }

        .act-text {
            min-height: 44px;
            padding: 0.75rem 2rem;
            border: 1px solid rgb(var(--wabi-dark));
            color: rgb(var(--wabi-dark));
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            touch-action: manipulation;
        }

        .act-text:active {
            background: rgb(var(--wabi-dark));
            color: rgb(var(--wabi-bg));
        }

        /* 三個垃圾桶的按鈕：桶子是實物，顏色固定 */
        .bin-btn {

            min-height: 64px;
            border-radius: 8px;

            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            line-height: 1.3;
            box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18);
            touch-action: manipulation;
        }

        .bin-btn small {
            display: block;

            font-weight: 400;

    <script>
        // ===== 0. 舞台：畫布用固定的 360×400 座標畫，CSS 再縮放 =====
        const W = 360, H = 400, TAU = Math.PI * 2;
        const $ = id => document.getElementById(id);
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const cv = $('cv'), ctx = cv.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        const SERIF = '"Noto Serif TC", serif', SANS = '"Noto Sans TC", sans-serif';
        // 房間裡的東西是實物，顏色固定，不跟晝夜
        const K = { floor: '#dcc9a6', floorLine: '#c8b18a', wood: '#a9825a', woodD: '#7a5a3c', wall: '#efe8dc', white: '#fbf8f2',
            ink: '#3b3431', shu: '#b33a2f', gen: '#6b6b6b', rec: '#2f6ea5', food: '#4f8a3c', sheet: '#dfe8ef', sheetD: '#b9c8d4' };
        const pick = list => list[Math.floor(Math.random() * list.length)];
        const rand = (lo, hi) => lo + Math.random() * (hi - lo);
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
        const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
        const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
        function roundRect(c, x, y, w, h, r) {
            c.beginPath(); c.moveTo(x + r, y);
            c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
            c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
        }

        // ===== 1. 上一組房客：房間亂成什麼樣子看是誰住的 =====
        const GUESTS = [
            { key: 'drink', who: '喝酒團（四個人）', note: '退房的時候還在唱歌。', tags: ['drink'], stains: ['ring', 'ring', 'ring', 'sauce', 'print'], lost: ['earphone', 'key', 'sock'] },
            { key: 'lottery', who: '刮刮樂狂', note: '說要刮到中才退房，最後還是退了。', tags: ['lottery'], stains: ['flake', 'flake', 'flake', 'ring'], lost: ['bei', 'split', 'charger'] },
            { key: 'shampoo', who: '坐洗部的常客', note: '頭髮很香，桌上都是泡泡。', tags: ['shampoo'], stains: ['bubble', 'bubble', 'bubble', 'ring'], lost: ['comb', 'lash', 'sock'] },
            { key: 'food', who: '宵夜派', note: '冰箱是空的，垃圾桶是滿的。', tags: ['food'], stains: ['sauce', 'sauce', 'sauce', 'ring'], lost: ['pudding', 'sock', 'charger'] },
            { key: 'cat', who: '帶貓來住的旅人', note: '貓比人還早起，毛比人還多。', tags: ['cat'], stains: ['fur', 'fur', 'fur', 'sauce'], lost: ['cattoy', 'sock', 'key'] },
            { key: 'ex', who: '前夫', note: '不知道為什麼會來住。', tags: ['ex'], stains: ['print', 'print', 'print', 'ring'], lost: ['exprint', 'key', 'split'], rare: true },
        ];
        function pickGuest() { return Math.random() < 0.05 ? GUESTS.find(g => g.rare) : pick(GUESTS.filter(g => !g.rare)); }

        // ===== 2. 垃圾：照台灣（台北市）的分類 =====
        // bin：gen 一般垃圾、rec 資源回收、food 廚餘；why 分錯時說明；tags 哪種房客比較會留下
        const BINS = { gen: { name: '一般垃圾', color: K.gen }, rec: { name: '資源回收', color: K.rec }, food: { name: '廚餘', color: K.food } };
        const ITEMS = [
            { name: '啤酒罐', bin: 'rec', icon: 'can', tags: ['drink'], why: '鋁罐倒乾淨，資源回收。' },
            { name: '寶特瓶', bin: 'rec', icon: 'bottle', tags: ['all'], why: '寶特瓶倒空、壓扁，資源回收。' },
            { name: '玻璃酒瓶', bin: 'rec', icon: 'glass', tags: ['drink'], why: '玻璃瓶資源回收（破掉的要包好丟一般垃圾）。' },
            { name: '吃剩的丼飯', bin: 'food', icon: 'bowl', tags: ['food', 'all'], why: '剩飯剩菜是廚餘，湯汁先瀝乾。' },
            { name: '香蕉皮', bin: 'food', icon: 'peel', tags: ['food'], why: '果皮是廚餘。' },
            { name: '茶葉渣', bin: 'food', icon: 'leaves', tags: ['drink'], why: '茶葉渣是廚餘。' },
            { name: '咖啡渣', bin: 'food', icon: 'coffee', tags: ['all'], why: '咖啡渣是廚餘。' },
            { name: '喝剩的珍珠', bin: 'food', icon: 'pearls', tags: ['food'], why: '珍珠是食物，倒出來丟廚餘。' },
            { name: '布丁杯', bin: 'rec', icon: 'pudding', tags: ['food', 'ex'], why: '塑膠杯沖乾淨，資源回收（布丁要先吃完）。' },
            { name: '手搖飲杯', bin: 'rec', icon: 'drinkcup', tags: ['food', 'all'], why: '塑膠杯洗乾淨回收；吸管、封膜丟一般垃圾。' },
            { name: '鋁箔包', bin: 'rec', icon: 'tetra', tags: ['all'], why: '鋁箔包壓扁，資源回收。' },
            { name: '紙箱', bin: 'rec', icon: 'box', tags: ['all'], why: '紙箱攤平，紙類回收。' },
            { name: '舊報紙', bin: 'rec', icon: 'paper', tags: ['all'], why: '報紙是紙類，資源回收。' },
            { name: '洗髮精空瓶', bin: 'rec', icon: 'shampoo', tags: ['shampoo'], why: '塑膠瓶沖乾淨，資源回收。' },
            { name: '乾電池', bin: 'rec', icon: 'battery', tags: ['all'], why: '乾電池是資源回收，要另外交給回收車或便利商店，不能丟一般垃圾。' },
            { name: '用過的衛生紙', bin: 'gen', icon: 'tissue', tags: ['all'], why: '衛生紙不能回收（纖維太短），一般垃圾。' },
            { name: '刮刮樂彩券', bin: 'gen', icon: 'ticket', tags: ['lottery'], why: '刮刮樂有銀漆塗層，不能回收，一般垃圾。' },
            { name: '發票', bin: 'gen', icon: 'receipt', tags: ['lottery', 'all'], why: '發票是感熱紙，不能回收，一般垃圾（先對完獎）。' },
            { name: '免洗筷', bin: 'gen', icon: 'sticks', tags: ['food'], why: '免洗筷是一般垃圾。' },
            { name: '口罩', bin: 'gen', icon: 'mask', tags: ['all'], why: '口罩是一般垃圾。' },
            { name: '舊牙刷', bin: 'gen', icon: 'brush', tags: ['shampoo'], why: '牙刷是一般垃圾。' },
            { name: '濕紙巾', bin: 'gen', icon: 'wipe', tags: ['shampoo', 'cat'], why: '濕紙巾是不織布，不能回收，一般垃圾。' },
            { name: '菸蒂', bin: 'gen', icon: 'butt', tags: ['drink'], why: '菸蒂熄滅後丟一般垃圾。' },
            { name: '牙線', bin: 'gen', icon: 'floss', tags: ['shampoo'], why: '牙線是一般垃圾。' },
            { name: '用過的貓砂', bin: 'gen', icon: 'litter', tags: ['cat'], why: '用過的貓砂丟一般垃圾，不能倒馬桶。' },
            { name: '貓罐頭空罐', bin: 'rec', icon: 'catcan', tags: ['cat'], why: '鐵罐沖乾淨，資源回收。' },
        ];
        const SORT_N = 12;
        function pickItems(guest) {
            const mine = shuffle(ITEMS.filter(i => i.tags.includes(guest.key))).slice(0, 5);
            const rest = shuffle(ITEMS.filter(i => !mine.includes(i)));
            // 三個桶子都至少要有兩件
            const out = mine.slice();
            ['gen', 'rec', 'food'].forEach(b => { while (out.filter(i => i.bin === b).length < 2) { const k = rest.findIndex(i => i.bin === b && !out.includes(i)); out.push(rest.splice(k, 1)[0]); } });
            while (out.length < SORT_N) out.push(rest.splice(rest.findIndex(i => !out.includes(i)), 1)[0]);
            return shuffle(out.slice(0, SORT_N));
        }

        // ===== 3. 遺失物：藏在房間裡，找到另外給錢 =====
        const LOST = {
            bei: { name: '筊杯（擲杯用的）', bonus: 150, icon: 'bei' },
            earphone: { name: '一隻耳機', bonus: 150, icon: 'earphone' },
            sock: { name: '一隻襪子', bonus: 100, icon: 'sock' },
            key: { name: '車鑰匙', bonus: 200, icon: 'key' },
            charger: { name: '充電線', bonus: 100, icon: 'charger' },
            split: { name: '還沒算完的分帳單', bonus: 150, icon: 'split' },
            pudding: { name: '沒吃完的布丁', bonus: 120, icon: 'pudding' },
            lash: { name: '假睫毛', bonus: 100, icon: 'lash' },
            cattoy: { name: '逗貓棒', bonus: 120, icon: 'cattoy' },
            comb: { name: '梳子', bonus: 100, icon: 'comb' },
            lotto: { name: '一張還沒刮的刮刮樂', bonus: 500, icon: 'ticket', rare: true },
            exprint: { name: '前夫的指紋（裱框）', bonus: 800, icon: 'exprint', rare: true },
        };
        // 藏東西的地方（找・物那一關的房間）
        const SPOTS = [
            { key: 'pillow', label: '枕頭下', x: 32, y: 34, w: 140, h: 46 },
            { key: 'underbed', label: '床底', x: 24, y: 168, w: 156, h: 34 },

        // ===== 5. 聲音（Web Audio 合成） =====
        let audioCtx = null;
        function audio() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            } catch (e) { return null; }
        }
        function tone(freq, dur, vol = 0.15, type = 'sine', at = 0, slide = 1) {
            const a = audio();
            if (!a) return;
            const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
            o.type = type; o.frequency.setValueAtTime(freq, t);
            if (slide !== 1) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
            g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
            return o;
        }
        function noise(dur, vol = 0.1, freq = 1200) {
            const a = audio();
            if (!a) return;
            const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate), d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

            src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
            src.connect(f).connect(g).connect(a.destination); src.start();
        }

        function playElise() {
            const a = audio();
            if (!a) return;
            stopElise();
            const beat = 0.19, nodes = [];
            let t = a.currentTime + 0.05;
            const lap = ELISE.reduce((s, n) => s + n[1], 0) * beat;
            for (let lapI = 0; lapI < 3; lapI++) {
                ELISE.forEach(([n, len]) => {
                    const o = a.createOscillator(), g = a.createGain();

        }
        function drawSort(c, now) {

                c.save(); c.translate(q.x, q.y); c.scale(1 + bt / 60, 1 - bt / 80);
                c.fillStyle = '#fff'; c.strokeStyle = '#d9d2c6'; c.lineWidth = 1.5;
                roundRect(c, -42, -20 - fl * 1.5, 84, 40 + fl * 3, 14); c.fill(); c.stroke();
                if (fl < 3) { c.strokeStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.moveTo(-28, 0); c.lineTo(28, 2); c.stroke(); }
                c.fillStyle = fl >= 3 ? K.shu : '#b9ae9f'; c.font = `500 10px ${SANS}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(fl >= 3 ? '鬆' : `拍 ${3 - fl}`, 0, 0);
                c.restore();
            });
            // 角的把手
            P.forEach((q, i) => {
                if (q.placed) return;
                c.fillStyle = b.drag === i ? K.shu : '#fff'; c.strokeStyle = K.shu; c.lineWidth = 2.5;
                c.beginPath(); c.arc(q.x, q.y, 13, 0, TAU); c.fill(); c.stroke();
                c.fillStyle = b.drag === i ? '#fff' : K.shu; c.font = `700 11px ${SANS}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('拉', q.x, q.y + 0.5);
            });
        }
        function drawRun(c, now) {
            const r = G.run;
            c.fillStyle = '#e9e3d8'; c.fillRect(0, 0, W, H);
            // 樓梯間（之字形）
            c.strokeStyle = '#b5aa98'; c.lineWidth = 3;
            const off = ((27 - r.floor) * 40 + (r.step && now - r.step < 120 ? (now - r.step) / 120 * 40 - 40 : 0)) % 80;
            for (let y = -80 + off; y < 320; y += 80) { c.beginPath(); c.moveTo(60, y); c.lineTo(300, y + 40); c.lineTo(60, y + 80); c.stroke(); }
            // 樓層
            c.fillStyle = K.ink; c.font = `700 64px ${SANS}`; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(`${r.floor}F`, 20, 14);
            // 人（扛著垃圾袋）
            const bob = r.step && now - r.step < 150 ? -6 : 0;
            c.save(); c.translate(200, 170 + bob);
            c.fillStyle = '#3b3431'; c.beginPath(); c.arc(0, -36, 11, 0, TAU); c.fill();
            c.fillRect(-7, -24, 14, 30);
            c.strokeStyle = '#3b3431'; c.lineWidth = 5; c.beginPath(); c.moveTo(-3, 6); c.lineTo(-10 + (bob ? 8 : 0), 30); c.moveTo(3, 6); c.lineTo(10 - (bob ? 8 : 0), 30); c.stroke();
            c.fillStyle = '#2c2c2c'; [-22, 22].forEach(x => { c.beginPath(); c.ellipse(x, -4, 13, 16, 0, 0, TAU); c.fill(); c.fillStyle = '#4a4a4a'; c.fillRect(x - 3, -22, 6, 6); c.fillStyle = '#2c2c2c'; });
            c.restore();
            // 街上：垃圾車開過來又開走
            c.fillStyle = '#9aa0a6'; c.fillRect(0, 330, W, 70);
            c.fillStyle = '#fff'; for (let x = 0; x < W; x += 40) c.fillRect(x, 362, 20, 4);
            const t = now < r.t0 ? 0 : clamp((now - r.t0) / RUN_LIMIT, 0, 1);
            const tx = r.done && r.made ? 150 : W + 20 - t * (W + 160);
            c.save(); c.translate(tx, 336);
            c.fillStyle = '#f2c94c'; roundRect(c, 0, 0, 52, 30, 4); c.fill();
            c.fillStyle = '#2f6ea5'; roundRect(c, 50, 4, 70, 26, 4); c.fill();
            c.fillStyle = '#cfe3f2'; c.fillRect(6, 4, 22, 12);
            c.fillStyle = '#2c2c2c'; [14, 44, 96].forEach(x => { c.beginPath(); c.arc(x, 32, 7, 0, TAU); c.fill(); });
            c.restore();
            // 音符
            if (!r.done) for (let i = 0; i < 3; i++) { const k = ((now / 900) + i / 3) % 1; c.fillStyle = `rgba(59,52,49,${1 - k})`; c.font = `700 16px ${SANS}`; c.fillText('♪', tx + 20 + i * 18, 320 - k * 40); }
            if (now < r.t0) { c.fillStyle = K.shu; c.font = `700 30px ${SERIF}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('預備', 180, 250); }
            // 時間到
            if (!r.done && now > r.end) endRun(false);
        }
        function drawFloats(c, now) {
            floats = floats.filter(f => now - f.born < f.life);
            floats.forEach(f => {
                const k = (now - f.born) / f.life;
                c.save(); c.globalAlpha = 1 - k; c.fillStyle = f.color; c.font = `700 22px ${SERIF}`; c.textAlign = 'center'; c.textBaseline = 'middle';
                c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 4; c.strokeText(f.text, f.x, f.y - k * 30); c.fillText(f.text, f.x, f.y - k * 30);
                c.restore();
            });
        }
        function frame(now) {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, W, H);
            if (G) {
                if (stage === -1 || stage === 5) drawFindRoom(ctx, now, stage === -1);
                else if (stage === 0) drawSort(ctx, now);
                else if (stage === 1) drawWipe(ctx, now);
                else if (stage === 2 || stage === 2.5) drawBed(ctx, now);
                else if (stage === 3 || stage === 3.5) drawFindRoom(ctx, now, false);
                else if (stage === 4) drawRun(ctx, now);
                drawFloats(ctx, now);
            }
            requestAnimationFrame(frame);
        }

        // ===== 8. 手指 =====
        const toP = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
        let down = false, lastP = null;
        cv.addEventListener('pointerdown', e => {
            audio();
            down = true; const p = toP(e); lastP = p;
            try { cv.setPointerCapture(e.pointerId); } catch (err) { }
            if (stage === 1) wipeAt(p, null);
            else if (stage === 2) bedDown(p);
            else if (stage === 3) findTap(p);
            else if (stage === 0) { const bi = [0, 1, 2].find(i => p.y > 296 && p.x > 26 + i * 108 && p.x < 118 + i * 108); if (bi !== undefined) answer(['gen', 'rec', 'food'][bi]); }
        });
        cv.addEventListener('pointermove', e => {
            if (!down) return;
            const p = toP(e);
            if (stage === 1) wipeAt(p, lastP);
            else if (stage === 2) bedMove(p);
            lastP = p;
        });
        const up = () => { if (!down) return; down = false; if (stage === 2) bedUp(); };
        cv.addEventListener('pointerup', up);
        cv.addEventListener('pointercancel', up);
        cv.addEventListener('contextmenu', e => e.preventDefault());

        // ===== 9. 結算 =====
        const GRADES = [
            { min: 90, mark: '淨', line: '一塵不染' },
            { min: 75, mark: '亮', line: '可以直接入住' },
            { min: 55, mark: '可', line: '勉強可以' },
            { min: 35, mark: '亂', line: '主人會念' },
            { min: 0, mark: '髒', line: '下一組要退房了' },
        ];
        const BEST_KEY = 'dongbuli-fangwu-best', STATS_KEY = 'dongbuli-fangwu-stats';
        let sheetFile = null;
        function renderBest() {
            let best = 0;
            try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { }
            $('best').innerHTML = (best ? `最高乾淨度 ${best}<br>` : '') + `錢包 ${Wallet.fmt(Wallet.money)}`;
        }
        const loadStats = () => {
            let st = null;
            try { st = JSON.parse(localStorage.getItem(STATS_KEY)); } catch (e) { }
            st = st || { rooms: 0, best: 0, paid: 0, sortRight: 0, sortTotal: 0, made: 0, found: {}, guests: {}, wrong: {} };
            st.recent = st.recent || [];
            return st;
        };
        function recordRoom(total, pay, grade) {
            const st = loadStats();
            st.rooms++; st.best = Math.max(st.best, total); st.paid += pay;
            st.sortRight += G.right; st.sortTotal += SORT_N; if (G.run.made) st.made++;
            G.find.found.forEach(k => { st.found[k] = (st.found[k] || 0) + 1; });
            st.guests[G.guest.key] = (st.guests[G.guest.key] || 0) + 1;
            G.wrongs.forEach(w => { st.wrong[w.item.name] = (st.wrong[w.item.name] || 0) + 1; });
            // 這一間的細節（最近 50 間），也送到後端（Cleans 分頁）
            const s = G.scores;
            st.recent.unshift({
                at: new Date().toISOString(),
                ms: Math.round(performance.now() - G.startedAt),
                guest: G.guest.key, total, grade: grade.mark,
                parts: { sort: s.sort, wipe: s.wipe, bed: s.bed, find: s.find, run: s.run },
                sort_right: G.right,
                wrong: G.wrongs.map(w => `${w.item.name}:${w.bin}>${w.item.bin}`),
                cleaned: Math.round(G.cleaned * 100), wipe_ms: G.wipeMs,
                corners: G.bed.corners.filter(c => c.placed).length,
                pillows: G.bed.pillows.filter(n => n >= 3).length,
                peeks: PEEKS - G.find.peeks, hidden: G.find.total, found: G.find.found.slice(),
                made: !!G.run.made, floor: G.run.floor,
                pay: { ...G.pay },
                login: !!(window.Line && Line.loggedIn),
            });
            st.recent = st.recent.slice(0, 50);
            try { localStorage.setItem(STATS_KEY, JSON.stringify(st)); } catch (e) { }
        }

        // ---- 打掃紀錄送後端（跟坐洗部一樣：洗完馬上送、打開頁面補送；不用 keepalive）----
        const API_URL = (window.Line && Line.API_URL) || "https://script.google.com/macros/s/AKfycbz6TWDms090u7iS_Xk0lmbbz6mlpfbCoK2mffmpRootu2Hv2lYiASpDbb7n8COwnr_K/exec";
        function deviceId() {
            let id = '';
            try { id = localStorage.getItem('dongbuli-device') || ''; } catch (e) { }
            if (!id) {
                id = window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'd-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
                try { localStorage.setItem('dongbuli-device', id); } catch (e) { }
            }
            return id;
        }
        let uploading = null;
        function uploadRooms() {
            if (!uploading) uploading = doUpload().finally(() => { uploading = null; });
            return uploading;
        }
        async function doUpload() {
            const st = loadStats();
            const todo = st.recent.filter(r => !st.synced || r.at > st.synced).reverse().slice(0, 20);  // 舊的先送
            if (!todo.length) return { ok: true, saved: 0 };
            try {
                let session = '';
                try { session = localStorage.getItem('dongbuli-session') || ''; } catch (e) { }
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ type: 'cleanLog', device: deviceId(), session, recs: todo }) });
                const r = await res.json();
                if (r.result !== 'success') return { ok: false, error: r.error || r.result || '後端沒回成功' };
                const now = loadStats();
                now.synced = todo[todo.length - 1].at;
                try { localStorage.setItem(STATS_KEY, JSON.stringify(now)); } catch (e) { }
                if (todo.length === 20) setTimeout(uploadRooms, 1500);
                return { ok: true, saved: r.saved };
            } catch (e) {
                return { ok: false, error: '連不到後端' };
            }
        }
        function showSyncNote(r) {
            const el = $('syncNote');
            if (!el) return;
            if (r.ok) el.textContent = '這間房的打掃紀錄存到雲端了';
            else if (/不認得的請求/.test(r.error)) el.textContent = '紀錄還沒存上去：後端還是舊版（要重新部署「新版本」）';
            else el.textContent = `紀錄還沒存上去（${r.error}），下次打掃完會補存`;
        }
        async function showResult() {
            stage = 5; setSteps(5);
            const s = G.scores, total = s.sort + s.wipe + s.bed + s.find + s.run;
            const grade = GRADES.find(g => total >= g.min);
            const base = Math.max(100, total * 10);
            const lost = G.find.found.reduce((t, k) => t + LOST[k].bonus, 0);
            const star = total >= 90 ? 500 : total >= 75 ? 200 : 0;
            G.pay = { base, lost, star };
            Wallet.earn(base + lost + star, 'clean');
            try { if (total > (Number(localStorage.getItem(BEST_KEY)) || 0)) localStorage.setItem(BEST_KEY, String(total)); } catch (e) { }
            recordRoom(total, base + lost + star, grade);
            $('syncNote').textContent = '';
            uploadRooms().then(showSyncNote);
            note(grade.line + '。');
            hint('');
            meter(total, `乾淨度 ${total}`);
            sfx.stamp();
            $('score').textContent = total;
            $('gradeLine').textContent = `${grade.mark}・${grade.line}`;
            $('payBase').textContent = Wallet.fmt(base);
            $('payLostRow').classList.toggle('hidden', !lost);
            $('payLost').textContent = Wallet.fmt(lost);
            $('payStarRow').classList.toggle('hidden', !star);
            $('payStar').textContent = Wallet.fmt(star);
            $('payWallet').textContent = Wallet.fmt(Wallet.money);
            $('payAcct').innerHTML = Line.loggedIn ? `存在 ${esc((Line.profile || {}).name || 'LINE')} 的 LINE 帳號` : '錢只存在這支手機。<button type="button" data-login class="min-h-[32px] underline underline-offset-4 text-wabi-dark">用 LINE 登入</button>，換手機也在';
            $('wrongBox').classList.toggle('hidden', !G.wrongs.length);
            $('wrongList').innerHTML = G.wrongs.map(w => `<li><b class="font-normal text-wabi-dark">${esc(w.item.name)}</b>：你丟${BINS[w.bin].name}，要丟<b class="font-normal text-wabi-shu">${BINS[w.item.bin].name}</b>。${esc(w.item.why)}</li>`).join('');
            actions([]);
            renderBest();
            try {
                const blob = await makeSheet(total, grade);
                sheetFile = new File([blob], `dongbuli-fangwu-${Date.now()}.png`, { type: 'image/png' });
                $('sheetImg').src = URL.createObjectURL(blob);
            } catch (e) { }
            const canShare = !!(sheetFile && navigator.canShare && navigator.canShare({ files: [sheetFile] }));
            $('shareBtn').textContent = canShare ? '分享房務檢查表' : '下載房務檢查表';
            $('result').classList.remove('hidden');
            $('result').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
        }

        async function makeSheet(total, grade) {
            const s = G.scores, r = G.run, f = G.find;
            const rows = [
                ['上一組', G.guest.who],
                ['撿・分', `分對 ${G.right} / ${SORT_N} 件`],
                ['擦・亮', `擦掉 ${Math.round(G.cleaned * 100)}%${G.wipeMs && G.cleaned >= 0.95 ? `（${(G.wipeMs / 1000).toFixed(1)} 秒）` : ''}`],
                ['鋪・床', `${G.bed.corners.filter(c => c.placed).length} 個角到位・枕頭${G.bed.pillows.filter(n => n >= 3).length === 2 ? '拍鬆了' : '還扁扁的'}`],
                ['找・物', f.found.length ? f.found.map(k => LOST[k].name).join('、') : '什麼都沒找到'],
                ['倒・垃圾', r.made ? '趕上垃圾車' : `沒趕上，在 ${r.floor} 樓`],
                ['房務費', Wallet.fmt(G.pay.base) + (G.pay.lost + G.pay.star ? `＋${Wallet.fmt(G.pay.lost + G.pay.star)}` : '')],
            ];
            const allText = rows.flat().join('') + '房務檢查表乾淨度二十七樓房務部主人' + grade.mark + grade.line + '0123456789';
            try { await Promise.race([Promise.all([document.fonts.load(`600 40px ${SERIF}`, allText), document.fonts.load(`400 40px ${SANS}`, allText)]), new Promise(res => setTimeout(res, 2500))]); } catch (e) { }
            const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
            const x = c.getContext('2d');
            const text = (str, px, py, font, color, align = 'center') => { x.font = font; x.fillStyle = color; x.textAlign = align; x.fillText(str, px, py); };
            x.fillStyle = '#fcfaf8'; x.fillRect(0, 0, c.width, c.height);
            x.strokeStyle = '#8e8070'; x.lineWidth = 2; x.strokeRect(40, 40, 1000, 1270); x.lineWidth = 1; x.strokeRect(54, 54, 972, 1242);
            text('D O N G B U L I ・ 2 7 F ・ 房 務 部', 540, 130, `400 26px ${SANS}`, '#8e8070');
            text('房務檢查表', 540, 220, `600 76px ${SERIF}`, '#2c2c2c');
            x.fillStyle = '#8e8070'; x.fillRect(500, 250, 80, 2);
            let y = 340;
            rows.forEach(([k, v], i) => {
                const done = [true, G.right >= 10, G.cleaned >= 0.95, G.scores.bed >= 14, f.found.length === f.total, r.made, true][i];
                if (i > 0 && i < 6) { x.strokeStyle = '#8e8070'; x.lineWidth = 2; x.strokeRect(150, y - 30, 34, 34); if (done) { x.strokeStyle = '#b33a2f'; x.lineWidth = 5; x.beginPath(); x.moveTo(156, y - 14); x.lineTo(166, y - 2); x.lineTo(186, y - 36); x.stroke(); } }
                text(k, 210, y, `400 30px ${SANS}`, '#8e8070', 'left');
                x.font = `400 36px ${SERIF}`;
                const fit = Math.min(36, Math.floor(36 * 600 / Math.max(1, x.measureText(v).width)));
                text(v, 380, y, `400 ${fit}px ${SERIF}`, '#4a4a4a', 'left');
                y += 92;
            });
            text(`乾淨度 ${total}`, 150, y + 50, `600 52px ${SERIF}`, '#2c2c2c', 'left');
            text(grade.line, 150, y + 110, `400 30px ${SERIF}`, '#8e8070', 'left');
            text('主人', 640, y + 110, `400 26px ${SANS}`, '#8e8070', 'left');
            x.strokeStyle = '#8e8070'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(700, y + 112); x.lineTo(760, y + 112); x.stroke();
            x.save(); x.translate(850, y + 50); x.rotate(-0.12); x.globalAlpha = 0.9;
            x.strokeStyle = '#b33a2f'; x.lineWidth = 7; x.strokeRect(-85, -85, 170, 170); x.lineWidth = 2.5; x.strokeRect(-100, -100, 200, 200);
            x.textBaseline = 'middle'; text(grade.mark, 0, 6, `700 120px ${SERIF}`, '#b33a2f');
            x.restore();
            const d = new Date();
            text(`${d.getFullYear()}・${d.getMonth() + 1}・${d.getDate()}`, 540, 1270, `400 24px ${SANS}`, '#8e8070');
            return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(), 'image/png'));
        }
        async function shareSheet() {
            if (!sheetFile) return;
            if (navigator.canShare && navigator.canShare({ files: [sheetFile] })) {
                try { await navigator.share({ files: [sheetFile], title: '丼步喱・絆 房務檢查表', text: `我在二十七樓打掃了一間房，乾淨度 ${$('score').textContent}` }); } catch (e) { }
                return;
            }
            const a = document.createElement('a'); a.href = URL.createObjectURL(sheetFile); a.download = sheetFile.name; a.click();
        }
        const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);

        $('shareBtn').addEventListener('click', shareSheet);
        $('againBtn').addEventListener('click', () => { intro(); $('room').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' }); });
        $('payAcct').addEventListener('click', e => { if (e.target.closest('[data-login]')) Line.login(); });
        Wallet.on(type => { renderBest(); if (type === 'login') showToast('登入了，房務費存進 LINE 帳號'); });
        document.addEventListener('visibilitychange', () => { if (document.hidden) stopElise(); });

        intro();
        requestAnimationFrame(frame);
        setTimeout(uploadRooms, 2500);  // 補送上次沒送成功的
    </script>
</body>
