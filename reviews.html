    <style>
        .vertical-rl {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.25em;
        }

        /* 評分星星樣式 */
        .rating-input input {
            display: none;
        }

        .rating-input label {
            cursor: pointer;
            color: rgb(var(--wabi-sub));
            transition: color 0.3s;
        }

        .rating-input input:checked~label {
            color: rgb(var(--wabi-accent));
        }

        .review-card {
            transition: transform 0.3s ease;
        }

        /* 只有滑鼠才有 hover；手機點完星星不會卡在 hover 的顏色 */
        @media (hover: hover) {
            .rating-input label:hover,
            .rating-input label:hover~label {
                color: rgb(var(--wabi-accent));
            }

            .review-card:hover {
                transform: translateY(-5px);
            }
        }

        /* 剛留的那則：淡入，左邊朱色一下再退回 */
        @keyframes review-in {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: none; }
        }

        @keyframes review-mark {
            0%, 60% { box-shadow: inset 3px 0 0 rgb(var(--wabi-shu)); }
            100% { box-shadow: inset 3px 0 0 transparent; }
        }

        .review-new {
            animation: review-in 0.6s ease both, review-mark 2.5s ease 0.6s both;
        }

        .review-message {
            white-space: pre-line; /* 留言裡的換行照原樣顯示 */
            overflow-wrap: anywhere; /* 很長的網址或一串英文也不會撐破畫面 */
        }

        /* 一星時表單搖一下 */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px) rotate(-1deg);
            }

            40% {
                transform: translateX(7px) rotate(1deg);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(3px);
            }
        }

        .shake {
            animation: shake 0.5s ease;
        }
    </style>
    <!-- 先打包好的 Tailwind（CDN 被擋或太慢時排版也不會跑掉；放在 head 最後，跟 CDN 插入的位置一樣） -->

<body
    class="text-wabi-text font-serif leading-loose antialiased selection:bg-wabi-accent selection:text-white min-h-screen flex flex-col">

    <nav
        class="fixed top-0 w-full px-4 py-5 md:p-8 flex justify-between items-center z-40 bg-wabi-bg/90 backdrop-blur-sm border-b border-stone-100">
        <a href="index.html"
            class="text-base md:text-xl font-bold tracking-[0.1em] md:tracking-widest-xl uppercase whitespace-nowrap hover:text-black transition-colors duration-300">DongBuLi</a>
        <div class="flex gap-3 md:gap-8">
            <a href="index.html"
                class="text-xs tracking-normal md:tracking-widest whitespace-nowrap hover:text-wabi-dark transition-colors duration-500 text-stone-400">首頁・歸</a>
            <span class="text-xs tracking-normal md:tracking-widest whitespace-nowrap text-wabi-dark border-b border-wabi-dark pb-1">留言・絆</span>

    <!-- 主要內容 -->
    <main class="flex-grow max-w-5xl mx-auto pt-28 pb-16 px-4 md:py-32 md:px-8 w-full">

        <!-- 標題區塊 -->
        <div class="text-center mb-12 md:mb-16 relative">
            <span class="text-xs font-sans tracking-widest text-wabi-accent block mb-4">GUESTBOOK</span>
            <h1 class="text-4xl md:text-5xl font-light text-wabi-dark mb-4 tracking-widest">旅人・回響</h1>
            <div class="w-16 h-[1px] bg-wabi-accent mx-auto mt-8"></div>
            <p class="mt-8 text-sm text-stone-500 font-sans tracking-widest max-w-lg mx-auto leading-relaxed">
                留下一抹足跡，證明我們曾在此相遇。<br>
                每一則留言，都是這空間記憶的一部分。
            </p>
        </div>

        <div class="grid md:grid-cols-12 gap-12 md:gap-12">

            <!-- 左側：留言列表 -->
            <div class="md:col-span-7 space-y-8">
                <div class="flex justify-between items-baseline gap-4 mb-6">
                    <h3 class="text-lg font-light text-wabi-dark tracking-widest border-l-2 border-wabi-accent pl-4 whitespace-nowrap">
                        最新留言</h3>
                    <p id="reviewStats" class="text-xs font-sans tracking-widest text-stone-400 text-right"></p>
                </div>

                <!-- 留言載入中 -->
                <div id="loadingReviews" class="text-center py-12">
                    <div
                        class="inline-block w-8 h-8 border-2 border-stone-200 border-t-wabi-accent rounded-full animate-spin">
                    </div>
                    <p class="mt-4 text-xs tracking-widest text-stone-400">正在喚醒記憶...</p>
                </div>

                <!-- 留言列表容器 -->
                <div id="reviewsContainer" class="space-y-6 scroll-mt-24">
                    <!-- JS 會將留言插入此處 -->
                </div>
                <div class="text-center">
                    <button type="button" id="moreBtn" onclick="showMore()"
                        class="hidden px-6 py-3 text-xs font-sans tracking-widest text-stone-500 border-b border-stone-300 hover:text-wabi-dark transition-colors">往前翻</button>
                </div>
            </div>

            <!-- 右側：新增留言表單 -->
            <div class="md:col-span-5 order-first md:order-none">
                <div class="md:sticky md:top-32">
                    <div id="reviewCard"
                        class="bg-white p-6 md:p-10 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.05)] rounded-sm border border-stone-50">
                        <h3 class="text-xl font-light text-wabi-dark mb-6 md:mb-8 tracking-widest">寫下心情</h3>

                        <form id="reviewForm" class="space-y-6">
                            <div>
                                <label class="block text-xs font-sans mb-2 text-stone-500 tracking-widest">姓名</label>
                                <input type="text" name="name" required maxlength="12" autocomplete="nickname"

                                    placeholder="您的稱呼">

                            <div>
                                <label class="block text-xs font-sans mb-2 text-stone-500 tracking-widest">評分</label>
                                <div class="rating-input flex flex-row-reverse justify-end text-2xl -ml-1.5">
                                    <input type="radio" id="star5" name="rating" value="5" /><label
                                        class="px-1.5 py-1" for="star5">★</label>
                                    <input type="radio" id="star4" name="rating" value="4" /><label
                                        class="px-1.5 py-1" for="star4">★</label>
                                    <input type="radio" id="star3" name="rating" value="3" checked /><label
                                        class="px-1.5 py-1" for="star3">★</label>
                                    <input type="radio" id="star2" name="rating" value="2" /><label
                                        class="px-1.5 py-1" for="star2">★</label>
                                    <input type="radio" id="star1" name="rating" value="1" /><label
                                        class="px-1.5 py-1" for="star1">★</label>
                                </div>
                                <p id="ratingReaction" class="h-4 mt-1 text-xs font-sans tracking-widest text-stone-400"></p>
                            </div>

                            <div>
                                <div class="flex justify-between items-baseline mb-2">
                                    <label class="block text-xs font-sans text-stone-500 tracking-widest">留言</label>
                                    <span id="charCount" class="text-[11px] font-sans tracking-widest text-stone-400">0 / 300</span>
                                </div>
                                <textarea name="message" required rows="4" maxlength="300"

                                    placeholder="分享您的體驗..."></textarea>
                            </div>

                            <button type="submit" id="submitBtn"
                                class="w-full bg-wabi-dark text-white py-4 px-8 mt-4 hover:bg-black transition-all duration-300 tracking-[0.2em] font-sans text-xs uppercase shadow-lg group">
                                <span class="group-hover:tracking-[0.4em] transition-all duration-300">送出留言</span>

    <footer
        class="text-center py-16 text-stone-300 text-xs font-sans tracking-widest mt-auto border-t border-stone-100">

    <script>
        // Google Apps Script API URL
        const API_URL = "https://script.google.com/macros/s/AKfycbz6TWDms090u7iS_Xk0lmbbz6mlpfbCoK2mffmpRootu2Hv2lYiASpDbb7n8COwnr_K/exec";

        const PAGE_SIZE = 10;
        const NAME_KEY = 'dongbuli-review-name'; // 記住上次留言的名字（只存在這台手機）
        let allReviews = [];
        let shown = PAGE_SIZE;

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

        // 載入留言
        async function fetchReviews() {
            const loading = document.getElementById('loadingReviews');
            loading.style.display = '';
            loading.innerHTML = `
                <div class="inline-block w-8 h-8 border-2 border-stone-200 border-t-wabi-accent rounded-full animate-spin"></div>
                <p class="mt-4 text-xs tracking-widest text-stone-400">正在喚醒記憶...</p>`;
            try {
                const res = await fetch(`${API_URL}?action=getReviews`);
                const data = await res.json();
                if (!Array.isArray(data)) throw new Error('格式不對');
                // 新的在前面（不管後端給的順序）
                allReviews = data.slice().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                renderReviews();
            } catch (error) {
                console.error("無法載入留言:", error);
                loading.innerHTML = `
                    <p class="text-xs tracking-widest text-stone-400">暫時無法讀取記憶之書。</p>
                    <button type="button" onclick="fetchReviews()"
                        class="mt-4 px-5 py-3 border border-stone-300 text-xs font-sans tracking-widest text-wabi-dark hover:border-wabi-dark transition-colors">再翻一次</button>`;
            }
        }

        // 剛剛、5 分鐘前、3 小時前、昨天、4 天前，再久就寫日期
        function when(ts) {
            const t = new Date(ts);
            if (isNaN(t)) return '';
            const min = (Date.now() - t) / 60000;
            if (min < 1) return '剛剛';
            if (min < 60) return `${Math.floor(min)} 分鐘前`;
            if (min < 1440) return `${Math.floor(min / 60)} 小時前`;
            const days = Math.floor(min / 1440);
            if (days < 7) return days === 1 ? '昨天' : `${days} 天前`;
            return `${t.getFullYear()}.${t.getMonth() + 1}.${t.getDate()}`;
        }

        function reviewCard(review, isNew) {
            const rating = Math.min(5, Math.max(1, parseInt(review.rating) || 5));
            const stars = '★'.repeat(rating) + '☆'.repeat(5 - rating);
            return `
                <div class="review-card ${isNew ? 'review-new' : ''} bg-white p-5 md:p-8 shadow-sm border border-stone-100 rounded-sm relative overflow-hidden group">
                    <div class="absolute top-0 right-0 p-4 opacity-5 text-6xl font-serif text-wabi-accent select-none group-hover:scale-110 transition-transform duration-700">"</div>

                    <div class="flex justify-between items-baseline gap-3 mb-4 relative z-10">
                        <h4 class="text-lg font-serif text-wabi-dark break-all">${esc(review.name) || '匿名訪客'}</h4>
                        <span class="text-wabi-accent text-sm whitespace-nowrap" aria-label="${rating} 顆星">${stars}</span>
                    </div>

                    <p class="review-message text-stone-600 font-light leading-relaxed text-sm md:text-base border-l border-stone-200 pl-4 mb-4 relative z-10">${esc(review.message || review.content)}</p>

                    <div class="text-right">
                        <span class="text-[11px] text-stone-400 font-sans tracking-widest">${when(review.timestamp || review.date)}</span>
                    </div>
                </div>`;
        }

        function renderReviews(newOne) {
            const container = document.getElementById('reviewsContainer');
            document.getElementById('loadingReviews').style.display = 'none';

            // 「共 12 則・平均 4.6 顆星」
            const stats = document.getElementById('reviewStats');
            if (allReviews.length) {
                const avg = allReviews.reduce((sum, r) => sum + (Math.min(5, Math.max(1, parseInt(r.rating) || 5))), 0) / allReviews.length;
                stats.innerText = `共 ${allReviews.length} 則・平均 ${avg.toFixed(1)} 顆星`;
            } else {
                stats.innerText = '';
            }

            const more = document.getElementById('moreBtn');
            if (!allReviews.length) {
                more.classList.add('hidden');
                container.innerHTML = `
                    <div class="text-center py-12 border border-dashed border-stone-200 rounded-sm">
                        <p class="text-stone-400 font-sans text-sm tracking-widest">這裡還是一片空白的寧靜。</p>
                        <p class="text-stone-400 text-xs mt-2">成為第一位留下故事的人吧。</p>
                    </div>`;
                return;
            }

            container.innerHTML = allReviews.slice(0, shown).map(r => reviewCard(r, r === newOne)).join('');
            const left = allReviews.length - shown;
            more.classList.toggle('hidden', left <= 0);
            more.innerText = `往前翻・還有 ${left} 則`;
        }

        function showMore() {
            shown += PAGE_SIZE;
            renderReviews();
        }

        // 字數
        const messageBox = document.querySelector('#reviewForm textarea[name="message"]');
        const charCount = document.getElementById('charCount');
        function updateCount() {
            const n = messageBox.value.length;
            charCount.innerText = `${n} / 300`;
            charCount.style.color = n >= 280 ? 'rgb(var(--wabi-shu))' : '';
        }
        messageBox.addEventListener('input', updateCount);

        // 上次留言用的名字
        try {
            const saved = localStorage.getItem(NAME_KEY);
            if (saved) document.querySelector('#reviewForm input[name="name"]').value = saved;
        } catch (e) { }

        // 送出留言：等後端回覆，成功就把這則直接放到最上面，不用重新整理
        document.getElementById('reviewForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = this;
            const btn = document.getElementById('submitBtn');
            const label = btn.querySelector('span');
            const originalText = label.innerText;
            label.innerText = "刻錄中...";
            btn.disabled = true;
            btn.classList.add('opacity-70');

            const formData = new FormData(form);
            const data = {
                type: 'review',
                name: formData.get('name').trim(),
                rating: Number(formData.get('rating')),
                message: formData.get('message').trim()
            };

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
                const result = await res.json();
                if (result.result !== 'success') {
                    showToast(result.error || '系統似乎在打盹，請稍後再試。');
                } else {
                    const review = result.review || { ...data, timestamp: new Date().toISOString() };
                    allReviews.unshift(review);
                    shown = Math.max(shown, PAGE_SIZE);
                    renderReviews(review);
                    try { localStorage.setItem(NAME_KEY, data.name); } catch (e) { }
                    // 名字留著，下次不用再打
                    messageBox.value = '';
                    updateCount();
                    document.getElementById('star3').checked = true;
                    document.getElementById('ratingReaction').innerText = '';
                    showToast('感謝您的分享。您的聲音已被聽見。');
                    // 手機上表單在上面，捲到剛留的那則
                    if (window.matchMedia('(max-width: 767px)').matches) {
                        document.getElementById('reviewsContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }
            } catch (err) {
                console.error("提交失敗:", err);
                showToast('系統似乎在打盹，請稍後再試。');
            }
            btn.disabled = false;
            btn.classList.remove('opacity-70');
            label.innerText = originalText;
        });

        // 評分有反應：一星翻船、五星放煙火
        const RATING_REACTIONS = {
            1: '友情小船翻了……',
            2: '小船晃了一下',
            3: '普普通通，可以接受',
            4: '還不錯嘛，再一顆？',
            5: '感謝五星！今晚加菜',
        };

        document.querySelectorAll('input[name="rating"]').forEach(input => {
            input.addEventListener('change', () => {
                const rating = parseInt(input.value);
                const reaction = document.getElementById('ratingReaction');
                reaction.innerText = RATING_REACTIONS[rating];
                reaction.style.color = rating === 1 ? 'rgb(var(--wabi-shu))' : '';

                const card = document.getElementById('reviewCard');
                card.classList.remove('shake');
                if (rating === 1) {
                    void card.offsetWidth; // 重新觸發動畫
                    card.classList.add('shake');
                }
                if (rating === 5) fireworks(document.querySelector('.rating-input'));
            });
        });

        function fireworks(originEl) {
            const canvas = document.createElement('canvas');
            const dpr = window.devicePixelRatio || 1;
            canvas.width = innerWidth * dpr;
            canvas.height = innerHeight * dpr;
            canvas.style.cssText = `position:fixed;inset:0;width:${innerWidth}px;height:${innerHeight}px;pointer-events:none;z-index:50`;
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            const COLORS = [themeColor('--wabi-accent'), themeColor('--wabi-shu'), '#f2b65a', '#c9b8a3', themeColor('--wabi-dark')];
            const particles = [];

            function burst(x, y) {
                for (let i = 0; i < 40; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 4;
                    particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        decay: 0.012 + Math.random() * 0.01,
                        size: 2 + Math.random() * 2,
                        color: COLORS[i % COLORS.length],
                    });
                }
            }

            // 第一發從星星炸開，再補三發在畫面上半部
            const rect = originEl.getBoundingClientRect();
            burst(rect.left + rect.width / 2, rect.top + rect.height / 2);
            [250, 500, 750].forEach(delay => setTimeout(() => {
                burst(innerWidth * (0.2 + Math.random() * 0.6), innerHeight * (0.15 + Math.random() * 0.35));
            }, delay));

            const startedAt = performance.now();
            let lastTime = startedAt;
            function frame(now) {
                // 以 60fps 為基準換算，120Hz 螢幕上速度才不會變兩倍
                const dt = Math.min((now - lastTime) / (1000 / 60), 3);
                lastTime = now;
                ctx.clearRect(0, 0, innerWidth, innerHeight);
                for (const p of particles) {
                    p.vx *= Math.pow(0.98, dt);
                    p.vy = p.vy * Math.pow(0.98, dt) + 0.06 * dt; // 空氣阻力 + 重力
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= p.decay * dt;
                    if (p.life <= 0) continue;
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                for (let i = particles.length - 1; i >= 0; i--) {
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }
                // 還有粒子、或後面幾發還沒放完就繼續畫
                if (particles.length || performance.now() - startedAt < 900) requestAnimationFrame(frame);
                else canvas.remove();
            }
            requestAnimationFrame(frame);
        }

        // 初始化
        window.addEventListener('load', fetchReviews);

    </script>
</body>
