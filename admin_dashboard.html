<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預約・一覽 | 丼步喱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'wabi-bg': '#fcfaf8',
                        'wabi-text': '#4a4a4a',
                        'wabi-accent': '#8e8070',
                        'wabi-sub': '#dcdcdc',
                        'wabi-dark': '#2c2c2c',
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    letterSpacing: {
                        'widest-xl': '.25em',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fcfaf8;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        }
    </style>
</head>

<body
    class="text-wabi-text font-serif leading-loose antialiased selection:bg-wabi-accent selection:text-white min-h-screen">

    <!-- 導航 -->
    <nav
        class="fixed top-0 w-full p-8 flex justify-between items-center z-40 bg-[#fcfaf8]/90 backdrop-blur-sm border-b border-stone-100">
        <div class="flex items-center gap-4">
            <h1 class="text-lg font-bold tracking-widest uppercase text-wabi-dark border-r border-stone-200 pr-4">
                Dashboard</h1>
            <span class="text-xs tracking-widest text-stone-500">預約管理</span>
        </div>
        <button id="logoutBtn"
            class="text-xs tracking-widest hover:text-wabi-dark transition-colors duration-500 text-stone-400 uppercase">
            登出・離
        </button>
    </nav>

    <!-- 主要內容 -->
    <main class="max-w-7xl mx-auto py-32 px-8">

        <div class="mb-12 flex justify-between items-end">
            <div>
                <span class="text-xs font-sans tracking-widest text-wabi-accent block mb-2"> RESERVATIONS </span>
                <h2 class="text-3xl font-light text-wabi-dark">27樓・名簿</h2>
            </div>
            <div class="hidden md:block">
                <p class="text-[10px] text-stone-400 font-sans tracking-widest text-right">
                    目前的預約總數 <br>
                    <span class="text-2xl text-wabi-dark font-serif" id="totalCount">0</span>
                </p>
            </div>
        </div>

        <!-- 區塊 1: 即將入住 (Active) -->
        <div class="mb-16">
            <h3 class="text-xl font-light text-wabi-dark mb-6 tracking-widest pl-4 border-l-2 border-wabi-accent">即將入住
            </h3>
            <div class="bg-white shadow-[0_10px_40px_-10px_rgba(0,0,0,0.03)] overflow-hidden rounded-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr
                                class="bg-stone-50 border-b border-stone-100 text-[10px] font-sans tracking-[0.2em] text-stone-400 uppercase">
                                <th class="p-6 font-normal">姓名</th>
                                <th class="p-6 font-normal">聯絡電話</th>
                                <th class="p-6 font-normal">入住日期</th>
                                <th class="p-6 font-normal">退房日期</th>
                            </tr>
                        </thead>
                        <tbody id="activeTableBody" class="font-sans text-sm text-stone-600">
                            <!-- 資料將由 JS 插入 -->
                        </tbody>
                    </table>
                </div>
                <!-- Pagination Active -->
                <div class="p-4 border-t border-stone-100 flex justify-end gap-4 text-xs font-sans tracking-widest text-stone-400"
                    id="activePagination">
                    <button onclick="changePage('active', -1)" class="hover:text-wabi-dark disabled:opacity-30"
                        id="btnPrevActive">PREV</button>
                    <span id="pageInfoActive">1 / 1</span>
                    <button onclick="changePage('active', 1)" class="hover:text-wabi-dark disabled:opacity-30"
                        id="btnNextActive">NEXT</button>
                </div>
            </div>
        </div>

        <!-- 區塊 2: 歷史紀錄 (History) -->
        <div>
            <h3 class="text-xl font-light text-wabi-dark mb-6 tracking-widest pl-4 border-l-2 border-stone-300">歷史紀錄
            </h3>
            <div class="bg-stone-50/50 border border-stone-100 overflow-hidden rounded-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr
                                class="bg-stone-100 border-b border-stone-200 text-[10px] font-sans tracking-[0.2em] text-stone-500 uppercase">
                                <th class="p-6 font-normal">姓名</th>
                                <th class="p-6 font-normal">聯絡電話</th>
                                <th class="p-6 font-normal">入住日期</th>
                                <th class="p-6 font-normal">退房日期</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="font-sans text-sm text-stone-400 grayscale">
                            <!-- 資料將由 JS 插入 -->
                        </tbody>
                    </table>
                </div>
                <!-- Pagination History -->
                <div class="p-4 border-t border-stone-200 flex justify-end gap-4 text-xs font-sans tracking-widest text-stone-400"
                    id="historyPagination">
                    <button onclick="changePage('history', -1)" class="hover:text-wabi-dark disabled:opacity-30"
                        id="btnPrevHistory">PREV</button>
                    <span id="pageInfoHistory">1 / 1</span>
                    <button onclick="changePage('history', 1)" class="hover:text-wabi-dark disabled:opacity-30"
                        id="btnNextHistory">NEXT</button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // State
        const state = {
            active: { data: [], page: 1 },
            history: { data: [], page: 1 },
            pageSize: 10
        };

        // 檢查登入
        if (!localStorage.getItem('isAdmin')) {
            window.location.href = 'admin_login.html';
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('isAdmin');
            window.location.href = 'admin_login.html';
        });

        const API_URL = "https://script.google.com/macros/s/AKfycbzdwh8fkSACZ_Ccd_Jpf-ZF-N0rNsr91mD0h9qB8M2KLdiBewpLGrr-Jz-Njd_NKcOS/exec";

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                const realData = await res.json();
                processData(realData);

            } catch (e) {
                console.error("Fetch error", e);
            }
        }

        function processData(data) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let processed = data.map(item => {
                const checkInStr = (item.checkIn || item.check_in || '').split('T')[0];
                const checkOutStr = (item.checkOut || item.check_out || '').split('T')[0];
                const checkInDate = new Date(checkInStr);
                const checkOutDate = new Date(checkOutStr);
                const isPast = checkOutDate < today;
                return { ...item, checkInStr, checkOutStr, checkInDate, isPast };
            });

            // 分類與排序
            state.active.data = processed.filter(d => !d.isPast).sort((a, b) => a.checkInDate - b.checkInDate);
            // 歷史紀錄：最近的在最上面 (Descending)
            state.history.data = processed.filter(d => d.isPast).sort((a, b) => b.checkInDate - a.checkInDate);

            document.getElementById('totalCount').innerText = data.length;

            renderSection('active');
            renderSection('history');
        }

        function changePage(type, delta) {
            const s = state[type];
            const maxPage = Math.ceil(s.data.length / state.pageSize);
            const newPage = s.page + delta;

            if (newPage >= 1 && newPage <= maxPage) {
                s.page = newPage;
                renderSection(type);
            }
        }

        function renderSection(type) {
            const s = state[type];
            const tbody = document.getElementById(type + 'TableBody');
            const pageInfo = document.getElementById('pageInfo' + (type.charAt(0).toUpperCase() + type.slice(1)));
            const btnPrev = document.getElementById('btnPrev' + (type.charAt(0).toUpperCase() + type.slice(1)));
            const btnNext = document.getElementById('btnNext' + (type.charAt(0).toUpperCase() + type.slice(1)));

            if (!s.data.length) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-xs tracking-widest text-stone-300">暫無資料</td></tr>`;
                pageInfo.innerText = "0 / 0";
                btnPrev.disabled = true;
                btnNext.disabled = true;
                return;
            }

            // Pagination Logic
            const totalPages = Math.ceil(s.data.length / state.pageSize);
            const start = (s.page - 1) * state.pageSize;
            const end = start + state.pageSize;
            const pageData = s.data.slice(start, end);

            // Render Rows
            tbody.innerHTML = pageData.map(item => `
                <tr class="border-b ${type === 'active' ? 'border-stone-100 hover:bg-stone-50 text-wabi-text' : 'border-stone-50 text-stone-400'} transition-colors last:border-0">
                    <td class="p-6 font-medium ${type === 'active' ? 'text-wabi-dark' : ''}">${item.name || item.guest_name || '未知訪客'}</td>
                    <td class="p-6 font-mono text-xs text-stone-500">${item.phone || '09xx-xxx-xxx'}</td>
                    <td class="p-6 font-mono text-xs text-stone-500">${item.checkInStr}</td>
                    <td class="p-6 font-mono text-xs text-stone-500">${item.checkOutStr}</td>
                </tr>
            `).join('');

            // Update Controls
            pageInfo.innerText = `${s.page} / ${totalPages}`;
            btnPrev.disabled = s.page === 1;
            btnNext.disabled = s.page === totalPages;
        }

        fetchData();

    </script>
</body>

</html>
