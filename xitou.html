    <style>
        /* 洗頭台：手指在上面搓、拉，不能捲動頁面，長按也不能跳出系統選單 */
        .salon {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #cv {
            display: block;
            width: 100%;
            aspect-ratio: 360 / 380;
            touch-action: none;
        }

        /* 五道工序 */
        .step {
            width: 1.7rem;
            height: 1.7rem;
            border-radius: 9999px;
            border: 1px solid rgb(var(--wabi-sub));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            line-height: 1;
            color: rgb(var(--wabi-accent));
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .step.is-now {
            background: rgb(var(--wabi-dark));
            border-color: rgb(var(--wabi-dark));
            color: rgb(var(--wabi-bg));
        }

        .step.is-done {
            border-color: rgb(var(--wabi-accent) / 0.5);
            color: rgb(var(--wabi-accent) / 0.5);
        }

        /* 量尺：洗髮精、泡泡覆蓋、抓到幾個、剩多少泡泡、拍背的節奏 */
        .meter {
            position: relative;
            height: 0.5rem;
            border-radius: 9999px;
            background: rgb(var(--wabi-sub) / 0.6);
        }

        .meter-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            border-radius: 9999px;
            background: rgb(var(--wabi-accent));
        }

        .meter-zone {
            position: absolute;
            top: -0.2rem;
            bottom: -0.2rem;
            border: 1px solid rgb(var(--wabi-shu));
            border-radius: 2px;
        }

        .meter-mark {
            position: absolute;
            top: -0.3rem;
            bottom: -0.3rem;
            width: 2px;
            margin-left: -1px;
            background: rgb(var(--wabi-shu));
        }

        .meter-mark.is-hit {
            background: rgb(var(--wabi-accent) / 0.4);
        }

        .meter-cursor {
            position: absolute;
            top: -0.45rem;
            bottom: -0.45rem;
            width: 3px;
            margin-left: -1.5px;
            border-radius: 2px;
            background: rgb(var(--wabi-dark));
        }

        /* 按住擠、點一下啪 */
        .act-round {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 4.75rem;
            height: 4.75rem;
            border-radius: 9999px;
            background: rgb(var(--wabi-dark));
            color: rgb(var(--wabi-bg));
            font-family: 'Noto Serif TC', serif;
            font-size: 1.5rem;
            box-shadow: 0 14px 30px -12px rgba(0, 0, 0, 0.45);
            transition: transform 0.12s ease;
            touch-action: manipulation;
        }

        .act-round.is-pressed,
        .act-round:active {
            transform: scale(0.92);
        }

        .act-text {
            min-height: 44px;
            padding: 0.75rem 2rem;
            border: 1px solid rgb(var(--wabi-dark));
            color: rgb(var(--wabi-dark));
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            touch-action: manipulation;
        }

        .act-text:disabled {
            opacity: 0.3;
        }

        .act-text:active {
            background: rgb(var(--wabi-dark));
            color: rgb(var(--wabi-bg));
        }

        /* 造型名稱：朱色印章蓋在鏡子下面 */
        .shape-stamp {
            position: absolute;
            left: 50%;
            bottom: 5%;
            padding: 0.15rem 0.9rem;
            border: 3px double rgb(var(--wabi-shu));
            background: rgb(var(--wabi-card) / 0.9);
            color: rgb(var(--wabi-shu));
            font-family: 'Noto Serif TC', serif;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 0.2em;
            white-space: nowrap;
            transform: translateX(-50%) rotate(-6deg);
            pointer-events: none;
        }

        .shape-stamp.is-in {
            animation: stamp-in 0.35s cubic-bezier(.2, 1.6, .4, 1);
        }

        @keyframes stamp-in {
            from {
                opacity: 0;
                transform: translateX(-50%) rotate(-6deg) scale(1.8);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .shape-stamp.is-in {
                animation: none;
            }
        }

        /* 客人的點單：一張紙條，做到蓋「成」，搞砸蓋「破」 */
        .order-slip {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.5rem;
            padding: 0.45rem 0.6rem;
            border: 1px dashed rgb(var(--wabi-accent) / 0.5);
            background: rgb(var(--wabi-bg));
            border-radius: 2px;
        }

        .order-tag {
            flex: none;
            writing-mode: vertical-rl;
            padding-right: 0.45rem;
            border-right: 1px solid rgb(var(--wabi-sub));
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 10px;
            letter-spacing: 0.2em;
            color: rgb(var(--wabi-accent));
        }

        .order-mark {
            flex: none;
            width: 2.2rem;
            height: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid currentColor;
            border-radius: 3px;
            font-family: 'Noto Serif TC', serif;
            font-weight: 700;
            font-size: 1.15rem;
            transform: rotate(-8deg);
        }

        .order-slip.hidden,
        .order-mark.hidden {
            display: none;
        }

        .order-mark.is-ok {
            color: rgb(var(--wabi-shu));
        }

        .order-mark.is-no {
            color: rgb(var(--wabi-accent));
            opacity: 0.8;
        }

        .order-mark.is-in {
            animation: mark-in 0.35s cubic-bezier(.2, 1.6, .4, 1);
        }

        @keyframes mark-in {
            from {
                opacity: 0;
                transform: rotate(-8deg) scale(1.8);
            }
        }

        .order-slip.is-broken #orderText {
            text-decoration: line-through;
            text-decoration-color: rgb(var(--wabi-accent) / 0.6);
            color: rgb(var(--wabi-accent));
        }

        @media (prefers-reduced-motion: reduce) {
            .order-mark.is-in {
                animation: none;
            }
        }
    </style>

    <script>
        // ===== 0. 舞台 =====
        // 畫布用固定的 360×380 座標畫，CSS 再縮放到螢幕寬度
        const W = 360, H = 380, TAU = Math.PI * 2;
        const HEAD = { x: 180, y: 200, rx: 68, ry: 82 };
        const EARS = [{ x: 112, y: 214 }, { x: 248, y: 214 }];
        const INK = '#3b3431';
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);

        // 泡泡另外畫在一張畫布上，一層一層堆起來
        const foamCv = document.createElement('canvas');
        foamCv.width = cv.width;
        foamCv.height = cv.height;
        const fctx = foamCv.getContext('2d', { willReadFrequently: true });
        fctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // 顏色：鏡子跟晝夜走，客人本身（皮膚、頭髮、圍布、瓶子）是實物，顏色固定
        const DAY = { sub: 'rgb(220 220 220)', accent: 'rgb(142 128 112)', dark: 'rgb(44 44 44)', shu: 'rgb(179 58 47)' };
        let pal = DAY;
        function readPalette() {
            pal = { sub: themeColor('--wabi-sub'), accent: themeColor('--wabi-accent'), dark: themeColor('--wabi-dark'), shu: themeColor('--wabi-shu') };
        }
        readPalette();
        new MutationObserver(readPalette).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

        const inEllipse = (p, e) => ((p.x - e.x) / e.rx) ** 2 + ((p.y - e.y) / e.ry) ** 2 <= 1;
        const inRegion = (p, e) => inEllipse(p, e) && p.y < e.cut;
        const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
        const pick = list => list[Math.floor(Math.random() * list.length)];
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
        const rand = (lo, hi) => lo + Math.random() * (hi - lo);
        function inTri(p, [a, b, c]) {
            const s = (p1, p2, p3) => (p1.x - p3.x) * (p2.y - p3.y) - (p2.x - p3.x) * (p1.y - p3.y);
            const d1 = s(p, a, b), d2 = s(p, b, c), d3 = s(p, c, a);
            return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
        }

        // ===== 1. 客人：髮型、膚色、配件、個性都是隨機的 =====
        const cap = (cut, rx = 74, ry = 90) => ({ x: 180, y: 200, rx, ry, cut });

        // 頭頂那一片頭髮：橢圓切掉下面，瀏海有波浪、平的、或旁分的弧
        function capPath(c, e, kind) {
            const t = Math.asin((e.cut - e.y) / e.ry);
            c.beginPath();
            c.ellipse(e.x, e.y, e.rx, e.ry, 0, Math.PI - t, TAU + t);
            const xr = e.x + e.rx * Math.cos(t), xl = e.x - e.rx * Math.cos(t);
            if (kind === 'wave') {
                const n = 6, step = (xr - xl) / n;
                for (let i = 0; i < n; i++) {
                    const x1 = xr - step * i, x2 = x1 - step;
                    c.quadraticCurveTo((x1 + x2) / 2, e.cut + (i % 2 ? 4 : 9), x2, e.cut - (i === n - 1 ? 0 : 3));
                }
            } else if (kind === 'part') {
                c.quadraticCurveTo(e.x + 20, e.cut - 16, e.x - 6, e.cut - 2);
                c.quadraticCurveTo(e.x - 40, e.cut + 6, xl, e.cut);
            } else {
                c.lineTo(xl, e.cut);
            }
            c.closePath();
        }

        const CAT_EARS = [
            [{ x: 126, y: 162 }, { x: 134, y: 92 }, { x: 172, y: 128 }],
            [{ x: 234, y: 162 }, { x: 226, y: 92 }, { x: 188, y: 128 }],
        ];
        const longSide = p => !inEllipse(p, HEAD) && p.y > 176 && p.y < 318 &&
            ((p.x > 94 && p.x < 140) || (p.x > 220 && p.x < 266));

        // pumps：這種頭擠幾下剛好；top：頭頂（洗髮精落下來的地方）的 y
        const STYLES = {
            short: {
                name: '短髮', pumps: [2, 3], top: 110, line: '短髮，不用擠太多。',
                inHair: p => inRegion(p, cap(180)),
                front(c, col) { c.fillStyle = col; capPath(c, cap(180), 'wave'); c.fill(); },
            },
            long: {
                name: '長髮', pumps: [5, 6], top: 110, hideEars: true, line: '頭髮很長，要多擠一點。',
                inHair: p => inRegion(p, cap(186)) || longSide(p),
                back(c, col) {
                    c.fillStyle = col;
                    [[1, 106, 96, 142, 132], [-1, 254, 264, 218, 228]].forEach(([s, x0, x1, x2, x3]) => {
                        c.beginPath();
                        c.moveTo(x0, 170);
                        c.lineTo(x1, 322);
                        c.quadraticCurveTo((x1 + x2) / 2, 334, x2, 324);
                        c.lineTo(x3, 200);
                        c.closePath();
                        c.fill();
                    });
                },
                front(c, col) { c.fillStyle = col; capPath(c, cap(186), 'flat'); c.fill(); },
            },
            bun: {
                name: '包包頭', pumps: [3, 4], top: 76, line: '包包頭要拆嗎？不用？好。',
                inHair: p => inRegion(p, cap(176)) || dist(p, { x: 180, y: 98 }) < 24,
                front(c, col) {
                    c.fillStyle = col;
                    c.beginPath(); c.arc(180, 98, 23, 0, TAU); c.fill();
                    capPath(c, cap(176), 'part'); c.fill();
                    c.fillStyle = DAY.shu;  // 綁住的東西是朱色
                    roundRect(c, 168, 110, 24, 6, 3); c.fill();
                },
            },
            curly: {
                name: '捲髮', pumps: [4, 5], top: 84, line: '泡泡可能會在裡面迷路。',
                inHair: p => inRegion(p, { x: 180, y: 192, rx: 100, ry: 108, cut: 186 }),
                front(c, col) {
                    c.fillStyle = col;
                    c.beginPath(); capPath(c, { x: 180, y: 196, rx: 86, ry: 96, cut: 184 }, 'flat'); c.fill();
                    for (let a = Math.PI * 1.02; a <= Math.PI * 1.98; a += 0.16) {
                        c.beginPath(); c.arc(180 + 84 * Math.cos(a), 196 + 94 * Math.sin(a), 18, 0, TAU); c.fill();
                    }
                    for (let x = 110; x <= 250; x += 17) { c.beginPath(); c.arc(x, 182, 10, 0, TAU); c.fill(); }

                if (item.html) btn.innerHTML = item.html;
                else btn.textContent = item.label;
                if (item.aria) btn.setAttribute('aria-label', item.aria);
                if (item.disabled) btn.disabled = true;
                if (item.onDown) {
                    btn.addEventListener('pointerdown', e => {
                        e.preventDefault();
                        unlockAudio();
                        btn.classList.add('is-pressed');
                        item.onDown(performance.now());
                    });
                    const up = () => {
                        btn.classList.remove('is-pressed');
                        if (item.onUp) item.onUp();
                    };
                    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => btn.addEventListener(t, up));
                    btn.addEventListener('contextmenu', e => e.preventDefault());
                }
                if (item.onClick) btn.addEventListener('click', () => { unlockAudio(); item.onClick(); });
                box.appendChild(btn);
                return btn;
            });
        }

        // ===== 3. 聲音：全部用 Web Audio 合成，不載音檔 =====
        let audioCtx = null;

        function unlockAudio() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) { }
        }

        function noise(dur, type, freq, q, vol) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            try {
                const length = Math.floor(audioCtx.sampleRate * dur);
                const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 3);
                const src = audioCtx.createBufferSource();
                src.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = type;
                filter.frequency.value = freq;
                filter.Q.value = q;
                const gain = audioCtx.createGain();
                gain.gain.value = vol;
                src.connect(filter).connect(gain).connect(audioCtx.destination);
                src.start();
            } catch (e) { }
        }

        function tone(freq, dur, vol, to = freq, type = 'sine') {
            if (!audioCtx || audioCtx.state !== 'running') return;
            try {
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                osc.frequency.exponentialRampToValueAtTime(to, t + dur);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + dur + 0.02);
            } catch (e) { }
        }

        const sfx = {
            squeeze: () => { noise(0.07, 'bandpass', 900 + Math.random() * 300, 2, 0.25); tone(320, 0.07, 0.05, 520); },
            splat: () => { noise(0.06, 'lowpass', 600, 0.7, 0.35); tone(180, 0.06, 0.08, 90); },
            scrub: () => noise(0.07, 'highpass', 2600, 0.7, 0.07),
            pop: () => tone(900 + Math.random() * 700, 0.05, 0.04, 1800),
            scratch: () => { noise(0.04, 'bandpass', 3200, 2, 0.25); setTimeout(() => noise(0.04, 'bandpass', 2900, 2, 0.2), 55); },
            pat: () => { tone(120, 0.14, 0.5, 55); noise(0.05, 'lowpass', 500, 0.7, 0.35); },
            tick: () => tone(1500, 0.03, 0.05, 1400, 'triangle'),
            stamp: () => { tone(90, 0.22, 0.5, 45); noise(0.08, 'lowpass', 300, 0.7, 0.4); },
            water: () => noise(1.3, 'bandpass', 1700, 0.4, 0.12),
        };

        // ===== 4. 遊戲狀態 =====
        let G = null;
        let stage = -1;        // -1 還沒開始，0～4 擠搓抓捏拍，5 洗好了
        let cur = {};          // 這一關的處理（down / move / up / update）
        let face = { kind: 'neutral', until: 0 };
        let baseFace = 'neutral';
        let spots = [], floats = [], bubbles = [], drops = [];
        let saidAt = 0;        // 客人碎念不要太頻繁

        function newGame() {
            const c = makeCustomer();
            G = {
                c,
                pumps: 0, landed: 0, dollops: [], bottle: null, drip: false, foamMul: 1, squeezeScore: 0, squeezeLabel: '',
                coverage: 0, rubScore: 0,
                hits: 0, spawned: 0, hp: 1, scratchScore: 0,
                strokes: [], budget: 0, budgetMax: 0, shape: null, styleScore: 0, snapshot: null,
                patScore: 0, patMarks: [],
                foamAlpha: 1, wet: false,
                order: pickOrder(c), orderBroken: false,
                pokes: { face: 0, ear: 0 }, rubMs: null, force: null, t0: 0,
                cells: [], curls: [], dots: [],
            };
            // 頭髮切成小格子，算泡泡蓋了幾成、癢的地方冒在哪
            for (let y = 56; y < 330; y += 8) {
                for (let x = 80; x < 282; x += 8) {
                    const cell = { x: x + 4, y: y + 4, on: false };
                    if (c.st.inHair(cell)) G.cells.push(cell);
                }
            }
            if (c.style === 'curly') for (let i = 0; i < 26; i++) { const q = pick(G.cells); G.curls.push({ x: q.x + rand(-4, 4), y: q.y + rand(-4, 4), a: rand(0, TAU) }); }
            if (c.style === 'buzz') for (let i = 0; i < 160; i++) { const q = pick(G.cells); G.dots.push({ x: q.x + rand(-4, 4), y: q.y + rand(-4, 4) }); }
            fctx.clearRect(0, 0, W, H);
            spots = []; floats = []; bubbles = []; drops = [];
            baseFace = 'neutral';
            face = { kind: 'neutral', until: 0 };
            $('who').textContent = `今天的客人：${c.who}`;
            $('shapeStamp').classList.add('hidden');
            renderOrder();
        }

        // 點單紙條
        function renderOrder(mark) {
            const o = G.order && ORDERS[G.order];
            $('order').classList.toggle('hidden', !o);
            if (!o) return;
            $('orderText').textContent = G.c.cat ? (G.meow = G.meow || pick(MEOWS) + pick(MEOWS)) : o.text;
            $('orderHow').textContent = (G.c.cat ? `（翻譯：${o.text}）` : '') + o.how + `・小費 ${Wallet.fmt(o.tip)}`;
            $('order').classList.toggle('is-broken', G.orderBroken || mark === 'no');
            const m = $('orderMark');
            m.classList.toggle('hidden', !mark);
            if (!mark) return;
            m.textContent = mark === 'ok' ? '成' : '破';
            m.className = `order-mark is-${mark}`;
            if (!reduceMotion) { void m.offsetWidth; m.classList.add('is-in'); }
        }
        // 碰到臉、耳朵：記下來；點單說不能碰的，當場蓋「破」
        function poke(kind) {
            // 手指一直在臉上搓也只算一次：隔半秒以上才算新的一次
            const now = performance.now();
            G.pokeAt = G.pokeAt || {};
            if (now - (G.pokeAt[kind] || -1e9) < 500) { G.pokeAt[kind] = now; return; }
            G.pokeAt[kind] = now;
            G.pokes[kind]++;
            const o = G.order && ORDERS[G.order];
            if (o && o.broke && !G.orderBroken && o.broke(G)) {
                G.orderBroken = true;
                renderOrder('no');
                sfx.stamp();
            }
        }

        // 搓得出泡泡的地方：頭髮附近一圈
        function foamable(p) {
            return G.cells.some(c => Math.abs(c.x - p.x) <= 14 && Math.abs(c.y - p.y) <= 14);
        }

        function setFace(kind, ms) {
            if (ms) face = { kind, until: performance.now() + ms };
            else { baseFace = kind; face = { kind, until: 0 }; }
        }

        // 客人碎念：1.4 秒內不重複
        function mutter(text, kind = 'doubt', ms = 700) {
            const now = performance.now();
            setFace(kind, ms);
            if (now - saidAt < 1400) return;
            saidAt = now;
            say(text);
        }

        function floatText(x, y, text, color) {
            floats.push({ x, y, text, color, born: performance.now() });
        }

        function burst(x, y, n = 6, color) {
            for (let i = 0; i < n; i++) {
                const a = Math.random() * TAU, s = 0.04 + Math.random() * 0.06;
                bubbles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.03, r: 2 + Math.random() * 4, born: performance.now(), color });
            }
        }

        function shake() {
            if (reduceMotion) return;
            $('mirror').animate([
                { transform: 'translate(0,0)' }, { transform: 'translate(-3px,2px)' },
                { transform: 'translate(3px,-1px)' }, { transform: 'translate(0,0)' }
            ], { duration: 160 });
        }

        // 一團泡泡：先畫一圈淡灰的邊，再蓋白色，疊多了就像真的泡沫。
        // 捏造型時是沿著手指連續畫，邊要淡一點，不然看起來像一疊銅板
        function addFoam(x, y, r, count, edge = 0.45) {
            fctx.beginPath();
            fctx.arc(x, y, r + 1.3, 0, TAU);
            fctx.fillStyle = `rgba(140, 150, 162, ${edge})`;
            fctx.fill();
            const g = fctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
            g.addColorStop(0, '#ffffff');
            g.addColorStop(1, '#e7ebef');
            fctx.beginPath();
            fctx.arc(x, y, r, 0, TAU);
            fctx.fillStyle = g;
            fctx.fill();
            if (Math.random() < (count ? 0.3 : 0.08)) {
                fctx.beginPath();
                fctx.arc(x + (Math.random() - 0.5) * r, y + (Math.random() - 0.5) * r, 1.5 + Math.random() * 2.5, 0, TAU);
                fctx.strokeStyle = 'rgba(140, 150, 162, 0.6)';
                fctx.lineWidth = 0.8;
                fctx.stroke();
            }
            if (!count) return;
            let on = 0;
            G.cells.forEach(c => {
                if (!c.on && dist(c, { x, y }) < r * 0.95) c.on = true;
                if (c.on) on++;
            });
            G.coverage = on / G.cells.length;
        }

        // 手指附近有沒有泡泡（手指很粗，差一點也算）
        function onFoam(p) {
            return [[0, 0], [8, 0], [-8, 0], [0, 8], [0, -8]].some(([dx, dy]) => {
                const d = fctx.getImageData(Math.round((p.x + dx) * dpr), Math.round((p.y + dy) * dpr), 1, 1).data;
                return d[3] > 100;
            });
        }

        // ===== 5. 畫畫 =====
        // 洗髮精瓶：倒過來掛在客人頭上，第一次按的時候掉下來，按一下捏一下
        const BOTTLE_X = 186;

        function bottlePose(now) {
            const b = G.bottle;
            if (!b) return null;
            let oy = 0;
            const tin = (now - b.in) / 320;
            if (tin < 1) oy = -120 * Math.pow(1 - tin, 3);
            if (b.out) {
                const t = (now - b.out) / 340;
                if (t >= 1) return null;
                oy = -140 * t * t;
            }
            return { oy, sway: reduceMotion ? 0 : Math.sin(now / 520) * 0.05 };
        }

        function bottleTip(now) {
            const s = bottlePose(now) || { oy: 0, sway: 0 };
            return { x: BOTTLE_X - 68 * Math.sin(s.sway), y: s.oy + 68 * Math.cos(s.sway) };
        }

        function drawBottle(c, now) {
            const s = bottlePose(now);
            if (!s) return;
            const k = now - G.bottle.press < 170 ? Math.sin(Math.PI * (now - G.bottle.press) / 170) : 0;
            c.save();
            c.translate(BOTTLE_X, s.oy);
            c.rotate(s.sway);
            c.save();
            c.translate(0, 26);
            c.scale(1 - 0.22 * k, 1 + 0.04 * k);
            roundRect(c, -19, -24, 38, 48, 11);
            c.fillStyle = '#f6f1e8';
            c.fill();
            c.strokeStyle = '#cdbfae';
            c.lineWidth = 1.5;
            c.stroke();
            c.fillStyle = '#8e8070';
            c.fillRect(-19, -7, 38, 17);
            c.fillStyle = '#fcfaf8';
            c.font = '600 12px "Noto Serif TC", serif';
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            c.fillText('洗', 0, 2);
            c.fillStyle = 'rgba(255,255,255,0.7)';
            c.fillRect(-13, -19, 4, 10);
            c.restore();
            c.fillStyle = '#8e8070';
            c.beginPath(); c.moveTo(-12, 50); c.lineTo(12, 50); c.lineTo(7, 60); c.lineTo(-7, 60); c.closePath(); c.fill();
            c.fillStyle = '#6f6458';
            c.fillRect(-2.5, 60, 5, 8);
            c.restore();
        }

        // 洗髮精在頭頂的那一坨
        function blobSize() {
            return { rx: 7 + G.landed * 4.2, ry: 4 + G.landed * 1.6 };
        }

        function drawScene(c, colors, now, live) {
            const C = G.c, st = C.st;
            c.clearRect(0, 0, W, H);

            // 鏡子：拱形，跟著晝夜換色
            c.save();
            c.beginPath();
            c.moveTo(14, H);
            c.lineTo(14, 160);
            c.ellipse(180, 160, 166, 150, 0, Math.PI, TAU);
            c.lineTo(346, H);
            c.closePath();
            c.globalAlpha = 0.28;
            c.fillStyle = colors.sub;
            c.fill();
            c.globalAlpha = 0.5;
            c.strokeStyle = colors.accent;
            c.lineWidth = 1.5;
            c.stroke();
            c.globalAlpha = 0.35;
            c.strokeStyle = '#ffffff';
            c.lineWidth = 3;
            c.beginPath();
            c.moveTo(42, 150); c.lineTo(84, 74);
            c.moveTo(48, 182); c.lineTo(104, 82);
            c.stroke();
            c.restore();

            // 長髮的後面那片
            if (st.back) st.back(c, C.hair);

            // 圍布
            c.fillStyle = '#3e434a';
            c.beginPath();
            c.moveTo(34, H);
            c.bezierCurveTo(52, 330, 110, 310, 180, 310);
            c.bezierCurveTo(250, 310, 308, 330, 326, H);
            c.closePath();
            c.fill();
            c.strokeStyle = 'rgba(255,255,255,0.08)';
            c.lineWidth = 1;
            for (let x = 80; x <= 280; x += 25) {
                c.beginPath();
                c.moveTo(180 + (x - 180) * 0.45, 314);
                c.lineTo(x, H);
                c.stroke();
            }

            // 脖子、毛巾
            c.fillStyle = C.skin[1];
            c.fillRect(160, 262, 40, 50);
            c.fillStyle = '#f3efe8';
            roundRect(c, 116, 298, 128, 24, 12);
            c.fill();
            c.strokeStyle = '#d9d2c6';
            c.lineWidth = 1;
            c.stroke();

            // 耳朵、頭
            if (!st.hideEars) {
                EARS.forEach(e => {
                    c.fillStyle = C.skin[0];
                    c.beginPath();
                    c.ellipse(e.x, e.y, 10, 15, 0, 0, TAU);
                    c.fill();
                    c.strokeStyle = C.skin[1];
                    c.lineWidth = 1.5;
                    c.beginPath();
                    c.ellipse(e.x, e.y, 5, 9, 0, 0, TAU);
                    c.stroke();
                });
            }
            c.fillStyle = C.skin[0];
            c.beginPath();
            c.ellipse(HEAD.x, HEAD.y, HEAD.rx, HEAD.ry, 0, 0, TAU);
            c.fill();

            drawFace(c, now < face.until ? face.kind : baseFace);
            drawExtras(c);

            // 頭髮
            st.front(c, C.hair);
            if (G.wet && C.style !== 'bald' && !C.cat) {
                c.strokeStyle = 'rgba(255,255,255,0.28)';
                c.lineWidth = 2;
                c.beginPath();
                c.arc(170, 200, 74, Math.PI * 1.28, Math.PI * 1.45);
                c.moveTo(214, 140);
                c.arc(176, 200, 70, Math.PI * 1.62, Math.PI * 1.72);
                c.stroke();
            }

            // 洗髮精：擠在頭頂的一坨，擠太多會流下來
            if (G.landed > 0 && stage <= 1) {
                const { rx, ry } = blobSize();
                const by = st.top + 3 - ry * 0.6;
                c.fillStyle = 'rgba(226, 182, 98, 0.88)';
                if (G.drip) {
                    c.strokeStyle = 'rgba(226, 182, 98, 0.88)';
                    c.lineWidth = 5;
                    c.lineCap = 'round';
                    c.beginPath();
                    c.moveTo(168, by + 4);
                    c.quadraticCurveTo(148, 170, 160, 206);
                    c.stroke();
                    c.beginPath();
                    c.arc(160, 208, 4.5, 0, TAU);
                    c.fill();
                }
                c.beginPath();
                c.ellipse(183, by, rx, ry, 0, 0, TAU);
                c.fill();
                c.fillStyle = 'rgba(255,255,255,0.6)';
                c.beginPath();
                c.ellipse(183 - rx * 0.35, by - ry * 0.35, 2 + rx * 0.18, 1.2 + ry * 0.15, -0.3, 0, TAU);
                c.fill();
            }

            // 泡泡
            if (G.foamAlpha > 0) {
                c.save();
                c.globalAlpha = G.foamAlpha;
                c.drawImage(foamCv, 0, 0, W, H);
                c.restore();
            }

            if (!live) return;

            // 瓶子和正在掉的洗髮精
            if (G.bottle) drawBottle(c, now);
            G.dollops.forEach(d => {
                if (d.y === null) return;
                c.fillStyle = 'rgba(226, 182, 98, 0.95)';
                c.beginPath();
                c.ellipse(d.x, d.y, 4.5, 6.5, 0, 0, TAU);
                c.fill();
                c.fillStyle = 'rgba(255,255,255,0.7)';
                c.beginPath();
                c.arc(d.x - 1.5, d.y - 2.5, 1.4, 0, TAU);
                c.fill();
            });

            // 癢的地方：朱色圈圈，外圈是剩下的時間
            spots.forEach(s => {
                const age = clamp((now - s.born) / s.life, 0, 1);
                const pulse = 1 + 0.1 * Math.sin(now / 80);
                const fade = age > 0.85 ? (1 - age) / 0.15 : 1;
                c.save();
                c.globalAlpha = fade * 0.85;
                c.beginPath();
                c.arc(s.x, s.y, 14 * pulse, 0, TAU);
                c.fillStyle = colors.shu;
                c.fill();
                c.globalAlpha = fade;
                c.beginPath();
                c.arc(s.x, s.y, 20, -Math.PI / 2, -Math.PI / 2 + (1 - age) * TAU);
                c.strokeStyle = colors.shu;
                c.lineWidth = 2;
                c.stroke();
                c.fillStyle = '#ffffff';
                c.font = '600 13px "Noto Serif TC", serif';
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText(s.hp > 1 ? '癢癢' : '癢', s.x, s.y + 1);
                c.restore();
            });

            // 抓破的泡泡、濺開的洗髮精
            bubbles = bubbles.filter(b => now - b.born < 600);
            bubbles.forEach(b => {
                const age = now - b.born;
                c.save();
                c.globalAlpha = 1 - age / 600;
                c.strokeStyle = b.color || '#9aa6b2';
                c.lineWidth = b.color ? 2 : 1;
                c.beginPath();
                c.arc(b.x + b.vx * age, b.y + b.vy * age, b.color ? b.r * 0.5 : b.r, 0, TAU);
                c.stroke();
                c.restore();
            });

            // 沖水
            drops = drops.filter(d => d.y < 300);
            drops.forEach(d => {
                d.y += d.v;
                c.strokeStyle = 'rgba(140, 175, 200, 0.7)';
                c.lineWidth = 2;
                c.beginPath();
                c.moveTo(d.x, d.y);
                c.lineTo(d.x, d.y + 10);
                c.stroke();
            });

            // 飄起來的字
            floats = floats.filter(f => now - f.born < 750);
            floats.forEach(f => {
                const age = (now - f.born) / 750;
                c.save();
                c.globalAlpha = 1 - age;
                c.fillStyle = f.color || colors.shu;
                c.font = '700 16px "Noto Serif TC", serif';
                c.textAlign = 'center';
                c.fillText(f.text, f.x, f.y - age * 30);
                c.restore();
            });
        }

        function roundRect(c, x, y, w, h, r) {
            c.beginPath();
            c.moveTo(x + r, y);
            c.arcTo(x + w, y, x + w, y + h, r);
            c.arcTo(x + w, y + h, x, y + h, r);
            c.arcTo(x, y + h, x, y, r);
            c.arcTo(x, y, x + w, y, r);
            c.closePath();
        }

        // 表情：neutral 普通、happy 開心、bliss 爽、pain 痛、doubt 懷疑、wow 嚇到
        function drawFace(c, kind) {
            const L = { x: 155, y: 216 }, R = { x: 205, y: 216 };
            const cat = G.c.cat;
            c.save();
            c.strokeStyle = INK;
            c.fillStyle = INK;
            c.lineWidth = 2.4;
            c.lineCap = 'round';
            c.lineJoin = 'round';
            const line = (pts) => { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.stroke(); };

            // 眉毛（貓沒有眉毛）
            if (!cat) {
                if (kind === 'pain') { line([146, 197, 163, 203]); line([197, 203, 214, 197]); }
                else if (kind === 'doubt') { line([146, 194, 163, 190]); line([197, 199, 214, 199]); }
                else if (kind === 'wow' || kind === 'bliss') { line([146, 196, 163, 193]); line([197, 193, 214, 196]); }
                else { line([146, 200, 163, 198]); line([197, 198, 214, 200]); }
            }

            // 眼睛
            if (kind === 'happy') {
                [L, R].forEach(e => { c.beginPath(); c.arc(e.x, e.y + 3, 6, Math.PI + 0.5, TAU - 0.5); c.stroke(); });
            } else if (kind === 'bliss') {
                [L, R].forEach(e => { c.beginPath(); c.arc(e.x, e.y - 3, 6, 0.4, Math.PI - 0.4); c.stroke(); });
            } else if (kind === 'pain') {
                line([149, 211, 158, 216, 149, 221]);
                line([211, 211, 202, 216, 211, 221]);
            } else if (kind === 'doubt') {
                c.beginPath(); c.arc(L.x, L.y, 3.2, 0, TAU); c.fill();
                line([199, 216, 211, 216]);
            } else if (kind === 'wow') {
                [L, R].forEach(e => { c.beginPath(); c.arc(e.x, e.y, 4.5, 0, TAU); c.stroke(); });
            } else if (cat) {
                [L, R].forEach(e => { c.beginPath(); c.ellipse(e.x, e.y, 3.2, 5, 0, 0, TAU); c.fill(); });
            } else {
                [L, R].forEach(e => { c.beginPath(); c.arc(e.x, e.y, 3.2, 0, TAU); c.fill(); });
            }

            // 鼻子
            if (cat) {
                c.fillStyle = '#d98a7e';
                c.beginPath(); c.moveTo(174, 230); c.lineTo(186, 230); c.lineTo(180, 237); c.closePath(); c.fill();
                c.fillStyle = INK;
                c.globalAlpha = 0.6;
                c.lineWidth = 1.2;
                line([150, 236, 118, 230]); line([150, 242, 118, 244]);
                line([210, 236, 242, 230]); line([210, 242, 242, 244]);
                c.globalAlpha = 1;
            } else {
                c.globalAlpha = 0.55;
                c.lineWidth = 1.6;
                line([180, 224, 176, 237, 183, 238]);
                c.globalAlpha = 1;
            }
            c.lineWidth = 2.4;

            // 嘴巴
            if (kind === 'happy') {
                c.beginPath(); c.arc(180, 246, 11, 0.35, Math.PI - 0.35); c.stroke();
            } else if (kind === 'bliss') {
                c.beginPath(); c.arc(180, 248, 10, 0, Math.PI); c.closePath(); c.fill();
            } else if (kind === 'pain') {
                line([167, 254, 172, 250, 177, 254, 182, 250, 187, 254, 192, 250]);
            } else if (kind === 'doubt') {
                line([171, 253, 189, 249]);
            } else if (kind === 'wow') {
                c.beginPath(); c.arc(180, 253, 5, 0, TAU); c.stroke();
            } else if (cat) {
                c.beginPath(); c.arc(175, 243, 5, 0.2, Math.PI - 0.2); c.stroke();
                c.beginPath(); c.arc(185, 243, 5, 0.2, Math.PI - 0.2); c.stroke();
            } else {
                c.beginPath(); c.moveTo(170, 251); c.quadraticCurveTo(180, 255, 190, 251); c.stroke();
            }

            // 臉紅、冒汗
            if (kind === 'bliss' || kind === 'happy') {
                c.globalAlpha = 0.25;
                c.fillStyle = DAY.shu;
                c.beginPath(); c.ellipse(143, 234, 9, 5, 0, 0, TAU); c.fill();
                c.beginPath(); c.ellipse(217, 234, 9, 5, 0, 0, TAU); c.fill();
            }
            if (kind === 'pain') {
                c.globalAlpha = 0.9;
                c.fillStyle = '#9cc0d8';
                c.beginPath();
                c.moveTo(232, 186);
                c.quadraticCurveTo(240, 200, 232, 202);
                c.quadraticCurveTo(224, 200, 232, 186);
                c.fill();
            }
            c.restore();
        }

        // 配件：黑眼圈、雀斑、鬍子、眼鏡、墨鏡
        function drawExtras(c) {
            const C = G.c;
            c.save();
            c.lineCap = 'round';
            if (C.bags) {
                c.strokeStyle = 'rgba(120, 90, 110, 0.35)';
                c.lineWidth = 2;
                [155, 205].forEach(x => { c.beginPath(); c.arc(x, 220, 8, 0.5, Math.PI - 0.5); c.stroke(); });
            }
            if (C.freckles) {
                c.fillStyle = 'rgba(150, 100, 70, 0.45)';
                [[140, 230], [146, 236], [136, 237], [220, 230], [214, 236], [224, 237]].forEach(([x, y]) => { c.beginPath(); c.arc(x, y, 1.3, 0, TAU); c.fill(); });
            }
            if (C.mustache) {
                c.fillStyle = C.hair === GREY ? '#9d968b' : C.hair;
                c.beginPath();
                c.moveTo(180, 240);
                c.quadraticCurveTo(166, 234, 158, 246);
                c.quadraticCurveTo(170, 243, 180, 244);
                c.quadraticCurveTo(190, 243, 202, 246);
                c.quadraticCurveTo(194, 234, 180, 240);
                c.fill();
            }
            if (C.glasses === 'round') {
                c.strokeStyle = INK;
                c.lineWidth = 2;
                [155, 205].forEach(x => { c.beginPath(); c.arc(x, 216, 12, 0, TAU); c.stroke(); });
                c.beginPath(); c.moveTo(167, 214); c.quadraticCurveTo(180, 208, 193, 214); c.stroke();
                c.beginPath(); c.moveTo(143, 213); c.lineTo(116, 208); c.moveTo(217, 213); c.lineTo(244, 208); c.stroke();
            } else if (C.glasses === 'sun') {
                c.fillStyle = '#2a2624';
                [155, 205].forEach(x => { c.beginPath(); c.ellipse(x, 217, 15, 11, 0, 0, TAU); c.fill(); });
                c.strokeStyle = '#2a2624';
                c.lineWidth = 3;
                c.beginPath(); c.moveTo(170, 214); c.lineTo(190, 214); c.stroke();
                c.lineWidth = 2;
                c.beginPath(); c.moveTo(140, 213); c.lineTo(116, 208); c.moveTo(220, 213); c.lineTo(244, 208); c.stroke();
                c.fillStyle = 'rgba(255,255,255,0.35)';
                [149, 199].forEach(x => { c.beginPath(); c.ellipse(x, 212, 4, 2, -0.4, 0, TAU); c.fill(); });
            }
            c.restore();
        }

        // ===== 6. 五道工序 =====
        function go(i) {
            stage = i;
            if (i === 0) G.t0 = performance.now();
            setSteps(i);
            cur = [squeeze, rub, scratch, sculpt, pat][i]();
        }

        // 6a. 擠：點瓶子，一下擠一點，擠到框框裡就按「好了」
        function squeeze() {
            const st = G.c.st, [lo, hi] = st.pumps, MAX = 10;
            say(G.c.hello);
            setTimeout(() => { if (stage === 0 && !G.pumps) say(st.line); }, 1800);
            hint('點瓶子擠洗髮精，一下擠一點。擠到框框裡就按「好了」');
            meter({ fill: 0, zone: [(lo - 0.6) / MAX * 100, (hi + 0.6) / MAX * 100], label: '0 下' });
            let finishing = false, judged = false, warned = 0;

            function pump(now) {
                if (finishing || G.pumps >= MAX) return;
                if (!G.bottle) G.bottle = { in: now, press: 0, out: 0 };
                G.bottle.press = now;
                G.pumps++;
                G.dollops.push({ x: 0, y: null, vy: 0.04, at: Math.max(now, G.bottle.in + 260) });
                sfx.squeeze();
                doneBtn.disabled = false;
            }

            function landed(d) {
                G.landed++;
                sfx.splat();
                burst(d.x, d.y, 5, 'rgba(214, 166, 80, 0.9)');
                $('meterFill').style.width = (G.landed / MAX * 100) + '%';
                $('meterLabel').textContent = `${G.landed} 下`;
                setFace('wow', 260);
                if (warned < 1 && G.landed > hi + 1) { warned = 1; say('還要嗎？'); setFace('doubt'); }
                if (warned < 2 && G.landed > hi + 3) { warned = 2; say('夠了夠了！'); setFace('pain'); }
                if (G.landed >= MAX) { G.drip = true; finishing = true; }
            }

            function judge() {
                judged = true;
                G.bottle.out = performance.now();
                const n = G.landed, less = n < lo;
                const diff = less ? lo - n : n > hi ? n - hi : 0;
                let r;
                if (G.drip) r = { score: 2, label: '太多了', line: '流到眼睛了啦！', face: 'pain' };
                else if (!diff) r = { score: 15, label: '剛剛好', line: '嗯，專業。', face: 'happy' };
                else if (diff === 1) r = { score: 10, label: less ? '少了點' : '多了點', line: less ? '還行，省著用。' : '有點多，沒關係。', face: 'neutral' };
                else if (diff === 2) r = { score: 6, label: less ? '太少' : '太多', line: less ? '這樣起得了泡嗎？' : '是要洗兩顆頭嗎？', face: 'doubt' };
                else r = { score: 3, label: less ? '少很多' : '多很多', line: less ? '你們店是不是快倒了。' : '這瓶是不是要被你擠完了。', face: 'pain' };
                G.squeezeScore = r.score;
                G.squeezeLabel = `${r.label}（${n} 下）`;
                G.foamMul = clamp(n / ((lo + hi) / 2), 0.75, 1.4);
                say(r.line);
                setFace(r.face);
                floatText(183, st.top - 22, r.label, pal.accent);
                actions([]);
                setTimeout(() => go(1), 1500);
            }

            const [, doneBtn] = actions([
                { html: BOTTLE_SVG, round: true, aria: '擠洗髮精', onDown: pump },
                { label: '好了', disabled: true, onClick: () => { if (G.pumps) finishing = true; } },
            ]);

            return {
                down(p, now) { pump(now); },
                update(now, dt) {
                    const { ry } = blobSize();
                    const land = st.top + 3 - ry * 1.3;
                    G.dollops.forEach(d => {
                        if (now < d.at) return;
                        if (d.y === null) { const tip = bottleTip(now); d.x = tip.x; d.y = tip.y; }
                        d.vy += 0.0018 * dt;
                        d.y += d.vy * dt;
                    });
                    G.dollops = G.dollops.filter(d => {
                        if (d.y === null || d.y < land) return true;
                        landed(d);
                        return false;
                    });
                    if (finishing && !judged && !G.dollops.length) judge();
                },
            };
        }

        // 6b. 搓：手指在頭上搓出泡泡，十秒內蓋滿
        function rub() {
            setFace('neutral');
            hint('手指在頭上來回搓，把頭髮蓋滿泡泡（開始搓才計時）');
            meter({ fill: 0, label: '0%' });
            const LIMIT = 10000;
            let started = false, endAt = 0, done = false, last = null, carry = 0, nextScrub = 0, said = 0;

            function finish() {
                if (done) return;
                done = true;
                last = null;
                if (started && G.coverage >= 0.97) G.rubMs = Math.round(performance.now() - (endAt - LIMIT));
                G.rubScore = Math.round(G.coverage * 25);
                const pct = Math.round(G.coverage * 100);
                if (pct >= 95) { say('整顆都是泡泡了。'); setFace('bliss'); }
                else if (pct >= 75) { say('嗯，差不多了。'); setFace('happy'); }
                else if (pct >= 50) { say('後面好像還是乾的。'); setFace('doubt'); }
                else { say('還有一大半是乾的耶。'); setFace('pain'); }
                $('meterLabel').textContent = pct + '%';
                setTimeout(() => go(2), 1400);
            }

            return {
                down(p, now) {
                    if (done) return;
                    last = p;
                    carry = 0;
                    if (!started) { started = true; endAt = now + LIMIT; }
                },
                move(p, now) {
                    if (done || !last) return;
                    const d = dist(p, last);
                    carry += d;
                    while (carry >= 5) {
                        carry -= 5;
                        const k = 1 - carry / Math.max(d, 1);
                        const q = { x: last.x + (p.x - last.x) * k, y: last.y + (p.y - last.y) * k };
                        if (foamable(q)) {
                            // 泡泡長在頭髮上：中心要落在頭髮裡，才不會把整張臉蓋掉
                            const f = { x: q.x + rand(-6, 6), y: q.y + rand(-8, 2) };
                            if (G.c.st.inHair(f)) addFoam(f.x, f.y, Math.min(20, rand(10, 17) * G.foamMul), true);
                            if (Math.random() < 0.08) sfx.pop();
                        } else if (inEllipse(q, HEAD)) {
                            poke('face');
                            mutter('那是臉。', 'doubt');
                        }
                    }
                    last = p;
                    if (now > nextScrub) { sfx.scrub(); nextScrub = now + 80; }
                    const pct = Math.round(G.coverage * 100);
                    $('meterFill').style.width = pct + '%';
                    if (said < 1 && pct >= 40) { said = 1; say('嗯～'); setFace('happy'); }
                    if (said < 2 && pct >= 80) { said = 2; say('對，就是這樣。'); setFace('bliss'); }
                    if (G.coverage >= 0.97) finish();
                },
                up() { last = null; },
                update(now) {
                    if (done) return;
                    const pct = Math.round(G.coverage * 100);
                    if (!started) { $('meterLabel').textContent = '10 秒'; return; }
                    const left = Math.max(0, endAt - now);
                    $('meterLabel').textContent = `${pct}%・${Math.ceil(left / 1000)} 秒`;
                    if (left <= 0) finish();
                },
            };
        }

        // 6c. 抓：冒出「癢」就點，抓到一半問力道
        function scratch() {
            const TOTAL = 14;
            hint('冒出「癢」的地方，點下去抓');
            meter({ fill: 0, label: `0 / ${TOTAL}` });
            say('有點癢。');
            setFace('neutral');
            let nextAt = performance.now() + 900, done = 0, asked = false, pauseUntil = 0, finished = false;

            function progress() {
                $('meterFill').style.width = (done / TOTAL * 100) + '%';
                $('meterLabel').textContent = `${G.hits} / ${TOTAL}`;
            }

            function spawn(now) {
                let p, tries = 0;
                do { p = pick(G.cells); tries++; } while (tries < 30 && spots.some(s => dist(s, p) < 50));
                const life = Math.max(900, 1600 - G.spawned * 50) + (G.hp > 1 ? 450 : 0);
                spots.push({ x: p.x, y: p.y, born: now, life, hp: G.hp });
                G.spawned++;
            }

            function finish() {
                finished = true;
                G.scratchScore = Math.round(G.hits / TOTAL * 30);
                if (G.hits >= 12) { say('你是神。'); setFace('bliss'); }
                else if (G.hits >= 8) { say('還不錯。'); setFace('happy'); }
                else { say('我自己抓好了。'); setFace('doubt'); }
                setTimeout(() => go(3), 1400);
            }

            return {
                down(p, now) {
                    if (finished) return;
                    let best = null;
                    spots.forEach(s => { const d = dist(s, p); if (d < 30 && (!best || d < dist(best, p))) best = s; });
                    if (best) {
                        sfx.scratch();
                        best.hp--;
                        burst(best.x, best.y, 4);
                        if (best.hp > 0) { floatText(best.x, best.y - 18, '再'); return; }
                        spots = spots.filter(s => s !== best);
                        G.hits++;
                        done++;
                        progress();
                        burst(best.x, best.y, 8);
                        floatText(best.x, best.y - 18, '爽');
                        setFace('bliss', 450);
                        nextAt = Math.max(nextAt, now + 280);
                        return;
                    }
                    if (!G.c.st.hideEars && EARS.some(e => dist(e, p) < 22)) { poke('ear'); mutter('那是我的耳朵。', 'wow'); }
                    else if (inEllipse(p, HEAD) && !foamable(p)) { poke('face'); mutter('那是臉啦。', 'pain'); }
                    else if (foamable(p)) mutter(pick(['不是那裡。', '再過去一點。', '旁邊旁邊。']), 'doubt');
                },
                update(now) {
                    if (finished) return;
                    // 沒抓到，時間到就消失
                    const gone = spots.filter(s => now - s.born > s.life);
                    if (gone.length) {
                        spots = spots.filter(s => !gone.includes(s));
                        done += gone.length;
                        progress();
                        mutter(pick(['那邊啦。', '左邊一點……不對，右邊。', '很癢耶。']), 'pain', 600);
                        nextAt = Math.max(nextAt, now + 300);
                    }
                    // 抓到一半，問力道
                    if (!asked && G.spawned >= 7 && !spots.length) {
                        asked = true;
                        pauseUntil = now + 2600;
                        say('這樣力道可以嗎？', '你');
                        setFace('neutral');
                        setTimeout(() => {
                            const a = pick(ANSWERS);
                            G.hp = a.hp;
                            G.force = a.text;
                            say(a.text);
                            setFace(a.hp > 1 ? 'doubt' : 'happy');
                            if (a.hint) hint(a.hint);
                        }, 1100);
                    }
                    if (now < pauseUntil) return;
                    const maxAlive = G.spawned >= 7 ? 2 : 1;
                    if (G.spawned < TOTAL && spots.length < maxAlive && now >= nextAt) {
                        spawn(now);
                        nextAt = now + 450;
                    }
                    if (G.spawned >= TOTAL && !spots.length) finish();
                },
            };
        }

        // 6d. 捏：從泡泡往外拉，捏個造型。泡泡給很多，隨便捏
        function sculpt() {
            hint('從泡泡上往外拉，想捏幾條就捏幾條。好了按「照鏡子」');
            say('要幫我抓個造型嗎？');
            setFace('happy');
            G.budgetMax = G.budget = Math.round((1700 + 1300 * G.coverage) * clamp(G.foamMul, 0.85, 1.3));
            meter({ fill: 100, label: '泡泡' });
            let stroke = null, last = null, carry = 0, finished = false;
            const r0 = clamp(17 * G.foamMul, 14, 22);

            function finish() {
                if (finished) return;
                finished = true;
                stroke = null;
                const shape = classify(G.strokes);
                G.shape = shape;
                G.styleScore = shape === SHAPES.plain ? 6 : 10;
                G.snapshot = snapshot();
                const stamp = $('shapeStamp');
                stamp.textContent = shape.name;
                stamp.classList.remove('hidden', 'is-in');
                void stamp.offsetWidth;
                stamp.classList.add('is-in');
                sfx.stamp();
                say(shape.line);
                setFace(shape === SHAPES.plain ? 'neutral' : 'wow');
                setTimeout(() => setFace('happy'), 900);
                actions([]);
                hint('');
                setTimeout(() => go(4), 2600);
            }

            actions([{ label: '照鏡子', onClick: finish }]);

            return {
                down(p) {
                    if (finished) return;
                    if (G.budget <= 0) { hint('泡泡用完了，照鏡子吧'); return; }
                    if (!onFoam(p)) { hint('要從泡泡上開始拉'); return; }
                    hint('從泡泡上往外拉，想捏幾條就捏幾條。好了按「照鏡子」');
                    stroke = { pts: [p], len: 0 };
                    G.strokes.push(stroke);
                    last = p;
                    carry = 0;
                },
                move(p) {
                    if (!stroke) return;
                    const d = dist(p, last);
                    carry += d;
                    while (carry >= 3 && G.budget > 0) {
                        carry -= 3;
                        const k = 1 - carry / Math.max(d, 1);
                        const q = { x: last.x + (p.x - last.x) * k, y: last.y + (p.y - last.y) * k };
                        stroke.len += 3;
                        G.budget -= 3;
                        addFoam(q.x, q.y, Math.max(7, r0 - stroke.len * 0.025), false, 0.12);
                        if (dist(q, stroke.pts[stroke.pts.length - 1]) >= 6) stroke.pts.push(q);
                        if (Math.random() < 0.05) sfx.pop();
                    }
                    last = p;
                    $('meterFill').style.width = Math.max(0, G.budget / G.budgetMax * 100) + '%';
                    if (G.budget <= 0) { stroke = null; hint('泡泡用完了，照鏡子吧'); }
                },
                up() { stroke = null; },
            };
        }

        // 看拉了幾條、往哪拉、有沒有轉圈、有沒有繞回來、有沒有鋸齒，決定是什麼造型
        // 每一條算：方向（上／左上／右上／左／右／下）、從頭的哪一邊開始、拉多高、總共轉幾圈、
        //          轉彎方向換了幾次（鋸齒）、尾巴有沒有勾起來、頭尾有沒有接起來（圈）
        function strokeInfo(s) {
            const a = s.pts[0], b = s.pts[s.pts.length - 1];
            let turn = 0, flips = 0, lastSign = 0, hook = 0;
            const tail = Math.floor(s.pts.length * 0.65);
            for (let i = 2; i < s.pts.length; i++) {
                const p0 = s.pts[i - 2], p1 = s.pts[i - 1], p2 = s.pts[i];
                let d = Math.atan2(p2.y - p1.y, p2.x - p1.x) - Math.atan2(p1.y - p0.y, p1.x - p0.x);
                while (d > Math.PI) d -= TAU;
                while (d < -Math.PI) d += TAU;
                turn += d;
                if (i >= tail) hook += d;
                if (Math.abs(d) > 0.3) { const sg = Math.sign(d); if (lastSign && sg !== lastSign) flips++; lastSign = sg; }
            }
            const dx = b.x - a.x, dy = a.y - b.y;  // dy 往上是正的
            const ang = Math.atan2(dy, dx) * 180 / Math.PI;
            const dir = ang >= 60 && ang <= 120 ? 'up' : ang > 120 && ang < 160 ? 'upL' : ang > 20 && ang < 60 ? 'upR'
                : (ang >= 160 || ang <= -160) ? 'L' : (ang >= -20 && ang <= 20) ? 'R' : 'down';
            const top = Math.min(...s.pts.map(p => p.y));
            const cx = s.pts.reduce((t, p) => t + p.x, 0) / s.pts.length;
            const cy = s.pts.reduce((t, p) => t + p.y, 0) / s.pts.length;
            // 圈還是漩渦：頭尾離中心的距離差不多是圈，越轉越小是漩渦（霜淇淋）
            const q = Math.max(1, Math.floor(s.pts.length / 4));
            const rad = list => list.reduce((t, p) => t + Math.hypot(p.x - cx, p.y - cy), 0) / list.length;
            const round = rad(s.pts.slice(-q)) / Math.max(1, rad(s.pts.slice(0, q)));
            return {
                a, b, len: s.len, dx, dy, dir, top, cy,
                rise: a.y - top, turn: Math.abs(turn), flips, hook: Math.abs(hook),
                up: dy > Math.abs(dx) * 0.6,
                loop: dist(a, b) < 30 && s.len > 110 && Math.abs(turn) > Math.PI * 1.4 && Math.abs(turn) < Math.PI * 2.7 && round > 0.7,
                side: a.x < 168 ? 'L' : a.x > 192 ? 'R' : 'C',
            };
        }

        function classify(strokes) {
            const list = strokes.filter(s => s.len >= 24 && s.pts.length >= 3);
            const c = G ? G.c : { style: 'short', cat: false, st: STYLES.short };
            let shape = classifyInfo(list.map(strokeInfo), c);
            // 客人限定
            if (shape === SHAPES.plain && c.style === 'bald') shape = SHAPES.shine;
            if (shape === SHAPES.bunny && c.cat) shape = SHAPES.catears;
            return shape;
        }

        function classifyInfo(info, c) {
            const n = info.length;
            if (!n) return SHAPES.plain;
            const ups = info.filter(i => i.up).length;
            const downs = info.filter(i => i.dir === 'down').length;
            const maxTurn = Math.max(...info.map(i => i.turn));
            // 圈：頭頂上方是光環，其他地方是甜甜圈
            const loop = info.find(i => i.loop);
            if (loop) return loop.cy < c.st.top + 6 ? SHAPES.halo : SHAPES.donut;
            if (maxTurn > Math.PI * 3.4) return SHAPES.coil;
            if (n === 2 && info.every(i => i.turn > Math.PI * 0.9)) return SHAPES.horns;
            if (maxTurn > Math.PI * 1.7) return SHAPES.cone;
            if (info.some(i => i.flips >= 4 && i.len > 90)) return SHAPES.bolt;
            if (n >= 12) return SHAPES.hedgehog;
            if (n >= 7) return new Set(info.map(i => i.dir)).size >= 4 ? SHAPES.lion : SHAPES.urchin;
            if (n === 1) {
                const i = info[0];
                if (i.dir === 'down') return i.len > 110 ? SHAPES.seaweed : SHAPES.bangs;
                if (!i.up) return SHAPES.wind;
                if (i.hook > 1.3) return SHAPES.ahoge;
                if (i.dir !== 'up') return SHAPES.antenna;
                return i.rise >= 110 ? SHAPES.rocket : SHAPES.unicorn;
            }
            if (n === 2) {
                const [p, q] = info;
                if (ups === 2) {
                    if (Math.abs(p.a.x - q.a.x) < 40) return SHAPES.feelers;
                    return Math.min(p.rise, q.rise) >= 75 ? SHAPES.bunny : SHAPES.devil;
                }
                if (downs === 2) return (p.a.x < 180) !== (q.a.x < 180) ? SHAPES.twin : SHAPES.mop;
                if (!ups && (p.dx < 0) !== (q.dx < 0)) return SHAPES.prop;
                return SHAPES.abstract;
            }
            // 三到六條
            if (ups === n) {
                if (info.every(i => Math.abs(i.a.x - 180) < 30)) return SHAPES.mohawk;
                const angs = info.map(i => Math.atan2(i.dy, i.dx));
                if (n >= 5 && Math.max(...angs) - Math.min(...angs) > Math.PI * 0.55) return SHAPES.peacock;
                return SHAPES.crown;
            }
            if (downs === n) return SHAPES.mop;
            if (info.every(i => i.dir === 'L') || info.every(i => i.dir === 'R')) return SHAPES.slick;
            if (ups >= n - 1) return SHAPES.urchin;
            return ups >= 2 ? SHAPES.boom : SHAPES.abstract;
        }

        // 照鏡子那一刻拍一張（固定白天的顏色，證明是紙本）
        function snapshot() {
            const c = document.createElement('canvas');
            c.width = W * 2;
            c.height = H * 2;
            const x = c.getContext('2d');
            x.setTransform(2, 0, 0, 2, 0, 0);
            const keep = face;
            face = { kind: 'happy', until: Infinity };
            drawScene(x, DAY, performance.now(), false);
            face = keep;
            return c;
        }

        // 6e. 拍：沖完水，照節奏拍背
        function pat() {
            $('shapeStamp').classList.add('hidden');
            hint('沖水中……');
            meter({ fill: 0, label: '' });
            actions([]);
            sfx.water();
            const BEATS = [700, 1200, 1700, 1950], TRACK = 2600;
            const start = performance.now();
            let phase = 'rinse', trackStart = 0, ticked = 0, finished = false;
            const hit = BEATS.map(() => false);

            function tap(now) {
                sfx.pat();
                shake();
                if (phase !== 'track') return;
                const t = now - trackStart;
                let k = -1, best = Infinity;
                BEATS.forEach((b, i) => { const d = Math.abs(t - b); if (!hit[i] && d < best) { best = d; k = i; } });
                if (k < 0 || best > 230) { floatText(180, 330, '空', pal.accent); setFace('doubt', 400); return; }
                hit[k] = true;
                document.querySelectorAll('#meterMarks .meter-mark')[k]?.classList.add('is-hit');
                const g = best < 70 ? { w: '準', s: 5, f: 'bliss' } : best < 140 ? { w: '好', s: 3, f: 'happy' } : { w: '歪', s: 1, f: 'pain' };
                G.patScore += g.s;
                G.patMarks.push(g.w);
                floatText(140 + k * 27, 330, g.w);
                setFace(g.f, 400);
            }

            function finish() {
                finished = true;
                if (G.patScore >= 17) { say('啪得好專業。'); setFace('bliss'); }
                else if (G.patScore >= 10) { say('舒服。'); setFace('happy'); }
                else { say('你是在打我嗎？'); setFace('pain'); }
                actions([]);
                setTimeout(showResult, 1100);
            }

            return {
                down(p, now) { tap(now); },
                update(now) {
                    if (finished) return;
                    if (phase === 'rinse') {
                        const t = now - start;
                        G.foamAlpha = clamp(1 - t / 1300, 0, 1);
                        if (Math.random() < 0.6) drops.push({ x: 115 + Math.random() * 130, y: 70 + Math.random() * 20, v: 4 + Math.random() * 3 });
                        if (t > 1500) {
                            G.foamAlpha = 0;
                            G.wet = true;
                            fctx.clearRect(0, 0, W, H);
                            phase = 'ready';
                            trackStart = now + 1600;
                            say('沖好了，拍一拍就結束。');
                            setFace('happy');
                            hint('拍背：指針走到紅線就點「啪」（啪、啪、啪啪）');
                            meter({ fill: 0, marks: BEATS.map(b => b / TRACK * 100), cursor: 0, label: '預備' });
                            actions([{ label: '啪', round: true, onDown: tap }]);
                        }
                        return;
                    }
                    if (phase === 'ready') {
                        if (now >= trackStart) { phase = 'track'; $('meterLabel').textContent = ''; }
                        return;
                    }
                    const t = now - trackStart;
                    $('meterCursor').style.left = clamp(t / TRACK * 100, 0, 100) + '%';
                    while (ticked < BEATS.length && t >= BEATS[ticked]) { sfx.tick(); ticked++; }
                    if (t > TRACK) finish();
                },
            };
        }

        // ===== 7. 洗好了：算爽度、印洗頭證明 =====
        let certFile = null;

        async function showResult() {
            stage = 5;
            setSteps(5);
            const total = G.squeezeScore + G.rubScore + G.scratchScore + G.styleScore + G.patScore;
            const grade = GRADES.find(g => total >= g.min);
            let best = 0;
            try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { }
            if (total > best) {
                try { localStorage.setItem(BEST_KEY, String(total)); } catch (e) { }
                if (best) showToast('新紀錄・最高爽度');
            }
            // 發工資：爽度 × 10（最少 100），洗得好客人另外給小費。存進共用錢包
            const wage = Math.max(100, total * 10);
            const tip = total >= 90 ? 500 : total >= 75 ? 200 : 0;
            // 點單：做到另外給
            const o = G.order && ORDERS[G.order];
            const orderDone = !!(o && !G.orderBroken && o.ok(G));
            const orderTip = orderDone ? o.tip : 0;
            G.pay = { wage, tip, order: orderTip };
            Wallet.earn(wage + tip + orderTip, 'xitou');
            if (o) { renderOrder(orderDone ? 'ok' : 'no'); say(orderDone ? pick(ORDER_OK_LINES) : o.no); setFace(orderDone ? 'bliss' : 'doubt'); }
            $('payWage').textContent = Wallet.fmt(wage);
            $('payTip').textContent = tip ? Wallet.fmt(tip) : '客人沒給';
            $('payOrderRow').classList.toggle('hidden', !o);
            if (o) $('payOrder').textContent = orderDone ? Wallet.fmt(orderTip) : '沒做到';
            recordWash({
                at: new Date().toISOString(), ms: Math.round(performance.now() - G.t0),
                who: G.c.who, style: G.c.style, cat: G.c.cat, glasses: G.c.glasses, mustache: G.c.mustache, freckles: G.c.freckles,
                total, grade: grade.mark,
                parts: { squeeze: G.squeezeScore, rub: G.rubScore, scratch: G.scratchScore, style: G.styleScore, pat: G.patScore },
                pumps: G.landed, want: G.c.st.pumps, drip: G.drip,
                coverage: Math.round(G.coverage * 100) / 100, rubMs: G.rubMs,
                hits: G.hits, force: G.force,
                shape: shapeKey(G.shape), strokes: G.strokes.filter(x => x.len >= 24).length,
                patMarks: G.patMarks.join(''),
                pokes: { ...G.pokes },
                order: o ? { id: G.order, done: orderDone } : null,
                pay: { ...G.pay },
                login: !!(window.Line && Line.loggedIn),
            });
            uploadWashes();
            $('payWallet').textContent = Wallet.fmt(Wallet.money);
            renderAcct();

            renderBest();
            hint('');
            actions([{ label: '再洗一顆', onClick: restart }]);

            $('score').textContent = total;
            $('gradeLine').textContent = grade.line;
            const blob = await makeCert(total, grade);
            certFile = new File([blob], 'dongbuli-shampoo.png', { type: 'image/png' });
            $('certImg').src = URL.createObjectURL(blob);
            const canShare = navigator.canShare && navigator.canShare({ files: [certFile] });
            $('shareBtn').textContent = canShare ? '分享洗頭證明' : '下載洗頭證明';
            $('result').classList.remove('hidden');
            $('result').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
        }

        async function makeCert(total, grade) {
            const SERIF = '"Noto Serif TC", serif', SANS = '"Noto Sans TC", sans-serif';
            const rows = [
                ['客人', G.c.who],
                ['洗髮精', G.squeezeLabel],
                ['泡泡', `蓋滿 ${Math.round(G.coverage * 100)}%`],
                ['抓癢', `${G.hits} / 14`],
                ['造型', G.shape.name],
                ['拍背', G.patMarks.length ? G.patMarks.join('・') : '都沒拍到'],
                ...(G.order ? [['點單', `${ORDERS[G.order].text.replace(/[。，].*$/, '')}・${G.pay.order ? '達成' : '沒做到'}`]] : []),
                ['工資', Wallet.fmt(G.pay.wage) + (G.pay.tip + G.pay.order ? `＋小費 ${Wallet.fmt(G.pay.tip + G.pay.order)}` : '')],
            ];
            const allText = rows.flat().join('') + '洗頭證明爽度二十七樓坐洗部' + grade.mark + grade.line + '0123456789（）';
            try {
                await Promise.race([
                    Promise.all([document.fonts.load(`600 40px ${SERIF}`, allText), document.fonts.load(`400 40px ${SANS}`, allText)]),
                    new Promise(r => setTimeout(r, 2500)),
                ]);
            } catch (e) { }

            const c = document.createElement('canvas');
            c.width = 1080;
            c.height = 1500;
            const x = c.getContext('2d');
            const text = (s, px, py, font, color, align = 'center') => { x.font = font; x.fillStyle = color; x.textAlign = align; x.fillText(s, px, py); };

            x.fillStyle = '#fcfaf8';
            x.fillRect(0, 0, c.width, c.height);
            x.strokeStyle = '#8e8070';
            x.lineWidth = 2;
            x.strokeRect(40, 40, 1000, 1420);
            x.lineWidth = 1;
            x.strokeRect(54, 54, 972, 1392);

            x.textBaseline = 'alphabetic';
            text('D O N G B U L I ・ 2 7 F ・ 坐 洗 部', 540, 130, `400 26px ${SANS}`, '#8e8070');
            text('洗頭證明', 540, 220, `600 76px ${SERIF}`, '#2c2c2c');
            x.fillStyle = '#8e8070';
            x.fillRect(500, 250, 80, 2);

            // 照鏡子那一刻
            const iw = rows.length > 7 ? 440 : 480, ih = Math.round(iw * H / W), ix = (1080 - iw) / 2, iy = 290;
            x.drawImage(G.snapshot, ix, iy, iw, ih);
            x.strokeStyle = '#dcdcdc';
            x.lineWidth = 2;
            x.strokeRect(ix, iy, iw, ih);

            let y = iy + ih + 85;
            rows.forEach(([k, v]) => {
                text(k, 210, y, `400 30px ${SANS}`, '#8e8070', 'left');
                x.font = `400 38px ${SERIF}`;
                const fit = Math.min(38, Math.floor(38 * 660 / Math.max(1, x.measureText(v).width)));
                text(v, 360, y, `400 ${fit}px ${SERIF}`, '#4a4a4a', 'left');
                y += rows.length > 7 ? 54 : 57;
            });

            // 爽度、朱印
            text(`爽度 ${total}`, 210, y + 40, `600 48px ${SERIF}`, '#2c2c2c', 'left');
            text(grade.line, 210, y + 95, `400 30px ${SERIF}`, '#8e8070', 'left');

            x.save();
            x.translate(840, y + 10);
            x.rotate(-0.12);
            x.globalAlpha = 0.9;
            x.strokeStyle = '#b33a2f';
            x.lineWidth = 7;
            x.strokeRect(-85, -85, 170, 170);
            x.lineWidth = 2.5;
            x.strokeRect(-100, -100, 200, 200);
            x.textBaseline = 'middle';
            text(grade.mark, 0, 6, `700 120px ${SERIF}`, '#b33a2f');
            x.restore();

            const d = new Date();
            text(`${d.getFullYear()}・${d.getMonth() + 1}・${d.getDate()}`, 540, 1410, `400 24px ${SANS}`, '#8e8070');

            return new Promise((resolve, reject) => c.toBlob(b => b ? resolve(b) : reject(), 'image/png'));
        }

        async function shareCert() {
            if (!certFile) return;
            if (navigator.canShare && navigator.canShare({ files: [certFile] })) {
                try {
                    await navigator.share({ files: [certFile], title: '丼步喱・絆 洗頭證明', text: `我在二十七樓洗了一顆頭，爽度 ${$('score').textContent}` });
                } catch (e) { } // 使用者取消分享
                return;
            }
            const link = document.createElement('a');
            link.href = URL.createObjectURL(certFile);
            link.download = certFile.name;
            link.click();
        }

        // LINE 登入：工資存進帳號，換手機也在
        const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        function renderAcct() {
            const box = $('payAcct');
            if (Line.loggedIn) box.innerHTML = `存在 ${escHtml((Line.profile || {}).name || 'LINE')} 的 LINE 帳號`;
            else box.innerHTML = `錢只存在這支手機。<button type="button" data-login class="min-h-[32px] underline underline-offset-4 text-wabi-dark">用 LINE 登入</button>，換手機也在`;
            if (G && G.pay) $('payWallet').textContent = Wallet.fmt(Wallet.money);
        }
        $('payAcct').addEventListener('click', e => { if (e.target.closest('[data-login]')) Line.login(); });
        Wallet.on(type => {
            renderBest();
            renderAcct();
            if (type === 'login') showToast('登入了，工資存進 LINE 帳號');
        });

        function renderBest() {
            let best = 0;
            try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { }
            $('best').innerHTML = (best ? `最高爽度 ${best}<br>` : '') + `錢包 ${Wallet.fmt(Wallet.money)}`;
        }

        // ===== 8. 開始、重來 =====
        function intro() {
            newGame();
            stage = -1;
            cur = {};
            setSteps(-1);
            say(G.order ? ORDERS[G.order].text : pick(NO_ORDER_LINES));
            hint('五道工序：擠、搓、抓、捏、拍。大約一分鐘' + (G.order ? '。客人有點單，照做多給小費' : ''));
            meter({ fill: 0, label: '' });
            actions([{ label: '開始洗頭', onClick: () => go(0) }]);
        }

        function restart() {
            $('result').classList.add('hidden');
            intro();
            $('salon').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
            go(0);
        }

        $('shareBtn').addEventListener('click', shareCert);
        $('againBtn').addEventListener('click', restart);

        // 畫布上的手指：只認第一根
        let pointerId = null;

        function toPoint(e) {
            const r = cv.getBoundingClientRect();
            return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
        }

        cv.addEventListener('pointerdown', e => {
            unlockAudio();
            if (pointerId !== null) return;
            pointerId = e.pointerId;
            try { cv.setPointerCapture(e.pointerId); } catch (err) { }
            cur.down?.(toPoint(e), performance.now());
        });
        cv.addEventListener('pointermove', e => {
            if (e.pointerId !== pointerId) return;
            const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
            (events.length ? events : [e]).forEach(ev => cur.move?.(toPoint(ev), performance.now()));
        });
        const lift = e => {
            if (e.pointerId !== pointerId) return;
            pointerId = null;
            cur.up?.();
        };
        cv.addEventListener('pointerup', lift);
        cv.addEventListener('pointercancel', lift);
        cv.addEventListener('contextmenu', e => e.preventDefault());

        let lastFrame = performance.now();
        function frame(now) {
            const dt = Math.min(50, now - lastFrame);
            lastFrame = now;
            cur.update?.(now, dt);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            drawScene(ctx, pal, now, true);
            requestAnimationFrame(frame);
        }

        renderBest();
        intro();
        requestAnimationFrame(frame);
        setTimeout(uploadWashes, 2500);  // 之前沒送成功的補送
    </script>
</body>
