<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五種家門口</title>
<style>
  :root { --bg: #fcfaf8; --text: #4a4a4a; --dark: #2c2c2c; --accent: #8e8070; --sub: #dcdcdc; --shu: #b33a2f; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; }
  main { max-width: 390px; margin: 0 auto; padding: 22px 16px 28px; }
  h1 { font-family: 'Noto Serif TC', serif; font-weight: 300; font-size: 22px; letter-spacing: .3em; color: var(--dark); margin: 0; text-align: center; }
  .sub { text-align: center; font-size: 11px; letter-spacing: .12em; color: var(--accent); margin: 6px 0 4px; line-height: 1.7; }
  .card { border: 1px solid var(--sub); border-radius: 4px; padding: 12px; background: #fff; margin-top: 14px; }
  .h { display: flex; align-items: baseline; gap: 8px; }
  .no { font-size: 12px; color: var(--shu); border: 1px solid var(--shu); padding: 0 5px; line-height: 1.5; font-family: 'Noto Serif TC', serif; }
  .name { font-family: 'Noto Serif TC', serif; font-size: 16px; letter-spacing: .2em; color: var(--dark); }
  canvas { display: block; width: 100%; border-radius: 3px; margin-top: 8px; image-rendering: pixelated; }
  .cap { font-size: 10.5px; letter-spacing: .08em; color: var(--accent); margin-top: 6px; line-height: 1.7; }
</style>
</head>
<body>
<main>
  <h1>家門口・五種</h1>
  <p class="sub">房子升級，家門口跟著換・白天和夜晚</p>
  <div id="list"></div>
</main>
<script src="../../../assets/xiaodao-door.js"></script>
<script>
const CAP = {
  1: '帳篷：曬衣繩、營火、木頭椅凳；木箱桌上放日記、掛一盞提燈；信箱是木箱插在木樁上',
  2: '小木屋：圓木牆、綠屋頂、石頭煙囪；門廊有搖椅，木桶上放日記；旁邊一堆柴；木柵欄',
  3: '平房：木板牆、紅瓦；門廊小桌放日記；花圃、石板小路、地燈、白色籬笆',
  4: '兩層樓：二樓陽台（陽台下面就是門廊）、深藍百葉窗；路燈、樹籬、長椅、磚頭信箱',
  5: '海景別墅：白色方塊房子、大落地窗、屋頂露台的陽傘；泳池、躺椅（店貓在上面）、棕櫚樹；後面是海'
};
const NUM = ['', '壹', '貳', '參', '肆', '伍'];
for (let lv = 1; lv <= 5; lv++) {
  const sec = document.createElement('section'); sec.className = 'card';
  sec.innerHTML = `<div class="h"><span class="no">${NUM[lv]}</span><span class="name">${XiaodaoDoor.SPEC[lv].name}</span></div>`;
  [false, true].forEach(n => { const c = document.createElement('canvas'); c.id = `d${lv}${n ? 'n' : ''}`; XiaodaoDoor.render(lv, { canvas: c, z: 2, night: n }); sec.appendChild(c); });
  const p = document.createElement('p'); p.className = 'cap'; p.textContent = CAP[lv]; sec.appendChild(p);
  document.getElementById('list').appendChild(sec);
}
</script>
</body>
</html>
