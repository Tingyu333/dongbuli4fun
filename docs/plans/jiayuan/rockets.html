<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家園：火箭的圖鑑</title>
<!-- 家園・築的設計圖（2026-11-21）：發射台能放的火箭，三級各 5 枚、共 15 枚。火箭很高，所以跟發射台設計圖一樣「立起來畫」，每一張同一個比例。還不是遊戲本身。 -->
<style>
  :root { --bg: #fcfaf8; --text: #4a4a4a; --dark: #2c2c2c; --accent: #8e8070; --sub: #dcdcdc; --shu: #b33a2f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; }
  main { max-width: 390px; margin: 0 auto; padding: 22px 16px 28px; }
  h1 { font-family: 'Noto Serif TC', serif; font-weight: 300; font-size: 22px; letter-spacing: .3em; color: var(--dark); margin: 0; text-align: center; }
  .sub { text-align: center; font-size: 11px; letter-spacing: .12em; color: var(--accent); margin: 6px 0 10px; line-height: 1.7; }
  .card { border: 1px solid var(--sub); border-radius: 4px; padding: 12px; background: #fff; margin-top: 12px; }
  .h { display: flex; align-items: baseline; gap: 8px; }
  .no { font-size: 12px; color: var(--shu); border: 1px solid var(--shu); padding: 0 5px; line-height: 1.5; font-family: 'Noto Serif TC', serif; }
  .name { font-family: 'Noto Serif TC', serif; font-size: 16px; letter-spacing: .2em; color: var(--dark); }
  .tag { margin-left: auto; font-size: 10px; letter-spacing: .1em; color: var(--accent); }
  canvas { display: block; width: 100%; border-radius: 3px; margin-top: 10px; image-rendering: pixelated; image-rendering: crisp-edges; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 11.5px; letter-spacing: .04em; line-height: 1.6; }
  dt { color: var(--accent); } dd { margin: 0; }
  .arrow { text-align: center; color: var(--accent); font-size: 12px; letter-spacing: .3em; margin-top: 12px; }
  .labels { display: grid; gap: 4px; margin-top: 6px; text-align: center; }
  .labels b { display: block; font-weight: 500; font-size: 11.5px; color: var(--dark); letter-spacing: .04em; }
  .labels span { display: block; font-size: 9.5px; color: var(--accent); line-height: 1.4; margin-top: 1px; }
  .stack canvas { margin-top: 10px; }
  .gold { border-color: #c9a24a; }
</style>
</head>
<body>
<main>
  <h1>火箭・圖鑑</h1>
  <p class="sub">家園・築的設計圖（精緻像素；火箭很高，立起來畫）<br>每一張同一個比例，跟發射台設計圖裡的一樣大；名字都是暫定的</p>

  <section class="card">
    <div class="h"><span class="name">小型・探空火箭</span><span class="tag">最低要 壹 小發射架・5 枚</span></div>
    <div id="rSmall" class="stack"></div>
  </section>
  <section class="card">
    <div class="h"><span class="name">中型・運載火箭</span><span class="tag">最低要 貳 發射塔・5 枚</span></div>
    <div id="rMid" class="stack"></div>
  </section>
  <section class="card">
    <div class="h"><span class="name">大型・重型火箭</span><span class="tag">最低要 參 太空港・5 枚</span></div>
    <div id="rBig1" class="stack"></div>
    <div id="rBig2" class="stack"></div>
  </section>
</main>
<script>

// ===== 小工具（跟 style-mockup.html 同一套：硬邊、整數座標）=====
const TAU = Math.PI * 2;
function make(id) { const c = document.getElementById(id), x = c.getContext('2d'); x.imageSmoothingEnabled = false; return { c, x, W: c.width, H: c.height }; }
const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
function P(x, a, b, col) { x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), 1, 1); }
function R(x, a, b, w, h, col) { x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), Math.round(w), Math.round(h)); }
function circ(x, cx, cy, r, col) { for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) if (xx * xx + yy * yy <= r * r + r * .6) P(x, cx + xx, cy + yy, col); }
function poly(x, pts, col) {
  const ys = pts.map(p => p[1]), xs = pts.map(p => p[0]);
  const y0 = Math.floor(Math.min(...ys)), y1 = Math.ceil(Math.max(...ys)), x0 = Math.floor(Math.min(...xs)), x1 = Math.ceil(Math.max(...xs));
  x.fillStyle = col;
  for (let y = y0; y <= y1; y++) for (let X = x0; X <= x1; X++) {
    const px = X + .5, py = y + .5; let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside; }
    if (inside) x.fillRect(X, y, 1, 1);
  }
}
const K = {
  g1: '#97ad6f', g2: '#86a061', g3: '#a6bb7c', g4: '#738d51', sand: '#e6d3a3', sand2: '#d8c18b', sand3: '#efe0b8',
  sea: '#6b97a6', sea2: '#7ea9b5', shallow: '#9cc5c8', foam: '#e3efed', deep: '#4f7d8f',
  leaf1: '#5d7c43', leaf2: '#4a6634', leaf3: '#7a9a55', leafHi: '#9cb96f', trunk: '#6e4528',
  roof: '#b33a2f', roofHi: '#cf5a46', roofLo: '#8f2c23', roofLine: '#7a241d',
  wall: '#efe4cf', wall2: '#d9c9aa', wall3: '#c2ae8b', door: '#5e3c22', win: '#f6cd72', frame: '#6e4528',
  conc: '#c4beb3', conc2: '#aea79b', conc3: '#d6d1c7', stone: '#a39b8e', stone2: '#8b8377', stone3: '#bdb6aa',
  wood: '#9a6a40', wood2: '#7c5230', wood3: '#b07f50', post: '#5e3c22',
  canvas: '#dcc9a0', canvasHi: '#ece0c1', canvasLo: '#bba77c', canvasLine: '#9c8a62',
  shingle: '#8a6440', shingleHi: '#a57a50', shingleLo: '#6c4c30', shingleLine: '#553a24',
  slate: '#76828c', slateHi: '#8f9ba5', slateLo: '#626d77', slateLine: '#4f5962',
  white: '#f3f1ec', white2: '#dedad1', white3: '#c9c4b9', glass: '#a8cdd6', glassHi: '#e2f1f3',
  pool: '#5fb3c4', poolHi: '#9fdce4', poolLo: '#3f93a6', fire: '#e8873a', fire2: '#f6cd72', fire3: '#c4462e',
  hedge: '#557a3e', hedge2: '#43652f', flowerA: '#f0b8b0', flowerB: '#f1d36b', flowerC: '#c9a0dc',
  shadow: 'rgba(30,40,30,.24)'
};

// 共用：草地底、石板路、樹、影子
function lawn(x, W, H, seed = 0) { for (let b = 0; b < H; b++) for (let a = 0; a < W; a++) { const n = hash(a + seed, b); P(x, a, b, n > .9 ? K.g3 : n > .74 ? K.g2 : n < .05 ? K.g4 : K.g1); } }
function stones(x, pts) { pts.forEach(([a, b]) => { R(x, a, b, 6, 3, K.conc3); R(x, a, b + 2, 6, 1, K.conc2); P(x, a, b, '#e4e0d8'); }); }
function tree(x, a, b, r) {
  x.fillStyle = K.shadow; for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) if (xx * xx + yy * yy <= r * r) x.fillRect(a + xx + 3, b + yy + 3, 1, 1);
  circ(x, a, b, r, K.leaf2); circ(x, a - 1, b - 1, r - 1, K.leaf1); circ(x, a - 2, b - 2, Math.max(1, r - 3), K.leaf3); P(x, a - r / 2, b - r / 2, K.leafHi); P(x, a - r / 2 + 1, b - r / 2, K.leafHi);
  for (let i = 0; i < r * 2; i++) { const t = hash(a + i, b) * TAU, rr = hash(b, a + i) * r; P(x, a + Math.cos(t) * rr, b + Math.sin(t) * rr, i % 2 ? K.leaf2 : K.leaf3); }
}
function palm(x, a, b) {   // 椰子樹：六片葉子，每片兩顆寬、尾巴往下垂，葉子比草地深才看得出來
  for (let k = 0; k < 6; k++) { const t = k / 6 * TAU + .3; for (let s = 2; s < 12; s++) { const u = a + Math.cos(t) * s, v = b + Math.sin(t) * s + (s > 7 ? (s - 7) * .6 : 0); P(x, u + 3, v + 3, K.shadow); } }
  for (let k = 0; k < 6; k++) { const t = k / 6 * TAU + .3, nx = -Math.sin(t), ny = Math.cos(t); for (let s = 2; s < 12; s++) { const u = a + Math.cos(t) * s, v = b + Math.sin(t) * s + (s > 7 ? (s - 7) * .6 : 0); const wdt = s < 4 ? 1 : s < 9 ? 2 : 1; for (let q = -wdt; q <= wdt; q++) P(x, u + nx * q, v + ny * q, q === wdt ? '#3d5f2c' : (q === -wdt ? '#8fb35a' : '#6f9a45')); } }
  circ(x, a, b, 2, '#7a5a3a'); P(x, a - 1, b - 1, '#a07a50'); P(x, a + 1, b + 1, '#5e4228'); }
function shadowPoly(x, pts, dx, dy) { poly(x, pts.map(([a, b]) => [a + dx, b + dy]), K.shadow); }
// 四面坡（上亮、左亮、右暗、下暗），屋脊沿水平方向；line 是瓦片的橫線間距
function hipRoof(x, a, b, w, h, c, opts = {}) {
  const inset = Math.min(h / 2, opts.inset ?? h / 2), ry = b + h / 2;
  const ridgeL = a + inset, ridgeR = a + w - inset;
  shadowPoly(x, [[a, b], [a + w, b], [a + w, b + h], [a, b + h]], opts.sh || 4, opts.sh || 4);
  poly(x, [[a, b], [a + w, b], [ridgeR, ry], [ridgeL, ry]], c.hi);           // 上坡（迎光）
  poly(x, [[a, b + h], [a + w, b + h], [ridgeR, ry], [ridgeL, ry]], c.lo);   // 下坡
  poly(x, [[a, b], [ridgeL, ry], [a, b + h]], c.mid);                        // 左坡
  poly(x, [[a + w, b], [ridgeR, ry], [a + w, b + h]], c.lo);                  // 右坡
  // 瓦片橫線＋錯開的直縫
  for (let yy = b + 2; yy < b + h - 1; yy += c.step || 3) for (let xx = a + 1; xx < a + w - 1; xx++) {
    const dTop = yy - b, dBot = b + h - yy, dl = xx - a, dr = a + w - xx;
    if (dl > Math.min(dTop, dBot) + 1 && dr > Math.min(dTop, dBot) + 1 || true) { const px = x.getImageData(xx, yy, 1, 1).data; if (px[3]) P(x, xx, yy, c.line); }
  }
  for (let yy = b + 1; yy < b + h - 1; yy++) for (let xx = a + 1 + ((Math.floor((yy - b) / (c.step || 3)) % 2) * 2); xx < a + w - 1; xx += 4) if ((yy - b) % (c.step || 3)) P(x, xx, yy, c.seam || c.line);
  R(x, ridgeL, ry - 1, ridgeR - ridgeL, 2, c.ridge || c.line);
  // 四條斜脊
  const diag = (x0, y0, x1, y1) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)); for (let i = 0; i <= n; i++) P(x, x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c.ridge || c.line); };
  diag(a, b, ridgeL, ry); diag(a, b + h, ridgeL, ry); diag(a + w, b, ridgeR, ry); diag(a + w, b + h, ridgeR, ry);
  // 外框
  R(x, a, b, w, 1, c.edge || c.line); R(x, a, b + h - 1, w, 1, c.edge || c.line); R(x, a, b, 1, h, c.edge || c.line); R(x, a + w - 1, b, 1, h, c.edge || c.line);
}
function chimney(x, a, b, w, h, top, side, sh = 3) { R(x, a + sh, b + sh, w, h, K.shadow); R(x, a, b, w, h, side); R(x, a, b, w, 2, top); R(x, a + 1, b + 1, w - 2, 1, '#4a3f36'); for (let i = 0; i < 3; i++) P(x, a + 1 + i, b - 2 - i * 2, i % 2 ? '#ece8e2' : '#e0dbd2'); }

// ===== 火箭圖鑑：立起來畫（跟發射台設計圖同一個畫法、同一個比例），光從左上來 =====
// 2026-11-27 精緻重畫（使用者：上一版改完「變醜、變粗糙」）：
//   每種材質五個色階，照圓柱受光算每一欄用哪一階（左邊亮、偏左一條高光、右邊暗）；鼻錐用弧形（ogive）一列一列收，
//   陰影跟著箭身那一欄走；噴嘴是喇叭形的金屬；尾翼有亮的前緣、暗的後緣；燒黑由下往上用棋盤格慢慢淡出；不用接近黑。
function lineP(x, x0, y0, x1, y1, c) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; for (let i = 0; i <= n; i++) P(x, x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c); }
const RP = {   // 由暗到亮
  W: ['#bcb6aa', '#d6d1c6', '#eae7e0', '#f7f5f0', '#ffffff'],
  G: ['#9d988e', '#b4afa5', '#c9c4ba', '#dbd7ce', '#eae7e1'],
  S: ['#7d261e', '#97312a', '#b33a2f', '#c84c40', '#db6a5a'],
  N: ['#1e2a43', '#27375a', '#30436a', '#41577f', '#576d95'],
  A: ['#8a6b2b', '#a8863d', '#c9a24a', '#dfbf69', '#f4dc95'],
  O: ['#8c4821', '#a75a2a', '#c46d36', '#d9854b', '#eba46b'],
  D: ['#30353a', '#3b4045', '#474c51', '#565b60', '#686c70'],
  M: ['#575c60', '#6c7175', '#888d90', '#a6abae', '#c5c9cb'],
  C: ['#4f4842', '#5e564e', '#6f675e', '#847b71', '#9a9187'],   // 燒黑（暖色炭灰）
};
// 圓柱：第 u 欄（共 w 欄）用第幾階；偏左一條高光，最右一欄再暗一階
function lv(u, w) {
  if (w <= 1) return 3; const t = (u + .5) / w;
  let i = .98 - .8 * t + .18 * Math.exp(-Math.pow((t - .28) / .14, 2)); let k = Math.max(0, Math.min(4, Math.floor(i * 5)));
  if (w >= 6 && u === w - 1) k = Math.max(0, k - 1); return k;
}
const Lx = (cx, w) => Math.round(cx - w / 2);
// 直的一段：從 bot 往上畫 h 列，回傳頂端 y。fn(u, v, k) 可以換顏色（k 是那一欄的階）
function tube(x, cx, bot, w, h, rp, fn) { const L = Lx(cx, w); for (let v = 0; v < h; v++) for (let u = 0; u < w; u++) { const k = lv(u, w); P(x, L + u, bot - 1 - v, fn ? fn(u, v, k) : rp[k]); } return bot - h; }
// 細的環（比本色暗一階、亮的那邊留亮）
function ring(x, cx, y, w, rp, rows = 1) { tube(x, cx, y + rows, w, rows, rp); }
// 鼻錐：弧形一列一列收（寬度跟箭身同奇偶），顏色照「在箭身的哪一欄」算，陰影才連得起來；shape 給負數（例如 -.8）是比較尖的收法
function nose(x, cx, bot, w, len, rp, shape = 1.6) {
  const L = Lx(cx, w);
  for (let r = 0; r < len; r++) { const t = (r + 1) / len, half = (w / 2) * (shape < 0 ? Math.pow(t, -shape) : Math.pow(1 - Math.pow(1 - t, shape), .5));
    let ww = Math.max(w % 2 ? 1 : 2, Math.round(half * 2)); if ((ww - w) % 2) ww++; ww = Math.min(w, ww); const off = (w - ww) / 2;
    for (let u = 0; u < ww; u++) P(x, L + off + u, bot - len + r, rp[Math.min(4, lv(off + u, w) + (r < 2 ? 0 : 0))]); }
  return bot - len;
}
// 變寬變細的一段（級間段、整流罩下緣）
function taper(x, cx, bot, wb, wt, h, rp) { for (let v = 0; v < h; v++) { let ww = Math.round(wb + (wt - wb) * (h > 1 ? v / (h - 1) : 1)); if ((ww - wb) % 2) ww += wt > wb ? 1 : -1; const L = Lx(cx, ww); for (let u = 0; u < ww; u++) P(x, L + u, bot - 1 - v, rp[lv(u, ww)]); } return bot - h; }
// 噴嘴：喇叭形金屬，上面窄（喉部）、下面寬，最下一列是噴口的亮邊
function nozzle(x, cx, bot, w, h = 3, rp = RP.M) {
  const wb = Math.max(2, w - 2 - (w % 2 ? 1 : 0) + (w <= 4 ? 0 : 0)), wt = Math.max(2, wb - 2);
  for (let v = 0; v < h; v++) { let ww = Math.round(wb + (wt - wb) * (h > 1 ? v / (h - 1) : 1)); if ((ww - wb) % 2) ww--; const L = Lx(cx, ww);
    for (let u = 0; u < ww; u++) P(x, L + u, bot - 1 - v, v === 0 ? rp[Math.min(4, lv(u, ww) + 1)] : rp[Math.max(0, lv(u, ww) - (v === h - 1 ? 1 : 0))]); }
  return bot - h;
}
// 尾翼：左邊受光（亮、前緣更亮）、右邊背光；正面那片是中間一條
function fins(x, cx, bot, w, h, span, rp, sweep = 2, front = true) {
  const L = Lx(cx, w), Rr = L + w;
  poly(x, [[L, bot - h], [L - span, bot - h + sweep + span], [L - span, bot], [L, bot]], rp[3]); lineP(x, L - 1, bot - h + 1, L - span, bot - h + sweep + span, rp[4]); R(x, L - span, bot - 1, span, 1, rp[2]);
  poly(x, [[Rr, bot - h], [Rr + span, bot - h + sweep + span], [Rr + span, bot], [Rr, bot]], rp[1]); lineP(x, Rr, bot - h + 1, Rr + span - 1, bot - h + sweep + span, rp[2]); R(x, Rr, bot - 1, span, 1, rp[0]);
  if (front) { const c = Math.round(cx) - (w % 2 ? 0 : 1); R(x, c, bot - h + 3, 1, h - 3, rp[2]); P(x, c, bot - h + 3, rp[4]); if (!(w % 2)) R(x, c + 1, bot - h + 3, 1, h - 3, rp[1]); }
}
// 燒黑（2026-11-27 第二輪：棋盤格像紙杯、拉鍊）：兩欄一組，從不同高度開始，最上面一格淡、往下越來越深；跟著圓柱的明暗（左邊亮）
function soot(x, cx, bot, w, h) { const L = Lx(cx, w); for (let u = 0; u < w; u++) { const top = Math.round(h * (.62 + .38 * hash((u >> 1) + 11, bot))); for (let v = 0; v < top; v++) { const f = v / top, k = lv(u, w);
  const c = v === top - 1 ? '#c4beb3' : f > .7 ? RP.C[Math.min(4, k + 1)] : f > .4 ? RP.C[Math.max(0, k)] : RP.C[Math.max(0, k - 1)]; P(x, L + u, bot - 1 - v, c); } } }
// 收起來的降落腳：兩側貼著箭身，下面往外撇一格、腳墊
function legs(x, cx, bot, w, h) { const L = Lx(cx, w); R(x, L - 1, bot - h, 1, h - 3, RP.D[3]); R(x, L + w, bot - h, 1, h - 3, RP.D[1]); R(x, L - 2, bot - 3, 1, 3, RP.D[3]); R(x, L + w + 1, bot - 3, 1, 3, RP.D[1]); R(x, L - 3, bot - 1, 2, 1, RP.D[4]); R(x, L + w + 1, bot - 1, 2, 1, RP.D[2]); }
// 柵格翼：一格一格的小方框
function gridFins(x, cx, y, w, side = 0) { const L = Lx(cx, w); if (side <= 0) { R(x, L - 3, y, 3, 3, RP.M[3]); P(x, L - 2, y + 1, RP.M[1]); } if (side >= 0) { R(x, L + w, y, 3, 3, RP.M[1]); P(x, L + w + 1, y + 1, RP.M[0]); } }
// 圓窗：玻璃三階＋外框（外框用箭身暗一階或給的顏色）
function win(x, cx, y, big, frame) { const c = Math.round(cx); if (big) { if (frame) { R(x, c - 2, y - 1, 1, 3, frame); R(x, c + 2, y - 1, 1, 3, frame); R(x, c - 1, y - 2, 3, 1, frame); R(x, c - 1, y + 2, 3, 1, frame); } R(x, c - 1, y - 1, 3, 3, '#2f3e4c'); P(x, c - 1, y - 1, '#9fc0cc'); P(x, c, y - 1, '#5d7a8c'); P(x, c - 1, y, '#5d7a8c'); }
  else { if (frame) { R(x, c - 1, y - 2, 2, 1, frame); R(x, c - 1, y + 1, 2, 1, frame); R(x, c - 2, y - 1, 1, 2, frame); R(x, c + 1, y - 1, 1, 2, frame); } R(x, c - 1, y - 1, 2, 2, '#2f3e4c'); P(x, c - 1, y - 1, '#9fc0cc'); } }
// 影子：從底座往右下（跟其他載具同一個方向），長度約高度的三成、往尖端收窄
function shadowUp(x, cx, b, w, h) { const L = Math.min(h * .32, 26), dx = L * .9, dy = L * .45; poly(x, [[cx - w / 2, b - 1], [cx + w / 2, b - 1], [cx + w * .18 + dx, b - 1 + dy], [cx - w * .18 + dx, b - 1 + dy]], K.shadow); }
// 推進器：噴嘴＋圓柱＋弧形鼻錐，band 是中間一條環
function booster(x, cx, b, w, h, len, rp = RP.W, noseP = rp, band, nz = RP.M) { const y = nozzle(x, cx, b, w, 2, nz); const top = tube(x, cx, y, w, h, rp); if (band) ring(x, cx, y - Math.round(h * .45), w, band); nose(x, cx, top, w, len, noseP); return top; }
// 黑白滾轉標記（左右兩半交錯）
const rollFn = (w, seg) => (u, v, k) => ((Math.floor(v / seg) % 2) ? u < w / 2 : u >= w / 2) ? RP.D[k] : RP.W[k];

// ===== 小型：探空火箭（細細一根、沒有推進器）=====
function s1(x, cx, b) {   // 入門探空火箭
  shadowUp(x, cx, b, 4, 30); const y = nozzle(x, cx, b, 4, 2); const top = tube(x, cx, y, 4, 22, RP.W);
  ring(x, cx, y - 13, 4, RP.S, 2); nose(x, cx, top, 4, 7, RP.S, -.8); fins(x, cx, y, 4, 7, 3, RP.S);
}
function s2(x, cx, b) {   // 雙節探空火箭：下節灰（推完會掉）、深灰級間段、上節白
  shadowUp(x, cx, b, 6, 36); let y = nozzle(x, cx, b, 6, 2); const lb = y; y = tube(x, cx, y, 6, 13, RP.G); fins(x, cx, lb, 6, 8, 4, RP.S);
  y = taper(x, cx, y, 6, 4, 2, RP.D); const up = y; y = tube(x, cx, y, 4, 15, RP.W); ring(x, cx, up - 10, 4, RP.S);
  fins(x, cx, up, 4, 4, 2, RP.G, 1, false); nose(x, cx, y, 4, 7, RP.W);
}
function s3(x, cx, b) {   // 氣象探空火箭：儀器艙一個小窗、頭頂天線
  shadowUp(x, cx, b, 5, 34); let y = nozzle(x, cx, b, 5, 2); y = tube(x, cx, y, 5, 19, RP.W); ring(x, cx, b - 17, 5, RP.N);
  fins(x, cx, b - 2, 5, 6, 3, RP.N);
  const pod = y; y = tube(x, cx, y, 5, 5, RP.G); P(x, cx, pod - 3, '#2f3e4c'); P(x, cx - 1, pod - 3, '#9fc0cc');
  y = nose(x, cx, y, 5, 4, RP.W); R(x, cx, y - 6, 1, 6, RP.M[2]); P(x, cx, y - 7, '#d84a3c');
}
function s4(x, cx, b) {   // 黑白方格探空火箭（V-2）：大尾翼一路伸到噴嘴底下
  shadowUp(x, cx, b, 6, 36); let y = nozzle(x, cx, b, 6, 2); y = tube(x, cx, y, 6, 24, null, rollFn(6, 6));
  fins(x, cx, b, 6, 11, 4, RP.D, 1); nose(x, cx, y, 6, 9, RP.W);
}
function s5(x, cx, b) {   // 朱漆探空火箭「絆號」：全身朱色、白帶金環、金色鼻錐
  shadowUp(x, cx, b, 5, 36); const y = nozzle(x, cx, b, 5, 2, RP.A); const top = tube(x, cx, y, 5, 26, RP.S);
  tube(x, cx, y - 13, 5, 3, RP.W); ring(x, cx, y - 17, 5, RP.A); ring(x, cx, y - 13, 5, RP.A);
  fins(x, cx, y, 5, 7, 3, RP.A); nose(x, cx, top, 5, 8, RP.A, -.7);
}

// ===== 中型：運載火箭（大多有兩顆小推進器）=====
function m1(x, cx, b) {   // 標準運載火箭
  shadowUp(x, cx, b, 16, 66); [-1, 1].forEach(s => booster(x, cx + s * 6, b, 4, 26, 6, RP.W, RP.W, RP.S));
  const y = nozzle(x, cx, b, 8); const top = tube(x, cx, y, 8, 54, RP.W); ring(x, cx, y - 18, 8, RP.S, 2); ring(x, cx, y - 42, 8, RP.S, 2);
  nose(x, cx, top, 8, 12, RP.W); win(x, cx, top + 5, false, RP.W[1]);
}
function m2(x, cx, b) {   // 大整流罩運載火箭：頭比箭身寬、深藍環
  shadowUp(x, cx, b, 16, 66); [-1, 1].forEach(s => booster(x, cx + s * 6, b, 4, 22, 6, RP.W, RP.G));
  let y = nozzle(x, cx, b, 8); y = tube(x, cx, y, 8, 40, RP.W); ring(x, cx, b - 16, 8, RP.N, 2);
  y = taper(x, cx, y, 8, 12, 3, RP.G); const fb = y; y = tube(x, cx, y, 12, 12, RP.W); y = nose(x, cx, y, 12, 12, RP.W);
  for (let v = y + 3; v < fb; v++) P(x, cx, v, RP.W[1]); R(x, cx - 6, fb - 1, 12, 1, RP.W[1]);
}
function m3(x, cx, b) {   // 可回收運載火箭：燒黑、收起來的降落腳、黑色級間段上的柵格翼
  shadowUp(x, cx, b, 8, 70); let y = nozzle(x, cx, b, 8); const s1b = y; y = tube(x, cx, y, 8, 44, RP.W); soot(x, cx, s1b, 8, 18); legs(x, cx, s1b, 8, 11);
  y = tube(x, cx, y, 8, 4, RP.D); gridFins(x, cx, y, 8); y = tube(x, cx, y, 8, 10, RP.W); nose(x, cx, y, 8, 11, RP.W);
}
function m4(x, cx, b) {   // 橘槽運載火箭：橘色燃料槽（槽環）、白色推進器、白色上節
  shadowUp(x, cx, b, 16, 68); [-1, 1].forEach(s => { const t = booster(x, cx + s * 6, b, 4, 30, 7, RP.W); ring(x, cx + s * 6, b - 6, 4, RP.D); ring(x, cx + s * 6, t + 1, 4, RP.D); });
  let y = nozzle(x, cx, b, 8); const tb = y; y = tube(x, cx, y, 8, 44, RP.O, (u, v, k) => (v % 8 === 7) ? RP.O[Math.max(0, k - 1)] : RP.O[k]);
  y = taper(x, cx, y, 8, 6, 2, RP.G); y = tube(x, cx, y, 6, 12, RP.W); ring(x, cx, y + 4, 6, RP.S); nose(x, cx, y, 6, 10, RP.W);
}
function m5(x, cx, b) {   // 夜空藍運載火箭：深藍配金環、金鼻錐、金框圓窗
  shadowUp(x, cx, b, 16, 66); [-1, 1].forEach(s => booster(x, cx + s * 6, b, 4, 26, 6, RP.N, RP.A, RP.A, RP.A));
  const y = nozzle(x, cx, b, 8, 3, RP.A); const top = tube(x, cx, y, 8, 52, RP.N); [9, 27, 45].forEach(d => ring(x, cx, y - d, 8, RP.A));
  nose(x, cx, top, 8, 12, RP.A); win(x, cx, top + 6, true, RP.A[2]);
}

// ===== 大型：重型火箭 =====
function l1(x, cx, b) {   // 四推進器重型火箭（發射台參階那一枚）：前排兩顆＋後排兩顆露出鼻錐，深灰環
  shadowUp(x, cx, b, 24, 100);
  const RG = RP.G.map((c, i) => RP.G[Math.max(0, i - 1)]);   // 後排在陰影裡，整組暗一階
  [-1, 1].forEach(s => booster(x, cx + s * 7, b, 6, 55, 9, RG, RG));
  [-1, 1].forEach(s => { booster(x, cx + s * 9, b, 6, 46, 9, RP.W, RP.W, RP.D); const L = Lx(cx + s * 9, 6), o = s < 0 ? L : L + 6; poly(x, [[o, b - 8], [o + s * 2, b - 4], [o + s * 2, b - 2], [o, b - 2]], s < 0 ? RP.W[3] : RP.W[1]); });
  const y = nozzle(x, cx, b, 12); const top = tube(x, cx, y, 12, 84, RP.W); [.25, .5, .75].forEach(f => ring(x, cx, y - Math.round(84 * f), 12, RP.D, 3));
  nose(x, cx, top, 12, 17, RP.W); win(x, cx, top + 7, true, RP.W[1]);
}
function l2(x, cx, b) {   // 三芯重型火箭：三根一樣的芯，兩邊有圓錐頭、柵格翼、降落腳；中間的有整流罩
  shadowUp(x, cx, b, 24, 104);
  [-1, 1].forEach(s => { const c = cx + s * 8; let y = nozzle(x, c, b, 8, 2); const bb = y; y = tube(x, c, y, 8, 62, RP.W); soot(x, c, bb, 8, 20); legs(x, c, bb, 8, 10); ring(x, c, y + 3, 8, RP.D, 3); gridFins(x, c, y + 3, 8, s); nose(x, c, y, 8, 11, RP.W); });
  let y = nozzle(x, cx, b, 8, 2); const bb = y; y = tube(x, cx, y, 8, 62, RP.W); soot(x, cx, bb, 8, 20);
  y = tube(x, cx, y, 8, 4, RP.D); y = tube(x, cx, y, 8, 14, RP.W); y = taper(x, cx, y, 8, 10, 2, RP.G); y = tube(x, cx, y, 10, 10, RP.W); nose(x, cx, y, 10, 11, RP.W);
}
function l3(x, cx, b) {   // 多節重型火箭（最高）：三節、黑白滾轉標記、大尾翼；頂端是轉接段＋服務艙＋指揮艙＋逃逸塔
  shadowUp(x, cx, b, 14, 112);
  [-4, 0, 4].forEach(d => nozzle(x, cx + d, b, 4, 3));
  let y = b - 3; const s1b = y; y = tube(x, cx, y, 14, 36, RP.W, (u, v, k) => v < 10 ? rollFn(14, 5)(u, v, k) : RP.W[k]); ring(x, cx, y + 2, 14, RP.D, 2);
  fins(x, cx, s1b, 14, 10, 4, RP.D, 1, false);
  y = taper(x, cx, y, 14, 12, 3, RP.W); y = tube(x, cx, y, 12, 28, RP.W); ring(x, cx, y + 3, 12, RP.D, 3);
  y = taper(x, cx, y, 12, 10, 3, RP.W); const s3b = y; y = tube(x, cx, y, 10, 18, RP.W, (u, v, k) => v < 6 ? rollFn(10, 3)(u, v, k) : RP.W[k]);
  y = tube(x, cx, y, 10, 2, RP.W); y = tube(x, cx, y, 8, 2, RP.W); y = tube(x, cx, y, 6, 4, RP.G); y = nose(x, cx, y, 6, 4, RP.W, 1);
  const c0 = Math.round(cx) - 1; R(x, c0, y - 3, 1, 3, RP.M[2]); R(x, c0, y - 6, 2, 3, RP.M[3]); P(x, c0 + 1, y - 6, RP.M[1]); P(x, c0, y - 7, '#d84a3c');
}
function l4(x, cx, b) {   // 太空梭：橘色外燃料槽、兩根白色固體推進器、軌道器（背面朝我們）
  shadowUp(x, cx, b, 26, 100);
  const ty = tube(x, cx, b - 6, 10, 74, RP.O, (u, v, k) => (v % 9 === 8) ? RP.O[Math.max(0, k - 1)] : RP.O[k]); nose(x, cx, ty, 10, 15, RP.O, 1.4);
  [-1, 1].forEach(s => { const c = cx + s * 8; const t = booster(x, c, b, 4, 68, 8, RP.W, RP.W, null); ring(x, c, b - 6, 4, RP.D); ring(x, c, t + 3, 4, RP.D); });
  // 三角翼：受光的左翼亮、右翼暗，邊緣用同色系
  poly(x, [[cx - 13, b - 5], [cx, b - 5], [cx, b - 32], [cx - 4, b - 32]], RP.W[3]); poly(x, [[cx + 13, b - 5], [cx, b - 5], [cx, b - 32], [cx + 4, b - 32]], RP.W[1]);
  lineP(x, cx - 13, b - 5, cx - 4, b - 32, RP.W[4]); lineP(x, cx + 13, b - 5, cx + 4, b - 32, RP.G[0]); R(x, cx - 13, b - 5, 26, 1, RP.G[1]);
  [-3, 0, 3].forEach(d => nozzle(x, cx + d, b - 1, 3, 3));
  let y = tube(x, cx, b - 4, 8, 48, RP.W); R(x, Math.round(cx) - 1, b - 18, 1, 13, RP.G[2]); P(x, Math.round(cx) - 1, b - 18, RP.W[4]);
  y = nose(x, cx, y, 8, 10, RP.D, 1.3); R(x, cx - 3, y + 9, 6, 1, '#2f3e4c'); P(x, cx - 2, y + 9, '#9fc0cc');
}
function l5(x, cx, b) {   // 金箔重型火箭：上段包金箔、金鼻錐、金環
  shadowUp(x, cx, b, 24, 100); [-1, 1].forEach(s => { const t = booster(x, cx + s * 9, b, 6, 44, 9, RP.W, RP.A, null, RP.A); ring(x, cx + s * 9, b - 22, 6, RP.A, 2); });
  let y = nozzle(x, cx, b, 12, 3, RP.A); y = tube(x, cx, y, 12, 60, RP.W); ring(x, cx, b - 18, 12, RP.A, 2); ring(x, cx, b - 41, 12, RP.A, 2);
  // 金箔：金色五階的圓柱（平順），上面幾條斜的皺摺（亮一階、暗一階），不是亂點
  const fb = y; y = tube(x, cx, y, 12, 22, RP.A); const Lf = Lx(cx, 12);
  [[1, 4, 4], [2, 12, 5], [6, 17, 4], [3, 19, 3]].forEach(([u, v, n]) => { for (let i = 0; i < n; i++) if (u + i < 11) P(x, Lf + u + i, fb - 1 - v + i, RP.A[Math.min(4, lv(u + i, 12) + 1)]); });
  [[5, 8, 4], [7, 2, 3]].forEach(([u, v, n]) => { for (let i = 0; i < n; i++) if (u + i < 12) P(x, Lf + u + i, fb - 1 - v + i, RP.A[Math.max(0, lv(u + i, 12) - 1)]); });
  ring(x, cx, fb, 12, RP.S); const nb = y; nose(x, cx, nb, 12, 17, RP.W);
  { const L = Lx(cx, 12); for (let r = 0; r < 8; r++) { const t = (r + 1) / 17, half = 6 * Math.pow(1 - Math.pow(1 - t, 1.6), .5); let ww = Math.max(2, Math.round(half * 2)); if (ww % 2) ww++; const off = (12 - ww) / 2; for (let u = 0; u < ww; u++) P(x, L + off + u, nb - 17 + r, RP.A[lv(off + u, 12)]); } }
}

const SMALL = [['入門探空火箭', '白身朱鼻、三片尾翼；最便宜', s1], ['雙節探空火箭', '下面一節推完會掉、上面再飛', s2], ['氣象探空火箭', '頭上有天線、儀器艙兩個小窗', s3], ['黑白方格探空火箭', '經典的黑白方格塗裝', s4], ['朱漆探空火箭', '「絆號」：全身朱色、金色鼻錐', s5]];
const MID = [['標準運載火箭', '兩顆小推進器、有舷窗', m1], ['大整流罩運載火箭', '頭特別大，裝得下大衛星', m2], ['可回收運載火箭', '柵格翼＋收起來的降落腳，底部燒黑', m3], ['橘槽運載火箭', '橘色燃料槽、白色推進器', m4], ['夜空藍運載火箭', '深藍配金環、金鼻錐', m5]];
const BIG = [['四推進器重型火箭', '發射台參階那一枚；後面還有兩顆推進器', l1], ['三芯重型火箭', '三根一樣的芯並排，兩邊會飛回來降落', l2], ['多節重型火箭', '三節一路變細、黑白方格；最高', l3], ['太空梭', '橘色大燃料槽＋兩根推進器，三角翼', l4], ['金箔重型火箭', '上段包金箔、金鼻錐；重型裡最貴', l5]];

function sky(x, W, H, seed) {
  const base = H - 9;
  for (let j = 0; j < base; j++) { const t = j / base; for (let i = 0; i < W; i++) { const n = hash(i + seed, j); P(x, i, j, n > .992 ? '#eef4f4' : t < .33 ? '#a9c6cf' : t < .66 ? '#bad2d8' : '#cadde0'); } }
  for (let j = base; j < H; j++) for (let i = 0; i < W; i++) { const n = hash(i + seed, j); P(x, i, j, n > .93 ? K.conc2 : n < .05 ? K.conc3 : K.conc); }
  R(x, 0, base, W, 1, K.conc3);
}
function sheetRk(box, list, cols, rowH) {
  const el = document.getElementById(box), c = document.createElement('canvas'); c.width = 150; c.height = rowH; el.appendChild(c);
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; sky(x, 150, rowH, box.length * 13);
  const colW = 150 / cols;
  for (let k = 1; k < cols; k++) for (let j = 2; j < rowH - 10; j++) if (j % 3 !== 2) P(x, Math.round(k * colW), j, 'rgba(255,255,255,.35)');
  list.forEach(([, , draw], k) => draw(x, Math.round(k * colW + colW / 2) - 2, rowH - 9));
  const lab = document.createElement('div'); lab.className = 'labels'; lab.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  lab.innerHTML = list.map(([n, note]) => `<div><b>${n}</b><span>${note}</span></div>`).join(''); el.appendChild(lab);
}
sheetRk('rSmall', SMALL, 5, 58); sheetRk('rMid', MID, 5, 90); sheetRk('rBig1', BIG.slice(0, 3), 3, 128); sheetRk('rBig2', BIG.slice(3), 2, 128);
