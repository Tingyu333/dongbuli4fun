<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="utf-8"><title>公司・開　另外六個角色</title>
<style>
body { margin: 0; background: #e4e2dd; font-family: "Noto Sans TC", sans-serif; color: #26303a; }
.wrap { display: inline-block; padding: 22px 26px 26px; background: #f2f6f8; }
h1 { font-size: 17px; font-weight: 500; letter-spacing: .15em; margin: 0 0 4px; } p { font-size: 13px; margin: 0 0 12px; color: #56677a; }
.row { display: flex; gap: 18px; align-items: flex-start; }
.col h2 { font-size: 13px; font-weight: 500; letter-spacing: .3em; color: #56677a; margin: 0 0 6px; }
canvas { image-rendering: pixelated; display: block; border-radius: 10px; }
#a { width: 375px; height: 220px; } #b { width: 1125px; height: 660px; }
.names { display: grid; grid-template-columns: repeat(3, 375px); margin-top: 8px; font-size: 13px; letter-spacing: .15em; text-align: center; }
.names small { display: block; font-size: 12px; color: #56677a; letter-spacing: .03em; margin: 2px 0 8px; }
</style></head><body><div class="wrap">
<h1>另外六個角色（照前三隻的做法）</h1>
<p>每隻一個動作、一個自己的小窩、平塗＋一階陰影、五官小小擠在下面。左邊小圖只看剪影。</p>
<div class="row">
  <div class="col"><h2>剪影</h2><canvas id="a" width="375" height="220"></canvas></div>
  <div class="col"><h2>平塗</h2><canvas id="b" width="375" height="220"></canvas>
    <div class="names">
      <div>蘋果鴨<small>站在蛋糕架上，翅膀端著一塊蛋糕</small></div>
      <div>浣熊大王<small>坐在一堆金幣上，咬著金幣比讚</small></div>
      <div>青江菜船長<small>泡在一杯水裡，敬禮</small></div>
      <div>店貓<small>窩在文件盤裡，把筆推下桌</small></div>
      <div>坐洗部的狗<small>坐在洗頭盆裡，頭頂泡泡、搖尾巴</small></div>
      <div>鼴鼠<small>從插滿筆的筆筒鑽出來，頭燈亮著</small></div>
    </div>
  </div>
</div>
</div>
<script>
const W = 375, H = 220, S = 1.35;
const C = { ink0: '#1c2229', ink2: '#3a4656', ink3: '#56677a', g1: '#7a8c9d', g2: '#9fb1c0', g3: '#c2d0da', g4: '#e6ecf0', g5: '#f2f6f8', wh: '#ffffff',
  sky1: '#c3d8e4', sky3: '#e2edf2', city: '#a3bccb', cy0: '#4fa9bf', cy: '#8fd3e0', cy2: '#c9f0f6', b0: '#2b5290', b1: '#3d6fb6', b2: '#7fa8e6',
  o0: '#8a4f1c', o1: '#c97a2e', o2: '#f0a04b', o3: '#ffd08a', au0: '#8a5a14', au1: '#e2b44a', au2: '#ffe9a0', gr0: '#2f6e47', gr1: '#3f8a5a', gr2: '#6cb487',
  pk2: '#f8c3bc', pink: '#f08a80', red: '#d8433a', red0: '#6e2418', red2: '#a82c25', redh: '#ff8a7a',
  // 蘋果鴨
  y1: '#ffd95a', y2: '#f0b93a', y0: '#a8741c',
  // 浣熊大王
  rg: '#aaa7b1', rg2: '#87848f', rg0: '#4f4c56', mask: '#3a3840', fur: '#f7f3ea', cape: '#a83632', cape2: '#82261f', cape0: '#4e1512', vel: '#c4504a', vel2: '#97342f',
  // 青江菜船長
  lf: '#2f7d3a', lf2: '#256b31', lf0: '#16461e', vein: '#7cbf5a', st: '#e6f3d8', st2: '#c5e2aa', st0: '#6f9a55',
  // 店貓
  ct: '#eeac63', ct2: '#d58a42', ct0: '#8f5524', cts: '#bb6a2c', cw: '#f7ead8',
  // 坐洗部的狗
  cr: '#fdf0d6', cr2: '#ead1a0', cr0: '#a8874f', ear: '#d9b47a', ear2: '#b48a52', bub0: '#96b9d7', tub: '#b5d2e6', tub2: '#8fb5d1', tub0: '#4f7894',
  // 鼴鼠
  rw: '#b4aba7', rw2: '#968b88', rw0: '#5a504e', soot: '#6f6566',
  pu: '#7c5cae', pu2: '#5f4490', pu0: '#36245a', puh: '#a68ad6', mt: '#a6d8c8', mt2: '#7fbfac', mt0: '#3f7f6c',
  br: '#8f6a56', br2: '#6e4f40', br0: '#3a271e', brl: '#b8957f', hat: '#f2c230', hat2: '#cc9c1e', hat0: '#7a5a10', mpk: '#f39aa8' };
// 每個顏色的外框（同色系深一階）
const OLC = { [C.wh]: C.g2, [C.y1]: C.y0, [C.y2]: C.y0, [C.red]: C.red0, [C.red2]: C.red0, [C.redh]: C.red0, [C.gr1]: C.gr0, [C.b1]: C.b0, [C.o2]: C.o0, [C.o1]: C.o0,
  [C.rg]: C.rg0, [C.rg2]: C.rg0, [C.mask]: C.rg0, [C.fur]: C.rg0, [C.cape]: C.cape0, [C.cape2]: C.cape0, [C.au1]: C.au0, [C.au2]: C.au0,
  [C.lf]: C.lf0, [C.lf2]: C.lf0, [C.st]: C.st0, [C.st2]: C.st0, [C.ct]: C.ct0, [C.ct2]: C.ct0, [C.cw]: C.ct0, [C.cr]: C.cr0, [C.cr2]: C.cr0, [C.ear]: C.cr0, [C.ear2]: C.cr0,
  [C.br]: C.br0, [C.br2]: C.br0, [C.brl]: C.br0, [C.hat]: C.hat0, [C.hat2]: C.hat0, [C.pk2]: C.pink, [C.mpk]: C.red2, [C.pu]: C.pu0, [C.rw]: C.rw0, [C.rw2]: C.rw0, [C.mt]: C.mt0 };

function scene(X, sil) {
  const R = (a, b, w, h, col) => { X.fillStyle = col; X.fillRect(Math.round(a), Math.round(b), Math.round(w), Math.round(h)); };
  const px = (a, b, col) => R(a, b, 1, 1, col);
  const N = (a, b, w, h, col) => R(a, b, w, h, sil ? C.g3 : col);   // 小窩、道具：剪影版一律淡灰
  const el = (cx, cy, rx, ry, col, th = 0) => { const cs = Math.cos(th), sn = Math.sin(th), m = Math.max(rx, ry) + 1; for (let j = Math.floor(cy - m); j <= cy + m; j++) for (let i = Math.floor(cx - m); i <= cx + m; i++) { const dx = i + .5 - cx, dy = j + .5 - cy, u = (dx * cs + dy * sn) / rx, v = (-dx * sn + dy * cs) / ry; if (u * u + v * v <= 1) R(i, j, 1, 1, sil ? C.g3 : col); } };
  const Lay = () => new Array(W * H).fill(null);
  const lp = (L, a, b, col) => { a = Math.round(a); b = Math.round(b); if (a >= 0 && b >= 0 && a < W && b < H) L[b * W + a] = col; };
  const lel = (L, cx, cy, rx, ry, col, th = 0, only) => { const m = Math.max(rx, ry) + 1, cs = Math.cos(th), sn = Math.sin(th);
    for (let j = Math.floor(cy - m); j <= cy + m; j++) for (let i = Math.floor(cx - m); i <= cx + m; i++) { const dx = i + .5 - cx, dy = j + .5 - cy, u = (dx * cs + dy * sn) / rx, v = (-dx * sn + dy * cs) / ry;
      if (u * u + v * v <= 1 && i >= 0 && j >= 0 && i < W && j < H && (!only || L[j * W + i] === only)) L[j * W + i] = col; } };
  const lpoly = (L, pts, col, only) => { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    for (let j = Math.floor(Math.min(...ys)); j <= Math.max(...ys); j++) for (let i = Math.floor(Math.min(...xs)); i <= Math.max(...xs); i++) { const x = i + .5, y = j + .5; let inside = false;
      for (let k = 0, l = pts.length - 1; k < pts.length; l = k++) { const [xi, yi] = pts[k], [xj, yj] = pts[l]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside; }
      if (inside && i >= 0 && j >= 0 && i < W && j < H && (!only || L[j * W + i] === only)) L[j * W + i] = col; } };
  const outline = (L, force) => { const add = [];
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) { if (L[j * W + i]) continue; let col = null;
      for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) { const ni = i + dx, nj = j + dy; if (ni < 0 || nj < 0 || ni >= W || nj >= H) continue; const n = L[nj * W + ni]; if (n) { col = OLC[n] || C.ink2; if (dy === -1) break; } }
      if (col) add.push([i, j, force || col]); }
    add.forEach(([i, j, col]) => L[j * W + i] = col); };
  const blit = (L, maxY = H) => { for (let k = 0; k < W * H; k++) if (L[k] && ((k / W) | 0) < maxY) R(k % W, (k / W) | 0, 1, 1, sil ? C.ink2 : L[k]); };
  const mk = (cx, by, S = 1.35) => { const L = Lay(); return { L,
    E: (a, b, rx, ry, col, th, only) => lel(L, cx + a * S, by + b * S, rx * S, ry * S, col, th, only),
    PG: (pts, col, only) => lpoly(L, pts.map(([a, b]) => [cx + a * S, by + b * S]), col, only),
    at: (a, b) => [Math.round(cx + a * S), Math.round(by + b * S)] }; };
  const F = (L, x0, y0, pts, col) => { if (!sil) pts.forEach(([a, b]) => lp(L, x0 + a, y0 + b, col)); };   // 五官：剪影版不畫
  const bean = (L, x0, y0, h = 3) => { for (let j = 0; j < h; j++) { F(L, x0, y0 + j, [[0, 0], [1, 0]], C.ink0); } F(L, x0, y0, [[0, 0]], C.wh); };

  // ---------- 背景：兩排辦公室（同一個戊的窗、桌） ----------
  for (const y0 of [0, 110]) {
    R(0, y0, W, 110, C.g4); R(0, y0 + 6, W, 48, C.sky1);
    for (let i = 0; i < W; i += 125) { R(i + 8, y0 + 22, 20, 32, C.city); R(i + 34, y0 + 30, 26, 24, C.sky3); R(i + 66, y0 + 14, 18, 40, C.city); R(i + 90, y0 + 34, 24, 20, C.sky3); R(i + 123, y0 + 6, 2, 48, C.g5); }
    R(0, y0 + 54, W, 2, C.g5); R(0, y0 + 56, W, 1, C.g3);
    [66, 188, 310].forEach(cx => { const dy = y0 + 92; R(cx - 52, dy, 104, 1, C.wh); R(cx - 52, dy + 1, 104, 3, sil ? C.g3 : C.cy2); R(cx - 52, dy + 4, 104, 1, C.g2); R(cx - 46, dy + 5, 2, 13, C.g2); R(cx + 44, dy + 5, 2, 13, C.g2); });
  }
  R(0, 109, W, 1, C.g3);

  // ================= 第一排 =================
  // ---- 蘋果鴨：甜點店老闆，站在高腳蛋糕架上，穿白圍裙、有小腳（不像洗澡的小黃鴨），翅膀托著一盤草莓蛋糕 ----
  { const cx = 62, dy = 92;
    N(cx - 14, dy - 1, 28, 1, C.g3);
    N(cx - 9, dy - 2, 18, 1, C.g2); N(cx - 7, dy - 3, 14, 1, C.g4); N(cx - 2, dy - 10, 4, 7, C.g4); N(cx + 1, dy - 10, 1, 7, C.g3);   // 高腳蛋糕架的腳
    N(cx - 23, dy - 13, 46, 1, C.au1); N(cx - 22, dy - 12, 44, 2, C.wh); N(cx - 22, dy - 10, 44, 1, C.g3); N(cx - 18, dy - 9, 36, 1, C.g2);   // 盤子＋金邊
    if (!sil) for (let i = cx - 20; i < cx + 21; i += 4) px(i, dy - 11, C.pk2);
    const SA = 1.18, by = dy - 13, { L, E, PG, at } = mk(cx, by, SA);   // 小一號（妹妹：「比別人大一號、黃色很搶眼」）
    E(-3, .3, 2.4, 1, C.o2); E(5, .3, 2.4, 1, C.o2);                                                         // 小腳丫
    E(4, -7, 11, 7, C.y1); E(14, -10, 4, 2, C.y1, -.6); E(16.5, -12.5, 1.8, 1.2, C.y1, -1);                  // 身體、翹尾巴
    E(-5, -18.5, 9, 8.5, C.y1);                                                                             // 頭
    E(-14.5, -17.5, 3.2, 1.5, C.o2, .08); E(-13.8, -15.6, 2.6, 1, C.o1, .08);                               // 小小的嘴
    E(8, -2.5, 9, 2.6, C.y2, 0, C.y1);
    E(-1, -6.5, 5.5, 5, C.wh, 0, C.y1); E(-1, -11.2, 5, 1, C.wh, 0, C.y1);                                  // 白圍裙
    E(-3, -10.5, 4.5, 1.3, C.b1, .1);                                                                        // 藍緞帶
    E(-4, -30, 5, 4.6, C.red); E(-6, -31.5, 1.6, 1.3, C.redh, 0, C.red); E(-1.5, -27.5, 3.2, 1.6, C.red2, -.3, C.red);
    E(-2, -36, 2.4, 1.1, C.gr1, -.5);
    outline(L);
    const [ax, ay] = at(-4, -34.5); F(L, ax, ay, [[0, 0], [0, 1], [0, 2]], C.red0);
    const [ex, ey] = at(-6.5, -19.5); bean(L, ex - 3, ey); bean(L, ex + 3, ey);
    F(L, ex - 5, ey + 4, [[0, 0], [1, 0]], C.pink); F(L, ex + 5, ey + 4, [[0, 0], [1, 0]], C.pink);
    const [fx, fy] = at(-1, -2.5); F(L, fx - 6, fy, [[0, 0], [2, 1], [4, 1], [6, 1], [8, 1], [10, 0]], C.pk2);   // 圍裙的花邊
    blit(L, dy - 12);
    const Wg = Lay(); { const [a, b] = at(10.5, -15.5); lel(Wg, a, b, 2.4 * SA, 6.5 * SA, C.y1, -.15); lel(Wg, a + 1, b + 3, 1.4 * SA, 3 * SA, C.y2, -.15, C.y1); outline(Wg); blit(Wg, dy - 12); }   // 舉起來托盤子的翅膀（另一層、整圈描邊才看得出來）
    // 翅膀上托著的盤子＋蛋糕
    const Kc = Lay(), [kx, ky] = at(11.8, -22.5);
    lel(Kc, kx, ky, 6.5, 1.4, C.wh); lpoly(Kc, [[kx - 4, ky - 1], [kx + 5, ky - 1], [kx + 5, ky - 6]], C.wh); for (let i = kx - 3; i <= kx + 4; i++) lp(Kc, i, ky - 3, C.pk2); lp(Kc, kx + 4, ky - 5, C.pk2);
    outline(Kc); lel(Kc, kx + 3, ky - 8, 1.6, 1.6, C.red); lp(Kc, kx + 3, ky - 10, C.gr1); lp(Kc, kx + 2, ky - 9, C.redh); blit(Kc, dy);
  }
  // ---- 浣熊大王（第三版，妹妹：「現在是乖，還沒到想捏」）：頭大身小圓滾滾、暖灰、小熊貓那種小眼罩、
  //      下巴抬高瞇眼壞笑（酷洛米的「哼～我最棒」）、金幣咬在嘴角露一顆門牙、另一手比讚、屁股下壓一堆金幣、整件紅披風＋白毛領、臉頰沾煤灰 ----
  { const cx = 188, dy = 92;
    N(cx - 24, dy - 1, 48, 1, C.g3);
    el(cx, dy - 5, 23, 4.5, C.pu0); el(cx, dy - 5, 22, 3.6, C.pu); el(cx + 2, dy - 3.5, 20, 1.6, C.pu2); el(cx - 8, dy - 7, 8, .8, C.puh);
    [[-22, -3], [22, -3]].forEach(([a, b]) => { N(cx + a - 1, dy + b, 2, 3, C.au1); N(cx + a - 1, dy + b + 3, 2, 1, C.au0); });
    el(cx, dy - 9, 15, 3, C.au0); el(cx, dy - 9.6, 14, 2.2, C.au1);                                        // 屁股下一堆金幣
    [[-13, -10], [-8, -12], [12, -10], [7, -12.5], [-2, -12.5]].forEach(([a, b]) => { el(cx + a, dy + b, 3, 1.3, C.au0); el(cx + a, dy + b - .4, 2.4, .8, C.au2); });
    if (!sil) [[-17, -15], [16, -16]].forEach(([a, b]) => { px(cx + a, dy + b, C.wh); px(cx + a - 1, dy + b, C.au2); px(cx + a + 1, dy + b, C.au2); px(cx + a, dy + b - 1, C.au2); px(cx + a, dy + b + 1, C.au2); });
    const by = dy - 11, { L, E, PG, at } = mk(cx, by);
    E(12, -7, 3, 6.2, C.rw, -.95); [[14, -10], [11, -6.2]].forEach(([a, b]) => E(a, b, 1.4, 3.3, C.mask, -.95, C.rw));   // 條紋尾巴
    E(0, -6.5, 10, 7.5, C.cape); E(5, -3, 5, 4, C.cape2, 0, C.cape);                                       // 整件紅披風
    E(0, -5.5, 7.5, 6, C.rw); E(0, -4.5, 4.6, 3.8, C.fur, 0, C.rw);                                         // 圓滾滾的小肚子
    E(-3.8, .2, 2.4, 1.5, C.rw); E(3.8, .2, 2.4, 1.5, C.rw);                                                 // 伸出來的兩隻小腳
    E(7.3, -6.5, 2, 2.3, C.rw);                                                                              // 叉腰的手
    E(0, -12, 9.5, 2.4, C.fur);                                                                              // 白毛領
    E(-8.5, -30.5, 3.2, 3.2, C.rw); E(8.5, -30.5, 3.2, 3.2, C.rw); E(-8.5, -30, 1.6, 1.6, C.rw2, 0, C.rw); E(8.5, -30, 1.6, 1.6, C.rw2, 0, C.rw);
    E(0, -22, 12, 10, C.rw, -.08);                                                                           // 大大的頭，下巴抬高一點
    E(-4.8, -23.3, 3.1, 2.3, C.mask, .1, C.rw); E(4.8, -23.6, 3.1, 2.3, C.mask, -.1, C.rw);                 // 小熊貓那種圓圓的小眼罩（不斜，才不會像生氣的眉毛）
    E(0, -18.8, 4.8, 3, C.fur, -.08, C.rw);
    E(6, -16, 4, 2.5, C.rw2, 0, C.rw);
    PG([[2, -30.5], [2, -35], [4.3, -33], [6.5, -37], [8.6, -33.2], [11, -34.6], [10.6, -30]], C.au1);     // 小皇冠，歪歪戴在一邊
    outline(L);
    const [kr, kq] = at(6.5, -33.5); F(L, kr - 3, kq + 1, [[0, 0]], C.red); F(L, kr, kq - 1, [[0, 0]], C.b1); F(L, kr + 3, kq, [[0, 0]], C.gr1);
    [[-6, -1.5], [-2, -2], [2, -2], [6, -1.5]].forEach(([a, b]) => { const [p, q] = at(a, b - 10.5); F(L, p, q, [[0, 0]], C.ink2); });
    [[-4.8, -23.3], [4.8, -23.6]].forEach(([a, b]) => { const [p, q] = at(a, b); F(L, p - 2, q, [[0, 0], [1, -1], [2, -1], [3, 0]], C.wh); });   // 眼罩正中間瞇成彎彎的得意眼（^ ^）
    const [ex, ey] = at(0, -24);
    F(L, ex - 1, ey + 4, [[0, 0], [1, 0]], C.ink0);
    F(L, ex - 3, ey + 7, [[0, 0], [1, 0], [2, 0], [3, -1], [4, -1]], C.ink2); F(L, ex + 1, ey + 8, [[0, 0]], C.wh);   // 斜斜的壞笑、一顆門牙
    F(L, ex - 10, ey + 5, [[0, 0], [2, 1], [1, 2]], C.soot);                                                 // 臉頰的煤灰
    F(L, ex - 7, ey + 4, [[0, 0], [1, 0]], C.pk2); F(L, ex + 6, ey + 4, [[0, 0], [1, 0]], C.pk2);
    blit(L, dy);
    const Cn = Lay(), [kx, ky] = at(4.8, -17.3);                                                             // 咬在嘴角的金幣
    lel(Cn, kx, ky, 2.6, 3.2, C.au1, .3); outline(Cn); lel(Cn, kx, ky, 1.3, 1.8, C.au2, .3, C.au1); lp(Cn, kx - 1, ky - 2, C.wh); blit(Cn, dy);
    const Th = Lay(), [tx, ty] = at(-9.5, -10);                                                              // 另一手比讚
    lel(Th, tx, ty, 2.8, 2.5, C.rw); lel(Th, tx + .3, ty - 4, 1.4, 2.6, C.rw, -.15); outline(Th); blit(Th, dy);
    if (!sil) { const sx = kx + 5, sy = ky - 4; px(sx, sy, C.wh); px(sx - 1, sy, C.au2); px(sx + 1, sy, C.au2); px(sx, sy - 1, C.au2); px(sx, sy + 1, C.au2); }
  }
  // ---- 青江菜船長：泡在一杯水裡，一片葉子舉到帽簷敬禮，生氣的粗眉 ----
  { const cx = 310, dy = 92;
