<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="utf-8"><title>公司・開　五間辦公室（戊）</title>
<style>
body { margin: 0; background: #e4e2dd; font-family: "Noto Sans TC", sans-serif; color: #26303a; }
.wrap { display: inline-block; padding: 22px 26px 26px; background: #f2f6f8; }
h1 { font-size: 17px; font-weight: 500; letter-spacing: .15em; margin: 0 0 4px; } p { font-size: 13px; margin: 0 0 14px; color: #56677a; }
.grid { display: grid; grid-template-columns: repeat(2, 750px); gap: 18px 22px; }
.cell h2 { font-size: 14px; font-weight: 500; letter-spacing: .2em; margin: 0 0 6px; } .wide { grid-column: span 2; } .scroll { position: relative; width: 1500px; } .scroll canvas { width: 1500px; height: 380px; } .view { position: absolute; left: 0; top: 0; width: 750px; height: 380px; border: 3px solid #4fa9bf; border-radius: 12px; box-sizing: border-box; pointer-events: none; } .view span { position: absolute; right: 8px; top: 8px; background: rgba(28,34,41,.7); color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 6px; letter-spacing: .1em; }
.cell h2 small { font-size: 12px; color: #56677a; letter-spacing: .05em; margin-left: 8px; }
canvas { image-rendering: pixelated; width: 750px; height: 380px; display: block; border-radius: 12px; }
</style></head><body><div class="wrap">
<h1>五間辦公室（戊・現代像素）</h1>
<p>每升一階換一間，座位跟著人數上限（3／5／8／12／20），門口的銘牌也一路升級。車庫的吊燈每次搬家都帶著走。第二版照妹妹的意見：後面三間加木頭、暖燈、地毯，每間補一兩樣生活小東西。</p>
<div class="grid">
  <div class="cell"><h2>一　車庫創業<small>3 人・紙名片</small></h2><canvas id="s1" width="375" height="190"></canvas></div>
  <div class="cell"><h2>二　小辦公室<small>5 人・木牌</small></h2><canvas id="s2" width="375" height="190"></canvas></div>
  <div class="cell"><h2>三　整層樓<small>8 人・拉絲銀牌</small></h2><canvas id="s3" width="375" height="190"></canvas></div>
  <div class="cell"><h2>四　二十七樓整層<small>12 人・黑底金字</small></h2><canvas id="s4" width="375" height="190"></canvas></div>
  <div class="cell wide"><h2>五　自己的大樓<small>20 人・黑漆金框・太寬了，手機上左右滑</small></h2><div class="scroll"><canvas id="s5" width="750" height="190"></canvas><div class="view"><span>手機一次看到這麼多　左右滑</span></div></div></div>
</div>
</div>
<script>
const W = 375, H = 190;
const C = { ink0: '#1c2229', ink: '#26303a', ink2: '#3a4656', ink3: '#56677a', g1: '#7a8c9d', g2: '#9fb1c0', g3: '#c2d0da', g4: '#e6ecf0', g5: '#f2f6f8', wh: '#ffffff',
  sky1: '#c3d8e4', sky2: '#d3e3eb', sky3: '#e2edf2', c1: '#a3bccb', c2: '#869fb1', c3: '#c3d6e1', cy0: '#4fa9bf', cy: '#8fd3e0', cy2: '#c9f0f6',
  b0: '#2b5290', b1: '#3d6fb6', au0: '#8a5a14', au1: '#e2b44a', au2: '#ffe9a0', gr0: '#2f6e47', gr1: '#3f8a5a', gr2: '#6cb487',
  kr: '#e8d6b0', kr2: '#c9ad7c', kr0: '#8f7448', wd: '#c99a68', wd2: '#a77a4c', wd0: '#5e4026', rg: '#e9d8bf', rg2: '#d6bf9d', rg3: '#c98f6b', pk: '#f08a80', yl: '#f2c94c', cn: '#b9bcbd', cn2: '#a2a6a8', cn3: '#cfd2d2',
  bk: '#1f2228', bk2: '#2c3038', red: '#d8433a', warm: '#f4dfa8', o2: '#f0a04b', pk2: '#f8c3bc', cl: '#f6fafc' };
const DON = ['..x...x..', '..x...x..', 'xxxxxxxxx', '..x...x..', '..x.x.x..', '..x...x..', 'xxxxxxxxx', '..x...x..', '.x.....x.'];   // 「丼」

function stage(id, draw) {
  const cv = document.getElementById(id), x = cv.getContext('2d'), W = cv.width;
  const R = (a, b, w, h, c) => { x.fillStyle = c; x.fillRect(Math.round(a), Math.round(b), Math.round(w), Math.round(h)); };
  const px = (a, b, c) => R(a, b, 1, 1, c);
  const el = (cx, cy, rx, ry, c) => { for (let j = Math.floor(cy - ry); j <= cy + ry; j++) for (let i = Math.floor(cx - rx); i <= cx + rx; i++) { const u = (i + .5 - cx) / rx, v = (j + .5 - cy) / ry; if (u * u + v * v <= 1) px(i, j, c); } };
  const checker = (a, b, w, h, c1, c2) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(a + i, b + j, (i + j) % 2 ? c1 : c2); };
  const dither = (a, b, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if ((a + i + b + j) % 2 === 0) px(a + i, b + j, c); };
  const glyph = (rows, a, b, c, s = 1) => rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === 'x') R(a + i * s, b + j * s, s, s, c); }));
  // 城市（三層）：窗戶裡的景
  const city = (a, b, w, h, seed, low = 0) => {
    R(a, b, w, h * .45, C.sky3); R(a, b + h * .45, w, h * .3, C.sky2); R(a, b + h * .75, w, h * .25, C.sky1);
    let r = seed; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
    for (const [col, base, hh] of [[C.c3, .35, .5], [C.c1, .5, .45], [C.c2, .68, .35]]) { let i = 0; while (i < w) { const bw = 6 + Math.floor(rnd() * 12), bh = h * (hh * (.4 + rnd() * .6)) * (1 - low); R(a + i, b + h - bh - (low ? 0 : 0), Math.min(bw, w - i), bh, col); if (col === C.c2) for (let k = 2; k < bh - 2; k += 3) for (let q = 2; q < bw - 2; q += 3) if (rnd() > .55) px(a + i + q, b + h - bh + k, C.sky3); i += bw + 1; } }
  };
  const glassDesk = (cx, y, w, holo) => { R(cx - w / 2, y, w, 1, C.wh); checker(cx - w / 2, y + 1, w, 3, C.sky3, C.g5); R(cx - w / 2, y + 4, w, 1, C.g2);
    R(cx - w / 2 + 3, y + 5, 1, 14, C.g2); R(cx + w / 2 - 4, y + 5, 1, 14, C.g2);
    if (holo) { const sx = cx + w / 2 - 14, sy = y - 13; R(sx + 4, y - 2, 4, 2, C.ink2); dither(sx + 3, sy + 10, 6, 1, C.cy2); R(sx, sy, 12, 9, C.cy2); R(sx, sy, 12, 1, C.wh); R(sx + 11, sy, 1, 9, C.cy0); [[2, 3, 7], [2, 5, 5]].forEach(([a, b, ww]) => R(sx + a, sy + b, ww, 1, C.cy0)); } };
  const monitor = (cx, y) => { R(cx - 6, y - 10, 12, 8, C.ink2); R(cx - 5, y - 9, 10, 6, C.cy); R(cx - 5, y - 9, 10, 1, C.cy2); R(cx - 1, y - 2, 2, 2, C.ink3); };
  const cushion = (cx, y) => { for (let j = 0; j < 6; j++) { const ins = j === 0 || j === 5 ? 1 : 0; R(cx - 7 + ins, y - 6 + j, 14 - ins * 2, 1, j === 0 || j === 5 ? C.g1 : j < 2 ? C.g4 : j > 3 ? C.g2 : C.g3); } R(cx - 7, y - 5, 1, 4, C.g1); R(cx + 6, y - 5, 1, 4, C.g1); };
  const plant = (a, b, s = 1) => { R(a - 4 * s, b - 7 * s, 8 * s, 7 * s, C.g2); R(a - 4 * s, b - 7 * s, 8 * s, 1, C.g4); R(a + 2 * s, b - 6 * s, 2 * s, 6 * s, C.g1);
    [[-5, -12, 4, 2.6], [4, -14, 4, 2.6], [0, -18, 3.6, 3], [-3, -21, 3, 2.2], [3, -22, 3, 2.2]].forEach(([dx, dy, rx, ry], k) => { el(a + dx * s, b + dy * s, rx * s, ry * s, k % 2 ? C.gr1 : C.gr0); el(a + dx * s - 1, b + dy * s - 1, rx * s * .5, ry * s * .4, C.gr2); }); R(a, b - 18 * s, 1, 11 * s, C.gr0); };
  const sign = (a, b, kind) => {   // 門口的銘牌：紙名片 → 木牌 → 拉絲銀牌 → 黑底金字 → 黑漆金框
    if (kind === 1) { R(a, b, 22, 13, C.wh); R(a, b + 12, 22, 1, C.g2); R(a + 21, b, 1, 13, C.g2); glyph(DON, a + 3, b + 2, C.ink2); R(a + 14, b + 4, 5, 1, C.g2); R(a + 14, b + 7, 4, 1, C.g2); R(a + 10, b - 1, 2, 2, C.red); }
    if (kind === 2) { R(a, b, 26, 15, C.wd); R(a, b, 26, 1, C.kr); R(a, b + 14, 26, 1, C.wd0); R(a + 25, b, 1, 15, C.wd2); for (let i = 3; i < 24; i += 5) R(a + i, b + 4, 3, 1, C.wd2); glyph(DON, a + 8, b + 3, C.wd0); px(a + 2, b + 2, C.g1); px(a + 23, b + 2, C.g1); }
    if (kind === 3) { R(a, b, 30, 15, C.g3); for (let j = 1; j < 14; j += 2) R(a, b + j, 30, 1, C.g4); R(a + 1, b + 1, 28, 1, C.g1); R(a + 1, b + 13, 28, 1, C.g1); R(a + 1, b + 1, 1, 13, C.g1); R(a + 28, b + 1, 1, 13, C.g1); R(a, b, 30, 1, C.wh); glyph(DON, a + 4, b + 3, C.ink2); R(a + 16, b + 6, 9, 1, C.ink3); R(a + 16, b + 9, 7, 1, C.ink3); }
    if (kind === 4) { R(a, b, 34, 16, C.bk); R(a, b, 34, 1, C.bk2); glyph(DON, a + 4, b + 4, C.au1); R(a + 17, b + 6, 12, 1, C.au1); R(a + 17, b + 9, 9, 1, C.au0); px(a + 5, b + 4, C.au2); }
    if (kind === 5) { R(a, b, 44, 20, C.au0); R(a + 1, b + 1, 42, 18, C.au1); R(a + 2, b + 2, 40, 16, C.bk); R(a + 3, b + 3, 38, 1, C.bk2); glyph(DON, a + 6, b + 6, C.au1); R(a + 19, b + 8, 15, 1, C.au1); R(a + 19, b + 11, 11, 1, C.au0);
      [[-3, 9], [44, 9]].forEach(([dx, dy]) => { px(a + dx + 1, b + dy - 1, C.au1); R(a + dx, b + dy, 3, 1, C.au1); px(a + dx + 1, b + dy + 1, C.au1); }); px(a + 7, b + 6, C.au2); }
  };
  const lamp = (lx, top, len) => { R(lx, top, 1, len, C.ink2); R(lx - 2, top + len - 2, 5, 3, C.g1); el(lx, top + len + 4, 4, 5, C.au2); el(lx, top + len + 3, 2, 2, C.wh);   // 車庫那顆燈泡，每次搬家都帶走
    for (let j = top + len + 9; j < top + len + 70; j++) { const half = 3 + (j - top - len - 9) * .45, step = j - top - len < 40 ? 2 : 3; for (let i = Math.round(lx - half); i <= lx + half; i++) if ((i + j) % step === 0 && j % 2 === 0) px(i, j, C.warm); } };
  const txt = (str, a, b, size, col, rot = 0) => { x.save(); x.translate(a, b); x.rotate(rot); x.fillStyle = col; x.font = `${size}px "Noto Sans TC", sans-serif`; x.textBaseline = 'top'; x.fillText(str, 0, 0); x.restore(); };
  const rug = (a, b, w, h, c1, c2) => { R(a, b, w, h, c1); R(a + 2, b + 2, w - 4, 1, c2); R(a + 2, b + h - 3, w - 4, 1, c2); };
  draw({ R, px, el, checker, dither, glyph, city, glassDesk, monitor, cushion, plant, sign, lamp, txt, rug, W });
}

// ===== 一　車庫創業：半開的鐵捲門、水泥地、一張折疊桌三個坐墊、吊燈泡、紙箱、延長線 =====
stage('s1', ({ R, px, el, checker, dither, glyph, city, glassDesk, monitor, cushion, plant, sign, lamp, txt, rug, W }) => {
  R(0, 0, W, H, C.cn3);
  for (let j = 8; j < 118; j += 6) { R(40, j, 210, 1, C.g2); R(40, j + 1, 210, 1, C.g4); }   // 鐵捲門的橫條
  R(36, 4, 218, 4, C.g1); R(36, 4, 4, 114, C.g1); R(250, 4, 4, 114, C.g1); R(40, 8, 210, 2, C.ink3);
  city(40, 100, 210, 18, 7); R(40, 98, 210, 2, C.ink3); R(40, 100, 210, 1, C.g1);   // 門沒拉到底，底下看得到外面
  R(0, 118, W, 72, C.cn); for (let i = 0; i < W; i += 23) R(i, 118, 1, 72, C.cn2); R(0, 118, W, 1, C.cn2); R(0, 140, W, 1, C.cn2);   // 水泥地
  el(300, 168, 20, 4, C.cn2); el(296, 167, 12, 2, '#a9adae');   // 地上的油漬
  // 右邊牆：工具板、紙名片
  R(262, 18, 104, 70, C.kr); R(262, 18, 104, 1, C.kr2); for (let j = 24; j < 86; j += 6) for (let i = 266; i < 364; i += 6) px(i, j, C.kr2);
  R(276, 30, 2, 20, C.ink3); R(271, 30, 12, 3, C.ink3); el(300, 40, 6, 6, C.g1); el(300, 40, 3, 3, C.kr); R(320, 28, 3, 24, C.red); R(318, 28, 7, 4, C.g2); R(340, 34, 14, 4, C.o2);
  sign(300, 60, 1);
  // 吊燈泡
  R(150, 0, 1, 34, C.ink2); el(150, 38, 4, 5, C.au2); el(150, 37, 2, 2, C.wh); R(148, 32, 5, 3, C.g1); for (let j = 44; j < 148; j++) { const half = 3 + (j - 44) * .45, step = j < 80 ? 2 : j < 115 ? 3 : 4; for (let i = Math.round(150 - half); i <= 150 + half; i++) if ((i + j) % step === 0 && (j % 2 === 0)) px(i, j, C.warm); }   // 燈泡往下的光，越下面越淡
  R(58, 52, 50, 34, C.wh); R(58, 52, 50, 1, C.g3); R(58, 85, 50, 1, C.g2); R(57, 52, 1, 34, C.g1); R(108, 52, 1, 34, C.g1); R(66, 86, 2, 30, C.g1); R(98, 86, 2, 30, C.g1);   // 白板
  txt('目標：', 61, 55, 9, C.b1, -.05); txt('搬家！', 66, 67, 11, C.red, -.08); R(62, 81, 30, 1, C.b1);
  // 紙箱
  [[14, 150, 30, 22], [20, 130, 22, 20], [52, 160, 20, 12]].forEach(([a, b, w, h]) => { R(a, b, w, h, C.kr); R(a, b, w, 2, C.kr2); R(a + w / 2 - 2, b, 4, h, C.warm); R(a + w - 2, b, 2, h, C.kr2); R(a, b + h - 1, w, 1, C.kr0); });
  // 折疊桌＋三個坐墊
  const ty = 150; R(110, ty, 140, 3, C.g5); R(110, ty + 3, 140, 1, C.g1); R(116, ty + 4, 2, 22, C.g1); R(242, ty + 4, 2, 22, C.g1); R(116, ty + 18, 128, 1, C.g2);
  [140, 180, 220].forEach(cx => cushion(cx, ty));
  R(158, ty - 9, 16, 9, C.ink2); R(159, ty - 8, 14, 7, C.cy); R(156, ty - 1, 20, 1, C.ink3);   // 一台筆電
  R(198, ty - 8, 8, 8, C.wh); R(198, ty - 8, 8, 2, C.o2); R(197, ty - 9, 10, 1, C.g2); R(203, ty - 13, 1, 5, C.wd0); R(205, ty - 13, 1, 5, C.wd0); px(200, ty - 11, C.g3); px(201, ty - 13, C.g3);   // 一碗泡麵（插著筷子、冒煙）
  for (let i = 60; i < 116; i++) px(i, 182 + Math.round(Math.sin(i / 6) * 2), C.ink2); R(56, 178, 8, 6, C.wh); px(58, 180, C.ink3); px(61, 180, C.ink3);   // 延長線
});

// ===== 二　小辦公室：一扇百葉窗、五張小桌、飲水機、盆栽、木牌 =====
stage('s2', ({ R, px, el, checker, dither, glyph, city, glassDesk, monitor, cushion, plant, sign, lamp, txt, rug, W }) => {
  R(0, 0, W, H, C.g4); R(0, 0, W, 6, C.g3); R(0, 112, W, 2, C.g3);
  R(90, 14, 150, 74, C.g1); city(93, 17, 144, 68, 21); for (let j = 19; j < 84; j += 4) R(93, j, 144, 1, C.g5); R(164, 17, 2, 68, C.g1);   // 一扇窗＋百葉
  R(86, 88, 158, 3, C.g3); R(86, 88, 158, 1, C.wh);
  sign(22, 40, 2);
  R(258, 22, 24, 30, C.wh); R(258, 22, 24, 6, C.red); R(268, 20, 4, 3, C.ink3); for (let j = 31; j < 50; j += 4) for (let i = 261; i < 280; i += 4) px(i, j, C.g2); px(273, 39, C.red); px(274, 39, C.red);   // 牆上的月曆（圈了一天）
  lamp(165, 0, 8);
  // 飲水機
  R(330, 52, 20, 60, C.wh); R(330, 52, 20, 1, C.g3); R(349, 52, 1, 60, C.g2); el(340, 44, 8, 9, C.cy2); el(338, 41, 3, 3, C.wh); R(336, 64, 3, 3, C.b1); R(342, 64, 3, 3, C.red); R(334, 78, 12, 2, C.g2);
  plant(296, 112, 1.2);
  R(14, 96, 40, 3, C.wd2); R(16, 99, 2, 14, C.wd0); R(50, 99, 2, 14, C.wd0); R(20, 86, 28, 10, C.kr); for (let i = 21; i < 47; i += 3) R(i, 87, 1, 8, C.kr2); R(19, 85, 30, 2, C.kr0);   // 零食籃
  [[23, 80, C.red], [29, 78, C.yl], [35, 81, C.b1], [41, 79, C.o2], [26, 82, C.pk]].forEach(([a, b, c]) => R(a, b, 5, 6, c));
  R(0, 114, W, 76, C.wd); for (let j = 118; j < H; j += 6) R(0, j, W, 1, C.wd2); for (let i = 0; i < W; i += 37) for (let j = 114; j < H; j += 12) R(i + (j % 24 ? 18 : 0), j, 1, 6, C.wd2);   // 木地板
  [40, 110, 180, 250, 320].forEach((cx, k) => { glassDesk(cx, 150, 56, false); monitor(cx + 12, 150); cushion(cx - 10, 150); });
});

// ===== 三　整層樓：一整排落地窗、八個位子（兩排）、玻璃會議室、拉絲銀牌 =====
stage('s3', ({ R, px, el, checker, dither, glyph, city, glassDesk, monitor, cushion, plant, sign, lamp, txt, rug, W }) => {
  R(0, 0, W, H, C.g4); R(0, 0, W, 5, C.g3);
  city(0, 8, W, 70, 33); for (let i = 0; i < W; i += 46) R(i, 8, 2, 70, C.g5); R(0, 6, W, 2, C.g5); R(0, 78, W, 3, C.g5); R(0, 81, W, 1, C.g3);
  // 右邊的玻璃會議室
  R(282, 30, 90, 70, C.cy2); dither(282, 30, 90, 70, C.sky3); R(282, 30, 90, 1, C.g1); R(282, 30, 1, 70, C.g1); R(326, 30, 1, 70, C.g2); for (let i = 286; i < 370; i += 3) px(i, 64, C.wh);
  R(296, 78, 62, 3, C.wh); R(296, 81, 62, 1, C.g2); R(300, 82, 1, 14, C.g2); R(353, 82, 1, 14, C.g2); el(312, 74, 4, 3, C.g1); el(340, 74, 4, 3, C.g1);
  sign(244, 40, 3);
  R(0, 82, 280, 18, C.wd); for (let i = 0; i < 280; i += 4) R(i, 82, 1, 18, C.wd2); R(0, 82, 280, 1, C.kr);   // 窗下一排木頭牆板
  R(300, 40, 26, 22, C.wh); R(300, 40, 26, 1, C.g2); [[303, 46], [304, 47], [305, 48], [306, 47], [307, 46]].forEach(([a, b]) => px(a, b, C.b1)); el(316, 47, 4, 3, C.yl); px(315, 46, C.ink); px(318, 47, C.o2); R(304, 53, 16, 1, C.red);   // 會議室白板的塗鴉（畫了一隻鴨）
  R(0, 100, W, 90, C.wd); for (let j = 104; j < H; j += 6) R(0, j, W, 1, C.wd2);   // 木地板
  rug(14, 108, 250, 74, C.rg, C.rg2);   // 暖色地毯
  R(256, 66, 18, 16, C.bk2); R(256, 66, 18, 2, C.g1); R(259, 70, 12, 5, C.ink2); R(262, 77, 6, 5, C.wh); R(263, 78, 4, 1, C.wd0); px(266, 63, C.g3); px(264, 61, C.g3);   // 咖啡機
  lamp(70, 0, 30); lamp(200, 0, 30);
  [36, 98, 160, 222].forEach(cx => { glassDesk(cx, 120, 50, false); monitor(cx + 10, 120); cushion(cx - 9, 120); });   // 後排四個
  [52, 120, 188, 256].forEach(cx => { glassDesk(cx, 166, 56, false); monitor(cx + 12, 166); cushion(cx - 10, 166); });  // 前排四個
  plant(350, 190, 1.3);
});
