<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="utf-8"><title>公司・開　五間辦公室（戊）</title>
<style>
body { margin: 0; background: #e4e2dd; font-family: "Noto Sans TC", sans-serif; color: #26303a; }
.wrap { display: inline-block; padding: 22px 26px 26px; background: #f2f6f8; }
h1 { font-size: 17px; font-weight: 500; letter-spacing: .15em; margin: 0 0 4px; } p { font-size: 13px; margin: 0 0 14px; color: #56677a; }
.grid { display: grid; grid-template-columns: repeat(2, 750px); gap: 18px 22px; }
.cell h2 { font-size: 14px; font-weight: 500; letter-spacing: .2em; margin: 0 0 6px; } .wide { grid-column: span 2; } .scroll { position: relative; width: 1494px; } .scroll canvas { width: 1494px; height: 296px; } .view { position: absolute; left: 0; top: 0; width: 584px; height: 296px; border: 3px solid #4fa9bf; border-radius: 12px; box-sizing: border-box; pointer-events: none; } .view span { position: absolute; right: 8px; top: 8px; background: rgba(28,34,41,.7); color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 6px; letter-spacing: .1em; }
.cell h2 small { font-size: 12px; color: #56677a; letter-spacing: .05em; margin-left: 8px; }

</style></head><body><div class="wrap">
<h1>五間辦公室（戊・現代像素）</h1>
<p>每升一階換一間，座位跟著人數上限（3／5／8／12／20），門口的銘牌也一路升級。車庫的吊燈每次搬家都帶著走。第四版照室內設計師的意見：每間有門、桌子兩三張一組、窗外跟著樓層變、天花板一階一階升級，舊燈泡永遠掛在元老座位正上方。</p>
<div class="grid">
  <div class="cell"><h2>一　車庫創業<small>3 人・紙名片</small></h2><canvas id="s1" width="375" height="190"></canvas></div>
  <div class="cell"><h2>二　小辦公室<small>5 人・木牌</small></h2><canvas id="s2" width="375" height="190"></canvas></div>
  <div class="cell"><h2>三　整層樓<small>8 人・拉絲銀牌</small></h2><canvas id="s3" width="375" height="190"></canvas></div>
  <div class="cell"><h2>四　二十七樓整層<small>12 人・黑底金字</small></h2><canvas id="s4" width="375" height="190"></canvas></div>
  <div class="cell wide"><h2>五　自己的大樓<small>20 人・黑漆金框・太寬了，手機上左右滑</small></h2><div class="scroll"><canvas id="s5" width="960" height="190"></canvas><div class="view"><span>手機一次看到這麼多　左右滑</span></div></div></div>
</div>
</div>
<script>
const W = 375, H = 190;
const C = { ink0: '#1c2229', ink: '#26303a', ink2: '#3a4656', ink3: '#56677a', g1: '#7a8c9d', g2: '#9fb1c0', g3: '#c2d0da', g4: '#e6ecf0', g5: '#f2f6f8', wh: '#ffffff',
  sky1: '#c3d8e4', sky2: '#d3e3eb', sky3: '#e2edf2', c1: '#a3bccb', c2: '#869fb1', c3: '#c3d6e1', cy0: '#4fa9bf', cy: '#8fd3e0', cy2: '#c9f0f6',
  b0: '#2b5290', b1: '#3d6fb6', au0: '#8a5a14', au1: '#e2b44a', au2: '#ffe9a0', gr0: '#2f6e47', gr1: '#3f8a5a', gr2: '#6cb487',
  kr: '#e8d6b0', kr2: '#c9ad7c', kr0: '#8f7448', wd: '#c99a68', wd2: '#a77a4c', wd0: '#5e4026', rg: '#e9d8bf', rg2: '#d6bf9d', rg3: '#c98f6b', pk: '#f08a80', yl: '#f2c94c', cn: '#b9bcbd', cn2: '#a2a6a8', cn3: '#cfd2d2',
  bk: '#1f2228', bk2: '#2c3038', red: '#d8433a', warm: '#f4dfa8', o2: '#f0a04b', pk2: '#f8c3bc', cl: '#f6fafc' };
const DON = ['..x...x..', '..x...x..', 'xxxxxxxxx', '..x...x..', '..x.x.x..', '..x...x..', 'xxxxxxxxx', '..x...x..', '.x.....x.'];   // 「丼」

function stage(id, draw) {
  const cv = document.getElementById(id), x = cv.getContext('2d'), W = cv.width;
  const R = (a, b, w, h, c) => { x.fillStyle = c; x.fillRect(Math.round(a), Math.round(b), Math.round(w), Math.round(h)); };
  const px = (a, b, c) => R(a, b, 1, 1, c);
  const el = (cx, cy, rx, ry, c) => { for (let j = Math.floor(cy - ry); j <= cy + ry; j++) for (let i = Math.floor(cx - rx); i <= cx + rx; i++) { const u = (i + .5 - cx) / rx, v = (j + .5 - cy) / ry; if (u * u + v * v <= 1) px(i, j, c); } };
  const checker = (a, b, w, h, c1, c2) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(a + i, b + j, (i + j) % 2 ? c1 : c2); };
  const dither = (a, b, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if ((a + i + b + j) % 2 === 0) px(a + i, b + j, c); };
  const glyph = (rows, a, b, c, s = 1) => rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === 'x') R(a + i * s, b + j * s, s, s, c); }));
  // 城市（三層）：窗戶裡的景
  const city = (a, b, w, h, seed, low = 0) => {
    R(a, b, w, h * .45, C.sky3); R(a, b + h * .45, w, h * .3, C.sky2); R(a, b + h * .75, w, h * .25, C.sky1);
    let r = seed; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
    for (const [col, base, hh] of [[C.c3, .35, .5], [C.c1, .5, .45], [C.c2, .68, .35]]) { let i = 0; while (i < w) { const bw = 6 + Math.floor(rnd() * 12), bh = h * (hh * (.4 + rnd() * .6)) * (1 - low); R(a + i, b + h - bh - (low ? 0 : 0), Math.min(bw, w - i), bh, col); if (col === C.c2) for (let k = 2; k < bh - 2; k += 3) for (let q = 2; q < bw - 2; q += 3) if (rnd() > .55) px(a + i + q, b + h - bh + k, C.sky3); i += bw + 1; } }
  };
  const glassDesk = (cx, y, w, holo) => { R(cx - w / 2, y, w, 1, C.wh); checker(cx - w / 2, y + 1, w, 3, C.sky3, C.g5); R(cx - w / 2, y + 4, w, 1, C.g2);
    R(cx - w / 2 + 3, y + 5, 1, 14, C.g2); R(cx + w / 2 - 4, y + 5, 1, 14, C.g2);
    if (holo) { const sx = cx + w / 2 - 14, sy = y - 13; R(sx + 4, y - 2, 4, 2, C.ink2); dither(sx + 3, sy + 10, 6, 1, C.cy2); R(sx, sy, 12, 9, C.cy2); R(sx, sy, 12, 1, C.wh); R(sx + 11, sy, 1, 9, C.cy0); [[2, 3, 7], [2, 5, 5]].forEach(([a, b, ww]) => R(sx + a, sy + b, ww, 1, C.cy0)); } };
  const monitor = (cx, y) => { R(cx - 6, y - 10, 12, 8, C.ink2); R(cx - 5, y - 9, 10, 6, C.cy); R(cx - 5, y - 9, 10, 1, C.cy2); R(cx - 1, y - 2, 2, 2, C.ink3); };
  const cushion = (cx, y) => { for (let j = 0; j < 6; j++) { const ins = j === 0 || j === 5 ? 1 : 0; R(cx - 7 + ins, y - 6 + j, 14 - ins * 2, 1, j === 0 || j === 5 ? C.g1 : j < 2 ? C.g4 : j > 3 ? C.g2 : C.g3); } R(cx - 7, y - 5, 1, 4, C.g1); R(cx + 6, y - 5, 1, 4, C.g1); };
  const plant = (a, b, s = 1) => { R(a - 4 * s, b - 7 * s, 8 * s, 7 * s, C.g2); R(a - 4 * s, b - 7 * s, 8 * s, 1, C.g4); R(a + 2 * s, b - 6 * s, 2 * s, 6 * s, C.g1);
    [[-5, -12, 4, 2.6], [4, -14, 4, 2.6], [0, -18, 3.6, 3], [-3, -21, 3, 2.2], [3, -22, 3, 2.2]].forEach(([dx, dy, rx, ry], k) => { el(a + dx * s, b + dy * s, rx * s, ry * s, k % 2 ? C.gr1 : C.gr0); el(a + dx * s - 1, b + dy * s - 1, rx * s * .5, ry * s * .4, C.gr2); }); R(a, b - 18 * s, 1, 11 * s, C.gr0); };
  const sign = (a, b, kind) => {   // 門口的銘牌：紙名片 → 木牌 → 拉絲銀牌 → 黑底金字 → 黑漆金框
    if (kind === 1) { R(a, b, 22, 13, C.wh); R(a, b + 12, 22, 1, C.g2); R(a + 21, b, 1, 13, C.g2); glyph(DON, a + 3, b + 2, C.ink2); R(a + 14, b + 4, 5, 1, C.g2); R(a + 14, b + 7, 4, 1, C.g2); R(a + 10, b - 1, 2, 2, C.red); }
    if (kind === 2) { R(a, b, 26, 15, C.wd); R(a, b, 26, 1, C.kr); R(a, b + 14, 26, 1, C.wd0); R(a + 25, b, 1, 15, C.wd2); for (let i = 3; i < 24; i += 5) R(a + i, b + 4, 3, 1, C.wd2); glyph(DON, a + 8, b + 3, C.wd0); px(a + 2, b + 2, C.g1); px(a + 23, b + 2, C.g1); }
    if (kind === 3) { R(a, b, 30, 15, C.g3); for (let j = 1; j < 14; j += 2) R(a, b + j, 30, 1, C.g4); R(a + 1, b + 1, 28, 1, C.g1); R(a + 1, b + 13, 28, 1, C.g1); R(a + 1, b + 1, 1, 13, C.g1); R(a + 28, b + 1, 1, 13, C.g1); R(a, b, 30, 1, C.wh); glyph(DON, a + 4, b + 3, C.ink2); R(a + 16, b + 6, 9, 1, C.ink3); R(a + 16, b + 9, 7, 1, C.ink3); }
    if (kind === 4) { R(a, b, 34, 16, C.bk); R(a, b, 34, 1, C.bk2); glyph(DON, a + 4, b + 4, C.au1); R(a + 17, b + 6, 12, 1, C.au1); R(a + 17, b + 9, 9, 1, C.au0); px(a + 5, b + 4, C.au2); }
    if (kind === 5) { R(a, b, 44, 20, C.au0); R(a + 1, b + 1, 42, 18, C.au1); R(a + 2, b + 2, 40, 16, C.bk); R(a + 3, b + 3, 38, 1, C.bk2); glyph(DON, a + 6, b + 6, C.au1); R(a + 19, b + 8, 15, 1, C.au1); R(a + 19, b + 11, 11, 1, C.au0);
      [[-3, 9], [44, 9]].forEach(([dx, dy]) => { px(a + dx + 1, b + dy - 1, C.au1); R(a + dx, b + dy, 3, 1, C.au1); px(a + dx + 1, b + dy + 1, C.au1); }); px(a + 7, b + 6, C.au2); }
  };
  const cone = (lx, y0, n) => { for (let j = y0; j < y0 + n; j++) { const half = 3 + (j - y0) * .45, step = j - y0 < 30 ? 2 : 3; for (let i = Math.round(lx - half); i <= lx + half; i++) if ((i + j) % step === 0 && j % 2 === 0) px(i, j, C.warm); } };
  const newLamp = (lx, top, len) => { R(lx, top, 1, len, C.ink2); el(lx, top + len + 3, 7, 4, C.bk2); R(lx - 7, top + len + 3, 15, 4, C.bk2); R(lx - 6, top + len + 3, 13, 1, C.ink3); R(lx - 5, top + len + 6, 11, 1, C.au2); cone(lx, top + len + 8, 60); };   // 新的吊燈：黑色燈罩
  const lamp = (lx, top, len) => { R(lx, top, 1, len, C.ink2); R(lx - 2, top + len - 2, 5, 3, C.g1); R(lx - 1, top + len - 8, 3, 4, C.kr); px(lx + 2, top + len - 6, C.kr2); px(lx + 3, top + len - 5, C.kr); el(lx, top + len + 4, 4, 5, C.au2); el(lx, top + len + 3, 2, 2, C.wh);   // 車庫那顆舊燈泡（電線纏一圈牛皮紙膠帶），每次搬家都帶走
    cone(lx, top + len + 9, 61); };
  const txt = (str, a, b, size, col, rot = 0) => { x.save(); x.translate(a, b); x.rotate(rot); x.fillStyle = col; x.font = `${size}px "Noto Sans TC", sans-serif`; x.textBaseline = 'top'; x.fillText(str, 0, 0); x.restore(); };
  const rug = (a, b, w, h, c1, c2) => { R(a, b, w, h, c1); R(a + 2, b + 2, w - 4, 1, c2); R(a + 2, b + h - 3, w - 4, 1, c2); };
  draw({ R, px, el, checker, dither, glyph, city, glassDesk, monitor, cushion, plant, sign, lamp, newLamp, txt, rug, W, x, cone });
}

// 第四版（2026-11-25，室內設計師）：每間左邊有門、銘牌掛在門邊牆上；桌子兩三張一組、中間留走道；窗外跟著樓層變；
// 天花板一階一階不一樣（車庫裸露低樑 → 輕鋼架 → 管線外露漆白 → 木格柵＋線型燈 → 大廳挑高）；舊燈泡永遠掛在元老座位正上方。
const C2 = { ap: '#d9cdb8', ap2: '#c4b69c', grill: '#5d6670', tarp: '#5f7f9a', tarp2: '#4a6880', tire: '#2c3038', stone: '#30343b', stone2: '#3a3f47', brass: '#c9a35a', brass2: '#9c7a38' };
const kit = K => { const { R, px, el, checker, dither, glyph, cushion, glassDesk, monitor, x, W } = K;
  return {
    door: (a, top, bot, style) => { const w = 22;   // 門：框＋門板＋把手
      const fr = style === 1 ? C.g1 : style === 2 ? C.wd0 : style === 3 ? C.g1 : style === 4 ? C.bk : C2.brass2, pn = style === 1 ? C.g3 : style === 2 ? C.wd : style === 3 ? C.cy2 : style === 4 ? C.wd2 : C.cy2;
      R(a - 2, top - 2, w + 4, bot - top + 2, fr); R(a, top, w, bot - top, pn);
      if (style === 3 || style === 5) { dither(a + 1, top + 1, w - 2, bot - top - 2, C.wh); R(a + w / 2, top, 1, bot - top, fr); } else if (style === 4) { R(a + 2, top + 3, w - 4, 1, C.wd); for (let j = top + 6; j < bot - 3; j += 8) R(a + 3, j, w - 6, 1, C.wd0); } else { R(a + 2, top + 3, w - 4, 1, C.g4); R(a + 2, top + 3, 1, bot - top - 6, C.g4); }
      R(a + w - 5, top + (bot - top) / 2, 2, 5, style === 5 ? C.au1 : C.ink3); },
    // 一組桌子：n 張靠在一起，第一個 k 是元老位（回傳每張的中心）
    cluster: (a, y, n, w, opt = {}) => { const xs = []; for (let k = 0; k < n; k++) { const cx = a + w / 2 + k * w; glassDesk(cx, y, w - 1, opt.holo && (k % 2 === 0)); if (!opt.holo && (k % 2 === 1 || n === 1)) monitor(cx + w / 4, y); if (opt.holo && k % 2) monitor(cx + w / 4, y); cushion(cx - w / 5, y); xs.push(cx - w / 5); } return xs; },
    // 四角壓暗：一圈一圈階梯式（像素感）
    vignette: (cx, cy, r1, r2, k = .72) => { const im = x.getImageData(0, 0, W, 190), d = im.data;
      for (let j = 0; j < 190; j++) for (let i = 0; i < W; i++) { const t = Math.hypot((i - cx) / (W * .5), (j - cy) / (190 * .5)), f = t < 1.05 ? 1 : t < 1.2 ? .95 : .9;   /* 只有四個角落淡淡暗一點（妹妹：整圈像監視器畫面） */ if (f < 1) { const o = (j * W + i) * 4; d[o] *= f; d[o + 1] *= f; d[o + 2] *= f; } }
      x.putImageData(im, 0, 0); },
    lowPlant: (a, b, w) => { R(a, b - 6, w, 6, C.wd2); R(a, b - 6, w, 1, C.kr); for (let i = 0; i < w; i += 4) { el(a + i + 2, b - 8, 3, 3, i % 8 ? C.gr1 : C.gr0); el(a + i + 1, b - 9, 1.4, 1, C.gr2); } },   // 矮盆栽隔間
  }; };

// ===== 一　車庫創業：裸露的低樑、半開鐵捲門、側門＋紙名片、一顆燈泡照元老位、四角壓暗、右邊停一台蓋帆布的機車 =====
stage('s1', K => { const { R, px, el, checker, dither, city, cushion, sign, txt, cone, W } = K, Q = kit(K);
  R(0, 0, W, H, C.cn3);
  for (let j = 30; j < 118; j += 6) { R(70, j, 190, 1, C.g2); R(70, j + 1, 190, 1, C.g4); }   // 鐵捲門的橫條
  R(66, 26, 198, 4, C.g1); R(66, 26, 4, 92, C.g1); R(260, 26, 4, 92, C.g1); R(70, 30, 190, 2, C.ink3);
  city(70, 100, 190, 18, 7); R(70, 98, 190, 2, C.ink3); R(70, 100, 190, 1, C.g1);
  R(0, 0, W, 12, C.cn2); for (let i = 0; i < W; i += 34) { R(i, 0, 6, 20, C.g1); R(i, 0, 6, 1, C.g2); } R(0, 12, W, 2, C.g1);   // 裸露的低樑
  Q.door(16, 52, 118, 1); sign(42, 62, 1);   // 側門＋門邊的紙名片
  R(0, 118, W, 72, C.cn); for (let i = 0; i < W; i += 23) R(i, 118, 1, 72, C.cn2); R(0, 118, W, 1, C.cn2); R(0, 140, W, 1, C.cn2);
  el(250, 176, 16, 3, C.cn2);
  R(276, 36, 88, 50, C.kr); R(276, 36, 88, 1, C.kr2); for (let j = 42; j < 84; j += 6) for (let i = 280; i < 362; i += 6) px(i, j, C.kr2);   // 洞洞板工具牆
  R(288, 46, 2, 18, C.ink3); R(283, 46, 12, 3, C.ink3); el(310, 54, 5, 5, C.g1); el(310, 54, 2.5, 2.5, C.kr); R(328, 44, 3, 22, C.red); R(326, 44, 7, 4, C.g2); R(344, 50, 12, 4, C.o2);
  R(96, 46, 50, 34, C.wh); R(96, 46, 50, 1, C.g3); R(96, 79, 50, 1, C.g2); R(95, 46, 1, 34, C.g1); R(146, 46, 1, 34, C.g1); R(104, 80, 2, 36, C.g1); R(136, 80, 2, 36, C.g1);   // 白板
  txt('目標：', 99, 49, 9, C.b1, -.05); txt('搬家！', 104, 61, 11, C.red, -.08); R(100, 75, 30, 1, C.b1);
  // 機車蓋著帆布（右半邊）
  el(300, 176, 9, 9, C.tire); el(300, 176, 4, 4, C.g1); el(352, 176, 9, 9, C.tire); el(352, 176, 4, 4, C.g1);
  el(326, 156, 34, 16, C2.tarp); el(312, 146, 18, 12, C2.tarp); el(330, 162, 30, 8, C2.tarp2); for (let k = 0; k < 4; k++) R(298 + k * 16, 150 + (k % 2) * 4, 1, 14, C2.tarp2); R(292, 168, 70, 2, C2.tarp2); R(296, 140, 10, 2, C.wh); R(290, 138, 12, 2, C.ink2); R(286, 136, 5, 2, C.ink3); R(298, 128, 1, 10, C.g1); el(298, 126, 3, 2, C.g1); el(298, 126, 2, 1, C.cy2); R(355, 150, 5, 3, C.red); px(356, 150, C.pk);   // 帆布下露出把手、後照鏡、尾燈
  [[14, 150, 30, 22], [20, 130, 22, 20], [52, 160, 20, 12]].forEach(([a, b, w, h]) => { R(a, b, w, h, C.kr); R(a, b, w, 2, C.kr2); R(a + w / 2 - 2, b, w > 25 ? 4 : 3, h, C.warm); R(a + w - 2, b, 2, h, C.kr2); R(a, b + h - 1, w, 1, C.kr0); });
  const ty = 150; R(110, ty, 140, 3, C.g5); R(110, ty + 3, 140, 1, C.g1); R(116, ty + 4, 2, 22, C.g1); R(242, ty + 4, 2, 22, C.g1); R(116, ty + 18, 128, 1, C.g2);
  [140, 180, 220].forEach(cx => cushion(cx, ty));
  R(158, ty - 9, 16, 9, C.ink2); R(159, ty - 8, 14, 7, C.cy); R(156, ty - 1, 20, 1, C.ink3);
  R(198, ty - 8, 8, 8, C.wh); R(198, ty - 8, 8, 2, C.o2); R(197, ty - 9, 10, 1, C.g2); R(203, ty - 13, 1, 5, C.wd0); R(205, ty - 13, 1, 5, C.wd0); px(200, ty - 11, C.g3); px(201, ty - 13, C.g3);
  for (let i = 60; i < 116; i++) px(i, 182 + Math.round(Math.sin(i / 6) * 2), C.ink2); R(56, 178, 8, 6, C.wh); px(58, 180, C.ink3); px(61, 180, C.ink3);
  Q.vignette(150, 100, 70, 130, .74);   // 四角壓暗，燈泡那一圈最亮
  R(140, 14, 1, 60, C.ink2); R(138, 72, 5, 3, C.g1); R(139, 66, 3, 4, C.kr); px(142, 68, C.kr2); px(143, 69, C.kr); el(140, 78, 4, 5, C.au2); el(140, 77, 2, 2, C.wh); cone(140, 84, 62);   // 舊燈泡：元老位正上方
});
