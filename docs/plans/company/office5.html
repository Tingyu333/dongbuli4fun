<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="utf-8"><title>公司・開　五間辦公室（戊）</title>
<style>
body { margin: 0; background: #e4e2dd; font-family: "Noto Sans TC", sans-serif; color: #26303a; }
.wrap { display: inline-block; padding: 22px 26px 26px; background: #f2f6f8; }
h1 { font-size: 17px; font-weight: 500; letter-spacing: .15em; margin: 0 0 4px; } p { font-size: 13px; margin: 0 0 14px; color: #56677a; }
.grid { display: grid; grid-template-columns: repeat(2, 750px); gap: 18px 22px; }
.cell h2 { font-size: 14px; font-weight: 500; letter-spacing: .2em; margin: 0 0 6px; } .wide { grid-column: span 2; } .scroll { position: relative; width: 1805px; } .scroll canvas { width: 1805px; height: 296px; } .s4w { width: 934px; } .s4w canvas { width: 934px; } .view { position: absolute; left: 0; top: 0; width: 584px; height: 296px; border: 3px solid #4fa9bf; border-radius: 12px; box-sizing: border-box; pointer-events: none; } .view span { position: absolute; right: 8px; top: 8px; background: rgba(28,34,41,.7); color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 6px; letter-spacing: .1em; }
.cell h2 small { font-size: 12px; color: #56677a; letter-spacing: .05em; margin-left: 8px; }
canvas { image-rendering: pixelated; width: 750px; height: 380px; display: block; border-radius: 12px; }
</style></head><body><div class="wrap">
<h1>五間辦公室（戊・現代像素）</h1>
<p>每升一階換一間，座位跟著人數上限（3／5／8／12／20），門口的銘牌也一路升級。車庫的吊燈每次搬家都帶著走。第四版照室內設計師的意見：每間有門、桌子兩三張一組、窗外跟著樓層變、天花板一階一階升級，舊燈泡永遠掛在元老座位正上方。</p>
<div class="grid">
  <div class="cell"><h2>一　車庫創業<small>3 人・紙名片</small></h2><canvas id="s1" width="375" height="190"></canvas></div>
  <div class="cell"><h2>二　小辦公室<small>5 人・木牌</small></h2><canvas id="s2" width="375" height="190"></canvas></div>
  <div class="cell"><h2>三　整層樓<small>8 人・拉絲銀牌</small></h2><canvas id="s3" width="375" height="190"></canvas></div>
  <div class="cell wide"><h2>四　二十七樓整層<small>12 人・黑底金字・加寬到 600，手機上左右滑（原本 375 坐不下 12 隻）</small></h2><div class="scroll s4w"><canvas id="s4" width="600" height="190"></canvas><div class="view"><span>手機一次看到這麼多　左右滑</span></div></div></div>
  <div class="cell wide"><h2>五　自己的大樓<small>20 人・黑漆金框・太寬了，手機上左右滑</small></h2><div class="scroll"><canvas id="s5" width="1160" height="190"></canvas><div class="view"><span>手機一次看到這麼多　左右滑</span></div></div></div>
</div>
</div>
<script src="../../../assets/company-office.js"></script>
<script>
// 畫法在 assets/company-office.js（company.html 也用同一份）
['s1', 's2', 's3', 's4', 's5'].forEach((id, i) => CompanyOffice.paint(document.getElementById(id), i + 1));
</script></body></html>
