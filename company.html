    <style>

  .staff.busy { opacity: .45; }
  .est { position: relative; margin: 10px 12px 0; padding: 10px 14px; display: flex; justify-content: space-between; font-size: 12px; } .est b { font-weight: 500; color: var(--teal); }

  /* 突發狀況 */
  .dim { position: absolute; inset: 0; background: rgba(38,48,58,.38); backdrop-filter: blur(3px); z-index: 4; }
  .modal { position: absolute; left: 16px; right: 16px; top: 250px; z-index: 5; padding: 16px 16px 14px; background: rgba(250,252,253,.78); }
  .timer { height: 3px; border-radius: 3px; background: rgba(120,140,155,.2); overflow: hidden; } .timer i { display: block; width: 62%; height: 100%; background: linear-gradient(90deg, #b33a2f, #e0786c); box-shadow: 0 0 6px rgba(224,120,108,.8); }
  .modal .lb { margin-top: 12px; font-size: 10.5px; letter-spacing: .3em; color: #b33a2f; display: flex; align-items: center; gap: 6px; } .modal .lb::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #b33a2f; box-shadow: 0 0 6px rgba(179,58,47,.8); }

  .co { position: relative; margin: 8px 12px 0; padding: 9px 14px; display: flex; justify-content: space-between; align-items: center; }

  .foot { position: relative; margin: 8px 18px 0; font-size: 10px; color: var(--sub); text-align: center; letter-spacing: .06em; }

  .np { display: inline-flex; align-items: center; gap: 6px; font-family: 'Noto Serif TC', serif; font-size: 13px; letter-spacing: .28em; padding: 4px 10px 4px 12px; line-height: 1.3; white-space: nowrap; position: relative; }
  .np1 { background: #f6f1e6; color: #6b6052; border: 1px solid #cfc6b6; }

  /* 第 4～6 階：像素金屬（美術審稿：滑順漸層跟像素畫不搭）——硬邊色帶、一顆斜面、四角鉚釘 */
  .np4 { background: #1f2125; color: #d9b75e; border: 1px solid #6b5a2c; box-shadow: inset 0 0 0 2px #1f2125, inset 0 0 0 3px #a88c45; padding: 6px 16px; letter-spacing: .3em; }   /* 二十七樓：黑底金字，簡單一條細金線，沒有釘子、沒有框（使用者：整層跟大樓沒差異） */
  .np5 { position: relative; background: linear-gradient(170deg, #3a3330 0 18%, #15110f 32%, #241d19 100%); color: #f3d27a; border: 4px solid; border-color: #ffe9a0 #8a6216 #6b4a12 #f6dc8a; box-shadow: inset 0 0 0 1px #3b2a0c, inset 0 0 0 2px #c9a35a, 0 2px 6px rgba(60,40,10,.35); padding: 8px 26px; letter-spacing: .3em; font-weight: 400; color: #f6d98a; text-shadow: none; }   /* 使用者：大樓的牌好糊——原本上下兩道浮雕陰影＋加粗，小字糊成一團，改成乾淨的金字 */   /* 自己的大樓：黑漆（有一道亮漆反光）＋厚金框（左上亮右下暗）＋內圈細金線＋兩邊金色菱形 */
  .np5::before, .np5::after { content: ''; position: absolute; top: 50%; width: 7px; height: 7px; margin-top: -4px; background: linear-gradient(135deg, #ffe9a0, #c9a35a 60%, #8a6216); transform: rotate(45deg); box-shadow: 0 0 0 1px #3b2a0c; } .np5::before { left: 8px; } .np5::after { right: 8px; }
  .np5 span { color: inherit; }
  .np6 { background: linear-gradient(#6b4a12,#6b4a12) left 3px top 3px/3px 3px no-repeat, linear-gradient(#6b4a12,#6b4a12) right 3px top 3px/3px 3px no-repeat, linear-gradient(#6b4a12,#6b4a12) left 3px bottom 3px/3px 3px no-repeat, linear-gradient(#6b4a12,#6b4a12) right 3px bottom 3px/3px 3px no-repeat, linear-gradient(#fff1b8 0 3px, #f3d27a 3px 50%, #dcae48 50% calc(100% - 3px), #a8761f calc(100% - 3px)); color: #3b2a0c; border: 2px solid #6b4a12; box-shadow: inset 2px 2px 0 #fff6d0, inset -2px -2px 0 #8a6216, 0 3px 0 rgba(107,74,18,.35); padding: 8px 22px; letter-spacing: .36em; font-weight: 600; text-shadow: 1px 1px 0 #fff3c4; }

.toast { z-index: 40 !important; top: auto !important; bottom: calc(84px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; width: max-content; max-width: calc(100vw - 48px); box-sizing: border-box; padding: 9px 16px 9px 14px !important; border-radius: 999px; border: 1px solid rgba(255,255,255,.8) !important;

#busy .sparks i:nth-child(1) { left: 58px; top: 70px; } #busy .sparks i:nth-child(2) { right: 62px; top: 56px; animation-delay: .7s; } #busy .sparks i:nth-child(3) { left: 112px; top: 34px; animation-delay: 1.4s; }

<script>
(() => {
    const R = CompanyRules, $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const OPEN = false;                                  // 使用者試過、接好後端才開放
    const PREVIEW = /[?&]preview\b/.test(location.search);                         // 試玩：試玩錢包、存在這支手機、不碰後端
    const LIVE = !PREVIEW && (OPEN || /[?&]live\b/.test(location.search));        // 正式：真的錢包、存檔在後端（開放前用 ?live 試）
    if (!LIVE && !PREVIEW) { $('gate').hidden = false; return; }

    // ---------- 存檔 ----------
    // 試玩：存在這支手機 localStorage（dongbuli-company-preview）。
    // 正式（做法 C，2026-11-26）：存檔在後端 Saves 分頁。手機照常每秒更新 S，有改過就大約 30 秒送一次（companySave，帶 rev），
    // 離開頁面時也送；另一支手機存過（conflict）或賺太快（rejected）就換成後端那份。
    // 增資、轉進錢包、加班費要等後端一次做完（serverAct），等的時候蓋 #busy 動畫。
    const KEY = 'dongbuli-company-preview', TRIAL_MONEY = 300000;
    let S = null, rev = 0, dirty = false, pushing = null, blocking = false, lastPush = 0;
    let founder = PREVIEW && /[?&]founder\b/.test(location.search);   // 創始執行長（許願的那位，admin 後台指定）：後端 companyLoad 回 founder；試玩加 ?founder 看他的樣子
    const ceo = () => founder ? '創始執行長' : '執行長';
    if (PREVIEW) { try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; } fixup(); }
    function fixup() {   // 舊存檔補欄位
        if (S && S.staff) S.staff.forEach(s => { if (s.trial && s.done > 0) s.trial = false; });   // 試用期做完第一件就轉正
        if (S && S.staff && !S.dexInfo) { S.dexInfo = {}; S.staff.forEach(s => { const d = S.dexInfo[s.key] = S.dexInfo[s.key] || { first: S.created, done: 0, lv: 1 }; d.done += s.done; d.lv = Math.max(d.lv, s.lv); }); }   // 舊存檔：從現在的員工補
        if (S && !S.inject) S.inject = { d: '', amt: 0 };
    }
    let resetting = false;
    const save = () => { if (resetting || !S) return; if (LIVE) { dirty = true; return; } try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } };
    const now = () => Date.now() + (PREVIEW && S ? S.shift || 0 : 0);   // 試玩可以「快轉」
    const fresh = () => ({ v: 1, name: '', stage: 0, acct: 0, wallet: PREVIEW ? TRIAL_MONEY : undefined, jobsDone: 0, staff: [], board: [], jobs: [], done: [], applicants: [], applyAt: 0, nextBoardAt: 0, adUntil: 0,
        series: {}, gifts: [], equip: {}, dex: { sp: {}, gen: {} }, hiredSp: [], last: null, today: { d: '', net: 0 }, inject: { d: '', amt: 0 }, lastSeen: 0, shift: 0, tut: 0, created: Date.now() });
    const wal = () => PREVIEW ? S.wallet : Wallet.money;   // 錢包：試玩是存檔裡的，正式是真的錢包
    const clone = o => JSON.parse(JSON.stringify(o));

    // ---------- 等後端的蓋板 ----------
    const BUSY = {
        load: { who: 'nugget', route: '', steps: [[0, '雞塊去拉鐵捲門'], [1800, '把公司的帳搬下來'], [5000, '後端剛睡醒，再等一下'], [11000, '還在等，Google 今天有點慢']] },
        sync: { who: 'nugget', route: '', steps: [[0, '對一下帳'], [2200, '看看另一支手機有沒有動過'], [6000, '後端剛睡醒，再等一下'], [11000, '還在等，Google 今天有點慢']] },
        inject: { who: 'raccoon', route: ['錢包', '公司帳戶'], steps: [[0, '把錢包的錢搬進公司'], [1800, '浣熊大王在點鈔'], [4500, '每一枚都要咬咬看是不是真的'], [9000, '銀行今天人有點多']] },
        out: { who: 'raccoon', route: ['公司帳戶', '錢包'], back: true, steps: [[0, '把公司的錢轉進錢包'], [1800, '浣熊大王在跑銀行'], [4500, '抽到號碼牌了，還要等'], [9000, '銀行今天人有點多']] },
        overtime: { who: 'xiaowu', route: ['錢包', '加班費'], steps: [[0, '叫大家留下來加班'], [1800, '小吳鴨推了推眼鏡'], [4500, '幫大家訂便當'], [9000, '便當還在路上']] },
    };
    const Busy = (() => {
        const el = $('busy'); let timers = [], since = 0;
        const say = t => { $('bzTx').textContent = t; };
        return {
            show(kind) {
                const k = BUSY[kind] || BUSY.sync;
                timers.forEach(clearTimeout); timers = [];
                el.classList.remove('done'); el.classList.toggle('back', !!k.back);
                $('bzImg').src = 'assets/company/' + k.who + '.png?v=20261125b';
                $('bzImg').onload = () => { const im = $('bzImg'); im.style.width = im.naturalWidth * 2 + 'px'; im.style.height = im.naturalHeight * 2 + 'px'; };
                $('bzRoute').innerHTML = k.route ? `<b>${k.route[0]}</b><b>${k.route[1]}</b>` : '';
                $('bzLane').hidden = !k.route;
                k.steps.forEach(([at, t]) => timers.push(setTimeout(() => say(t), at)));
                el.hidden = false; requestAnimationFrame(() => el.classList.add('on'));
                since = performance.now();
            },
            // 收起來：有 doneText 就先停在「好了」那一下；太快回來的也至少給動畫跑一下，不要一閃就不見
            async hide(doneText) {
                timers.forEach(clearTimeout); timers = [];
                const wait = Math.max(0, 650 - (performance.now() - since));
                if (wait) await new Promise(r => setTimeout(r, wait));
                if (doneText) { el.classList.add('done'); say(doneText); await new Promise(r => setTimeout(r, 750)); }
                el.classList.remove('on'); await new Promise(r => setTimeout(r, 260));
                el.hidden = true; el.classList.remove('done');
            },
        };
    })();

    // ---------- 跟後端同步（正式） ----------
    const MSG = { conflict: '另一支手機動過公司，換成那邊的進度', rejected: '這段進度跟後端對不起來，用回上一次存的' };
    function adoptServer(r, msg) {   // 換成後端那份
        hide();
        if (!r.save) { S = null; rev = 0; dirty = false; openNote(0); if (msg) toast('後端找不到這家公司，重新開一家'); return; }
        S = r.save; rev = r.rev; dirty = false; fixup();
        if (S.wallet !== undefined) delete S.wallet;
        tick(); render();
        if (msg) toast(msg);
    }
    function loggedOut() {
        S = null; dirty = false; $('main').hidden = true; hide(); $('coach').hidden = true;
        gateLogin('登入過期了，再登入一次就好。');
    }
    // 背景存檔：不蓋板
    function push(force) {
        if (!LIVE || !S || !S.name || blocking || pushing || (!dirty && !force)) return pushing || Promise.resolve();
        dirty = false; lastPush = Date.now();
        const base = rev;
        pushing = (async () => {
            try {
                const r = await Line.call({ type: 'companySave', save: clone(S), rev: base });
                if (r.result === 'success') { if (rev === base) rev = r.rev; }

              ${c.tutorial ? `<div class="kv" style="display:block;line-height:1.8"><span>名片印好了：${esc(S.name)}・${ceo()}。<br>錢先扣員工薪水（三成），剩下進<b>公司帳戶</b>，存著搬家用。</span></div>` : ''}</div>
              <div class="cta"><button class="main" id="xOk" style="flex:1">收下</button></div>`, { center: true });
        $('xOk').onclick = () => { hide(); if (c.tutorial) { if (S.coach) S.coach = 5.5; save(); go(S.coach ? 'office' : 'staff'); } };   // 5.5：先講賺到的錢進哪裡（使用者：加到新手說明）
    }

    // ---------- 派人 ----------
    let pickSel = [];
    function openDispatch(c) {

            <div class="est glass num" style="margin-top:10px"><span>${enough ? '預計 <b>' + (c.tutorial ? '3 秒' : R.dur(Math.max(1, Math.round(pl.m)))) + '</b>' + (pl.napper ? '（茱莉鴨可能睡一下）' : '') : '要選 ' + c.ppl + ' 人（選了 ' + team.length + '）'}</span><span>成功機率 <b>${enough ? R.odds(pl.p) : '—'}</b></span></div>
            <div class="cta"><button class="main" id="dGo" style="flex:1" ${enough ? '' : 'disabled'}>開工</button></div>`);
        if (c.tutorial) { $('sheet').scrollTop = 0; }

    // ---------- 突發狀況（只有開著畫面才跳；15 秒沒選就選第一個） ----------
    let incAt = 0, incOpen = null, incTimer = 0;
    function incidentTick(t) {

        if (incOpen) { const left = 15 - (t - incOpen.at) / 1000; const bar = $('incBar'); if (bar) bar.style.width = Math.max(0, left / 15 * 100) + '%'; if (left <= 0) applyInc(0); return; }
        if (t < incAt || !$('layer').hidden) return;

        document.querySelectorAll('#sheet .opt').forEach(e => e.onclick = () => applyInc(+e.dataset.k));
    }
    function applyInc(k) {
        if (!incOpen) return;
        const { j, inc } = incOpen, e = inc.o[k][2], team = j.team.map(staffById).filter(Boolean);
        let msg = '';
        if (e.cost) { const n = R.incidentCost(S.stage, e.cost); if (S.acct < n) { toast('公司帳戶不夠，只好等一下'); j.end += 2 * 60000; } else { S.acct -= n; j.spent = (j.spent || 0) + n; msg = '花了 ' + R.fmt(n) + '（公司帳戶）'; } }

        else if (e.delay) { j.end += e.delay * 60000; msg = '多等 ' + e.delay + ' 分鐘'; }

        if (e.odds && j.ok && Math.random() < -e.odds / Math.max(.1, j.p)) { j.ok = false; j.why = '突發狀況「' + inc.t + '」，被叫醒的人手一抖'; }
        if (e.bet) { if (Math.random() < .3) { j.ok = true; j.betWon = true; j.bonus = (j.bonus || 0) + .5; msg = '賭贏了！結案多拿五成'; } else { j.ok = false; j.why = '突發狀況「' + inc.t + '」賭一把輸了'; msg = '賭輸了……這件會做砸'; } }   // 使用者回報：新人以為輸了只是重做，結果倒扣錢——後果要寫實話、結案單寫原因
        incOpen = null; save(); hide(); render(); if (msg) toast(msg);
    }

    // ---------- 員工 ----------
    function openStaff(s) {
        const sp = s.special ? R.SPECIALS[s.key] : null, j = s.job ? S.jobs.find(x => x.id === s.job) : null;
        const say = sp ? R.pick(sp.say) : '「' + s.say + '」';
        const need = R.expNeed(s.lv), tp = R.trainPrice(S.stage, s);
        show(`<div class="hd2"><h2>${esc(R.staffName(s))}</h2><button class="x" id="sClose">關</button></div>
            <div class="top" style="display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center">${avaHtml(spriteKey(s), 'ava" style="width:76px;height:76px;border-radius:16px')}<div class="bubble">${esc(say)}</div></div>
            <div style="margin-top:12px;font-size:10.5px;color:var(--sub)">Lv.${s.lv}・${s.special ? '特別人選 <span class="star"></span>' : s.trial ? '試用期' : '一般員工・' + R.COLORS[s.color]}</div>
            ${statsHtml(s)}
            ${sp ? `<div class="skill"><b>本事・${sp.skill}</b>：${sp.skillText}</div>` : ''}
            <div class="kv num"><span>薪水抽 ${R.shares(s).toFixed(1).replace('.0', '')} 份（案子的三成照份數分）・做過 ${s.done} 件（做砸 ${s.failed} 件）</span></div>
            <div class="kv num"><span>經驗</span><b>${s.lv >= R.MAX_LV ? '滿級' : Math.floor(s.exp / need * 100) + '%・再做約 ' + Math.ceil(need - s.exp) + ' 件升 Lv.' + (s.lv + 1)}</b></div><div class="bar"><i style="width:${s.lv >= R.MAX_LV ? 100 : s.exp / need * 100}%"></i></div>
            ${j ? `<div class="kv num"><span>在做〈${esc(j.c.title)}〉・${R.clock((j.end - now()) / 1000)}</span></div>` : ''}
            <div class="btns"><button class="num" id="sTrain" ${s.lv >= R.MAX_LV ? 'disabled' : ''}>訓練 ${R.fmt(tp)}<br><small style="font-size:9.5px;color:var(--sub)">錢包付</small></button><button class="warn" id="sFire" ${s.job ? 'disabled' : ''}>請他走</button></div>
            <div class="kv" style="justify-content:flex-end;margin-top:6px"><span>${s.job ? '做事中不能請走' : '請走的話簽約金不退'}</span></div>`);
        $('sClose').onclick = hide;
        $('sTrain').onclick = () => { if (!payWallet(tp)) return; s.exp = 0; s.lv++; dexNote(s).lv = Math.max(dexNote(s).lv, s.lv); const can = [0, 1, 2, 3].filter(i => s.st[i] < 5); if (can.length) s.st[R.pick(can)]++; save(); toast(R.staffName(s) + '升到 Lv.' + s.lv); openStaff(s); render(); };
        $('sFire').onclick = async () => { if (!await ask('請' + esc(R.staffName(s)) + '走？', '簽約金不退。', { ok: '請他走', warn: true })) return; S.staff = S.staff.filter(x => x !== s); if (s.special) S.hiredSp = S.hiredSp.filter(k => k !== s.key); save(); hide(); render(); toast(R.staffName(s) + '收拾東西走了'); };
    }
    const DEX_MILES = [[10, '小動物收容所'], [20, '萬事屋人力銀行'], [41, '全員到齊']];
    const dexCount = () => Object.keys(S.dex.sp).length + Object.keys(R.SPECIES).reduce((a, k) => a + (S.dex.gen[k] || []).length, 0);
    // 圖鑑的資料（點格子看）：每一種／每一位第一次來的日子、做過幾件、最高等級
    function dexNote(s) { const D = S.dexInfo = S.dexInfo || {}; return D[s.key] = D[s.key] || { first: now(), done: 0, lv: s.lv }; }
    function addDex(s) { dexNote(s); addDex0(s); const n = dexCount(); S.dexMiles = S.dexMiles || []; DEX_MILES.forEach(([m, t]) => { if (n >= m && !S.dexMiles.includes(m)) { S.dexMiles.push(m); S.freeRef = (S.freeRef || 0) + 1; setTimeout(() => toast('圖鑑 ' + m + ' 格・' + t + '！送一次免費換應徵'), 600); } }); }
    function addDex0(s) { if (s.special) S.dex.sp[s.key] = S.dex.sp[s.key] || Date.now(); else { const a = S.dex.gen[s.key] = S.dex.gen[s.key] || []; if (!a.includes(s.color)) a.push(s.color); } }
    function openApply() {
        const full = S.staff.length >= st().seats, left = Math.max(0, S.applyAt - now());
        show(`<div class="hd2"><h2>應徵</h2><button class="x" id="aClose">關</button></div>
            <div class="sub" style="margin:0 2px"><span class="num">員工 ${S.staff.length} / ${st().seats}${full ? '・坐滿了，搬家才有位子' : '・還能請 ' + (st().seats - S.staff.length) + ' 位'}</span><span class="r num">錢包 ${R.fmt(wal())}</span></div>
            ${S.applicants.map((s, k) => { const sp = s.special ? R.SPECIALS[s.key] : null, fee = R.hireFee(S.stage, s);
                return `<div class="app glass${sp ? ' gold' : ''}" style="margin:10px 0 0">${avaHtml(spriteKey(s))}<div><div class="nm">${esc(R.staffName(s))}${sp ? '<span class="star"></span><small>特別人選</small>' : '<small>一般・' + R.COLORS[s.color] + '</small>'}</div>${statsHtml(s)}<div class="say">${esc(sp ? sp.skill + '：' + sp.skillText : s.say)}</div></div>
                <div class="ft num"><span>簽約金 <b>${R.fmt(fee)}</b>・薪水抽 ${sp ? 1.5 : 1} 份</span><button data-k="${k}" ${full ? 'disabled' : ''}>聘用</button></div></div>`; }).join('') || '<div class="empty">這一批都請完了</div>'}
            <div class="cta"><button class="num" id="aFree" disabled>${R.clock(left / 1000)} 後免費換</button><button class="main num" id="aRef" style="flex:1">${S.freeRef ? '圖鑑獎勵・免費換 ×' + S.freeRef : '現在換一批 ' + R.fmt(st().refresh)}</button></div>`);

    // ---------- 畫辦公室 ----------
    // 使用者 2026-11-25：辦公室完全靜態——加動態：燈泡的光會呼吸（舊燈泡偶爾閃一下）、光裡有灰塵飄、螢幕上的字一行一行打、
    // 做事的員工跟著打字點頭、閒著的偶爾伸個懶腰、茱莉鴨睡著冒 Z、案子做完在頭上飄「+$」
    const firstCh = () => S && S.name ? Array.from(S.name.trim())[0] : '';   // 門牌上的字：公司名字的第一個字
    if (document.fonts) document.fonts.ready.then(() => { if (window.CompanyOffice && CompanyOffice.clearGlyphs) CompanyOffice.clearGlyphs(); baseStage = -1; });   // 字型載好再重畫一次門牌
    let baseName = '', baseCv = null, baseStage = -1, seats = [], ofx = { mon: [], bulb: [] }, dust = [], monBg = [], floats = [];
    function drawScene() {
        if (!S || !S.name) return;
        const cv = $('cv'), x = cv.getContext('2d');
        const L = look();
        if (baseStage !== L || baseName !== S.name) { baseName = S.name; baseCv = document.createElement('canvas'); seats = CompanyOffice.paint(baseCv, L + 1, firstCh()).slice(); ofx = CompanyOffice.fx(L + 1); baseStage = L;
            const bx = baseCv.getContext('2d'); monBg = ofx.mon.map(([mx, my]) => { const d = bx.getImageData(mx + 6, my + 3, 1, 1).data; return 'rgb(' + d[0] + ',' + d[1] + ',' + d[2] + ')'; });
            dust = []; ofx.bulb.forEach(([lx, ly]) => { for (let k = 0; k < 7; k++) dust.push({ cx: lx, cy: ly, a: Math.random() * 6.28, r: 4 + Math.random() * 16, h: Math.random(), sp: .5 + Math.random() }); }); cv.width = baseCv.width; cv.height = baseCv.height; cv.style.width = baseCv.width + 'px'; cv.style.height = baseCv.height + 'px'; $('sceneHint').hidden = baseCv.width <= 380; requestAnimationFrame(() => { $('scene').scrollLeft = L === 4 ? 250 : 0; }); }   // 大樓一打開先看辦公區，大廳往左滑
        x.imageSmoothingEnabled = false; x.drawImage(baseCv, 0, 0);
        const T = performance.now() / 1000;
        // 燈泡：光暈慢慢呼吸；舊燈泡每 9 秒左右閃一下
        ofx.bulb.forEach(([lx, ly, old], k) => { let a = .16 + .06 * Math.sin(T * 1.7 + k * 2); if (old && (T + k * 3.1) % 9 < .18) a = .02;
            const g = x.createRadialGradient(lx, ly, 1, lx, ly, 22); g.addColorStop(0, 'rgba(255,226,150,' + a + ')'); g.addColorStop(1, 'rgba(255,226,150,0)'); x.fillStyle = g; x.fillRect(lx - 22, ly - 22, 44, 44); });
        // 光裡的灰塵：慢慢往上飄
        dust.forEach(d => { const h = (d.h + T * .02 * d.sp) % 1, px = Math.round(d.cx + Math.cos(d.a + T * .3 * d.sp) * d.r * .6), py = Math.round(d.cy + 26 - h * 40); x.fillStyle = 'rgba(255,244,214,' + (.55 * Math.sin(h * Math.PI)).toFixed(2) + ')'; x.fillRect(px, py, 1, 1); });
        // 螢幕：字一行一行打出來、打滿就清掉重來
        ofx.mon.forEach(([mx, my, mw, mh], k) => { const ph = (T * .7 + k * .37) % 1, n = Math.floor(ph * 10);
            x.fillStyle = monBg[k]; x.fillRect(mx, my, mw, mh); x.fillStyle = 'rgba(38,58,70,.45)';
            for (let r = 0; r < 3; r++) { const len = Math.min(n * 3 - r * 9, [9, 7, 8][r]); if (len > 0) x.fillRect(mx + 1, my + 1 + r * 2, len, 1); }

    // 執行長增資：自己選金額，＋／－一次 1,000（使用者 2026-11-25）；長按會一直加
    function openInject(injLeft, next) {

        const clamp = v => Math.max(lo, Math.min(max, v));

              <div style="display:flex;gap:8px;justify-content:center;margin-top:12px">${short && Math.ceil(short / 1000) * 1000 <= max ? '<button class="mini num" id="iShort" style="font:inherit;font-size:11px;padding:6px 12px;border-radius:10px;border:1px solid rgba(47,125,144,.5);background:none;color:var(--teal)">補到能搬家</button>' : ''}<button class="mini num" id="iMax" style="font:inherit;font-size:11px;padding:6px 12px;border-radius:10px;border:1px solid rgba(47,125,144,.5);background:none;color:var(--teal)">全部 ${R.fmt(max)}</button></div></div>

        const step = d => { amt = clamp(d < 0 && amt % 1000 ? Math.floor(amt / 1000) * 1000 : amt + d); draw(); };   // 不是整千的（例如上限 $33,500）先對齊到整千

            const stop = () => { clearTimeout(t1); clearInterval(t2); };

n": ["....e..E..e.....", "...eEe.eE.eEe...", "..eEeEeEeEeEeE..", "...EeYeEeEreE...", "..eEeEeEeEeEe...", "..nnnnnnnnnnnn..", "..nNNNNNNNNNNn..", "..nNNNNNNNNNNn..", "..nnnnnnnnnnnn..", "................", "................", "................", "................", "................", "................", "................"], "canteen": ["................", "................", "................", "................", "...gGGGGGGGGg...", "..gGwwwwwwwwGg..", ".kkkkkkkkkkkkkk.", ".kwwwwwwwwwwwwk.", ".kwoowyywweewwk.", ".kwOOwYYwwEEwwk.", ".kkkkkkkkkkkkkk.", "..k..........k..", "..k..........k..", "..k..........k..", "..kk........kk..", "................"], "autodoor": ["................", ".kkkkkkkkkkkkkk.", ".kGGGGGGGGGGGGk.", ".kGkkkkkkkkkkGk.", ".kGkeeeeeeeekGk.", ".kGkkkkkkkkkkGk.", ".kGGGGGGGGGGGGk.", ".kkkkkkkkkkkkkk.", "................", "................", "................", "................", "................", "................", "................", "................"], "roofsign": ["kkkkkkkkkkkkkkkk", "kYyYyYyYyYyYyYyk", "kyRRRRyRRRRyRRyk", "kYyRRyyRyyRyRRYk", "kyRRRRyRRRRyRRyk", "kYyYyYyYyYyYyYyk", "kkkkkkkkkkkkkkkk", ".k............k.", ".k............k.", "kkk..........kkk", "................", "................", "................", "................", "................", "................"]};
    // 每間辦公室三樣設備放哪裡（下緣中間；車庫的電風扇、印表機放桌上）
    const EQ_POS = [{ strip: [112, 187], fan: [272, 150], printer: [96, 150] }, { chair: [14, 189], coffee: [289, 117], noise: [236, 117] },
        { snack: [272, 106], stand: [240, 106], screen: [345, 62] }, { holo: [570, 189], massage: [570, 140], garden: [300, 93] }, { canteen: [640, 146], autodoor: [25, 92], roofsign: [170, 121] }];
    function paintEq(x, key, ox, oy) { const rows = EQ_ART[key]; if (!rows) return; rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === '.') return; x.fillStyle = PAL[ch]; x.fillRect(ox + i, oy + j, 1, 1); })); }
    const eqBottom = key => { const rows = EQ_ART[key]; let b = 15; while (b > 0 && !/[^.]/.test(rows[b])) b--; return b; };
    function drawIcons() {
        document.querySelectorAll('canvas[data-eq]').forEach(cv => { const x = cv.getContext('2d'); x.clearRect(0, 0, 16, 16); paintEq(x, cv.dataset.eq, 0, 0); });
        document.querySelectorAll('canvas[data-ic]').forEach(cv => {
            const x = cv.getContext('2d'), rows = ICONS[cv.dataset.ic], off = cv.dataset.off;
            x.clearRect(0, 0, 12, 12);
            if (!rows) { x.fillStyle = off ? '#b8c5cf' : '#9fb1c0'; x.fillRect(3, 3, 6, 6); x.fillStyle = off ? '#dfe5e9' : '#e6ecf0'; x.fillRect(4, 4, 4, 4); return; }   // 之後的設備還沒畫小圖
            rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === '.') return; x.fillStyle = off ? '#b8c5cf' : PAL[ch]; x.fillRect(i, j, 1, 1); }));
        });
    }

    // ---------- 你不在的時候 ----------
    function away() {
        const gap = Date.now() - (S.lastSeen || Date.now());
        if (gap < 10 * 60000) return;
        const from = now() - gap;
        const finished = S.jobs.filter(j => !j.collected && j.end > from && j.end <= now());
        tick();
        const ready = S.jobs.filter(j => j.fin && !j.collected), sum = ready.reduce((a, j) => a + j.res.net, 0);
        const h = Math.floor(gap / 3600000), m = Math.floor(gap % 3600000 / 60000);
        const ups = finished.flatMap(j => j.ups || []);
        show(`<div class="away glass" style="margin:0"><div class="lb" style="font-size:10.5px;letter-spacing:.3em;color:var(--teal);display:flex;gap:6px;align-items:center"><span class="dot"></span>你不在的時候</div>
              <div class="tm num">${h ? h + ' 小時 ' : ''}${m} 分鐘</div>
              <div class="big num"><b>${R.fmt(sum)}</b><span>做完 ${finished.filter(j => j.ok).length} 件・做砸 ${finished.filter(j => !j.ok).length} 件</span></div></div>
              <div class="panel glass" style="margin:10px 0 0">
                <div class="it"><span class="k">員工</span><span class="v">${ups.length ? ups.map(([id, lv]) => { const s = staffById(id); return s ? esc(R.staffName(s)) + '升到 Lv.' + lv : ''; }).join('、') : '大家都在'}</span></div>
                <div class="it"><span class="k">委託</span><span class="v">委託板上有 ${S.board.length} 張${S.board.some(c => c.tag === 'super') ? '・<span style="color:#8a6a26">1 張特好賺</span>' : ''}</span></div>
              </div>
              <div class="cta"><button id="awOk">好</button>${ready.length ? `<button class="main num" id="awAll">全部收款 ${R.fmt(sum)}</button>` : ''}</div>`, { center: true });
        $('awOk').onclick = hide; if ($('awAll')) $('awAll').onclick = () => { hide(); go('office'); $('collectAll').click(); };
    }

    // ---------- 開始 ----------
    function start() { if (!S || !S.name) openNote(0); else { tick(); render(); away(); } }
    // 正式：先登入、從後端讀存檔（等的時候蓋板）
    async function boot() {
        Busy.show('load');
        try { await Line.ready; } catch (e) { }
        if (!Line.loggedIn) { await Busy.hide(); return gateLogin(); }
        let r = null;
        try { r = await Line.call({ type: 'companyLoad' }); } catch (e) { }
        if (!r) { await Busy.hide(); return gateError('連不到後端，可能是網路不穩。'); }
        if (r.result === 'unauthorized') { await Busy.hide(); return gateLogin(); }
        if (r.result !== 'success') { await Busy.hide(); return gateError(/不認得的請求/.test(r.error || '') ? '後端還是舊版，<br>要在 Apps Script 重新部署「新版本」。' : esc(r.error || '後端沒回應')); }
        S = r.save; rev = r.rev; founder = !!r.founder; fixup(); if (S && S.wallet !== undefined) delete S.wallet;
        $('main').hidden = false;
        await Busy.hide();
        start();
    }
    // 離開超過三分鐘回來：先看看另一支手機有沒有動過（有就換成那份），再算「你不在的時候」
    async function resync() {
        blocking = true; Busy.show('sync');
        try {
            if (pushing) await pushing;
            const r = await Line.call({ type: 'companyLoad' });
            if (r.result === 'success' && r.save && r.rev !== rev) { S = r.save; rev = r.rev; dirty = false; fixup(); if (S.wallet !== undefined) delete S.wallet; hide(); render(); }
            else if (r.result === 'unauthorized') { blocking = false; await Busy.hide(); return loggedOut(); }
        } catch (e) { }
        await Busy.hide(); blocking = false;
    }
    if (PREVIEW) start(); else boot();
    if (LIVE) {
        Line.on(type => { if (type === 'logout' && S) loggedOut(); });
        Wallet.on(type => { if (type === 'server' && S && S.name) render(); });   // 別支手機賺了錢：錢包數字跟著變
        window.addEventListener('pagehide', () => { if (S && S.name) { S.lastSeen = Date.now(); push(true); } });
    }
    setInterval(() => {
        if (!S || !S.name || blocking) return;
        tick(); S.lastSeen = Date.now(); save();
        if (LIVE && !document.hidden && Date.now() - lastPush > 30000) push();   // 大約 30 秒送一次存檔
    }, 1000);
    let hiddenAt = 0;
    document.addEventListener('visibilitychange', async () => {
        if (!S || !S.name) return;
        if (document.hidden) { hiddenAt = Date.now(); S.lastSeen = Date.now(); save(); push(true); return; }
        if (LIVE && hiddenAt && Date.now() - hiddenAt > 3 * 60000 && !blocking) await resync();
        if (S && S.name) { away(); tick(); startAnim(); }
    });
    window.__company = { get S() { return S; }, get rev() { return rev; }, Busy, push, tick, render, R, inc() { incAt = 1; }, away };   // 試玩時給測試用
})();
</script>
