    const fresh = () => ({ v: 1, name: '', stage: 0, acct: 0, wallet: TRIAL_MONEY, jobsDone: 0, staff: [], board: [], jobs: [], done: [], applicants: [], applyAt: 0, nextBoardAt: 0, adUntil: 0,
        series: {}, gifts: [], equip: {}, dex: { sp: {}, gen: {} }, hiredSp: [], last: null, today: { d: '', net: 0 }, inject: { d: '', amt: 0 }, lastSeen: 0, shift: 0, tut: 0, created: Date.now() });

    // ---------- 角色圖 ----------
    const SP = {};
    const ANCHOR = { apple: 27, raccoon: 24, captain: 22, cat: 40, dog: 24, mole: 21, pigeon: 20, sparrow: 17, squirrel: 18, hamster: 17, rabbit: 16, hedgehog: 20, frog: 17, turtle: 25, xiaowu: 20, nugget: 24, julie: 29, 'julie-sleep': 36 };
    let spritesLeft = Object.keys(ANCHOR).length;
    Object.keys(ANCHOR).forEach(k => { const im = new Image(); im.onload = () => { if (--spritesLeft === 0) drawScene(); }; im.src = 'assets/company/' + k + '.png?v=20261125a'; SP[k] = im; });
    const spriteKey = s => s.key;
    const avaHtml = (key, cls = 'ava') => `<div class="${cls}"><img class="px" src="assets/company/${key}.png?v=20261125a" alt=""></div>`;

    // ---------- 共用 ----------
    const st = () => R.STAGES[S.stage];
    const staffById = id => S.staff.find(s => s.id === id);
    const idle = () => S.staff.filter(s => !s.job);
    const running = () => S.jobs.filter(j => !j.fin);
    const today = () => new Date(now()).toLocaleDateString('sv-SE');
    const plateCls = () => 'np np' + (S.stage + 1);
    const reqText = ([i, n]) => R.STATS[i][1] + ' ' + n + ' 以上';
    const tagChip = c => c.tag === 'super' ? '<span class="chip gold">特好賺</span>' : c.tag === 'rush' ? '<span class="chip shu">急件</span>' : c.tag === 'big' ? '<span class="chip gold">大案</span>' : c.tag === 'talk' ? '<span class="chip">要先談</span>' : '';
    const segHtml = (n, hi) => '<i class="seg' + (hi ? ' hi' : '') + '">' + [0, 1, 2, 3, 4].map(k => k < n ? '<i class="f"></i>' : '<i></i>').join('') + '</i>';
    const statsHtml = s => '<div class="st">' + R.STATS.map(([, lab], i) => `<span>${lab}${segHtml(s.st[i], s.st[i] >= 5)}</span>`).join('') + '</div>';
    const toast = m => { document.querySelectorAll('.toast').forEach(e => e.remove()); window.showToast ? showToast(m) : alert(m); };   // 一次只留一張，不然會疊在一起
    function payWallet(n) { if (S.wallet < n) { toast('試玩錢包不夠了（公司頁最下面可以加）'); return false; } S.wallet -= n; return true; }

    // ---------- 開場（三張紙條 → 取名字 → 送一位試用員工＋雞塊的教學案） ----------
    const NOTES = [
        ['許願池的回信', '「創一家公司，讓我當執行長。」<br>准了。但執行長自己出錢。', '准'],
        ['茱莉鴨留在門口的紙條', '車庫借你。<br>條件是，下午兩點到四點不要吵我。', '好'],
        ['咚、咚、咚', '雞塊站在鐵捲門外面，手裡拿著一張紙：<br>「聽說這裡開了公司？我有一件小事想拜託。」', '開門'],
    ];
    function openNote(i) {
        if (i >= NOTES.length) return openName();
        const [from, text, btn] = NOTES[i];
        show(`<div class="note glass" style="margin:0"><div class="from">${from}</div><p>${text}</p><div class="nx"><div class="dots">${NOTES.map((_, k) => `<i${k === i ? ' class="on"' : ''}></i>`).join('')}</div><button id="nNext">${btn}</button></div></div>
              <div style="text-align:center;margin-top:10px"><button class="x" id="nSkip" style="font:inherit;font-size:11px;letter-spacing:.2em;color:#6a7884;background:none;border:0">略過</button></div>`, { center: true, lock: true });
        $('nNext').onclick = () => openNote(i + 1); $('nSkip').onclick = () => openName();
    }
    function openName() {
        const SUG = ['丼步喱設計社', '二十七樓萬事屋', '午睡設計所', '不要沾醬有限公司'];
        show(`<div class="hd2"><h2>先幫公司取個名字</h2></div>
              <div class="namef" style="margin:0;padding:0"><div class="q"><small>最多 12 個字・名片和排行榜都會寫這個・之後可以改一次</small></div>
              <div class="in"><input id="nm" maxlength="12" placeholder="公司名字" value="${esc(SUG[0])}"><small class="num" id="nmCount"></small></div>
              <div class="sug">${SUG.map(s => `<span class="chip" data-s="${esc(s)}">${esc(s)}</span>`).join('')}</div></div>
              <div class="cta" style="margin-top:16px"><button class="main" id="nmOk" style="flex:1">就叫這個</button></div>`, { center: true, lock: true });
        const upd = () => { $('nmCount').textContent = [...$('nm').value].length + ' / 12'; };
        upd(); $('nm').oninput = upd;
        document.querySelectorAll('.sug .chip').forEach(c => c.onclick = () => { $('nm').value = c.dataset.s; upd(); });
        $('nmOk').onclick = () => {
            const name = [...$('nm').value.trim()].slice(0, 12).join('');
            if (!name) return toast('先取個名字');
            S = fresh(); S.name = name; S.lastSeen = Date.now();
            const trial = R.newStaff('hamster', false); trial.nick = '小麥'; trial.trial = true; trial.st = [3, 3, 2, 2]; trial.color = 0;
            S.staff.push(trial); addDex(trial);
            S.board = [R.tutorialCase(now())]; S.nextBoardAt = now() + 60000; S.tut = 1;
            S.applicants = R.applicants(0, []); S.applyAt = now() + R.FREE_REFRESH * 60000;
            save(); hide(); go('board'); toast('送你一位試用期的員工：倉鼠・小麥');
        };
    }

    // ---------- 蓋上來的那一層 ----------
    let layerLock = false;
    function show(html, opt = {}) { $('sheet').innerHTML = html; $('layer').hidden = false; $('layer').classList.toggle('center', !!opt.center); layerLock = !!opt.lock; $('sheet').scrollTop = 0; }
    function hide() { $('layer').hidden = true; $('sheet').innerHTML = ''; layerLock = false; incOpen = null; }
    $('layerBack').onclick = () => { if (!layerLock) hide(); };

    // ---------- 分頁 ----------
    let view = 'office', seg = 'move';
    function go(v) { view = v; document.querySelectorAll('.view').forEach(e => e.hidden = e.id !== 'v-' + v); document.querySelectorAll('#tabs span').forEach(e => e.classList.toggle('on', e.dataset.v === v)); render(); window.scrollTo(0, 0); }
    document.querySelectorAll('#tabs span').forEach(e => e.onclick = () => go(e.dataset.v));
    document.querySelectorAll('#seg span').forEach(e => e.onclick = () => { seg = e.dataset.seg; document.querySelectorAll('#seg span').forEach(x => x.classList.toggle('on', x === e)); renderCompany(); });
    $('goBoard').onclick = () => go('board');

    // ---------- 時間往前走：做完、貼新案子、撤掉過期的 ----------
    function tick() {
        if (!S || !S.name) return;
        const t = now(); let changed = false;
        for (const j of S.jobs) if (!j.fin && j.end <= t) { finish(j); changed = true; }
        const before = S.board.length;
        S.board = S.board.filter(c => c.tutorial || c.expires > t);
        if (S.board.length !== before) changed = true;
        const max = R.BOARD_MAX + (S.adUntil > t ? 1 : 0);
        if (!S.tut) {
            if (S.nextBoardAt <= t) {
                while (S.board.length < max && S.nextBoardAt <= t) { addCase(S.nextBoardAt); S.nextBoardAt += R.BOARD_EVERY * 60000; changed = true; }
                if (S.nextBoardAt <= t) S.nextBoardAt = t + R.BOARD_EVERY * 60000;
            }
        }
        if (S.applyAt <= t) { S.applicants = R.applicants(S.stage, S.hiredSp); S.applyAt = t + R.FREE_REFRESH * 60000; changed = true; }
        if (changed) { save(); render(); }
        else renderLive();
        incidentTick(t);
    }
    function addCase(at) {
        const onBoard = S.board.filter(c => c.seriesNo).map(c => c.client).concat(S.jobs.filter(j => !j.collected && j.c.seriesNo).map(j => j.c.client));
        const superOn = S.board.some(c => c.tag === 'super');
        let c = null;
        for (let k = 0; k < 6; k++) { c = R.newCase(S.stage, { now: at, series: S.series, onBoard, noSuper: superOn }); if (!S.board.some(b => b.title === c.title && b.client === c.client)) break; }   // 同一張不要貼兩次
        if (!superOn && !c.seriesNo && S.adUntil > at && Math.random() < .1) { c.tag = 'super'; c.gross *= 2; c.expires = at + R.SUPER_LIFE * 60000; }
        S.board.push(c);
    }
    function finish(j) {
        j.fin = true;
        const team = j.team.map(staffById).filter(Boolean);
        const ctx = { souvenir: S.gifts.includes(j.c.client), equip: (S.equip[S.stage] || []).length };
        j.res = R.settle(j, team, ctx);
        j.ups = [];
        team.forEach(s => { s.job = null; s.done++; if (!j.ok) s.failed++; const ups = R.gainExp(s, j.ok ? (j.great ? 2 : 1) : 1); ups.forEach(([lv, i]) => j.ups.push([s.id, lv, i])); });
        j.finAt = j.end;
    }

    // ---------- 收款 ----------
    function collect(j) {
        if (j.collected) return null;
        j.collected = true;
        S.acct += j.res.net; S.jobsDone++;
        if (S.today.d !== today()) S.today = { d: today(), net: 0 };
        S.today.net += j.res.net;
        let gift = null;
        const c = j.c;
        if (j.ok && c.seriesNo) {
            const team = j.team.map(staffById).filter(Boolean);
            const step = team.some(s => s.special && s.key === 'mole') ? 2 : 1;
            S.series[c.client] = Math.min(5, Math.max(S.series[c.client] || 0, c.seriesNo - 1 + step));
            if (S.series[c.client] >= 5 && !S.gifts.includes(c.client)) { S.gifts.push(c.client); gift = c.client; }
        }
        if (c.tutorial) { S.tut = 0; const t0 = now(); for (let k = 0; k < 3; k++) addCase(t0); S.nextBoardAt = t0 + R.BOARD_EVERY * 60000; }
        return gift;
    }
    $('collectAll').onclick = () => {
        const ready = S.jobs.filter(j => j.fin && !j.collected);
        if (!ready.length) return;
        if (ready.length === 1) return openReceipt(ready[0]);
        let sum = 0, okN = 0, bad = 0; const gifts = [];
        ready.forEach(j => { sum += j.res.net; j.ok ? okN++ : bad++; const g = collect(j); if (g) gifts.push(g); });
        S.jobs = S.jobs.filter(j => !j.collected); save(); render();
        show(`<div class="hd2"><h2>全部收款</h2><button class="x" id="xClose">關</button></div>
              <div class="rc glass" style="margin:0"><div class="lb"><span class="dot"></span>${ready.length} 件結案</div>
              ${ready.map(j => `<div class="ln num"><span>〈${esc(j.c.title)}〉${j.ok ? '' : '<span class="dn">做砸了</span>'}</span><span class="${j.res.net < 0 ? 'dn' : ''}">${R.fmt(j.res.net)}</span></div>`).join('')}
              <div class="ln tot num"><span>入帳公司帳戶</span><span class="v">${R.fmt(sum)}</span></div>
              ${upsHtml(ready.flatMap(j => j.ups))}${gifts.map(giftHtml).join('')}</div>
              <div class="cta"><button class="main" id="xOk" style="flex:1">收下</button></div>`, { center: true });
        $('xClose').onclick = $('xOk').onclick = hide;
    };
    const upsHtml = ups => ups.length ? `<div class="lvup">${ups.map(([id, lv, i]) => { const s = staffById(id); return s ? `<b>${esc(R.staffName(s))}升到 Lv.${lv}</b>${i >= 0 ? '：' + R.STATS[i][1] + ' +1' : ''}` : ''; }).join('<br>')}</div>` : '';
    const giftHtml = k => `<div class="skill" style="margin-top:10px"><b>拿到紀念品・${esc(R.CLIENTS[k].gift)}</b><br>${esc(R.CLIENTS[k].who)}的系列五件都做完了。之後他的案子多拿 5%。</div>`;
    function openReceipt(j) {
        const team = j.team.map(staffById).filter(Boolean), r = j.res, c = j.c;
        const gift = collect(j);
        S.jobs = S.jobs.filter(x => x !== j); save(); render();
        const cl = R.CLIENTS[c.client];
        show(`<div class="rc glass" style="margin:0"><div class="lb${r.ok ? '' : ' bad'}"><span class="dot"${r.ok ? '' : ' style="background:#b33a2f;box-shadow:0 0 0 3px rgba(179,58,47,.2),0 0 8px rgba(179,58,47,.8)"'}></span>${c.tutorial ? '第一張結案單' : r.ok ? '結案單' : '做砸了'}</div>
              <h2>${avaHtml(c.client)}<span>〈${esc(c.title)}〉<div class="who">${esc(cl.who)}・${team.map(s => esc(R.staffName(s))).join('、') || '—'}做的</div></span></h2>
              <div class="ln num" style="margin-top:10px"><span>案子${r.ok ? '' : '（只付一成）'}</span><span>${R.fmt(r.base)}</span></div>
              ${r.extra.map(([t, v]) => `<div class="ln num"><span>${esc(t)}</span><span class="up">+${R.fmt(v)}</span></div>`).join('')}
              <div class="ln num"><span>薪水（${r.ok ? '案子的三成' : '做砸了扣一半'}）</span><span class="dn">−${R.fmt(r.salary)}</span></div>
              ${r.per.map(([s, full, paid]) => `<div class="ln sub num"><span>${esc(R.staffName(s))} Lv.${s.lv}・${R.shares(s).toFixed(1).replace('.0', '')} 份</span><span>${r.ok ? R.fmt(paid) : R.fmt(full) + ' → ' + R.fmt(paid)}</span></div>`).join('')}
              <div class="ln tot num"><span>入帳公司帳戶</span><span class="v ${r.net < 0 ? 'dn' : ''}">${R.fmt(r.net)}</span></div>
              ${upsHtml(j.ups)}${gift ? giftHtml(gift) : ''}
              ${!r.ok ? `<div class="kv"><span>開工前寫的做得好機率是 ${R.odds(j.p)}</span></div>` : ''}
              ${c.tutorial ? `<div class="kv" style="display:block;line-height:1.7"><span>名片印好了：${esc(S.name)}・創始執行長。<br>委託那頁會開始貼新的案子，人手不夠就去「員工」看應徵的人。</span></div>` : ''}</div>
              <div class="cta"><button class="main" id="xOk" style="flex:1">收下</button></div>`, { center: true });
        $('xOk').onclick = () => { hide(); if (c.tutorial) go('staff'); };
    }

    // ---------- 派人 ----------
    let pickSel = [];
    function openDispatch(c) {
        if (running().length >= st().conc && !c.tutorial) return toast('同時只能做 ' + st().conc + ' 件，等一件做完');
        const free = idle();
        pickSel = (S.last && S.last.ppl === c.ppl ? S.last.ids.filter(id => free.some(s => s.id === id)) : []).slice(0, c.ppl);
        if (c.tutorial) pickSel = [];
        drawDispatch(c);
    }
    function drawDispatch(c) {
        const free = idle(), team = pickSel.map(staffById).filter(Boolean), pl = R.plan(c, team);
        const enough = team.length === c.ppl;
        const cl = R.CLIENTS[c.client];
        show(`<div class="hd2"><h2>派誰去</h2><button class="x" id="dClose">關</button></div>
            <div class="case glass" style="margin:0"><h3>〈${esc(c.title)}〉</h3><div class="who num">${esc(cl.who)}・${c.tutorial ? '30 秒' : R.dur(c.m)}・${R.fmt(c.gross)}・${c.ppl} 人${c.seriesNo ? '・系列 ' + c.seriesNo + ' / 5' : ''}</div>
              ${c.req.length ? '<div class="need" style="display:block">' + c.req.map((q, k) => { const w = pl.who[k]; return `<div class="req2"><span>${reqText(q)}</span><span class="r2" style="color:${w ? '#2f7d90' : '#b33a2f'}">${w ? '合（' + esc(R.staffName(w)) + ' ' + w.st[q[0]] + '）' : team.length ? '缺 ' + pl.short[k] : '還沒選人'}</span>${w ? '<span class="ok">✓</span>' : '<span class="bad2">!</span>'}</div>`; }).join('') + '</div>' : ''}</div>
            <div class="cta"><button class="main" id="dAuto" style="flex:1">幫我派</button><button id="dLast" ${S.last && S.last.ppl === c.ppl ? '' : 'disabled'}>照上次的組合</button></div>
            <div class="panel glass" style="margin-top:10px">${S.staff.map(s => { const on = pickSel.includes(s.id), busy = !!s.job; const j = busy ? S.jobs.find(x => x.id === s.job) : null;
                return `<div class="staff${busy ? ' busy' : ''}" data-id="${s.id}">${avaHtml(spriteKey(s))}<div><div class="nm">${esc(R.staffName(s))}<small>Lv.${s.lv}${s.trial ? '・試用期' : ''}</small></div>${statsHtml(s)}<div class="say">${busy ? '在做〈' + esc(j ? j.c.title : '') + '〉・' + R.clock(j ? (j.end - now()) / 1000 : 0) + ' 後回來' : esc(s.special ? R.SPECIALS[s.key].skill + '：' + R.SPECIALS[s.key].skillText : s.say)}</div></div><div class="chk${on ? ' on' : ''}">${on ? '✓' : ''}</div></div>`; }).join('') || '<div class="empty">還沒有員工</div>'}</div>
            <div class="est glass num" style="margin-top:10px"><span>${enough ? '預計 <b>' + (c.tutorial ? '30 秒' : R.dur(Math.max(1, Math.round(pl.m)))) + '</b>' + (pl.napper ? '（茱莉鴨可能睡一下）' : '') : '要選 ' + c.ppl + ' 人（選了 ' + team.length + '）'}</span><span>做得好 <b>${enough ? R.odds(pl.p) : '—'}</b></span></div>
            <div class="cta"><button class="main" id="dGo" style="flex:1" ${enough ? '' : 'disabled'}>開工</button></div>`);
        if (c.tutorial) { $('sheet').scrollTop = 0; }
        $('dClose').onclick = hide;
        $('dAuto').onclick = () => { const t = R.autoPick(c, idle()); if (!t) return toast('閒著的人不夠 ' + c.ppl + ' 位'); pickSel = t.map(s => s.id); drawDispatch(c); };
        $('dLast').onclick = () => { const ids = S.last.ids.filter(id => idle().some(s => s.id === id)); if (ids.length < c.ppl) return toast('上次的人有的在忙'); pickSel = ids.slice(0, c.ppl); drawDispatch(c); };
        document.querySelectorAll('#sheet .staff').forEach(e => e.onclick = () => { const id = e.dataset.id, s = staffById(id); if (s.job) return; if (pickSel.includes(id)) pickSel = pickSel.filter(x => x !== id); else if (pickSel.length < c.ppl) pickSel.push(id); else { pickSel.shift(); pickSel.push(id); } drawDispatch(c); });
        $('dGo').onclick = () => {
            if (pl.p < .5 && !confirm('做得好的機率只有' + R.odds(pl.p) + '，還是要開工嗎？')) return;
            const j = R.start(c, team, now());
            if (c.tutorial) { j.ok = true; j.great = false; j.napped = false; j.tip = false; j.end = now() + 30000; }
            team.forEach(s => s.job = j.id);
            S.jobs.push(j); S.board = S.board.filter(x => x !== c); S.last = { ppl: c.ppl, ids: team.map(s => s.id) };
            save(); hide(); go('office'); toast('開工了');
        };
    }

    // ---------- 突發狀況（只有開著畫面才跳；15 秒沒選就選第一個） ----------
    let incAt = 0, incOpen = null, incTimer = 0;
    function incidentTick(t) {
        if (document.hidden || !S.name || S.tut) return;
        const pool = running().filter(j => !j.c.tutorial && j.end - t > 60000);
        if (!pool.length) { incAt = 0; return; }
        if (!incAt) incAt = t + (4 + Math.random() * 5) * 60000;
        if (incOpen) { const left = 15 - (t - incOpen.at) / 1000; const bar = $('incBar'); if (bar) bar.style.width = Math.max(0, left / 15 * 100) + '%'; if (left <= 0) applyInc(0); return; }
        if (t < incAt || !$('layer').hidden) return;
        incAt = 0;
        const j = R.pick(pool), inc = R.pick(R.INCIDENTS);
        incOpen = { j, inc, at: t };
        show(`<div class="timer"><i id="incBar" style="width:100%"></i></div>
              <div class="modal" style="position:static;padding:0;background:none;box-shadow:none;border:0"><div class="lb">突發狀況・〈${esc(j.c.title)}〉</div><h2>${inc.t}</h2><p>${inc.d}</p>
              ${inc.o.map(([a, b, e], k) => `<div class="opt${k === 0 ? ' def' : ''}${e.bet ? ' bet' : ''}" data-k="${k}">${k === 0 ? '<span class="tag">沒選就是這個</span>' : e.bet ? '<span class="tag">賭一把</span>' : ''}${a}<small>${e.cost ? '花 ' + R.fmt(R.incidentCost(S.stage, e.cost)) + '（公司帳戶）' : b}</small></div>`).join('')}</div>`, { center: true, lock: true });
        document.querySelectorAll('#sheet .opt').forEach(e => e.onclick = () => applyInc(+e.dataset.k));
    }
    function applyInc(k) {
        if (!incOpen) return;
        const { j, inc } = incOpen, e = inc.o[k][2], team = j.team.map(staffById).filter(Boolean);
        let msg = '';
        if (e.cost) { const n = R.incidentCost(S.stage, e.cost); if (S.acct < n) { toast('公司帳戶不夠，只好等一下'); j.end += 2 * 60000; } else { S.acct -= n; msg = '花了 ' + R.fmt(n); } }
        if (e.neg) { if (team.some(s => s.st[3] >= e.neg)) msg = '談成了，沒事'; else { if (e.delay) j.end += e.delay * 60000; if (e.fail) j.ok = false; msg = e.fail ? '沒談成……要重做' : '沒談成，慢一點'; } }
        else if (e.delay) { j.end += e.delay * 60000; msg = '多等 ' + e.delay + ' 分鐘'; }
        if (e.bonus) j.bonus = (j.bonus || 0) + e.bonus;
        if (e.odds && j.ok && Math.random() < -e.odds / Math.max(.1, j.p)) j.ok = false;
        if (e.bet) { if (Math.random() < .3) { j.ok = true; j.bonus = (j.bonus || 0) + .5; msg = '賭贏了！'; } else { j.ok = false; msg = '賭輸了……'; } }
        incOpen = null; save(); hide(); render(); if (msg) toast(msg);
    }

    // ---------- 員工 ----------
    function openStaff(s) {

            <div class="top" style="display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center">${avaHtml(spriteKey(s), 'ava" style="width:76px;height:76px;border-radius:16px')}<div class="bubble">${esc(say)}</div></div>
            <div style="margin-top:12px;font-size:10.5px;color:#6a7884">Lv.${s.lv}・${s.special ? '特別人選 <span class="star"></span>' : s.trial ? '試用期' : '一般員工・' + R.COLORS[s.color]}</div>

            ${sp ? `<div class="skill"><b>本事・${sp.skill}</b>：${sp.skillText}</div>` : ''}
            <div class="kv num"><span>薪水抽 ${R.shares(s).toFixed(1).replace('.0', '')} 份・做過 ${s.done} 件（做砸 ${s.failed} 件）</span></div>
            <div class="kv num"><span>經驗</span><b>${s.lv >= R.MAX_LV ? '滿級' : Math.floor(s.exp / need * 100) + '%・再做約 ' + Math.ceil(need - s.exp) + ' 件升 Lv.' + (s.lv + 1)}</b></div><div class="bar"><i style="width:${s.lv >= R.MAX_LV ? 100 : s.exp / need * 100}%"></i></div>

            <div class="kv" style="justify-content:flex-end;margin-top:6px"><span>${s.job ? '做事中不能請走' : '請走的話簽約金不退'}</span></div>`);
        $('sClose').onclick = hide;
        $('sTrain').onclick = () => { if (!payWallet(tp)) return; s.exp = 0; s.lv++; const can = [0, 1, 2, 3].filter(i => s.st[i] < 5); if (can.length) s.st[R.pick(can)]++; save(); toast(R.staffName(s) + '升到 Lv.' + s.lv); openStaff(s); render(); };
        $('sFire').onclick = () => { if (!confirm('確定要請' + R.staffName(s) + '走嗎？簽約金不退。')) return; S.staff = S.staff.filter(x => x !== s); if (s.special) S.hiredSp = S.hiredSp.filter(k => k !== s.key); save(); hide(); render(); toast(R.staffName(s) + '收拾東西走了'); };
    }
    function addDex(s) { if (s.special) S.dex.sp[s.key] = S.dex.sp[s.key] || Date.now(); else { const a = S.dex.gen[s.key] = S.dex.gen[s.key] || []; if (!a.includes(s.color)) a.push(s.color); } }
    function openApply() {
        const full = S.staff.length >= st().seats, left = Math.max(0, S.applyAt - now());
        show(`<div class="hd2"><h2>應徵</h2><button class="x" id="aClose">關</button></div>
            <div class="sub" style="margin:0 2px"><span class="num">員工 ${S.staff.length} / ${st().seats}${full ? '・坐滿了，搬家才有位子' : '・還能請 ' + (st().seats - S.staff.length) + ' 位'}</span><span class="r num">錢包 ${R.fmt(S.wallet)}</span></div>
            ${S.applicants.map((s, k) => { const sp = s.special ? R.SPECIALS[s.key] : null, fee = R.hireFee(S.stage, s);
                return `<div class="app glass${sp ? ' gold' : ''}" style="margin:10px 0 0">${avaHtml(spriteKey(s))}<div><div class="nm">${esc(R.staffName(s))}${sp ? '<span class="star"></span><small>特別人選</small>' : '<small>一般・' + R.COLORS[s.color] + '</small>'}</div>${statsHtml(s)}<div class="say">${esc(sp ? sp.skill + '：' + sp.skillText : s.say)}</div></div>
                <div class="ft num"><span>簽約金 <b>${R.fmt(fee)}</b>・薪水抽 ${sp ? 1.5 : 1} 份</span><button data-k="${k}" ${full ? 'disabled' : ''}>聘用</button></div></div>`; }).join('') || '<div class="empty">這一批都請完了</div>'}
            <div class="cta"><button class="num" disabled>${R.clock(left / 1000)} 後免費換</button><button class="main num" id="aRef" style="flex:1">現在換一批 ${R.fmt(st().refresh)}</button></div>`);
        $('aClose').onclick = hide;
        document.querySelectorAll('#sheet .ft button').forEach(b => b.onclick = () => {
            const s = S.applicants[+b.dataset.k], fee = R.hireFee(S.stage, s);

    // ---------- 畫辦公室 ----------
    let baseCv = null, baseStage = -1, seats = [];
    function drawScene() {
        if (!S || !S.name) return;
        const cv = $('cv'), x = cv.getContext('2d');
        if (baseStage !== S.stage) { baseCv = document.createElement('canvas'); seats = CompanyOffice.paint(baseCv, S.stage + 1).slice(); baseStage = S.stage; cv.width = baseCv.width; cv.height = baseCv.height; cv.style.width = baseCv.width + 'px'; cv.style.height = baseCv.height + 'px'; $('sceneHint').hidden = baseCv.width <= 380; requestAnimationFrame(() => { $('scene').scrollLeft = S.stage === 4 ? 250 : 0; }); }   // 大樓一打開先看辦公區，大廳往左滑
        x.imageSmoothingEnabled = false; x.drawImage(baseCv, 0, 0);
        const order = seats.map((p, i) => [p, i]).sort((a, b) => a[0][1] - b[0][1]);   // 後排先畫
        const t = now();
        order.forEach(([[sx, sy], i]) => {
            const s = S.staff[i]; if (!s) return;
            let key = spriteKey(s);
            const j = s.job ? S.jobs.find(q => q.id === s.job) : null;
            if (s.key === 'julie' && j && j.napped) { const u = (t - j.start) / (j.end - j.start); if (u > .35 && u < .7) key = 'julie-sleep'; }
            const im = SP[key]; if (!im || !im.complete || !im.naturalWidth) return;
            x.drawImage(im, Math.round(sx) - ANCHOR[key], Math.round(sy) + 1 - im.naturalHeight);
            if (j) { const u = Math.min(1, Math.max(0, (t - j.start) / (j.end - j.start))); x.fillStyle = 'rgba(38,48,58,.55)'; x.fillRect(Math.round(sx) - 9, Math.round(sy) + 3, 18, 2); x.fillStyle = '#8fd3e0'; x.fillRect(Math.round(sx) - 9, Math.round(sy) + 3, Math.round(18 * u), 2); }
        });
    }

    // ---------- 畫面 ----------
    function render() {
        if (!S || !S.name) return;
        $('money').textContent = R.fmt(S.acct);
        const readyN = S.jobs.filter(j => j.fin && !j.collected).length, newN = S.board.length;

        if (view === 'office') renderOffice(); else if (view === 'board') renderBoard(); else if (view === 'staff') renderStaff(); else renderCompany();
    }
    function renderLive() {   // 每秒只更新倒數和進度
        if (view === 'office') { renderRun(); drawScene(); }
        if (view === 'board') $('boardNext').textContent = S.tut ? '先做完雞塊的這件' : '新案子 ' + R.clock((S.nextBoardAt - now()) / 1000) + ' 後';
    }

        $('title').textContent = '公司・開'; $('moneyLab').textContent = '公司帳戶';
        $('plate').className = plateCls(); $('plate').textContent = S.name;
        $('stageLine').textContent = st().name + '・員工 ' + S.staff.length + ' 人';
        if (S.today.d !== today()) S.today = { d: today(), net: 0 };
        $('kToday').textContent = R.fmt(S.today.net);
        $('kRun').textContent = running().length + ' / ' + st().conc;
        $('kIdle').textContent = idle().length + ' 人';
        $('concLine').textContent = '同時 ' + st().conc + ' 件';
        renderRun(); drawScene();
        const next = R.STAGES[S.stage + 1];
        $('goal').hidden = !next;
        if (next) $('goal').innerHTML = `<div class="gt"><span>下一步・搬到${next.name}</span><span class="r" style="cursor:pointer" id="goMove">公司頁 ›</span></div>
            <div class="g2"><div><div class="gl num"><span>案子</span><b>${Math.min(S.jobsDone, next.jobs)} / ${next.jobs} 件</b></div><div class="bar"><i style="width:${Math.min(100, S.jobsDone / next.jobs * 100)}%"></i></div></div>
            <div><div class="gl num"><span>帳戶</span><b>${R.fmt(S.acct)} / ${R.fmt(next.cost)}</b></div><div class="bar"><i style="width:${Math.min(100, Math.max(0, S.acct / next.cost * 100))}%"></i></div></div></div>`;
        if ($('goMove')) $('goMove').onclick = () => { seg = 'move'; document.querySelectorAll('#seg span').forEach(x => x.classList.toggle('on', x.dataset.seg === 'move')); go('company'); };
    }
    function renderRun() {
        const t = now(), list = S.jobs.slice().sort((a, b) => (b.fin ? 1 : 0) - (a.fin ? 1 : 0) || a.end - b.end);

        $('collectAll').disabled = !ready.length;

        $('runList').innerHTML = list.map(j => {
            const names = j.team.map(staffById).filter(Boolean).map(s => R.staffName(s)).join('、');
            if (j.fin) return `<div class="row done" data-j="${j.id}"><span class="tt">〈${esc(j.c.title)}〉<small>${esc(names)}</small></span><span class="chip${j.ok ? '' : ' shu'} num">${j.ok ? '完成' : '做砸了'}・${R.fmt(j.res.net)}</span></div>`;
            const u = Math.min(1, (t - j.start) / (j.end - j.start)), sleeping = j.napped && u > .35 && u < .7 && j.team.some(id => { const s = staffById(id); return s && s.key === 'julie'; });

                    return `<div class="ser">${avaHtml(k)}<div><div class="nm">${esc(C.who)}・${esc(C.series)}</div><div class="pips">${[0, 1, 2, 3, 4].map(i => `<i class="${i < n ? 'f' : ''}${i === 4 ? ' big' : ''}"></i>`).join('')}</div><div class="nx">${n >= 5 ? '做完了・之後的案子多拿 5%' : lock ? '搬到' + R.STAGES[C.minStage].name + '才會來' : '下一件：〈' + esc(C.jobs[n]) + '〉'}</div></div><div class="gift"><canvas width="12" height="12" data-ic="${k}"${n >= 5 ? '' : ' data-off="1"'}></canvas></div></div>`; }).join('')}</div>`;
            drawIcons();
            document.querySelectorAll('.shelf .slot').forEach(e => e.onclick = () => { const C = R.CLIENTS[e.dataset.k]; toast(S.gifts.includes(e.dataset.k) ? C.gift + '（' + C.who + '送的）' : '做完' + C.who + '的五件系列才拿得到'); });
        } else if (seg === 'equip') {
            const own = S.equip[S.stage] || [], list = R.EQUIP[S.stage];
            B.innerHTML = `<div class="sub" style="margin-top:12px"><span>${st().name}的設備・買了 ${own.length} / 3</span><span class="r num">現在 +${Math.round(own.length * R.EQUIP_BOOST * 100)}%</span></div>
                <div class="panel glass" style="padding:2px 0">${list.map(([k, n, d]) => `<div class="eq"><div class="ic"><canvas width="12" height="12" data-ic="${k}"></canvas></div><div><div class="nm">${n}</div><div class="d">${d}・賺的 +8%</div></div>${own.includes(k) ? '<button class="got">已經有了</button>' : `<button class="num" data-e="${k}">${R.fmt(st().equip)}</button>`}</div>`).join('')}</div>
                <div class="goal glass"><div class="gt"><span>買滿三樣</span><span class="r num">賺的約 +25%</span></div><div class="bar" style="margin-top:8px"><i style="width:${own.length / 3 * 100}%"></i></div></div>
                ${R.EQUIP[S.stage + 1] ? `<div class="sub" style="margin-top:10px"><span>搬家後換新的一組（${R.STAGES[S.stage + 1].name}：${R.EQUIP[S.stage + 1].map(e => e[1]).join('、')}）</span></div>` : ''}`;
            drawIcons();
            document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { const k = b.dataset.e; if (!confirm('用錢包買 ' + R.fmt(st().equip) + '？')) return; if (!payWallet(st().equip)) return; (S.equip[S.stage] = S.equip[S.stage] || []).push(k); save(); renderCompany(); toast('買好了，之後的案子多賺 8%'); });
        } else {
            const spKeys = Object.keys(R.SPECIALS), genKeys = Object.keys(R.SPECIES);
            const n = Object.keys(S.dex.sp).length + genKeys.reduce((a, k) => a + (S.dex.gen[k] || []).length, 0);
            const COL = ['#9fb1c0', '#f2f6f8', '#c9ad7c', '#3a4656'];
            B.innerHTML = `<div class="dex glass"><div class="ttl">員工圖鑑<b class="num">${n} / 41</b></div>
                <div class="sub2">特別人選・9</div><div class="g" style="grid-template-columns:repeat(5,1fr)">${spKeys.map(k => `<div class="c sp${S.dex.sp[k] ? '' : ' off'}"><img src="assets/company/${k}.png?v=20261125a" alt=""></div>`).join('')}</div>
                <div class="sub2">一般員工・8 種 × 4 色（右上角四格是收集到的顏色）</div><div class="g" style="grid-template-columns:repeat(4,1fr)">${genKeys.map(k => { const got = S.dex.gen[k] || []; return `<div class="c${got.length ? '' : ' off'}" style="height:58px"><img src="assets/company/${k}.png?v=20261125a" alt=""><b class="dots4">${[0, 1, 2, 3].map(c => got.includes(c) ? `<i style="background:${COL[c]};box-shadow:0 0 0 1px rgba(40,50,60,.65)"></i>` : '<i style="background:transparent;box-shadow:0 0 0 1px rgba(120,140,155,.3)"></i>').join('')}</b></div>`; }).join('')}</div>
                <div class="miles">${[[10, '免費刷新'], [20, '小動物收容所'], [41, '全員到齊']].map(([m, t]) => `<span class="${n >= m ? 'done' : ''}">${m === 41 ? '全部' : m + ' 格'}<br>${t}</span>`).join('')}</div></div>`;
        }
    }
    // 紀念品、設備的小圖（12×12 像素）
    const PAL = { k: '#3a4656', w: '#ffffff', g: '#c2d0da', G: '#9fb1c0', y: '#e2b44a', Y: '#ffe9a0', o: '#f0a04b', O: '#c97a2e', r: '#e05a4f', R: '#b33a2f', c: '#8fd3e0', C: '#4fa9bf', b: '#3d6fb6', B: '#2b5290', n: '#a77a4c', N: '#7a5634', e: '#6cb487', E: '#2f6e47', s: '#f8e6cf', S: '#ecc9a6' };
    const ICONS = {
        dog: ['....kk......', '....kk......', '...kkkk.....', '....gg...w..', '...gccg.w.w.', '..gcccCg.w..', '..gcwcCg....', '..gcccCg....', '..gcccCg....', '..gCCCCg....', '..gggggg....', '............'],
        nugget: ['..GGG.......', '.G...G......', '.G...G......', '..GGG.......', '...G........', '..oooOO.....', '.oYoooOO....', '.ooooooO....', '.oooYooO....', '..OoooO.....', '...OOO......', '............'],
        apple: ['.....E......', '....EeE.....', '.....n......', '..rrr.rrr...', '.rrwrrrrrR..', '.rwrrrrrrR..', '.rrrrrrrrR..', '.rrrrrrrRR..', '..rrrrrRR...', '...RRRRR....', '............', '............'],
        raccoon: ['............', '...yyyyy....', '..yYYYYYy...', '.yYyyyyyYy..', '.yYyYYyyYy..', '.yYyYyyyYy..', '.yYyyyyyYy..', '.yYyyyyyYy..', '..yYYYYYy...', '...yyyyy....', '............', '............'],
        captain: ['............', '.....n......', '..n..n..n...', '...nnnnn....', '...n...n....', '.nnn.N.nnn..', '...n...n....', '...nnnnn....', '..n..n..n...', '.....n......', '............', '............'],
        mole: ['............', '............', '............', '....yyyy....', '...yYYyyy...', '..yYyyyyyy..', '..yyyyyyyy..', '..yyyyyyyy..', 'yyyyyyyyyyyy', '.OOOOOOOOOO.', '............', '............'],
        cat: ['............', '...nn.......', '...nn.......', '..nnnn......', '.NNNNNN.....', '.rrrrrr.....', '........r.r.', '.......r...r', '........rrr.', '.......rrrrr', '.......rrrrr', '........rrr.'],
        julie: ['............', '............', '............', '.SssssssssS.', '.ssssssssss.', '.sssSSSSsss.', '.ssssssssss.', '.ssssssssss.', '.SssssssssS.', '............', '............', '............'],
        xiaowu: ['............', '..bbbbbbbb..', '..bBBBBBBbw.', '..byyyyyybw.', '..bBBBBBBbw.', '..bBBBBBBbw.', '..byyyyyybw.', '..bBBBBBBbw.', '..bbbbbbbbw.', '...wwwwwwww.', '............', '............'],
        strip: ['............', '............', '............', '.wwwwwwwwww.', '.wkwkwkwkGw.', '.wwwwwwwwrw.', '.GGGGGGGGGG.', '..........k.', '.........k..', '........k...', '............', '............'],
        fan: ['...GGGGGG...', '..G.c..c.G..', '.G.cc..cc.G.', '.Gc..kk..cG.', '.G..kGGk..G.', '.Gc..kk..cG.', '.G.cc..cc.G.', '..G.c..c.G..', '...GGGGGG...', '.....kk.....', '.....kk.....', '...kkkkkk...'],
        printer: ['............', '...wwwwww...', '...wgggww...', '.kkkkkkkkkk.', '.kGGGGGGGGk.', '.kGGGGGGcGk.', '.kkkkkkkkkk.', '..wwwwwwww..', '..wggggggw..', '..wwwwwwww..', '............', '............'],
    };
    function drawIcons() {
        document.querySelectorAll('canvas[data-ic]').forEach(cv => {
            const x = cv.getContext('2d'), rows = ICONS[cv.dataset.ic], off = cv.dataset.off;
            x.clearRect(0, 0, 12, 12);
            if (!rows) { x.fillStyle = off ? '#b8c5cf' : '#9fb1c0'; x.fillRect(3, 3, 6, 6); x.fillStyle = off ? '#dfe5e9' : '#e6ecf0'; x.fillRect(4, 4, 4, 4); return; }   // 之後的設備還沒畫小圖
            rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === '.') return; x.fillStyle = off ? '#b8c5cf' : PAL[ch]; x.fillRect(i, j, 1, 1); }));
        });
    }

    // ---------- 你不在的時候 ----------
    function away() {
        const gap = Date.now() - (S.lastSeen || Date.now());
        if (gap < 10 * 60000) return;
        const from = now() - gap;
        const finished = S.jobs.filter(j => !j.collected && j.end > from && j.end <= now());
        tick();
        const ready = S.jobs.filter(j => j.fin && !j.collected), sum = ready.reduce((a, j) => a + j.res.net, 0);
        const h = Math.floor(gap / 3600000), m = Math.floor(gap % 3600000 / 60000);
        const ups = finished.flatMap(j => j.ups || []);
        show(`<div class="away glass" style="margin:0"><div class="lb" style="font-size:10.5px;letter-spacing:.3em;color:#2f7d90;display:flex;gap:6px;align-items:center"><span class="dot"></span>你不在的時候</div>
              <div class="tm num">${h ? h + ' 小時 ' : ''}${m} 分鐘</div>
              <div class="big num"><b>${R.fmt(sum)}</b><span>做完 ${finished.filter(j => j.ok).length} 件・做砸 ${finished.filter(j => !j.ok).length} 件</span></div></div>
              <div class="panel glass" style="margin:10px 0 0">
                <div class="it"><span class="k">員工</span><span class="v">${ups.length ? ups.map(([id, lv]) => { const s = staffById(id); return s ? esc(R.staffName(s)) + '升到 Lv.' + lv : ''; }).join('、') : '大家都在'}</span></div>
                <div class="it"><span class="k">委託</span><span class="v">委託板上有 ${S.board.length} 張${S.board.some(c => c.tag === 'super') ? '・<span style="color:#8a6a26">1 張特好賺</span>' : ''}</span></div>
              </div>
              <div class="cta"><button id="awOk">好</button>${ready.length ? `<button class="main num" id="awAll">全部收款 ${R.fmt(sum)}</button>` : ''}</div>`, { center: true });
        $('awOk').onclick = hide; if ($('awAll')) $('awAll').onclick = () => { hide(); go('office'); $('collectAll').click(); };
    }

    // ---------- 開始 ----------
    if (!S || !S.name) { openNote(0); }
    else { tick(); render(); away(); }
    setInterval(() => { if (S && S.name) { tick(); S.lastSeen = Date.now(); save(); } }, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && S && S.name) { away(); tick(); } else if (S && S.name) { S.lastSeen = Date.now(); save(); } });
    window.__company = { get S() { return S; }, tick, render, R, inc() { incAt = 1; }, away };   // 試玩時給測試用
})();
</script>
</body>
