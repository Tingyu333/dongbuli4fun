<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷失・無 | 丼步哩</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'wabi-bg': '#fcfaf8',
                        'wabi-text': '#4a4a4a',
                        'wabi-accent': '#8e8070',
                        'wabi-sub': '#dcdcdc',
                        'wabi-dark': '#2c2c2c',
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    letterSpacing: {
                        'widest-xl': '.25em',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fcfaf8;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        }

        .vertical-rl {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.25em;
        }
    </style>
</head>

<body
    class="h-screen w-full flex flex-col items-center justify-center text-wabi-text font-serif overflow-hidden relative selection:bg-wabi-accent selection:text-white">

    <!-- 背景裝飾字 -->
    <div
        class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[20rem] text-stone-100 select-none z-0 pointer-events-none opacity-50">
        無
    </div>

    <!-- 主要內容 -->
    <div class="relative z-10 text-center space-y-12">
        <h1 class="text-8xl md:text-9xl font-light text-wabi-accent tracking-widest opacity-80">404</h1>

        <div class="space-y-6">
            <p class="text-xl md:text-2xl tracking-[0.5em] text-wabi-dark">迷失確認</p>
            <div class="w-12 h-[1px] bg-wabi-accent mx-auto"></div>
            <p class="text-sm md:text-base font-sans tracking-widest text-stone-500 leading-loose">
                您尋找的羈絆<br>
                似乎不在這裡
            </p>
        </div>

        <div class="pt-8">
            <a href="index.html"
                class="inline-block border border-wabi-dark text-wabi-dark px-10 py-3 hover:bg-wabi-dark hover:text-white transition-all duration-500 tracking-[0.3em] text-xs font-sans uppercase">
                回到原點
            </a>
        </div>
    </div>

    <!-- 垂直裝飾文字 -->
    <div class="absolute right-10 top-1/2 transform -translate-y-1/2 hidden md:block">
        <p class="vertical-rl text-xs tracking-[1em] text-stone-300 h-64 border-r border-stone-200 pr-4">
            有時迷路也是一種風景
        </p>
    </div>

    <footer class="absolute bottom-8 w-full text-center">
        <p class="text-[10px] text-stone-300 font-sans tracking-widest">&copy; 2026 DONGBULI</p>
    </footer>

</body>

</html>
