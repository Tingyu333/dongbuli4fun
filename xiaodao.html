<body>
    <!-- 還沒開放：只放預告圖（網址加 ?preview 才進得去） -->

        <!-- 屋內（第四批）：進屋時把島和下面四顆換成這一塊 -->

            <div id="dStage" class="rstage"><canvas id="dcv" aria-label="家門口"></canvas><p id="dHint" class="rhint">按下面的「進屋」進去，也可以直接點大門</p></div>

        </div>

            <div id="rStage" class="rstage"><canvas id="rcv" aria-label="屋內"></canvas><div class="rzoom"><button type="button" id="rzIn" aria-label="放大">＋</button><button type="button" id="rzOut" aria-label="縮小">－</button><button type="button" id="rzView" aria-label="切換平面圖、斜看" style="font-size:13px;font-family:'Noto Serif TC',serif">平</button></div><p id="rHint" class="rhint"></p></div>
            <div id="rPanel" class="rpanel"></div>

        <nav class="tabs" aria-label="小島">

            <button type="button" class="tab" data-tab="depot"><img src="assets/xiaodao/icon-depot.png" alt="">倉庫</button>

    <div id="sheet" class="sheet" aria-hidden="true">

            <div class="stabs" id="stabs"></div>
            <div class="sheet-body" id="sheetBody"></div>
        </div>
    </div>

    <!-- 扭蛋動畫：轉把手 → 蛋掉出來 → 搖一搖 → 打開（點畫面跳過） -->

        <div class="gfx-in">

            <div id="gfxOut" class="gfx-out"></div>

            <button type="button" id="gfxOk" class="btn main gfx-ok" hidden>好</button>
            <p class="gfx-skip">點畫面可以跳過</p>
        </div>
    </div>

    <div id="up" class="up" hidden>
        <div class="up-in">
            <span id="upSeal" class="up-seal">島 貳</span>
            <p id="upText"></p>
            <button type="button" class="btn main" id="upOk" style="width:100%">好</button>
        </div>
    </div>

    <script>
        // ===== 開放了沒 =====
        // 六批都做完、使用者試過才開放（使用者 2026-11-21 定的）。開放前只放預告圖，網址加 ?preview 用試玩錢包玩（存在這支手機，不動真的錢包）。
        // 擋瀏覽器放大：iPhone 不理 user-scalable=no，要擋 gesture 事件和兩指的 touchmove；萬一還是放大了（或之前就放大著），把 viewport 重設一次就會縮回 1 倍
        (function () {
            ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
            document.addEventListener('touchmove', e => { if (e.touches.length > 1 && !e.target.closest('#cv')) e.preventDefault(); }, { passive: false });
            const vp = document.getElementById('vp'), base = vp.getAttribute('content'); let busy = false;
            function unzoom() {
                if (busy || !window.visualViewport || visualViewport.scale <= 1.02) return; busy = true;
                vp.setAttribute('content', 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
                setTimeout(() => { vp.setAttribute('content', base); busy = false; window.scrollTo(0, 0); }, 120);
            }
            // 還是放大著的話（擋不掉的放大方式、或縮不回去）：整個 App 塞進看得到的那一塊（不會有東西被切掉、按鈕跑到外面），上面跳一條提示
            // 也抓瀏覽器自己的「縮放」（Chrome 選單裡的，視窗變窄但 scale 還是 1）
            function fitApp() {
                const vv = window.visualViewport, z = vv && vv.scale > 1.02, narrow = screen.width && window.innerWidth < screen.width * 0.86;
                const tip = document.getElementById('zoomTip'); if (tip) tip.hidden = !(z || narrow);
                ['app', 'sheet', 'up'].forEach(id => { const el = document.getElementById(id); if (!el) return;
                    if (z) Object.assign(el.style, { top: vv.offsetTop + 'px', left: vv.offsetLeft + 'px', width: vv.width + 'px', height: vv.height + 'px', right: 'auto', bottom: 'auto', margin: '0', maxWidth: 'none' });
                    else ['top', 'left', 'width', 'height', 'right', 'bottom', 'margin', 'maxWidth'].forEach(k => el.style[k] = ''); });
            }
            window.__fitApp = fitApp;
            const both = () => { unzoom(); fitApp(); };
            if (window.visualViewport) { visualViewport.addEventListener('resize', both); visualViewport.addEventListener('scroll', both); }
            window.addEventListener('resize', fitApp); window.addEventListener('pageshow', both);
            document.addEventListener('DOMContentLoaded', () => { fitApp(); const tip = document.getElementById('zoomTip'); if (tip) tip.onclick = () => { busy = false; unzoom(); setTimeout(fitApp, 300); if (window.visualViewport && visualViewport.scale <= 1.02) showToast('如果還是很大：瀏覽器右上「⋯」→「縮放」→ 100%'); }; });
        })();
        const OPEN = false;
        const PREVIEW = /[?&]preview\b/.test(location.search);
        const X = XiaodaoRules, D = XiaodaoDraw, $ = id => document.getElementById(id);
        const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
        const NUM = ['', '壹', '貳', '參', '肆', '伍'];
        const short = n => n >= 1e8 ? (n / 1e8).toFixed(n >= 1e9 ? 1 : 2).replace(/\.?0+$/, '') + ' 億' : n >= 1e4 ? Math.floor(n / 1e4).toLocaleString('en-US') + ' 萬' : '$' + Math.round(n).toLocaleString('en-US');
        if (!OPEN && !PREVIEW) { $('teaser').hidden = false; }
        else start();

        function start() {
            $('app').hidden = false;
            // ----- 存檔（試玩：存在這支手機） -----
            const TRIAL_KEY = 'dongbuli-xiaodao-preview3', TRIAL_MONEY = 50000000;
            let S, money;
            function loadTrial() {
                let d = null; try { d = JSON.parse(localStorage.getItem(TRIAL_KEY)); } catch (e) { }
                S = X.clean(d && d.s); money = d && d.money >= 0 ? d.money : TRIAL_MONEY;
            }
            function save() { try { localStorage.setItem(TRIAL_KEY, JSON.stringify({ s: S, money })); } catch (e) { } }
            loadTrial();
            $('trial').hidden = false;
            $('addMoney').onclick = () => { money += 10000000; save(); renderTop(); refreshUI(); showToast('試玩錢包多了 1000 萬'); };
            $('resetTrial').onclick = () => { try { localStorage.removeItem(TRIAL_KEY); } catch (e) { } loadTrial(); sel = null; closeCard(); rebuild(true); showToast('島回到第一天了'); };

            // ----- 上面那一列 -----
            function renderTop() {
                const t = X.tierOf(S), n = X.island(S).plots.length, nt = X.TIERS[t + 1];
                $('money').textContent = fmt(money);
                $('tierSeal').textContent = '島 ' + X.TIERS[t].name;
                $('nPlots').textContent = n;
                $('nextTier').textContent = nt ? `・再買 ${nt.n - n} 塊升「${nt.name}」` : '・島已經最大了';
                $('worthBtn').textContent = '身價 ' + short(X.worth(S));
            }

            // ----- 島和鏡頭 -----
            const view = $('view'), cv = $('cv'), ctx = cv.getContext('2d'), mini = $('mini');
            let world = null, out = null, vw = 0, vh = 0, dpr = 1;
            const cam = { x: 0, y: 0, s: 1, base: 1 };
            let sel = null;   // { t: 'plot', p } | { t: 'fac', k }
            function size() {
                const r = view.getBoundingClientRect(); dpr = Math.min(3, window.devicePixelRatio || 1);
                const w = Math.round(r.width), h = Math.round(r.height);
                if (w === vw && h === vh) return false;
                vw = w; vh = h; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); return true;
            }
            function fit(animate) {
                const b = D.bounds(S, 24), s = Math.min(vw / b.w, (vh - 20) / b.h);
                cam.base = s; cam.s = s; cam.x = b.x + b.w / 2 - vw / 2 / s; cam.y = b.y + b.h / 2 - vh / 2 / s; clampCam(); draw();
            }
            // 畫面中心要在島的範圍裡（拖不出去）
            function clampCam() {
                const b = D.bounds(S, 24), cx = cam.x + vw / 2 / cam.s, cy = cam.y + vh / 2 / cam.s;
                const nx = Math.max(b.x, Math.min(b.x + b.w, cx)), ny = Math.max(b.y, Math.min(b.y + b.h, cy));
                cam.x = nx - vw / 2 / cam.s; cam.y = ny - vh / 2 / cam.s;
            }
            // 卡片跳出來會蓋住下半部：選到的東西如果在卡片底下，把島往上推
            function focus(wx, wy) {
                requestAnimationFrame(() => {
                    const ch = card.classList.contains('on') ? card.offsetHeight + 20 : 0, sy = (wy - cam.y) * cam.s;
                    if (ch && sy > vh - ch - 24) { cam.y = wy - (vh - ch) / 2 / cam.s; clampCam(); draw(); }
                });
            }
            function zoomAt(s2, px, py) {
                s2 = Math.max(cam.base, Math.min(Math.max(cam.base * 4, 3), s2));
                // 縮回全島（或兩指捏到差不多全島）就整座島擺回正中間；卡片開著的話再把選到的東西推到卡片上面
                if (s2 <= cam.base * 1.05) { fit(); refocus(); return; }
                const wx = cam.x + px / cam.s, wy = cam.y + py / cam.s;
                cam.s = s2; cam.x = wx - px / s2; cam.y = wy - py / s2; clampCam(); draw();
            }
            function refocus() {
                if (!sel || !card.classList.contains('on')) return;
                if (sel.t === 'plot') focus(...X.lotCenter(sel.p));
                else { const r = X.rect(sel.k, Math.max(1, X.level(S, sel.k))); focus(r.x + r.w / 2, r.y + r.h / 2); }
            }
            const zoomed = () => cam.s > cam.base * 1.05;

            function rebuild(refit) {
                out = D.render(S, { canvas: world || (world = document.createElement('canvas')), marks: out && out.marks, noVeh: true });
                fx = XiaodaoFX.make(S, out, { waves: !calm });
                seaPat = { day: null, night: null }; marksN = null;
                $('loading').hidden = true;
                renderTop();
                if (refit) fit(); else { clampCam(); draw(); }
                refreshUI(); nextFrame();
            }

            let raf = 0;
            function draw() { if (!raf) raf = requestAnimationFrame(paint); }
            // 畫面外圍（世界圖外面）用世界左上角那塊遠海做成花紋鋪滿（2026-11-26：原本寫死一個顏色，夜裡上下多一條顏色不一樣的帶子）
            let seaPat = { day: null, night: null }, marksN = null, marksSrc = null;
            // 夜裡的地塊記號：跟島用同一個夜色調暗（不然淺灘色那層在夜裡像一圈發光的框）
            function nightMarks() {
                if (marksN && marksSrc === out.marks) return marksN;
                const c = document.createElement('canvas'); c.width = out.marks.width; c.height = out.marks.height; const x2 = c.getContext('2d');
                x2.drawImage(out.marks, 0, 0); XiaodaoFX.nightify(x2, c.width, c.height, out.marks); marksSrc = out.marks; return (marksN = c);
            }
            function seaPattern(src, night) {
                const key = night ? 'night' : 'day'; if (seaPat[key]) return seaPat[key];
                const t = document.createElement('canvas'); t.width = 64; t.height = 64; t.getContext('2d').drawImage(src, 0, 0, 64, 64, 0, 0, 64, 64);
                return (seaPat[key] = ctx.createPattern(t, 'repeat'));
            }
            function paint() {
                raf = 0; if (!world) return;
                const night = isNight(), base = night && fx ? fx.night(world) : world;
                const k = dpr * cam.s; ctx.imageSmoothingEnabled = false;
                ctx.setTransform(k, 0, 0, k, -cam.x * k, -cam.y * k);

                ctx.drawImage(base, 0, 0);

                if (out.marks) ctx.drawImage(night ? nightMarks() : out.marks, 0, 0);
                if (fx) fx.paint(ctx, performance.now(), night, calm);
                // 工地：還沒蓋、可以蓋的設施，地上已經有木樁和麻繩（xiaodao-draw.js 的 siteMarks），平常不再畫白色虛線框；選到才畫
                // 選到的地／設施
                const Wd = X.world();
                const tint = (plots, col) => { ctx.fillStyle = col; plots.forEach(p => Wd.cells[p].forEach(c => ctx.fillRect((c % X.GW) * X.C, Math.floor(c / X.GW) * X.C, X.C, X.C))); };
                let pinAt = null;
                if (sel && sel.t === 'plot') { tint(X.plotInfo(S, sel.p).plots || [sel.p], 'rgba(255,255,255,.32)'); pinAt = D.lockAt(S, sel.p); }
                if (sel && sel.t === 'fac') {
                    const lv = X.level(S, sel.k), r = X.rect(sel.k, Math.max(1, lv)), info = X.facInfo(S, sel.k);
                    if (info.miss) tint(info.miss, 'rgba(179,58,47,.28)');
                    ctx.lineWidth = 2 / cam.s; ctx.setLineDash([5 / cam.s, 3 / cam.s]); ctx.strokeStyle = '#fff';
                    ctx.strokeRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4); ctx.setLineDash([]);
                    // 空的車位／泊位／機位：點設施時才畫白色虛線框（2026-11-26：圖裡不再畫，平常太搶眼又斷斷續續）
                    if (lv && X.FAC[sel.k].slots) { ctx.lineWidth = 1.2 / cam.s; ctx.setLineDash([3 / cam.s, 2 / cam.s]); ctx.strokeStyle = 'rgba(243,241,236,.9)';
                        X.slotsOf(S, sel.k).forEach(sl => { if (!sl.v) ctx.strokeRect(sl.x + .5, sl.y + .5, sl.w - 1, sl.h - 1); }); ctx.setLineDash([]); }
                    if (info.miss && info.next) { const r2 = X.rect(sel.k, info.next); ctx.strokeStyle = 'rgba(179,58,47,.9)'; ctx.setLineDash([3 / cam.s, 3 / cam.s]); ctx.strokeRect(r2.x, r2.y, r2.w, r2.h); ctx.setLineDash([]); }

                if (park) {

                        const on = park.slot === sl.i, bad = park.pick && X.fitWhy(park.pick, sl);
                        ctx.lineWidth = (on ? 2.4 : 1.3) / cam.s; ctx.setLineDash(on ? [] : [3 / cam.s, 2 / cam.s]);
                        ctx.strokeStyle = on ? '#b33a2f' : bad ? 'rgba(179,58,47,.75)' : 'rgba(255,255,255,.95)';

                // 標籤「這一塊」
                const pin = $('pin');
                if (pinAt) { pin.hidden = false; pin.style.left = ((pinAt[0] - cam.x) * cam.s) + 'px'; pin.style.top = ((pinAt[1] - cam.y) * cam.s - 8) + 'px'; } else pin.hidden = true;

                const z = zoomed(); mini.hidden = !z; $('zoomOut').hidden = !z; $('hint').style.opacity = z ? 0 : 1;
                $('zoomOut').style.top = (z ? 10 + 92 * (out.H / out.W) + 10 : 10) + 'px';
                if (z) {
                    const b = D.bounds(S, 24), mw = 92 * dpr, mh = Math.round(mw * b.h / b.w);
                    if (mini.width !== mw || mini.height !== mh) { mini.width = mw; mini.height = mh; }
                    mini.style.height = (mh / dpr) + 'px'; $('zoomOut').style.top = (10 + mh / dpr + 10) + 'px';

                    m.strokeStyle = '#b33a2f'; m.lineWidth = 2 * dpr; m.strokeRect((cam.x - b.x) * ks, (cam.y - b.y) * ks, vw / cam.s * ks, vh / cam.s * ks);

            // ----- 會動的東西、夜景（第六批）-----
            // 浪一直在打、每 9～17 秒島上隨機一台車開出去兜風／一艘船出海繞一圈／一架飛機起飛（飛走一會兒再降落），偶爾火箭發射；
            // 設施卡片上也有按鈕叫一台出去。迴圈照網站的規矩：沒東西在動每秒畫約 20 張、有東西在動 60 張；看不到島（進屋、切到別的 App）就停
            let fx = null, loopOn = false, nextAmb = performance.now() + 5000;
            const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
            const isNight = () => document.documentElement.classList.contains('night');
            const islandVisible = () => world && !$('app').hidden && !$('view').hidden && document.visibilityState === 'visible';
            function tick() {

                    if (fx.actors.length < 2) { const opts = ['garage', 'dock', 'airfield'].filter(f => fx.can(f)); if (fx.can('launchpad') && Math.random() < .12) opts.push('launchpad'); if (opts.length) fx.trip(opts[Math.floor(Math.random() * opts.length)]); }

            }
            function nextFrame() {
                if (loopOn || !islandVisible()) return; loopOn = true;

            }
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') nextFrame(); });
            // 晝夜：網站晚上 10 點到早上 6 點、或手機是深色模式會自動換夜；左上角「夜／晝」可以手動切（跟網站其他頁同一個設定）
            function dnLabel() { $('dn').textContent = isNight() ? '晝' : '夜'; }
            $('dn').onclick = () => { const t = document.querySelector('.theme-toggle'); if (t) t.click(); else document.documentElement.classList.toggle('night'); };
            new MutationObserver(() => { dnLabel(); draw(); if (typeof roomOn !== 'undefined' && roomOn) renderRoom(); if (typeof doorOn !== 'undefined' && doorOn) renderDoor(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
            dnLabel();
            if (PREVIEW) window.__xiaodao = { fx: () => fx, cam, tap: (wx, wy) => tapAt(wx, wy), room: () => ({ rio, rscale }), zoom: (s2, wx, wy) => { const r = cv.getBoundingClientRect(); cam.s = s2; cam.x = wx - r.width / 2 / s2; cam.y = wy - r.height / 2 / s2; clampCam(); draw(); } };   // 試玩時給測試用
            // 設施卡片的「出去一趟」
            const TRIP = { garage: '開一台出去兜風', dock: '開一艘出海繞一圈', airfield: '飛一架起來', launchpad: '發射' };
            function goTrip(k) { closeCard(); if (!fx || !fx.trip(k)) { showToast(k === 'dock' ? '船開不出去（碼頭外面不是海）' : '現在沒有空著的可以出去'); return; } nextFrame(); }

            // ----- 摸：拖、點、點兩下、兩指縮放 -----
            const pts = new Map(); let drag = null, lastTap = { t: 0, x: 0, y: 0 }, pinch = null;
            const pos = e => { const r = view.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
            cv.addEventListener('pointerdown', e => {
                cv.setPointerCapture(e.pointerId); const p = pos(e); pts.set(e.pointerId, p);

                if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: cam.s }; drag = null; }

            cv.addEventListener('pointermove', e => {

                if (!drag) return;
                if (!drag.moved && Math.hypot(p[0] - drag.x0, p[1] - drag.y0) > 8) drag.moved = true;
                if (drag.moved && zoomed()) { cam.x = drag.cx - (p[0] - drag.x0) / cam.s; cam.y = drag.cy - (p[1] - drag.y0) / cam.s; clampCam(); draw(); }
            });
            const up = e => {
                if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
                if (pinch) { if (pts.size < 2) pinch = null; drag = null; return; }
                if (!drag) return; const d = drag; drag = null; if (d.moved) return;
                const p = pos(e), now = performance.now();
                if (!park && now - lastTap.t < 320 && Math.hypot(p[0] - lastTap.x, p[1] - lastTap.y) < 30) { lastTap.t = 0; zoomAt(zoomed() ? cam.base : cam.base * 2.2, p[0], p[1]); return; }

            $('zoomOut').onclick = () => { zoomAt(cam.base, vw / 2, vh / 2); };

            function tapAt(wx, wy) {

                    if (!sl && park.f === 'launchpad') { const only = X.slotsOf(S, 'launchpad')[0]; park.slot = only ? 0 : null; openParkCard(); draw(); return; }

                const hit = X.FAC_KEYS.slice().reverse().find(k => { const lv = X.level(S, k); if (!lv && !siteVisible(k)) return false; const r = X.rect(k, Math.max(1, lv)); return wx >= r.x && wx < r.x + r.w && wy >= r.y && wy < (r.shore != null && !lv ? r.shore : r.y + r.h); });
                if (hit) { sel = { t: 'fac', k: hit }; openFac(hit); draw(); const r = X.rect(hit, Math.max(1, X.level(S, hit))); focus(r.x + r.w / 2, r.y + r.h / 2); return; }
                const cx = Math.floor(wx / X.C), cy = Math.floor(wy / X.C);

                if (p >= 0 && X.island(S).plots.includes(p)) { closeCard(); return; }
                closeCard();
            }
            const siteVisible = k => { const i = X.facInfo(S, k); return !X.level(S, k) && (i.ok || !!i.miss || i.price != null && i.needTier == null); };

            // ----- 卡片 -----
            const card = $('card');
            function closeCard() { card.classList.remove('on'); if (sel) { sel = null; } if (!zoomed()) fit(); else draw(); }
            function unlockText(ti) {
                const t = X.TIERS[ti], prev = X.TIERS[ti - 1] || { cap: {} }, out2 = [];
                X.FAC_KEYS.forEach(k => { const a = prev.cap[k] || 0, b = t.cap[k] || 0; if (b > a) out2.push(a ? `${X.FAC[k].name}到「${X.FAC[k].levels[b - 1]}」` : `可以蓋${X.FAC[k].name}`); });
                return out2.join('、');
            }
            function openPlot(p) {
                const i = X.plotInfo(S, p), n = X.island(S).plots.length, nt = X.TIERS[X.tierOf(S) + 1];
                const left = nt ? nt.n - n : 0, own = new Set(X.island(S).plots), lagoon = X.world().nbLand[p].every(q => own.has(q));   // 四周都是自己的地＝島中間的內海（2026-11-26：玩家看到湖裡有鎖會以為「我家的湖要錢？」）
                card.innerHTML = `<h2>${i.lot ? X.FAC[i.lot.k].name + '的工地' : '買這塊地'}</h2>
                    <p class="line">${i.size} 格・${i.n > 1 ? `${i.n} 塊地合成一塊，一次買下` : lagoon ? '被你的地圍起來的內海：買下來就填海造地，變成陸地' : '跟你的地連著，會填海接起來'}</p>
                    <p class="price">${fmt(i.price)}</p>
                    <p class="note">價錢之後會變：越後面買的地越貴。${nt ? (left <= i.n ? `買了這塊，島就升到「${nt.name}」：${unlockText(X.tierOf(S) + 1)}。` : `再買 ${left} 塊，島升到「${nt.name}」：${unlockText(X.tierOf(S) + 1)}。`) : ''}</p>
                    <div class="btns"><button type="button" class="btn" data-a="no">先不要</button><button type="button" class="btn main" data-a="buy" ${money < i.price ? 'disabled' : ''}>${money < i.price ? '錢包不夠' : '買下來'}</button></div>`;

                    btn = pi ? `<button type="button" class="btn main" data-a="lot" ${money < pi.price ? 'disabled' : ''}>${money < pi.price ? '錢包不夠' : `買工地的地：${pi.n} 塊 ${fmt(pi.price)}`}</button>` : `<button type="button" class="btn main" disabled>${lv ? '升級' : '蓋'}：${i.name} ${fmt(i.price)}</button>`;

            function refreshUI() {

            // ----- 買、蓋 -----
            function act(a) {

                S = r.state; money -= r.cost; save();
                const V = a.k && X.VEH[a.k], F = V && X.FAC[V.fac];
                if (a.t === 'plot') { showToast('買下來了・海岸線長出去'); if (!a.f) { sel = null; card.classList.remove('on'); } }   // 從設施卡片買工地的地：卡片留著，接著就能蓋
                else if (a.t === 'build') { const off = before - X.vehicles(S).filter(v => v.in !== 'depot').length; showToast(`${X.FAC[a.k].levels[r.lv - 1]}・蓋好了` + (off > 0 ? `（${off} 台先收進寄放處）` : '')); }
                else if (a.t === 'buyv') showToast(V.fac === 'launchpad' ? (r.parked ? (r.bumped ? `立上發射台了・${X.VEH[r.bumped].name}先收起來` : '立上發射台了') : '發射台上已經有一枚，先放寄放處') : r.parked ? (r.bumped ? `停進${F.name}了・${X.VEH[r.bumped].name}先讓位` : `停進${F.name}了`) : `${F.name}沒有空位，先放寄放處`);
                else if (a.t === 'park') showToast(`${V.name}・${V.fac === 'launchpad' ? '立上去了' : '停好了'}`);

                const FU = a.k && X.FURN[a.k];
                if (a.t === 'buyf') {
                    if (roomOn) { if (rmode !== 'place') startPlace(); pm = { k: a.k, c: a.c || 0, rot: 0, ghost: null, move: null }; showToast(`${FU.name}・買好了，關上商店點一格就能放`); }

                    body.innerHTML = `<p class="sm" style="margin-top:6px">${F.name}（${room ? room.name : ''}）・${H.n} 格，用了 ${st.length} 格。一模一樣的疊在同一格；點一格拿一件出來。</p>
                        <div class="grid4">${Array.from({ length: H.n }, (_, i) => { const t = st[i]; return t ? `<button type="button" class="gcell" data-out="${t.key}" data-c="${t.c}">${clIco(t.key, t.c, 1)}<b>${X.CLOTH[t.key].name}</b><span class="q">×${t.qty}</span></button>` : `<div class="gcell empty">空</div>`; }).join('')}</div>
                        <p class="swl" style="margin-top:14px">倉庫裡的衣服（點了放一件進來）</p>` + (dep.length ? `<div class="tray">${dep.map(t => `<button type="button" class="vchip" data-in="${t.key}" data-c="${t.c}"><span class="vimg" style="background:#e9e1d2">${clIco(t.key, t.c, 1)}</span><b>${X.CLOTH[t.key].name}</b><i>×${t.qty}</i></button>`).join('')}</div>` : `<p class="sm">沒有。<button type="button" class="btn" id="goCl" style="min-height:32px;padding:0 10px;margin-left:6px">去商店買衣服</button></p>`);
                    body.querySelectorAll('[data-out]').forEach(b => b.onclick = () => act({ t: 'wrout', k: b.dataset.out, c: +b.dataset.c, uid: u.id }));
                    body.querySelectorAll('[data-in]').forEach(b => b.onclick = () => act({ t: 'wrin', k: b.dataset.in, c: +b.dataset.c, uid: u.id }));
                    const g = $('goCl'); if (g) g.onclick = () => openSheet('shop', 'cloth');
                } else {
                    const its = X.caseItems(S, u.id), dep = S.items.filter(t => X.COLL[t.key] && t.in === 'depot' && t.qty > 0);
                    body.innerHTML = `<p class="sm" style="margin-top:6px">${F.name}（${room ? room.name : ''}）・${H.n} 格。點空格再點下面一件放進去；點擺著的拿出來。</p>
                        <div class="grid4">${Array.from({ length: H.n }, (_, i) => { const t = its.find(q => q.at === i); return t ? `<button type="button" class="gcell r-${X.COLL[t.key].r}" data-cout="${i}">${coIco(t.key, 2)}<b>${X.COLL[t.key].name}</b></button>` : `<button type="button" class="gcell empty ${caseSel === i ? 'on' : ''}" data-sel="${i}">空</button>`; }).join('')}</div>
                        <p class="swl" style="margin-top:14px">倉庫裡的藏品</p>` + (dep.length ? `<div class="tray">${dep.map(t => `<button type="button" class="vchip" data-cin="${t.key}"><span class="vimg" style="background:#e9e1d2">${coIco(t.key, 1)}</span><b>${X.COLL[t.key].name}</b><i>×${t.qty}</i></button>`).join('')}</div>` : `<p class="sm">沒有。<button type="button" class="btn" id="goGa" style="min-height:32px;padding:0 10px;margin-left:6px">去扭蛋</button></p>`) + GACHA_LEGAL;
                    body.querySelectorAll('[data-cout]').forEach(b => b.onclick = () => act({ t: 'caseout', uid: u.id, i: +b.dataset.cout }));
                    body.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { caseSel = +b.dataset.sel; renderSheet(); });
                    body.querySelectorAll('[data-cin]').forEach(b => b.onclick = () => { let i = caseSel; if (i == null || its.some(q => q.at === i)) { i = null; for (let j = 0; j < H.n; j++) if (!its.some(q => q.at === j)) { i = j; break; } } if (i == null) { showToast('展示櫃滿了，先點一格拿出來'); return; } caseSel = null; act({ t: 'casein', k: b.dataset.cin, uid: u.id, i }); });
                    const g = $('goGa'); if (g) g.onclick = () => openSheet('gacha');
                }
            }


            // ----- 扭蛋動畫（2026-11-22 使用者要的）-----
            // 轉把手、機器晃 → 蛋從出口掉出來 → 滾到中間搖一搖（傳說搖比較久、會發光）→ 打開，藏品跳出來；十次是十顆一起掉、一顆一顆打開。點畫面跳過，直接看結果
            const CAP_TOP = { n: ['#9cc5c8', '#f2a093', '#c49ae0', '#a9c46e', '#f1d36b'], r: ['#e2b84a'], l: ['#b33a2f'] };
            function capsule(col, half) {   // 14×14 的蛋：上半顏色、下半白；half: 'top' 只畫上半、'bot' 只畫下半
                const c = document.createElement('canvas'); c.width = 14; c.height = 14; const x = c.getContext('2d');
                for (let j = 0; j < 14; j++) for (let i = 0; i < 14; i++) { const d = Math.hypot(i - 6.5, j - 6.5); if (d > 6.6) continue; const top = j < 7; if ((half === 'top' && !top) || (half === 'bot' && top)) continue;
                    x.fillStyle = d > 5.7 ? (top ? 'rgba(0,0,0,.35)' : '#b9b2a6') : top ? col : (j === 7 ? '#d6d1c7' : '#f3f1ec'); x.fillRect(i, j, 1, 1); }
                if (half !== 'bot') { x.fillStyle = 'rgba(255,255,255,.75)'; x.fillRect(3, 3, 2, 1); x.fillRect(3, 4, 1, 1); }
                return c;
            }
            const capCol = k => { const r = X.COLL[k].r, list = CAP_TOP[r]; return list[Math.floor(Math.random() * list.length)]; };
            const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
            let gfxSkip = false, gfxAnims = [];
            const anim = (el, kf, opt) => { const a = el.animate(kf, Object.assign({ fill: 'forwards', easing: 'ease-out' }, opt)); gfxAnims.push(a); if (gfxSkip) a.finish(); return a.finished.catch(() => { }); };
            const gwait = ms => new Promise(ok => { const t0 = performance.now(); const tick = () => { if (gfxSkip || performance.now() - t0 >= ms) ok(); else requestAnimationFrame(tick); }; tick(); });
            async function playGacha(got) {
                const fx = $('gfx'), out = $('gfxOut'), txt = $('gfxTxt'), ok = $('gfxOk'), m = fx.querySelector('.gfx-m'), knob = fx.querySelector('.gfx-knob');
                fx.hidden = false; out.innerHTML = ''; txt.innerHTML = ''; ok.hidden = true; gfxSkip = reduce; gfxAnims = [];
                fx.onclick = e => { if (e.target === ok) return; if (!gfxSkip) { gfxSkip = true; gfxAnims.forEach(a => { try { a.finish(); } catch (er) { } }); } };
                ok.onclick = () => { fx.hidden = true; };
                const legend = got.some(g => X.COLL[g.k].r === 'l');
                // 1. 轉把手、機器晃
                anim(knob, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(720deg)' }], { duration: 650, easing: 'ease-in-out' });
                await anim(m, [0, -3, 3, -2, 2, -1, 0].map(v => ({ transform: `translateX(${v}px)` })), { duration: 650 });
                const ob = out.getBoundingClientRect(), mb = m.getBoundingClientRect(), chute = [mb.left - ob.left + 60 - 14, mb.top - ob.top + 120 - 14];
                const center = [ob.width / 2 - 14, ob.height / 2 - 14];
                if (got.length === 1) {
                    // 2. 掉出來、彈一下 → 滾到中間變大、搖一搖 → 打開
                    const g = got[0], c = X.COLL[g.k], col = capCol(g.k), cap = capsule(col); cap.className = 'gfx-cap'; out.appendChild(cap);
                    await anim(cap, [{ transform: `translate(${chute[0]}px,${chute[1] - 30}px) scale(1)` }, { transform: `translate(${chute[0]}px,${chute[1]}px) scale(1)`, offset: .6 }, { transform: `translate(${chute[0]}px,${chute[1] - 8}px) scale(1)`, offset: .8 }, { transform: `translate(${chute[0]}px,${chute[1]}px) scale(1)` }], { duration: 450, easing: 'ease-in' });
                    await anim(cap, [{ transform: `translate(${chute[0]}px,${chute[1]}px) scale(1) rotate(0deg)` }, { transform: `translate(${center[0]}px,${center[1]}px) scale(3.2) rotate(360deg)` }], { duration: 500 });
                    const shake = legend ? 1100 : c.r === 'r' ? 800 : 550;
                    if (c.r !== 'n') anim(cap, [{ filter: 'drop-shadow(0 0 0 rgba(255,220,150,0))' }, { filter: `drop-shadow(0 0 6px ${c.r === 'l' ? '#ff8a70' : '#f4dc95'})` }], { duration: shake });
                    await anim(cap, [0, -18, 18, -14, 14, -8, 8, 0].map(v => ({ transform: `translate(${center[0]}px,${center[1]}px) scale(3.2) rotate(${v}deg)` })), { duration: shake, easing: 'linear' });
                    cap.remove();
                    const top = capsule(col, 'top'), bot = capsule(col, 'bot'); [top, bot].forEach(e => { e.className = 'gfx-cap'; out.appendChild(e); });
                    if (c.r !== 'n') { const rays = document.createElement('div'); rays.className = 'gfx-rays'; rays.style.background = `repeating-conic-gradient(${c.r === 'l' ? 'rgba(255,140,110,.45)' : 'rgba(244,220,149,.4)'} 0 10deg, transparent 10deg 30deg)`; out.appendChild(rays); anim(rays, [{ transform: 'scale(.2) rotate(0deg)', opacity: 0 }, { transform: 'scale(1) rotate(90deg)', opacity: 1 }], { duration: 700 }); anim(rays, [{ transform: 'scale(1) rotate(90deg)' }, { transform: 'scale(1) rotate(450deg)' }], { duration: 9000, delay: 700, iterations: Infinity, easing: 'linear', fill: 'none' }); }
                    const item = document.createElement('img'); item.className = 'gfx-item'; item.src = crop(CO_IMG, c.d, 5); out.appendChild(item);
                    anim(top, [{ transform: `translate(${center[0]}px,${center[1]}px) scale(3.2)`, opacity: 1 }, { transform: `translate(${center[0] - 40}px,${center[1] - 60}px) scale(3.2) rotate(-40deg)`, opacity: 0 }], { duration: 450 });
                    anim(bot, [{ transform: `translate(${center[0]}px,${center[1]}px) scale(3.2)`, opacity: 1 }, { transform: `translate(${center[0] + 30}px,${center[1] + 50}px) scale(3.2) rotate(30deg)`, opacity: 0 }], { duration: 450 });
                    await anim(item, [{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1.25)', opacity: 1, offset: .6 }, { transform: 'scale(1)', opacity: 1 }], { duration: 450 });
                    txt.innerHTML = `${c.name}<small style="color:${c.r === 'n' ? '#d8c9ae' : X.RARE[c.r][1] === '#b33a2f' ? '#ff9a8a' : '#f4dc95'}">${X.RARE[c.r][0]}・${g.first ? '第一次扭到！' : '重複 ×' + g.n}</small>`;
                } else {
                    // 十次：十顆接連掉進格子 → 一顆一顆打開
                    const grid = document.createElement('div'); grid.className = 'gfx-grid'; out.appendChild(grid);
                    const cells = got.map(() => { const d = document.createElement('div'); d.className = 'gfx-cell'; grid.appendChild(d); return d; });
                    const caps = got.map((g, i) => { const cap = capsule(capCol(g.k)); cap.className = 'gfx-cap'; cap.style.opacity = 0; out.appendChild(cap); return cap; });
                    const cellPos = i => { const cb = cells[i].getBoundingClientRect(); return [cb.left - ob.left + cb.width / 2 - 14, cb.top - ob.top + cb.height / 2 - 14]; };
                    for (let i = 0; i < got.length; i++) { const [cx, cy] = cellPos(i); caps[i].style.opacity = 1; anim(caps[i], [{ transform: `translate(${chute[0]}px,${chute[1] - 20}px) scale(1)` }, { transform: `translate(${cx}px,${cy}px) scale(1.6) rotate(360deg)` }], { duration: 380 }); await gwait(110); }
                    await gwait(420);
                    for (let i = 0; i < got.length; i++) {
                        const g = got[i], c = X.COLL[g.k], [cx, cy] = cellPos(i);
                        if (c.r !== 'n') await anim(caps[i], [0, -15, 15, -10, 10, 0].map(v => ({ transform: `translate(${cx}px,${cy}px) scale(1.6) rotate(${v}deg)` })), { duration: c.r === 'l' ? 600 : 300, easing: 'linear' });
                        caps[i].remove(); cells[i].className = 'gfx-cell r-' + c.r; cells[i].innerHTML = `<img src="${crop(CO_IMG, c.d, 3)}" alt="${c.name}">${g.first ? '<span class="nw">新</span>' : ''}`;
                        anim(cells[i].firstChild, [{ transform: 'scale(.2)' }, { transform: 'scale(1.2)', offset: .6 }, { transform: 'scale(1)' }], { duration: 260 });
                        await gwait(130);
                    }
                    const fresh = got.filter(g => g.first).length, best = got.reduce((b, g) => ({ n: 0, r: 1, l: 2 })[X.COLL[g.k].r] > ({ n: 0, r: 1, l: 2 })[X.COLL[b.k].r] ? g : b);
                    txt.innerHTML = `扭了十次<small>${fresh ? `新的 ${fresh} 款・` : '都是重複的・'}最好的是${X.RARE[X.COLL[best.k].r][0]}「${X.COLL[best.k].name}」</small>`;
                }
                if (legend) { const fl = document.createElement('div'); fl.style.cssText = 'position:fixed;inset:0;pointer-events:none;background:rgba(255,236,190,.0)'; fx.appendChild(fl); anim(fl, [{ background: 'rgba(255,236,190,0)' }, { background: 'rgba(255,236,190,.55)' }, { background: 'rgba(255,236,190,0)' }], { duration: 900, fill: 'none' }).then(() => fl.remove()); }
                ok.hidden = false;
            }

            // ----- 開始 -----
            size();
            new ResizeObserver(() => { if (size()) { if (world) { if (zoomed()) { clampCam(); draw(); } else fit(); } } }).observe(view);
            renderTop();
            D.load('assets/xiaodao/', '20261126p').then(() => setTimeout(() => rebuild(true), 30));
            roomLoaded = Promise.all([RM.load('assets/xiaodao/', '20261122a', '20261122a'), RI.load('assets/xiaodao/', '20261122a')]);   // 家具的圖先載好（商店、倉庫的小圖要用）
            roomLoaded.then(() => { if ($('sheet').classList.contains('on')) renderSheet(); if (roomOn) renderRoom(); });
        }
    </script>
