        .sub { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-family: 'Noto Sans TC', sans-serif; font-size: 11px; letter-spacing: .08em; color: rgb(var(--wabi-accent)); white-space: nowrap; overflow: hidden; }

        .sub b { font-weight: 400; color: rgb(var(--wabi-dark)); }

        .trial button { flex: none; font: inherit; color: rgb(var(--wabi-dark)); border: 1px solid rgb(var(--wabi-accent) / .5); border-radius: 999px; padding: 3px 9px; background: transparent; min-height: 28px; }

        @media (prefers-reduced-motion: reduce) { .card, .sheet, .sheet-in { transition: none; } }

<body>

    <script>
        // ===== 開放了沒 =====
        // 六批都做完、使用者試過才開放（使用者 2026-11-21 定的）。開放前只放預告圖，網址加 ?preview 用試玩錢包玩（存在這支手機，不動真的錢包）。
        const OPEN = false;
        const PREVIEW = /[?&]preview\b/.test(location.search);
        const X = XiaodaoRules, D = XiaodaoDraw, $ = id => document.getElementById(id);
        const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
        const NUM = ['', '壹', '貳', '參', '肆', '伍'];
        if (!OPEN && !PREVIEW) { $('teaser').hidden = false; }
        else start();

        function start() {
            $('app').hidden = false;
            // ----- 存檔（試玩：存在這支手機） -----
            const TRIAL_KEY = 'dongbuli-xiaodao-preview', TRIAL_MONEY = 50000000;
            let S, money;
            function loadTrial() {
                let d = null; try { d = JSON.parse(localStorage.getItem(TRIAL_KEY)); } catch (e) { }
                S = X.clean(d && d.s); money = d && d.money >= 0 ? d.money : TRIAL_MONEY;
            }
            function save() { try { localStorage.setItem(TRIAL_KEY, JSON.stringify({ s: S, money })); } catch (e) { } }
            loadTrial();
            $('trial').hidden = false;
            $('addMoney').onclick = () => { money += 10000000; save(); renderTop(); refreshUI(); showToast('試玩錢包多了 1000 萬'); };
            $('resetTrial').onclick = () => { try { localStorage.removeItem(TRIAL_KEY); } catch (e) { } loadTrial(); sel = null; closeCard(); rebuild(true); showToast('島回到第一天了'); };

            // ----- 上面那一列 -----
            function renderTop() {
                const t = X.tierOf(S), n = X.island(S).plots.length, nt = X.TIERS[t + 1];
                $('money').textContent = fmt(money);
                $('tierSeal').textContent = '島 ' + X.TIERS[t].name;
                $('nPlots').textContent = n;
                $('nextTier').textContent = nt ? `・再買 ${nt.n - n} 塊升「${nt.name}」` : '・島已經最大了';
            }

            // ----- 島和鏡頭 -----
            const view = $('view'), cv = $('cv'), ctx = cv.getContext('2d'), mini = $('mini');
            let world = null, out = null, vw = 0, vh = 0, dpr = 1;
            const cam = { x: 0, y: 0, s: 1, base: 1 };
            let sel = null;   // { t: 'plot', p } | { t: 'fac', k }
            function size() {
                const r = view.getBoundingClientRect(); dpr = Math.min(3, window.devicePixelRatio || 1);
                const w = Math.round(r.width), h = Math.round(r.height);
                if (w === vw && h === vh) return false;
                vw = w; vh = h; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); return true;
            }
            function fit(animate) {
                const b = D.bounds(S, 24), s = Math.min(vw / b.w, (vh - 20) / b.h);
                cam.base = s; cam.s = s; cam.x = b.x + b.w / 2 - vw / 2 / s; cam.y = b.y + b.h / 2 - vh / 2 / s; clampCam(); draw();
            }
            // 畫面中心要在島的範圍裡（拖不出去）
            function clampCam() {
                const b = D.bounds(S, 24), cx = cam.x + vw / 2 / cam.s, cy = cam.y + vh / 2 / cam.s;
                const nx = Math.max(b.x, Math.min(b.x + b.w, cx)), ny = Math.max(b.y, Math.min(b.y + b.h, cy));
                cam.x = nx - vw / 2 / cam.s; cam.y = ny - vh / 2 / cam.s;
            }
            // 卡片跳出來會蓋住下半部：選到的東西如果在卡片底下，把島往上推
            function focus(wx, wy) {
                requestAnimationFrame(() => {
                    const ch = card.classList.contains('on') ? card.offsetHeight + 20 : 0, sy = (wy - cam.y) * cam.s;
                    if (ch && sy > vh - ch - 24) { cam.y = wy - (vh - ch) / 2 / cam.s; clampCam(); draw(); }
                });
            }
            function zoomAt(s2, px, py) {
                s2 = Math.max(cam.base, Math.min(Math.max(cam.base * 4, 3), s2));
                // 縮回全島（或兩指捏到差不多全島）就整座島擺回正中間；卡片開著的話再把選到的東西推到卡片上面
                if (s2 <= cam.base * 1.05) { fit(); refocus(); return; }
                const wx = cam.x + px / cam.s, wy = cam.y + py / cam.s;
                cam.s = s2; cam.x = wx - px / s2; cam.y = wy - py / s2; clampCam(); draw();
            }
            function refocus() {
                if (!sel || !card.classList.contains('on')) return;
                if (sel.t === 'plot') focus(...X.world().center[sel.p]);
                else { const r = X.rect(sel.k, Math.max(1, X.level(S, sel.k))); focus(r.x + r.w / 2, r.y + r.h / 2); }
            }
            const zoomed = () => cam.s > cam.base * 1.05;

            function rebuild(refit) {
                out = D.render(S, { canvas: world || (world = document.createElement('canvas')) });
                $('loading').hidden = true;
                renderTop();
                if (refit) fit(); else { clampCam(); draw(); }
                refreshUI();
            }

            let raf = 0;
            function draw() { if (!raf) raf = requestAnimationFrame(paint); }
            function paint() {
                raf = 0; if (!world) return;
                ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#4f7d8f'; ctx.fillRect(0, 0, cv.width, cv.height);
                const k = dpr * cam.s; ctx.imageSmoothingEnabled = false;
                ctx.setTransform(k, 0, 0, k, -cam.x * k, -cam.y * k);
                ctx.drawImage(world, 0, 0);
                // 工地：還沒蓋、島的等級已經可以蓋的設施，畫白色虛線框
                ctx.lineWidth = 1.5 / cam.s; ctx.setLineDash([4 / cam.s, 3 / cam.s]);
                X.FAC_KEYS.forEach(k2 => { if (X.level(S, k2)) return; const i = X.facInfo(S, k2); if (i.needTier != null && i.why && !i.miss && !i.ok) return; const r = X.rect(k2, 1); ctx.strokeStyle = 'rgba(243,241,236,.85)'; ctx.strokeRect(r.x + .5, r.y + .5, r.w - 1, (r.shore != null ? r.shore - r.y : r.h) - 1); });
                ctx.setLineDash([]);
                // 選到的地／設施
                const Wd = X.world();
                const tint = (plots, col) => { ctx.fillStyle = col; plots.forEach(p => Wd.cells[p].forEach(c => ctx.fillRect((c % X.GW) * X.C, Math.floor(c / X.GW) * X.C, X.C, X.C))); };
                let pinAt = null;
                if (sel && sel.t === 'plot') { tint([sel.p], 'rgba(255,255,255,.32)'); pinAt = Wd.center[sel.p]; }
                if (sel && sel.t === 'fac') {
                    const lv = X.level(S, sel.k), r = X.rect(sel.k, Math.max(1, lv)), info = X.facInfo(S, sel.k);
                    if (info.miss) tint(info.miss, 'rgba(179,58,47,.28)');
                    ctx.lineWidth = 2 / cam.s; ctx.setLineDash([5 / cam.s, 3 / cam.s]); ctx.strokeStyle = '#fff';
                    ctx.strokeRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4); ctx.setLineDash([]);
                    if (info.miss && info.next) { const r2 = X.rect(sel.k, info.next); ctx.strokeStyle = 'rgba(179,58,47,.9)'; ctx.setLineDash([3 / cam.s, 3 / cam.s]); ctx.strokeRect(r2.x, r2.y, r2.w, r2.h); ctx.setLineDash([]); }
                }
                // 換車／看船：每一格框起來（選到的朱色；要停的那台停不進去的格子紅色虛線）
                if (park) {
                    X.slotsOf(S, park.f).forEach(sl => {
                        const on = park.slot === sl.i, bad = park.pick && X.fitWhy(park.pick, sl);
                        ctx.lineWidth = (on ? 2.4 : 1.3) / cam.s; ctx.setLineDash(on ? [] : [3 / cam.s, 2 / cam.s]);
                        ctx.strokeStyle = on ? '#b33a2f' : bad ? 'rgba(179,58,47,.75)' : 'rgba(255,255,255,.95)';
                        ctx.strokeRect(sl.x - 2, sl.y - 2, sl.w + 4, sl.h + 4);
                    });
                    ctx.setLineDash([]);
                }
                // 標籤「這一塊」
                const pin = $('pin');
                if (pinAt) { pin.hidden = false; pin.style.left = ((pinAt[0] - cam.x) * cam.s) + 'px'; pin.style.top = ((pinAt[1] - cam.y) * cam.s - 8) + 'px'; } else pin.hidden = true;
                // 小地圖（放大時）
                const z = zoomed(); mini.hidden = !z; $('zoomOut').hidden = !z; $('hint').style.opacity = z ? 0 : 1;
                $('zoomOut').style.top = (z ? 10 + 92 * (out.H / out.W) + 10 : 10) + 'px';
                if (z) {
                    const b = D.bounds(S, 24), mw = 92 * dpr, mh = Math.round(mw * b.h / b.w);
                    if (mini.width !== mw || mini.height !== mh) { mini.width = mw; mini.height = mh; }
                    mini.style.height = (mh / dpr) + 'px'; $('zoomOut').style.top = (10 + mh / dpr + 10) + 'px';
                    const m = mini.getContext('2d'), ks = mw / b.w; m.imageSmoothingEnabled = true;
                    m.setTransform(1, 0, 0, 1, 0, 0); m.drawImage(world, b.x, b.y, b.w, b.h, 0, 0, mw, mh);
                    m.strokeStyle = '#b33a2f'; m.lineWidth = 2 * dpr; m.strokeRect((cam.x - b.x) * ks, (cam.y - b.y) * ks, vw / cam.s * ks, vh / cam.s * ks);
                }
            }

            // ----- 摸：拖、點、點兩下、兩指縮放 -----
            const pts = new Map(); let drag = null, lastTap = { t: 0, x: 0, y: 0 }, pinch = null;
            const pos = e => { const r = view.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
            cv.addEventListener('pointerdown', e => {
                cv.setPointerCapture(e.pointerId); const p = pos(e); pts.set(e.pointerId, p);
                if (pts.size === 1) drag = { x0: p[0], y0: p[1], cx: cam.x, cy: cam.y, moved: false };
                if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: cam.s }; drag = null; }
            });
            cv.addEventListener('pointermove', e => {
                if (!pts.has(e.pointerId)) return; const p = pos(e); pts.set(e.pointerId, p);
                if (pinch && pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomAt(pinch.s * d / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); return; }
                if (!drag) return;
                if (!drag.moved && Math.hypot(p[0] - drag.x0, p[1] - drag.y0) > 8) drag.moved = true;
                if (drag.moved && zoomed()) { cam.x = drag.cx - (p[0] - drag.x0) / cam.s; cam.y = drag.cy - (p[1] - drag.y0) / cam.s; clampCam(); draw(); }
            });
            const up = e => {
                if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
                if (pinch) { if (pts.size < 2) pinch = null; drag = null; return; }
                if (!drag) return; const d = drag; drag = null; if (d.moved) return;
                const p = pos(e), now = performance.now();
                if (!park && now - lastTap.t < 320 && Math.hypot(p[0] - lastTap.x, p[1] - lastTap.y) < 30) { lastTap.t = 0; zoomAt(zoomed() ? cam.base : cam.base * 2.2, p[0], p[1]); return; }
                lastTap = { t: now, x: p[0], y: p[1] };
                tapAt(cam.x + p[0] / cam.s, cam.y + p[1] / cam.s);
            };
            cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e => { pts.delete(e.pointerId); drag = null; pinch = null; });
            cv.addEventListener('wheel', e => { e.preventDefault(); const p = pos(e); zoomAt(cam.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), p[0], p[1]); }, { passive: false });
            $('zoomOut').onclick = () => { zoomAt(cam.base, vw / 2, vh / 2); };

            function tapAt(wx, wy) {
                if (park) {   // 換車／看船：只點位子
                    const sl = X.slotsOf(S, park.f).find(q => wx >= q.x - 4 && wx < q.x + q.w + 4 && wy >= q.y - 4 && wy < q.y + q.h + 4);
                    if (sl && park.pick) { const k = park.pick; park.pick = null; park.slot = sl.i; act({ t: 'park', k, f: park.f, i: sl.i }); return; }
                    park.slot = sl ? sl.i : null; openParkCard(); draw(); return;
                }
                // 設施（蓋好的、或可以蓋的工地）
                const hit = X.FAC_KEYS.slice().reverse().find(k => { const lv = X.level(S, k); if (!lv && !siteVisible(k)) return false; const r = X.rect(k, Math.max(1, lv)); return wx >= r.x && wx < r.x + r.w && wy >= r.y && wy < (r.shore != null && !lv ? r.shore : r.y + r.h); });
                if (hit) { sel = { t: 'fac', k: hit }; openFac(hit); draw(); const r = X.rect(hit, Math.max(1, X.level(S, hit))); focus(r.x + r.w / 2, r.y + r.h / 2); return; }
                const cx = Math.floor(wx / X.C), cy = Math.floor(wy / X.C);
                const p = cx >= 0 && cy >= 0 && cx < X.GW && cy < X.GH ? X.world().id[cy * X.GW + cx] : -1;
                if (p >= 0 && X.plotInfo(S, p).ok) { sel = { t: 'plot', p }; openPlot(p); draw(); focus(...X.world().center[p]); return; }
                if (p >= 0 && X.island(S).plots.includes(p)) { closeCard(); return; }
                closeCard();
            }
            const siteVisible = k => { const i = X.facInfo(S, k); return !X.level(S, k) && (i.ok || !!i.miss || i.price != null && i.needTier == null); };

            // ----- 卡片 -----
            const card = $('card');
            function closeCard() { card.classList.remove('on'); if (sel) { sel = null; } if (!zoomed()) fit(); else draw(); }
            function unlockText(ti) {
                const t = X.TIERS[ti], prev = X.TIERS[ti - 1] || { cap: {} }, out2 = [];
                X.FAC_KEYS.forEach(k => { const a = prev.cap[k] || 0, b = t.cap[k] || 0; if (b > a) out2.push(a ? `${X.FAC[k].name}到「${X.FAC[k].levels[b - 1]}」` : `可以蓋${X.FAC[k].name}`); });
                return out2.join('、');
            }
            function openPlot(p) {
                const i = X.plotInfo(S, p), n = X.island(S).plots.length, nt = X.TIERS[X.tierOf(S) + 1];
                const left = nt ? nt.n - n : 0;
                card.innerHTML = `<h2>買這塊地</h2>
                    <p class="line">${i.size} 格・跟你的地連著，會填海接起來</p>
                    <p class="price">${fmt(i.price)}</p>
                    <p class="note">價錢之後會變：越後面買的地越貴。${nt ? (left === 1 ? `買了這塊，島就升到「${nt.name}」：${unlockText(X.tierOf(S) + 1)}。` : `再買 ${left} 塊，島升到「${nt.name}」：${unlockText(X.tierOf(S) + 1)}。`) : ''}</p>
                    <div class="btns"><button type="button" class="btn" data-a="no">先不要</button><button type="button" class="btn main" data-a="buy" ${money < i.price ? 'disabled' : ''}>${money < i.price ? '錢包不夠' : '買下來'}</button></div>`;
                card.classList.add('on');
                card.querySelector('[data-a=no]').onclick = closeCard;
                card.querySelector('[data-a=buy]').onclick = () => act({ t: 'plot', p });
            }
            function facLine(k) {
                const lv = X.level(S, k), f = X.FAC[k];
                return `<span class="dots">${f.levels.map((n, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('')}</span> ${lv ? `第 ${NUM[lv]} 階` : '還沒蓋'}・最高 ${f.levels.length} 階`;
            }
            function openFac(k) {
                const lv = X.level(S, k), f = X.FAC[k], i = X.facInfo(S, k);
                let note = '', btn = '';
                if (i.max) note = '已經蓋到最高了。';
                else if (i.ok) btn = `<button type="button" class="btn main" data-a="build" ${money < i.price ? 'disabled' : ''}>${money < i.price ? '錢包不夠' : (lv ? '升級' : '蓋') + `：${i.name} ${fmt(i.price)}`}</button>`;
                else { note = i.why + (i.miss ? '（地圖上紅色那幾塊，點有鎖的地就能買）' : '') + '。'; btn = `<button type="button" class="btn main" disabled>${lv ? '升級' : '蓋'}：${i.name} ${fmt(i.price)}</button>`; }
                const sl = lv && f.slots ? X.slotsOf(S, k) : null;
                card.innerHTML = `<h2>${lv ? f.levels[lv - 1] : f.name + '・空地'}${lv ? `<span class="seal lvseal">${NUM[lv]}</span>` : ''}</h2>
                    <p class="line">${f.name}・${facLine(k)}</p>
                    ${note ? `<p class="note">${note}</p>` : ''}
                    ${sl ? `<button type="button" class="btn" data-a="park" style="width:100%;margin-top:12px">${k === 'garage' ? '換車' : '看船'}・停了 ${sl.filter(q => q.v).length}／${sl.length}</button>` : ''}
                    <div class="btns"><button type="button" class="btn" data-a="no">關上</button>${btn}</div>`;
                card.classList.add('on');
                card.querySelector('[data-a=no]').onclick = closeCard;
                const pb = card.querySelector('[data-a=park]'); if (pb) pb.onclick = () => enterPark(k);
                const b = card.querySelector('[data-a=build]'); if (b) b.onclick = () => act({ t: 'build', k });
            }
            function refreshUI() {
                if (park) openParkCard();
                else if (card.classList.contains('on') && sel) { if (sel.t === 'plot') { if (X.plotInfo(S, sel.p).ok) openPlot(sel.p); else closeCard(); } else openFac(sel.k); }
                if ($('sheet').classList.contains('on')) renderSheet();
            }

            // ----- 買、蓋 -----
            function act(a) {
                const before = X.vehicles(S).filter(v => v.in !== 'depot').length;
                const r = X.apply(S, a, money);
                if (!r.ok) { showToast(r.err); return; }
                S = r.state; money -= r.cost; save();
                const V = a.k && X.VEH[a.k], F = V && X.FAC[V.fac];
                if (a.t === 'plot') { showToast('買下來了・海岸線長出去'); sel = null; card.classList.remove('on'); }
                else if (a.t === 'build') { const off = before - X.vehicles(S).filter(v => v.in !== 'depot').length; showToast(`${X.FAC[a.k].levels[r.lv - 1]}・蓋好了` + (off > 0 ? `（${off} 台先收進寄放處）` : '')); }
                else if (a.t === 'buyv') showToast(r.parked ? (r.bumped ? `停進${F.name}了・${X.VEH[r.bumped].name}先讓位` : `停進${F.name}了`) : `${F.name}沒有空位，先放寄放處`);
                else if (a.t === 'park') showToast(`${V.name}・停好了`);
                else if (a.t === 'depot') showToast(`${V.name}・收進寄放處`);
                else if (a.t === 'sell') showToast(`${V.name}賣掉了・拿回 ${fmt(-r.cost)}`);
                rebuild(false);
                if (r.tierUp) {
                    $('upSeal').textContent = '島 ' + X.TIERS[r.tierUp].name;
                    $('upText').innerHTML = `島升到「${X.TIERS[r.tierUp].name}」了。<br>${unlockText(r.tierUp)}。`;
                    $('up').hidden = false; fit();
                }
            }
            $('upOk').onclick = () => { $('up').hidden = true; };

            // ----- 換車／看船（點位子 → 下面挑一台；從倉庫按「停進去」會先選好那台，點位子就停） -----
            let park = null;   // { f: 'garage'|'dock', slot: 第幾格, pick: 要停的那台 }
            function enterPark(f, pick) {
                const lv = X.level(S, f); if (!lv) return;
                park = { f, slot: null, pick: pick || null }; sel = null; closeSheet();
                const r = X.rect(f, lv), room = vh - 230, s2 = Math.max(cam.base, Math.min(4, vw / (r.w + 30), room / (r.h + 30)));
                cam.s = s2; cam.x = r.x + r.w / 2 - vw / 2 / s2; cam.y = r.y + r.h / 2 - room / 2 / s2; clampCam();
                openParkCard(); draw();
            }
            function exitPark() { park = null; card.classList.remove('on'); fit(); }
            const vimg = (k, max = 2) => { const v = X.VEH[k], z = Math.max(1, Math.min(max, Math.floor(48 / Math.max(v.h, v.w * 1.1)))); return `<img src="assets/xiaodao/v/${k}.png" alt="" style="width:${v.w * z}px;height:${v.h * z}px">`; };
            function openParkCard() {
                const f = park.f, lv = X.level(S, f), F = X.FAC[f], list = X.slotsOf(S, f), boat = f === 'dock';
                const n = list.filter(q => q.v).length;
                let html = `<h2>${boat ? '看船' : '換車'}・${F.levels[lv - 1]}</h2><p class="line">停了 ${n}／${list.length}・${park.pick ? `點一個位子停「${X.VEH[park.pick].name}」` : '點地圖上的一個位子'}</p>`;
                let btn2 = `<button type="button" class="btn" data-a="shop">去商店買</button>`;
                if (park.slot != null && list[park.slot]) {
                    const sl = list[park.slot], cn = X.CLS_NAME[f][sl.cls];
                    html += `<p class="note">第 ${sl.i + 1} 格・可以停${cn}${sl.cls > 1 ? '以下' : ''}・${sl.v ? `現在停「${X.VEH[sl.v].name}」` : '空的'}</p>`;
                    const mine = X.vehicles(S).filter(v => X.VEH[v.key].fac === f && v.key !== sl.v);
                    html += mine.length ? `<div class="vchips">${mine.map(v => { const why = X.fitWhy(v.key, sl); return `<button type="button" class="vchip" data-k="${v.key}" ${why ? 'disabled' : ''}><span class="vimg ${boat ? 'sea' : ''}">${vimg(v.key)}</span><b>${X.VEH[v.key].name}</b><i>${why || (v.in === 'depot' ? '寄放處' : '在第 ' + (v.at + 1) + ' 格')}</i></button>`; }).join('')}</div>`
                        : `<p class="note">${boat ? '還沒有別的船' : '還沒有別的車'}，去商店買。</p>`;
                    if (sl.v) btn2 = `<button type="button" class="btn" data-a="depot">收進寄放處</button>`;
                }
                card.innerHTML = html + `<div class="btns">${btn2}<button type="button" class="btn main" data-a="done">完成</button></div>`;
                card.classList.add('on');
                card.querySelector('[data-a=done]').onclick = exitPark;
                const sb = card.querySelector('[data-a=shop]'); if (sb) sb.onclick = () => { const f2 = park.f; exitPark(); vkind = f2; openSheet('shop', 'veh'); };
                const db = card.querySelector('[data-a=depot]'); if (db) db.onclick = () => act({ t: 'depot', k: list[park.slot].v });
                card.querySelectorAll('.vchip[data-k]').forEach(b => b.onclick = () => act({ t: 'park', k: b.dataset.k, f, i: park.slot }));
            }

            // ----- 商店、倉庫（同一張從下面滑上來） -----
            let smode = 'shop', stab = 'fac', vkind = 'garage', sellArm = null;
            const sheet = $('sheet');
            const TABS = { shop: [['plot', '地'], ['fac', '設施'], ['veh', '載具'], ['furn', '家具', 1], ['cloth', '衣服', 1]], depot: [['veh', '載具'], ['furn', '家具', 1], ['cloth', '衣服', 1], ['coll', '藏品', 1]] };
            const LATER = { furn: '家具第四批開（進屋擺）', cloth: '衣服第五批開', coll: '藏品第五批開（扭蛋）', gacha: '扭蛋第五批開（29 款藏品）', book: '圖鑑第五批開' };
            function openSheet(mode, t) { smode = mode || 'shop'; if (t) stab = t; else if (smode === 'depot') stab = 'veh'; renderSheet(); sheet.classList.add('on'); sheet.setAttribute('aria-hidden', 'false'); }
            function closeSheet() { sheet.classList.remove('on'); sheet.setAttribute('aria-hidden', 'true'); }
            $('sheetClose').onclick = closeSheet;
            sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
            $('stabs').addEventListener('click', e => { const b = e.target.closest('.stab'); if (!b) return; if (b.classList.contains('later')) { showToast(LATER[b.dataset.s]); return; } stab = b.dataset.s; renderSheet(); });
            const LEGAL = `<p class="legal">島上的東西都用遊戲幣買，不能儲值，也不能換成現金或任何獎品。</p>`;
            const kindChips = () => `<div class="subk">${[['garage', '車'], ['dock', '船']].map(([k, n]) => `<button type="button" class="stab ${vkind === k ? 'on' : ''}" data-kind="${k}">${n}</button>`).join('')}</div>`;
            function renderSheet() {
                $('sheetTitle').textContent = smode === 'shop' ? '商店' : '倉庫';
                if (!TABS[smode].some(([k, , l]) => k === stab && !l)) stab = TABS[smode][0][0];
                $('stabs').innerHTML = TABS[smode].map(([k, n, l]) => `<button type="button" class="stab ${l ? 'later' : ''} ${k === stab ? 'on' : ''}" data-s="${k}">${n}</button>`).join('');
                const body = $('sheetBody'), t = X.tierOf(S), n = X.island(S).plots.length;
                if (smode === 'shop' && stab === 'fac') {
                    body.innerHTML = X.FAC_KEYS.map(k => {
                        const f = X.FAC[k], lv = X.level(S, k), i = X.facInfo(S, k), showLv = lv || 1;
                        const can = i.ok && money >= i.price;
                        const label = i.max ? '最高了' : !i.ok ? (i.needTier != null ? `島「${X.TIERS[i.needTier].name}」` : i.miss ? `差 ${i.miss.length} 塊地` : '還不能蓋') : money < i.price ? '錢包不夠' : `${lv ? '升級' : '蓋'}<br>${fmt(i.price)}`;
                        return `<div class="row"><div class="thumb ${k === 'dock' ? 'sea' : ''}"><img src="assets/xiaodao/${k}${showLv}.png" alt=""></div>
                            <div class="info"><p class="nm">${lv ? f.levels[lv - 1] : f.name}</p><p class="sm">${facLine(k)}</p><p class="sm">${i.max ? '' : `下一階：${i.name} ${fmt(i.price)}${!i.ok ? '・' + i.why : ''}`}</p></div>
                            <button type="button" class="buy" data-k="${k}" ${can ? '' : 'disabled'}>${label}</button></div>`;
                    }).join('') + LEGAL;
                    body.querySelectorAll('.buy[data-k]').forEach(b => b.onclick = () => { act({ t: 'build', k: b.dataset.k }); });
                } else if (smode === 'shop' && stab === 'plot') {
                    const nextP = X.plotPrice(X.island(S).bought + 1);
                    body.innerHTML = `<p class="sm" style="margin-top:6px;line-height:1.9">點地圖上<b style="font-weight:500;color:rgb(var(--wabi-dark))">有鎖、灰色虛線</b>的地就能買（要跟你的地連著）。買了海岸線會長出去，越後面買的地越貴。</p>
                        <p class="price" style="margin-top:8px;font-family:'Noto Sans TC',sans-serif;color:rgb(var(--wabi-shu))">下一塊 ${fmt(nextP)}</p>
                        <p class="sm">已經有 ${n} 塊（一開始送 ${X.world().start.length} 塊），買過 ${X.island(S).bought} 塊。</p>
                        <table class="tier-table">${X.TIERS.map((x, i) => `<tr class="${i === t ? 'now' : ''}"><td style="white-space:nowrap">島 ${x.name}</td><td style="white-space:nowrap">${i ? x.n + ' 塊' : '一開始'}</td><td>${i ? unlockText(i) : '家、車庫、碼頭，最高到貳'}</td></tr>`).join('')}</table>
                        <button type="button" class="btn main" id="goMap" style="width:100%;margin-top:14px">回地圖挑地</button>` + LEGAL;
                    $('goMap').onclick = closeSheet;
                } else if (smode === 'shop' && stab === 'veh') {
                    // 載具：車、船，照種類分組；買之前車庫／碼頭要蓋到同一級
                    const F = X.FAC[vkind], keys = X.VEH_KEYS.filter(k => X.VEH[k].fac === vkind), groups = [...new Set(keys.map(k => X.VEH[k].g))];
                    body.innerHTML = kindChips() + `<p class="sm" style="margin-top:6px">${vkind === 'garage' ? '車' : '船'}每種一台。買了先停進${F.name}的空位，沒有空位就放寄放處（倉庫裡看得到）。</p>` + groups.map(g => `<p class="gh">${g}</p>` + keys.filter(k => X.VEH[k].g === g).map(k => {
                        const v = X.VEH[k], i = X.vehInfo(S, k), can = i.ok && money >= v.price;
                        const label = i.owned ? '有了' : !i.ok ? `${F.name}<br>「${F.levels[v.cls - 1]}」` : money < v.price ? '錢包不夠' : `買<br>${fmt(v.price)}`;
                        return `<div class="row"><div class="thumb v ${vkind === 'dock' ? 'sea' : ''}">${vimg(k)}</div>
                            <div class="info"><p class="nm">${v.name}</p><p class="sm">${v.desc}・${fmt(v.price)}</p><p class="sm">停${X.CLS_NAME[vkind][v.cls]}位・${F.name}要「${F.levels[v.cls - 1]}」以上</p></div>
                            <button type="button" class="buy" data-v="${k}" ${can ? '' : 'disabled'}>${label}</button></div>`;
                    }).join('')).join('') + LEGAL;
                    body.querySelectorAll('.buy[data-v]').forEach(b => b.onclick = () => act({ t: 'buyv', k: b.dataset.v }));
                } else if (smode === 'depot' && stab === 'veh') {
                    // 倉庫：有的車船，停在哪、停進去／收起來、賣掉（買價一半，按兩下確定）
                    const F = X.FAC[vkind], mine = X.vehicles(S).filter(v => X.VEH[v.key].fac === vkind).sort((a, b) => (a.in === 'depot') - (b.in === 'depot') || X.VEH[a.key].cls - X.VEH[b.key].cls);
                    const nd = mine.filter(v => v.in === 'depot').length;
                    body.innerHTML = kindChips() + `<p class="sm" style="margin-top:6px">${mine.length ? `有 ${mine.length} ${vkind === 'garage' ? '台' : '艘'}，停在${F.name} ${mine.length - nd}、寄放處 ${nd}。寄放處不限量，只是不會畫在島上。` : `還沒有${vkind === 'garage' ? '車' : '船'}。`}</p>` + mine.map(v => {
                        const V = X.VEH[v.key], armed = sellArm && sellArm.k === v.key && performance.now() - sellArm.t < 4000;
                        return `<div class="row"><div class="thumb v ${vkind === 'dock' ? 'sea' : ''}">${vimg(v.key)}</div>
                            <div class="info"><p class="nm">${V.name}</p><p class="sm">${v.in === 'depot' ? '在寄放處' : `停在${F.name}第 ${v.at + 1} 格`}</p><p class="sm">買價 ${fmt(V.price)}・賣掉拿回 ${fmt(X.sellPrice(v.key))}</p></div>
                            <div class="acts">${v.in === 'depot' ? `<button type="button" class="buy" data-park="${v.key}">停進去</button>` : `<button type="button" class="buy ghost" data-off="${v.key}">收起來</button>`}
                            <button type="button" class="buy ${armed ? 'warn' : 'ghost'}" data-sell="${v.key}">${armed ? '確定賣掉' : '賣掉'}</button></div></div>`;
                    }).join('') + (mine.length ? '' : `<button type="button" class="btn main" id="goShop" style="width:100%;margin-top:14px">去商店買</button>`) + LEGAL;
                    body.querySelectorAll('[data-park]').forEach(b => b.onclick = () => enterPark(vkind, b.dataset.park));
                    body.querySelectorAll('[data-off]').forEach(b => b.onclick = () => act({ t: 'depot', k: b.dataset.off }));
                    body.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => {
                        const k = b.dataset.sell;
                        if (sellArm && sellArm.k === k && performance.now() - sellArm.t < 4000) { sellArm = null; act({ t: 'sell', k }); }
                        else { sellArm = { k, t: performance.now() }; renderSheet(); showToast(`再按一次就賣掉，拿回 ${fmt(X.sellPrice(k))}`); }
                    });
                    const gs = $('goShop'); if (gs) gs.onclick = () => openSheet('shop', 'veh');
                }
                body.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { vkind = b.dataset.kind; renderSheet(); });
            }
            document.querySelector('.tabs').addEventListener('click', e => {
                const b = e.target.closest('.tab'); if (!b) return;
                if (park) exitPark();
                if (b.dataset.tab === 'shop') openSheet('shop'); else if (b.dataset.tab === 'depot') openSheet('depot'); else showToast(LATER[b.dataset.tab]);
            });

            // ----- 開始 -----
            size();
            new ResizeObserver(() => { if (size()) { if (world) { if (zoomed()) { clampCam(); draw(); } else fit(); } } }).observe(view);
            renderTop();
            D.load('assets/xiaodao/', '20261121b').then(() => setTimeout(() => rebuild(true), 30));
        }
    </script>
</body>

</html>
