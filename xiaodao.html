    <div id="app" class="app" hidden>
        <div class="top">
            <div class="bar">
                <a class="back" href="member.html">←<span> 會員・我</span></a>
                <h1 class="title">我的小島</h1>
                <span id="money" class="money"></span>
            </div>
            <div class="sub">
                <span id="tierSeal" class="seal">島 壹</span>
                <span><b id="nPlots">0</b> 塊地</span>
                <span id="nextTier"></span>
            </div>
            <button type="button" id="zoomTip" class="zoomtip" hidden>畫面被放大了・點這裡縮回<small>還是很大的話：瀏覽器右上「⋯」→「縮放」→ 100%</small></button>
            <div id="trial" class="trial" hidden>
                <span>監修中試玩・試玩錢包，不會動到真的錢包</span>
                <span style="display:flex;gap:6px"><button type="button" id="addMoney">＋1000 萬</button><button type="button" id="resetTrial">重來</button></span>
            </div>
        </div>

        <div id="view" class="view">
            <canvas id="cv" aria-label="我的小島：點兩下放大，點設施或有鎖的地"></canvas>
            <div id="loading" class="loading">整地中</div>
            <canvas id="mini" class="mini" hidden></canvas>
            <button type="button" id="zoomOut" class="zoomout" hidden aria-label="縮回去看全島">－</button>
            <div id="pin" class="pin" hidden>這一塊</div>
            <p id="hint" class="hint">點兩下放大・點設施看看</p>
            <div id="card" class="card" role="dialog" aria-live="polite"></div>
        </div>

        <!-- 屋內（第四批）：進屋時把島和下面四顆換成這一塊 -->
        <div id="room" class="room" hidden>
            <div class="rbar"><span id="rLeft"></span><b id="rName"></b><span id="rRight"></span></div>
            <div id="rFloors" class="rfloors"></div>
            <div id="rStage" class="rstage"><canvas id="rcv" aria-label="屋內"></canvas><p id="rHint" class="rhint"></p></div>
            <div id="rPanel" class="rpanel"></div>
        </div>

        <nav class="tabs" aria-label="小島">
            <button type="button" class="tab" data-tab="shop"><img src="assets/xiaodao/icon-shop.png" alt="">商店</button>
            <button type="button" class="tab" data-tab="depot"><img src="assets/xiaodao/icon-depot.png" alt="">倉庫</button>
            <button type="button" class="tab later" data-tab="gacha"><img src="assets/xiaodao/icon-gacha.png" alt="">扭蛋</button>
            <button type="button" class="tab later" data-tab="book"><img src="assets/xiaodao/icon-book.png" alt="">圖鑑</button>
        </nav>
    </div>

    <div id="sheet" class="sheet" aria-hidden="true">
        <div class="sheet-in" role="dialog" aria-label="商店">
            <div class="sheet-head"><h2 id="sheetTitle">商店</h2><button type="button" class="x" id="sheetClose">關上</button></div>
            <div class="stabs" id="stabs"></div>
            <div class="sheet-body" id="sheetBody"></div>
        </div>
    </div>

    <div id="up" class="up" hidden>
        <div class="up-in">
            <span id="upSeal" class="up-seal">島 貳</span>
            <p id="upText"></p>
            <button type="button" class="btn main" id="upOk" style="width:100%">好</button>
        </div>
    </div>

    <script>
        // ===== 開放了沒 =====
        // 六批都做完、使用者試過才開放（使用者 2026-11-21 定的）。開放前只放預告圖，網址加 ?preview 用試玩錢包玩（存在這支手機，不動真的錢包）。
        // 擋瀏覽器放大：iPhone 不理 user-scalable=no，要擋 gesture 事件和兩指的 touchmove；萬一還是放大了（或之前就放大著），把 viewport 重設一次就會縮回 1 倍
        (function () {
            ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
            document.addEventListener('touchmove', e => { if (e.touches.length > 1 && !e.target.closest('#cv')) e.preventDefault(); }, { passive: false });
            const vp = document.getElementById('vp'), base = vp.getAttribute('content'); let busy = false;
            function unzoom() {
                if (busy || !window.visualViewport || visualViewport.scale <= 1.02) return; busy = true;
                vp.setAttribute('content', 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
                setTimeout(() => { vp.setAttribute('content', base); busy = false; window.scrollTo(0, 0); }, 120);
            }
            // 還是放大著的話（擋不掉的放大方式、或縮不回去）：整個 App 塞進看得到的那一塊（不會有東西被切掉、按鈕跑到外面），上面跳一條提示
            // 也抓瀏覽器自己的「縮放」（Chrome 選單裡的，視窗變窄但 scale 還是 1）
            function fitApp() {
                const vv = window.visualViewport, z = vv && vv.scale > 1.02, narrow = screen.width && window.innerWidth < screen.width * 0.86;
                const tip = document.getElementById('zoomTip'); if (tip) tip.hidden = !(z || narrow);
                ['app', 'sheet', 'up'].forEach(id => { const el = document.getElementById(id); if (!el) return;
                    if (z) Object.assign(el.style, { top: vv.offsetTop + 'px', left: vv.offsetLeft + 'px', width: vv.width + 'px', height: vv.height + 'px', right: 'auto', bottom: 'auto', margin: '0', maxWidth: 'none' });
                    else ['top', 'left', 'width', 'height', 'right', 'bottom', 'margin', 'maxWidth'].forEach(k => el.style[k] = ''); });
            }
            window.__fitApp = fitApp;
            const both = () => { unzoom(); fitApp(); };
            if (window.visualViewport) { visualViewport.addEventListener('resize', both); visualViewport.addEventListener('scroll', both); }
            window.addEventListener('resize', fitApp); window.addEventListener('pageshow', both);
            document.addEventListener('DOMContentLoaded', () => { fitApp(); const tip = document.getElementById('zoomTip'); if (tip) tip.onclick = () => { busy = false; unzoom(); setTimeout(fitApp, 300); if (window.visualViewport && visualViewport.scale <= 1.02) showToast('如果還是很大：瀏覽器右上「⋯」→「縮放」→ 100%'); }; });
        })();
        const OPEN = false;
        const PREVIEW = /[?&]preview\b/.test(location.search);
        const X = XiaodaoRules, D = XiaodaoDraw, $ = id => document.getElementById(id);
        const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
        const NUM = ['', '壹', '貳', '參', '肆', '伍'];
        if (!OPEN && !PREVIEW) { $('teaser').hidden = false; }
        else start();

        function start() {
            $('app').hidden = false;
            // ----- 存檔（試玩：存在這支手機） -----
            const TRIAL_KEY = 'dongbuli-xiaodao-preview', TRIAL_MONEY = 50000000;
            let S, money;
            function loadTrial() {
                let d = null; try { d = JSON.parse(localStorage.getItem(TRIAL_KEY)); } catch (e) { }
                S = X.clean(d && d.s); money = d && d.money >= 0 ? d.money : TRIAL_MONEY;
            }
            function save() { try { localStorage.setItem(TRIAL_KEY, JSON.stringify({ s: S, money })); } catch (e) { } }
            loadTrial();
            $('trial').hidden = false;
            $('addMoney').onclick = () => { money += 10000000; save(); renderTop(); refreshUI(); showToast('試玩錢包多了 1000 萬'); };
            $('resetTrial').onclick = () => { try { localStorage.removeItem(TRIAL_KEY); } catch (e) { } loadTrial(); sel = null; closeCard(); rebuild(true); showToast('島回到第一天了'); };

            // ----- 上面那一列 -----
            function renderTop() {
                const t = X.tierOf(S), n = X.island(S).plots.length, nt = X.TIERS[t + 1];
                $('money').textContent = fmt(money);
                $('tierSeal').textContent = '島 ' + X.TIERS[t].name;
                $('nPlots').textContent = n;
                $('nextTier').textContent = nt ? `・再買 ${nt.n - n} 塊升「${nt.name}」` : '・島已經最大了';
            }

            // ----- 島和鏡頭 -----
            const view = $('view'), cv = $('cv'), ctx = cv.getContext('2d'), mini = $('mini');
            let world = null, out = null, vw = 0, vh = 0, dpr = 1;
            const cam = { x: 0, y: 0, s: 1, base: 1 };
            let sel = null;   // { t: 'plot', p } | { t: 'fac', k }
            function size() {
                const r = view.getBoundingClientRect(); dpr = Math.min(3, window.devicePixelRatio || 1);
                const w = Math.round(r.width), h = Math.round(r.height);
                if (w === vw && h === vh) return false;
                vw = w; vh = h; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); return true;
            }
            function fit(animate) {
                const b = D.bounds(S, 24), s = Math.min(vw / b.w, (vh - 20) / b.h);
                cam.base = s; cam.s = s; cam.x = b.x + b.w / 2 - vw / 2 / s; cam.y = b.y + b.h / 2 - vh / 2 / s; clampCam(); draw();
            }
            // 畫面中心要在島的範圍裡（拖不出去）
            function clampCam() {
                const b = D.bounds(S, 24), cx = cam.x + vw / 2 / cam.s, cy = cam.y + vh / 2 / cam.s;
                const nx = Math.max(b.x, Math.min(b.x + b.w, cx)), ny = Math.max(b.y, Math.min(b.y + b.h, cy));
                cam.x = nx - vw / 2 / cam.s; cam.y = ny - vh / 2 / cam.s;
            }
            // 卡片跳出來會蓋住下半部：選到的東西如果在卡片底下，把島往上推
            function focus(wx, wy) {
                requestAnimationFrame(() => {
                    const ch = card.classList.contains('on') ? card.offsetHeight + 20 : 0, sy = (wy - cam.y) * cam.s;
                    if (ch && sy > vh - ch - 24) { cam.y = wy - (vh - ch) / 2 / cam.s; clampCam(); draw(); }
                });
            }
            function zoomAt(s2, px, py) {
                s2 = Math.max(cam.base, Math.min(Math.max(cam.base * 4, 3), s2));
                // 縮回全島（或兩指捏到差不多全島）就整座島擺回正中間；卡片開著的話再把選到的東西推到卡片上面
                if (s2 <= cam.base * 1.05) { fit(); refocus(); return; }
                const wx = cam.x + px / cam.s, wy = cam.y + py / cam.s;
                cam.s = s2; cam.x = wx - px / s2; cam.y = wy - py / s2; clampCam(); draw();
            }
            function refocus() {
                if (!sel || !card.classList.contains('on')) return;
                if (sel.t === 'plot') focus(...X.world().center[sel.p]);
                else { const r = X.rect(sel.k, Math.max(1, X.level(S, sel.k))); focus(r.x + r.w / 2, r.y + r.h / 2); }
            }
            const zoomed = () => cam.s > cam.base * 1.05;

            function rebuild(refit) {
                out = D.render(S, { canvas: world || (world = document.createElement('canvas')) });
                $('loading').hidden = true;
                renderTop();
                if (refit) fit(); else { clampCam(); draw(); }
                refreshUI();
            }

            let raf = 0;
            function draw() { if (!raf) raf = requestAnimationFrame(paint); }
            function paint() {
                raf = 0; if (!world) return;
                ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#4f7d8f'; ctx.fillRect(0, 0, cv.width, cv.height);
                const k = dpr * cam.s; ctx.imageSmoothingEnabled = false;
                ctx.setTransform(k, 0, 0, k, -cam.x * k, -cam.y * k);
                ctx.drawImage(world, 0, 0);
                // 工地：還沒蓋、島的等級已經可以蓋的設施，畫白色虛線框
                ctx.lineWidth = 1.5 / cam.s; ctx.setLineDash([4 / cam.s, 3 / cam.s]);
                X.FAC_KEYS.forEach(k2 => { if (X.level(S, k2)) return; const i = X.facInfo(S, k2); if (i.needTier != null && i.why && !i.miss && !i.ok) return; const r = X.rect(k2, 1); ctx.strokeStyle = 'rgba(243,241,236,.85)'; ctx.strokeRect(r.x + .5, r.y + .5, r.w - 1, (r.shore != null ? r.shore - r.y : r.h) - 1); });
                ctx.setLineDash([]);
                // 選到的地／設施
                const Wd = X.world();
                const tint = (plots, col) => { ctx.fillStyle = col; plots.forEach(p => Wd.cells[p].forEach(c => ctx.fillRect((c % X.GW) * X.C, Math.floor(c / X.GW) * X.C, X.C, X.C))); };
                let pinAt = null;
                if (sel && sel.t === 'plot') { tint([sel.p], 'rgba(255,255,255,.32)'); pinAt = Wd.center[sel.p]; }
                if (sel && sel.t === 'fac') {
                    const lv = X.level(S, sel.k), r = X.rect(sel.k, Math.max(1, lv)), info = X.facInfo(S, sel.k);
                    if (info.miss) tint(info.miss, 'rgba(179,58,47,.28)');
                    ctx.lineWidth = 2 / cam.s; ctx.setLineDash([5 / cam.s, 3 / cam.s]); ctx.strokeStyle = '#fff';
                    ctx.strokeRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4); ctx.setLineDash([]);
                    if (info.miss && info.next) { const r2 = X.rect(sel.k, info.next); ctx.strokeStyle = 'rgba(179,58,47,.9)'; ctx.setLineDash([3 / cam.s, 3 / cam.s]); ctx.strokeRect(r2.x, r2.y, r2.w, r2.h); ctx.setLineDash([]); }
                }
                // 換車／看船：每一格框起來（選到的朱色；要停的那台停不進去的格子紅色虛線）
                if (park) {
                    X.slotsOf(S, park.f).forEach(sl => {
                        const on = park.slot === sl.i, bad = park.pick && X.fitWhy(park.pick, sl);
                        ctx.lineWidth = (on ? 2.4 : 1.3) / cam.s; ctx.setLineDash(on ? [] : [3 / cam.s, 2 / cam.s]);
                        ctx.strokeStyle = on ? '#b33a2f' : bad ? 'rgba(179,58,47,.75)' : 'rgba(255,255,255,.95)';
                        ctx.strokeRect(sl.x - 2, sl.y - 2, sl.w + 4, sl.h + 4);
                    });
                    ctx.setLineDash([]);
                }
                // 標籤「這一塊」
                const pin = $('pin');
                if (pinAt) { pin.hidden = false; pin.style.left = ((pinAt[0] - cam.x) * cam.s) + 'px'; pin.style.top = ((pinAt[1] - cam.y) * cam.s - 8) + 'px'; } else pin.hidden = true;
                // 小地圖（放大時）
                const z = zoomed(); mini.hidden = !z; $('zoomOut').hidden = !z; $('hint').style.opacity = z ? 0 : 1;
                $('zoomOut').style.top = (z ? 10 + 92 * (out.H / out.W) + 10 : 10) + 'px';
                if (z) {
                    const b = D.bounds(S, 24), mw = 92 * dpr, mh = Math.round(mw * b.h / b.w);
                    if (mini.width !== mw || mini.height !== mh) { mini.width = mw; mini.height = mh; }
                    mini.style.height = (mh / dpr) + 'px'; $('zoomOut').style.top = (10 + mh / dpr + 10) + 'px';
                    const m = mini.getContext('2d'), ks = mw / b.w; m.imageSmoothingEnabled = true;
                    m.setTransform(1, 0, 0, 1, 0, 0); m.drawImage(world, b.x, b.y, b.w, b.h, 0, 0, mw, mh);
                    m.strokeStyle = '#b33a2f'; m.lineWidth = 2 * dpr; m.strokeRect((cam.x - b.x) * ks, (cam.y - b.y) * ks, vw / cam.s * ks, vh / cam.s * ks);
                }
            }

            // ----- 摸：拖、點、點兩下、兩指縮放 -----
            const pts = new Map(); let drag = null, lastTap = { t: 0, x: 0, y: 0 }, pinch = null;
            const pos = e => { const r = view.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
            cv.addEventListener('pointerdown', e => {
                cv.setPointerCapture(e.pointerId); const p = pos(e); pts.set(e.pointerId, p);
                if (pts.size === 1) drag = { x0: p[0], y0: p[1], cx: cam.x, cy: cam.y, moved: false };
                if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: cam.s }; drag = null; }
            });
            cv.addEventListener('pointermove', e => {
                if (!pts.has(e.pointerId)) return; const p = pos(e); pts.set(e.pointerId, p);
                if (pinch && pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomAt(pinch.s * d / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); return; }
                if (!drag) return;
                if (!drag.moved && Math.hypot(p[0] - drag.x0, p[1] - drag.y0) > 8) drag.moved = true;
                if (drag.moved && zoomed()) { cam.x = drag.cx - (p[0] - drag.x0) / cam.s; cam.y = drag.cy - (p[1] - drag.y0) / cam.s; clampCam(); draw(); }
            });
            const up = e => {
                if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
                if (pinch) { if (pts.size < 2) pinch = null; drag = null; return; }
                if (!drag) return; const d = drag; drag = null; if (d.moved) return;
                const p = pos(e), now = performance.now();
                if (!park && now - lastTap.t < 320 && Math.hypot(p[0] - lastTap.x, p[1] - lastTap.y) < 30) { lastTap.t = 0; zoomAt(zoomed() ? cam.base : cam.base * 2.2, p[0], p[1]); return; }
                lastTap = { t: now, x: p[0], y: p[1] };
                tapAt(cam.x + p[0] / cam.s, cam.y + p[1] / cam.s);
            };
            cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e => { pts.delete(e.pointerId); drag = null; pinch = null; });
            cv.addEventListener('wheel', e => { e.preventDefault(); const p = pos(e); zoomAt(cam.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), p[0], p[1]); }, { passive: false });
            $('zoomOut').onclick = () => { zoomAt(cam.base, vw / 2, vh / 2); };

            function tapAt(wx, wy) {
                if (park) {   // 換車／看船：只點位子
                    const sl = X.slotsOf(S, park.f).find(q => wx >= q.x - 4 && wx < q.x + q.w + 4 && wy >= q.y - 4 && wy < q.y + q.h + 4);
                    if (sl && park.pick) { const k = park.pick; park.pick = null; park.slot = sl.i; act({ t: 'park', k, f: park.f, i: sl.i }); return; }
                    if (!sl && park.f === 'launchpad') { const only = X.slotsOf(S, 'launchpad')[0]; park.slot = only ? 0 : null; openParkCard(); draw(); return; }
                    park.slot = sl ? sl.i : null; openParkCard(); draw(); return;
                }
                // 設施（蓋好的、或可以蓋的工地）
                const hit = X.FAC_KEYS.slice().reverse().find(k => { const lv = X.level(S, k); if (!lv && !siteVisible(k)) return false; const r = X.rect(k, Math.max(1, lv)); return wx >= r.x && wx < r.x + r.w && wy >= r.y && wy < (r.shore != null && !lv ? r.shore : r.y + r.h); });
                if (hit) { sel = { t: 'fac', k: hit }; openFac(hit); draw(); const r = X.rect(hit, Math.max(1, X.level(S, hit))); focus(r.x + r.w / 2, r.y + r.h / 2); return; }
                const cx = Math.floor(wx / X.C), cy = Math.floor(wy / X.C);
                const p = cx >= 0 && cy >= 0 && cx < X.GW && cy < X.GH ? X.world().id[cy * X.GW + cx] : -1;
                if (p >= 0 && X.plotInfo(S, p).ok) { sel = { t: 'plot', p }; openPlot(p); draw(); focus(...X.world().center[p]); return; }
                if (p >= 0 && X.island(S).plots.includes(p)) { closeCard(); return; }
                closeCard();
            }
            const siteVisible = k => { const i = X.facInfo(S, k); return !X.level(S, k) && (i.ok || !!i.miss || i.price != null && i.needTier == null); };

            // ----- 卡片 -----
            const card = $('card');
            function closeCard() { card.classList.remove('on'); if (sel) { sel = null; } if (!zoomed()) fit(); else draw(); }
            function unlockText(ti) {
                const t = X.TIERS[ti], prev = X.TIERS[ti - 1] || { cap: {} }, out2 = [];
                X.FAC_KEYS.forEach(k => { const a = prev.cap[k] || 0, b = t.cap[k] || 0; if (b > a) out2.push(a ? `${X.FAC[k].name}到「${X.FAC[k].levels[b - 1]}」` : `可以蓋${X.FAC[k].name}`); });
                return out2.join('、');
            }
            function openPlot(p) {
                const i = X.plotInfo(S, p), n = X.island(S).plots.length, nt = X.TIERS[X.tierOf(S) + 1];
                const left = nt ? nt.n - n : 0;
                card.innerHTML = `<h2>買這塊地</h2>
                    <p class="line">${i.size} 格・跟你的地連著，會填海接起來</p>
                    <p class="price">${fmt(i.price)}</p>
                    <p class="note">價錢之後會變：越後面買的地越貴。${nt ? (left === 1 ? `買了這塊，島就升到「${nt.name}」：${unlockText(X.tierOf(S) + 1)}。` : `再買 ${left} 塊，島升到「${nt.name}」：${unlockText(X.tierOf(S) + 1)}。`) : ''}</p>
                    <div class="btns"><button type="button" class="btn" data-a="no">先不要</button><button type="button" class="btn main" data-a="buy" ${money < i.price ? 'disabled' : ''}>${money < i.price ? '錢包不夠' : '買下來'}</button></div>`;
                card.classList.add('on');
                card.querySelector('[data-a=no]').onclick = closeCard;
                card.querySelector('[data-a=buy]').onclick = () => act({ t: 'plot', p });
            }
            function facLine(k) {
                const lv = X.level(S, k), f = X.FAC[k];
                return `<span class="dots">${f.levels.map((n, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('')}</span> ${lv ? `第 ${NUM[lv]} 階` : '還沒蓋'}・最高 ${f.levels.length} 階`;
            }
            function openFac(k) {
                const lv = X.level(S, k), f = X.FAC[k], i = X.facInfo(S, k);
                let note = '', btn = '';
                if (i.max) note = '已經蓋到最高了。';

            function refreshUI() {
                if (park) openParkCard();

            // ----- 買、蓋 -----
            function act(a) {

                else if (a.t === 'build') { const off = before - X.vehicles(S).filter(v => v.in !== 'depot').length; showToast(`${X.FAC[a.k].levels[r.lv - 1]}・蓋好了` + (off > 0 ? `（${off} 台先收進寄放處）` : '')); }
                else if (a.t === 'buyv') showToast(V.fac === 'launchpad' ? (r.parked ? (r.bumped ? `立上發射台了・${X.VEH[r.bumped].name}先收起來` : '立上發射台了') : '發射台上已經有一枚，先放寄放處') : r.parked ? (r.bumped ? `停進${F.name}了・${X.VEH[r.bumped].name}先讓位` : `停進${F.name}了`) : `${F.name}沒有空位，先放寄放處`);
                else if (a.t === 'park') showToast(`${V.name}・${V.fac === 'launchpad' ? '立上去了' : '停好了'}`);
                else if (a.t === 'depot') showToast(`${V.name}・收進寄放處`);
                else if (a.t === 'sell') showToast(`${V.name}賣掉了・拿回 ${fmt(-r.cost)}`);
                const FU = a.k && X.FURN[a.k];
                if (a.t === 'buyf') showToast(`${FU.name}・放進倉庫了`);
                else if (a.t === 'sellf') showToast(`${FU.name}賣掉了・拿回 ${fmt(-r.cost)}`);
                else if (a.t === 'stow') showToast('收回倉庫了');
                else if (a.t === 'deco') showToast(r.cost ? `買了・花 ${fmt(r.cost)}，之後每一間都能用` : '換好了');
                if (a.t === 'build' && r.stowed) showToast(`${X.FAC.house.levels[r.lv - 1]}・蓋好了（房間變了，${r.stowed} 件家具先收回倉庫）`);
                if (['buyf', 'sellf', 'place', 'move', 'stow', 'deco'].includes(a.t)) { renderTop(); refreshUI(); if (roomOn) renderRoom(); return r; }
                rebuild(false);

            }
            $('upOk').onclick = () => { $('up').hidden = true; };

            // ----- 換車／看船（點位子 → 下面挑一台；從倉庫按「停進去」會先選好那台，點位子就停） -----
            // 四種載具：停哪、怎麼叫（第三批多了飛機、火箭）
            const KIND = { garage: { n: '車', u: '台', park: '換車', bg: '' }, dock: { n: '船', u: '艘', park: '看船', bg: 'sea' }, airfield: { n: '飛機', u: '架', park: '看飛機', bg: 'air' }, launchpad: { n: '火箭', u: '枚', park: '換火箭', bg: 'sky' } };
            const KINDS = Object.keys(KIND);
            let park = null;   // { f: 'garage'|'dock', slot: 第幾格, pick: 要停的那台 }
            function enterPark(f, pick) {
                const lv = X.level(S, f); if (!lv) return;
                park = { f, slot: null, pick: pick || null }; sel = null; closeSheet();
                const r = X.rect(f, lv), room = vh - 230, s2 = Math.max(cam.base, Math.min(4, vw / (r.w + 30), room / (r.h + 30)));
                cam.s = s2; cam.x = r.x + r.w / 2 - vw / 2 / s2; cam.y = r.y + r.h / 2 - room / 2 / s2; clampCam();
                openParkCard(); draw();
            }
            function exitPark() { park = null; card.classList.remove('on'); fit(); }
            const vimg = (k, max = 2) => { const v = X.VEH[k]; let z = Math.min(max, 48 / Math.max(v.h, v.w * 1.1)); if (z >= 1) z = Math.floor(z); return `<img src="assets/xiaodao/v/${k}.png" alt="" style="width:${Math.round(v.w * z)}px;height:${Math.round(v.h * z)}px">`; };
            function openParkCard() {

                const n = list.filter(q => q.v).length;
                let html = `<h2>${K.park}・${F.levels[lv - 1]}</h2><p class="line">${f === 'launchpad' ? '發射台一次立一枚' : `停了 ${n}／${list.length}`}・${park.pick ? `點一個位子停「${X.VEH[park.pick].name}」` : '點地圖上的一個位子'}</p>`;
                let btn2 = `<button type="button" class="btn" data-a="shop">去商店買</button>`;
                if (park.slot != null && list[park.slot]) {
                    const sl = list[park.slot], cn = X.CLS_NAME[f][sl.cls];
                    html += `<p class="note">第 ${sl.i + 1} 格・可以停${cn}${sl.cls > 1 ? '以下' : ''}・${sl.v ? `現在停「${X.VEH[sl.v].name}」` : '空的'}</p>`;
                    const mine = X.vehicles(S).filter(v => X.VEH[v.key].fac === f && v.key !== sl.v);
                    html += mine.length ? `<div class="vchips">${mine.map(v => { const why = X.fitWhy(v.key, sl); return `<button type="button" class="vchip" data-k="${v.key}" ${why ? 'disabled' : ''}><span class="vimg ${K.bg}">${vimg(v.key)}</span><b>${X.VEH[v.key].name}</b><i>${why || (v.in === 'depot' ? '寄放處' : '在第 ' + (v.at + 1) + ' 格')}</i></button>`; }).join('')}</div>`

                card.innerHTML = html + `<div class="btns">${btn2}<button type="button" class="btn main" data-a="done">完成</button></div>`;

            // ----- 商店、倉庫（同一張從下面滑上來） -----
            let smode = 'shop', stab = 'fac', vkind = 'garage', sellArm = null;
            const sheet = $('sheet');
            const TABS = { shop: [['plot', '地'], ['fac', '設施'], ['veh', '載具'], ['furn', '家具'], ['cloth', '衣服', 1]], depot: [['veh', '載具'], ['furn', '家具'], ['cloth', '衣服', 1], ['coll', '藏品', 1]] };
            const LATER = { cloth: '衣服第五批開', coll: '藏品第五批開（扭蛋）', gacha: '扭蛋第五批開（29 款藏品）', book: '圖鑑第五批開' };
            function openSheet(mode, t) { smode = mode || 'shop'; if (t) stab = t; else if (smode === 'depot') stab = 'veh'; renderSheet(); sheet.classList.add('on'); sheet.setAttribute('aria-hidden', 'false'); }
            function closeSheet() { sheet.classList.remove('on'); sheet.setAttribute('aria-hidden', 'true'); }
            $('sheetClose').onclick = closeSheet;
            sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

            const LEGAL = `<p class="legal">島上的東西都用遊戲幣買，不能儲值，也不能換成現金或任何獎品。</p>`;
            const kindChips = () => `<div class="subk">${KINDS.map(k => `<button type="button" class="stab ${vkind === k ? 'on' : ''}" data-kind="${k}">${KIND[k].n}</button>`).join('')}</div>`;
            function renderSheet() {
                $('sheetTitle').textContent = smode === 'shop' ? '商店' : '倉庫';
                if (!TABS[smode].some(([k, , l]) => k === stab && !l)) stab = TABS[smode][0][0];
                $('stabs').innerHTML = TABS[smode].map(([k, n, l]) => `<button type="button" class="stab ${l ? 'later' : ''} ${k === stab ? 'on' : ''}" data-s="${k}">${n}</button>`).join('');
                const body = $('sheetBody'), t = X.tierOf(S), n = X.island(S).plots.length;
                if (smode === 'shop' && stab === 'fac') {
                    body.innerHTML = X.FAC_KEYS.map(k => {
                        const f = X.FAC[k], lv = X.level(S, k), i = X.facInfo(S, k), showLv = lv || 1;
                        const can = i.ok && money >= i.price;
                        const label = i.max ? '最高了' : !i.ok ? (i.needTier != null ? `島「${X.TIERS[i.needTier].name}」` : i.miss ? `差 ${i.miss.length} 塊地` : '還不能蓋') : money < i.price ? '錢包不夠' : `${lv ? '升級' : '蓋'}<br>${fmt(i.price)}`;
                        return `<div class="row"><div class="thumb ${k === 'dock' ? 'sea' : ''}"><img src="assets/xiaodao/${k}${showLv}.png" alt=""></div>

                            <button type="button" class="buy" data-k="${k}" ${can ? '' : 'disabled'}>${label}</button></div>`;
                    }).join('') + LEGAL;
                    body.querySelectorAll('.buy[data-k]').forEach(b => b.onclick = () => { act({ t: 'build', k: b.dataset.k }); });
                } else if (smode === 'shop' && stab === 'plot') {
                    const nextP = X.plotPrice(X.island(S).bought + 1);
                    body.innerHTML = `<p class="sm" style="margin-top:6px;line-height:1.9">點地圖上<b style="font-weight:500;color:rgb(var(--wabi-dark))">有鎖、灰色虛線</b>的地就能買（要跟你的地連著）。買了海岸線會長出去，越後面買的地越貴。</p>
                        <p class="price" style="margin-top:8px;font-family:'Noto Sans TC',sans-serif;color:rgb(var(--wabi-shu))">下一塊 ${fmt(nextP)}</p>
                        <p class="sm">已經有 ${n} 塊（一開始送 ${X.world().start.length} 塊），買過 ${X.island(S).bought} 塊。</p>
                        <table class="tier-table">${X.TIERS.map((x, i) => `<tr class="${i === t ? 'now' : ''}"><td style="white-space:nowrap">島 ${x.name}</td><td style="white-space:nowrap">${i ? x.n + ' 塊' : '一開始'}</td><td>${i ? unlockText(i) : '家、車庫、碼頭，最高到貳'}</td></tr>`).join('')}</table>
                        <button type="button" class="btn main" id="goMap" style="width:100%;margin-top:14px">回地圖挑地</button>` + LEGAL;
                    $('goMap').onclick = closeSheet;
                } else if (smode === 'shop' && stab === 'veh') {
                    // 載具：車、船，照種類分組；買之前車庫／碼頭要蓋到同一級
                    const F = X.FAC[vkind], keys = X.VEH_KEYS.filter(k => X.VEH[k].fac === vkind), groups = [...new Set(keys.map(k => X.VEH[k].g))];
                    const K = KIND[vkind], Fl = X.level(S, vkind);
                    body.innerHTML = kindChips() + `<p class="sm" style="margin-top:6px">${K.n}每種一${K.u}。${vkind === 'launchpad' ? '發射台一次立一枚，空著就立上去，其他的收在寄放處，倉庫裡隨時可以換。' : `買了先停進${F.name}的空位，沒有空位就放寄放處（倉庫裡看得到）。`}${Fl ? '' : `<br>要先蓋${F.name}${vkind === 'launchpad' ? '（島升到「伍」、停機坪蓋到「私人機場」）' : vkind === 'airfield' ? '（島升到「貳」）' : ''}。`}</p>` + groups.map(g => `<p class="gh">${g}</p>` + keys.filter(k => X.VEH[k].g === g).map(k => {
                        const v = X.VEH[k], i = X.vehInfo(S, k), can = i.ok && money >= v.price;
                        const label = i.owned ? '有了' : !i.ok ? `${F.name}<br>「${F.levels[v.cls - 1]}」` : money < v.price ? '錢包不夠' : `買<br>${fmt(v.price)}`;
                        return `<div class="row"><div class="thumb v ${K.bg}">${vimg(k)}</div>
                            <div class="info"><p class="nm">${v.name}</p><p class="sm">${v.desc}・${fmt(v.price)}</p><p class="sm">${vkind === 'launchpad' ? '' : `停${X.CLS_NAME[vkind][v.cls]}位・`}${F.name}要「${F.levels[v.cls - 1]}」以上</p></div>
                            <button type="button" class="buy" data-v="${k}" ${can ? '' : 'disabled'}>${label}</button></div>`;
                    }).join('')).join('') + LEGAL;
                    body.querySelectorAll('.buy[data-v]').forEach(b => b.onclick = () => act({ t: 'buyv', k: b.dataset.v }));
                } else if (smode === 'depot' && stab === 'veh') {
                    // 倉庫：有的車船，停在哪、停進去／收起來、賣掉（買價一半，按兩下確定）
                    const F = X.FAC[vkind], mine = X.vehicles(S).filter(v => X.VEH[v.key].fac === vkind).sort((a, b) => (a.in === 'depot') - (b.in === 'depot') || X.VEH[a.key].cls - X.VEH[b.key].cls);
                    const nd = mine.filter(v => v.in === 'depot').length;
                    const K = KIND[vkind];
                    body.innerHTML = kindChips() + `<p class="sm" style="margin-top:6px">${mine.length ? `有 ${mine.length} ${K.u}，${vkind === 'launchpad' ? '立在' : '停在'}${F.name} ${mine.length - nd}、寄放處 ${nd}。寄放處不限量，只是不會畫在島上。` : `還沒有${K.n}。`}</p>` + mine.map(v => {
                        const V = X.VEH[v.key], armed = sellArm && sellArm.k === v.key && performance.now() - sellArm.t < 4000;
                        return `<div class="row"><div class="thumb v ${K.bg}">${vimg(v.key)}</div>

                            <div class="acts">${v.in === 'depot' ? `<button type="button" class="buy" data-park="${v.key}">停進去</button>` : `<button type="button" class="buy ghost" data-off="${v.key}">收起來</button>`}
                            <button type="button" class="buy ${armed ? 'warn' : 'ghost'}" data-sell="${v.key}">${armed ? '確定賣掉' : '賣掉'}</button></div></div>`;
                    }).join('') + (mine.length ? '' : `<button type="button" class="btn main" id="goShop" style="width:100%;margin-top:14px">去商店買</button>`) + LEGAL;

                if (stab === 'furn') renderFurnTab(body);
                body.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { vkind = b.dataset.kind; renderSheet(); });
            }
            document.querySelector('.tabs').addEventListener('click', e => {
                const b = e.target.closest('.tab'); if (!b) return;
                if (park) exitPark();
                if (b.dataset.tab === 'shop') openSheet('shop'); else if (b.dataset.tab === 'depot') openSheet('depot'); else showToast(LATER[b.dataset.tab]);
            });


            // ===== 屋內（第四批）=====
            // 進屋：島和下面四顆藏起來，換成房間；一層一張圖，點樓層切換。三種模式：看（view）、擺放（place）、地板壁紙（deco）
            const RM = XiaodaoRoom, rcv = $('rcv');
            let roomOn = false, rfl = 0, rmode = 'view', pm = null, rdeco = null, rscale = 1, rlay = null, fcat = '床', fcol = {}, roomLoaded = null;
            function openRoom(mode, pick) {
                if (!X.level(S, 'house')) return;
                roomLoaded = roomLoaded || RM.load('assets/xiaodao/', '20261122a');
                closeCard(); closeSheet(); if (park) exitPark();
                roomOn = true; $('view').hidden = true; document.querySelector('.tabs').hidden = true; $('room').hidden = false;
                rfl = Math.min(rfl, X.floorsOf(S).length - 1); rmode = 'view'; pm = null; rdeco = null;
                if (mode === 'place') startPlace(pick);
                roomLoaded.then(() => renderRoom());
            }
            function closeRoom() { roomOn = false; $('room').hidden = true; $('view').hidden = false; document.querySelector('.tabs').hidden = false; size(); fit(); }
            function renderRoom() {
                if (!roomOn) return;
                const fls = X.floorsOf(S); rfl = Math.min(rfl, fls.length - 1);
                $('rName').textContent = X.FAC.house.levels[X.level(S, 'house') - 1];
                $('rFloors').innerHTML = fls.length > 1 ? fls.map((f, i) => `<button type="button" class="${i === rfl ? 'on' : ''}" data-fl="${i}">${f.n}・${f.rooms.map(r => r.name).join('、')}</button>`).join('') : `<span>${fls[0].rooms.map(r => r.name).join('、')}</span>`;
                $('rFloors').querySelectorAll('[data-fl]').forEach(b => b.onclick = () => { rfl = +b.dataset.fl; if (pm) { pm.ghost = null; if (pm.move) pm.move = null; } rdeco = null; renderRoom(); });
                // 上面左右：看的時候「← 回島上」；擺放、地板壁紙的時候「取消／完成」
                if (rmode === 'view') { $('rLeft').innerHTML = `<button type="button" id="rBack">← 回島上</button>`; $('rRight').innerHTML = '<span style="display:inline-block;min-width:64px"></span>'; $('rBack').onclick = closeRoom; }
                else { $('rLeft').innerHTML = `<button type="button" id="rCancel">取消</button>`; $('rRight').innerHTML = `<button type="button" class="main" id="rDone">完成</button>`; $('rCancel').onclick = cancelMode; $('rDone').onclick = () => { rmode = 'view'; pm = null; rdeco = null; renderRoom(); }; }
                // 畫房間（擺放中：選好的那件半透明預覽）
                const g = pm && pm.ghost ? Object.assign({ k: pm.k, c: pm.c }, pm.ghost) : null;
                const o = RM.render(S, rfl, { canvas: rcv, ghost: g, hide: pm && pm.move && pm.ghost ? pm.move : null }); rlay = o.layout;
                const st = $('rStage').getBoundingClientRect(), sc = Math.min((st.width - 16) / rlay.W, (st.height - 28) / rlay.H);
                rscale = sc >= 1 ? Math.floor(sc * 2) / 2 : sc; rcv.style.width = Math.round(rlay.W * rscale) + 'px'; rcv.style.height = Math.round(rlay.H * rscale) + 'px';
                // 地板壁紙：選到的房間框起來
                if (rdeco) { const r = rlay.rooms.find(q => q.id === rdeco); if (r) { const x = rcv.getContext('2d'); x.strokeStyle = '#b33a2f'; x.lineWidth = 2; x.strokeRect(r.x0 - 3, 1, r.w * RM.T + 6, RM.TOP + r.h * RM.T + 2); } }
                renderRoomPanel();
            }
            const rHint = (t, bad) => { const h = $('rHint'); h.textContent = t || ''; h.classList.toggle('bad', !!bad); };
            function renderRoomPanel() {
                const P = $('rPanel'), here = rlay ? rlay.rooms.reduce((n, r) => n + X.placedIn(S, r.id).length, 0) : 0;
                if (rmode === 'view') {
                    rHint(here ? `這層擺了 ${here} 件家具` : '這層還空空的，按「擺放」從倉庫拿家具出來');
                    P.innerHTML = `<div class="rrow"><button type="button" class="btn" data-r="deco">地板・壁紙</button><button type="button" class="btn" data-r="shot">${SaveImg.inApp ? '存一張圖' : navigator.canShare ? '分享一張圖' : '存一張圖'}</button><button type="button" class="btn main" data-r="place">擺放</button></div>`;
                    P.querySelector('[data-r=deco]').onclick = () => { rmode = 'deco'; rdeco = rlay.rooms[0].id; snap(); renderRoom(); };
                    P.querySelector('[data-r=place]').onclick = () => { startPlace(); renderRoom(); };
                    P.querySelector('[data-r=shot]').onclick = shotRoom;
                } else if (rmode === 'place') {
                    const stacks = S.items.filter(t => X.FURN[t.key] && t.in === 'depot');
                    P.innerHTML = (stacks.length ? `<div class="tray">${stacks.map(t => `<button type="button" class="vchip ${pm.k === t.key && pm.c === t.c && !pm.move ? 'on' : ''}" data-k="${t.key}" data-c="${t.c}"><span class="vimg"><img src="${RM.thumb(t.key, t.c)}" alt="" style="${furnImgStyle(t.key)}"></span><b>${X.FURN[t.key].name}</b><i>×${t.qty}</i></button>`).join('')}</div>`
                        : `<p class="note" style="margin:0 0 8px">倉庫裡沒有家具了。<button type="button" class="btn" data-r="shop" style="margin-left:6px;min-height:32px;padding:0 10px">去商店買</button></p>`)
                        + `<div class="rrow"><button type="button" class="btn" data-r="rot" ${pm.k ? '' : 'disabled'}>旋轉</button><button type="button" class="btn" data-r="stow" ${pm.move ? '' : 'disabled'}>收回</button><button type="button" class="btn main" data-r="put" ${pm.ghost && !pm.ghost.bad ? '' : 'disabled'}>放這裡</button></div>`;
                    P.querySelectorAll('.tray .vchip').forEach(b => b.onclick = () => { pm = { snap: pm.snap, k: b.dataset.k, c: +b.dataset.c, rot: 0, ghost: null, move: null }; renderRoom(); rHint(`點房間裡的一格放「${X.FURN[pm.k].name}」`); });
                    const sb = P.querySelector('[data-r=shop]'); if (sb) sb.onclick = () => { openSheet('shop', 'furn'); };
                    P.querySelector('[data-r=rot]').onclick = rotateGhost;
                    P.querySelector('[data-r=stow]').onclick = () => { const id = pm.move; pm.move = null; pm.ghost = null; pm.k = null; act({ t: 'stow', id }); };
                    P.querySelector('[data-r=put]').onclick = putGhost;
                    if (!pm.k) rHint(stacks.length ? '點下面一件家具，再點房間裡的一格；點擺好的家具可以移動' : '點擺好的家具可以移動、收回');
                } else if (rmode === 'deco') {
                    const st = X.styleOf(S, rdeco), r = rlay.rooms.find(q => q.id === rdeco);
                    rHint(`改「${r ? r.name : ''}」：點別間房間可以換`);
                    const sw = (kind, list) => list.map((x, i) => { const own = kind === 'floor' ? X.hasFloor(S, i) : X.hasPaper(S, i), on = (kind === 'floor' ? st.floor : st.paper) === i;
                        return `<button type="button" class="${on ? 'on' : ''}" data-${kind}="${i}"><img src="${RM.swatch(kind, i)}" alt="">${x.n}<i>${on ? '用著' : own ? '有了' : fmt(x.p)}</i></button>`; }).join('');
                    P.innerHTML = `<p class="swl">地板</p><div class="sw">${sw('floor', X.FLOORS)}</div><p class="swl">壁紙</p><div class="sw">${sw('paper', X.PAPERS)}</div>`;
                    P.querySelectorAll('[data-floor]').forEach(b => b.onclick = () => act({ t: 'deco', room: rdeco, floor: +b.dataset.floor }));
                    P.querySelectorAll('[data-paper]').forEach(b => b.onclick = () => act({ t: 'deco', room: rdeco, paper: +b.dataset.paper }));
                }
            }
            function furnImgStyle(k) { const f = X.FURN[k], w = f.w * 10, h = f.kind === 'pic' ? 16 : f.h * 10, z = Math.min(2, 46 / Math.max(w, h)); return `width:${Math.round(w * z)}px;height:${Math.round(h * z)}px;image-rendering:pixelated`; }
            // 取消：回到進這個模式之前（擺放、換地板壁紙都可以整個還原；花掉的錢也退回）
            function snap() { rsnap = { s: JSON.stringify(S), money }; }
            let rsnap = null;
            function cancelMode() { if (rsnap) { S = X.clean(JSON.parse(rsnap.s)); money = rsnap.money; save(); renderTop(); refreshUI(); } rmode = 'view'; pm = null; rdeco = null; rsnap = null; renderRoom(); showToast('都還原了'); }
            function startPlace(pick) { rmode = 'place'; rsnap = { s: JSON.stringify(S), money }; pm = { k: pick ? pick.k : null, c: pick ? pick.c : 0, rot: 0, ghost: null, move: null }; }
            // 點房間：哪一間、哪一格（北牆那條是 y = -1，給掛畫）
            function cellAt(e) {
                const b = rcv.getBoundingClientRect(), px = (e.clientX - b.left) / rscale, py = (e.clientY - b.top) / rscale;
                const r = rlay.rooms.find(q => px >= q.x0 - 2 && px < q.x0 + q.w * RM.T + 2); if (!r) return null;
                const x = Math.max(0, Math.min(r.w - 1, Math.floor((px - r.x0) / RM.T)));
                if (py < RM.TOP && py >= 2) return { r, x, y: -1 };
                const y = Math.floor((py - RM.TOP) / RM.T); if (y < 0 || y >= r.h) return null; return { r, x, y };
            }
            function furnAt(r, x, y) {   // 點到哪一件（掛畫、家具、地毯的順序）
                const list = X.placedIn(S, r.id);
                if (y === -1) return list.find(t => X.FURN[t.key].kind === 'pic' && x >= t.at[0] && x < t.at[0] + X.FURN[t.key].w);
                const hit = t => { const [w, h] = X.fpOf(t.key, t.rot); return X.FURN[t.key].kind !== 'pic' && x >= t.at[0] && x < t.at[0] + w && y >= t.at[1] && y < t.at[1] + h; };
                return list.filter(t => X.layerOf(t.key) === 'obj').find(hit) || list.filter(t => X.layerOf(t.key) === 'rug').find(hit);
            }
            // 放在哪一格：點的那格當家具的中間；貼牆的、掛畫的自動靠過去
            function aimAt(r, cx, cy) {
                const f = X.FURN[pm.k];
                if (f.kind === 'pic') { const x = Math.max(0, Math.min(r.w - f.w, cx - Math.floor((f.w - 1) / 2))); return { room: r.id, x, y: -1, rot: 0 }; }
                let rot = pm.rot;
                if (f.kind === 'wall') {   // 靠最近的那面牆
                    const d = [[cy, 0], [r.w - 1 - cx, 1], [r.h - 1 - cy, 2], [cx, 3]].sort((a, b) => a[0] - b[0]); rot = d[0][1];
                    const [w, h] = X.fpOf(pm.k, rot); let x = cx - Math.floor((w - 1) / 2), y = cy - Math.floor((h - 1) / 2);
                    if (rot === 0) y = 0; if (rot === 2) y = r.h - h; if (rot === 1) x = r.w - w; if (rot === 3) x = 0;
                    return { room: r.id, x: Math.max(0, Math.min(r.w - w, x)), y: Math.max(0, Math.min(r.h - h, y)), rot };
                }
                const [w, h] = X.fpOf(pm.k, rot);
                return { room: r.id, x: Math.max(0, Math.min(r.w - w, cx - Math.floor((w - 1) / 2))), y: Math.max(0, Math.min(r.h - h, cy - Math.floor((h - 1) / 2))), rot };
            }
            function checkGhost() {
                const g = pm.ghost, chk = X.canPlace(S, g.room, pm.k, g.x, g.y, g.rot, pm.move || undefined);
                g.bad = !chk.ok; if (chk.ok) g.rot = chk.rot; rHint(chk.ok ? `「${X.FURN[pm.k].name}」放這裡？按「放這裡」` : chk.why, !chk.ok);
            }
            rcv.addEventListener('click', e => {
                if (!roomOn || !rlay) return; const at = cellAt(e); if (!at) return;
                if (rmode === 'deco') { rdeco = at.r.id; renderRoom(); return; }
                if (rmode === 'view') { const t = furnAt(at.r, at.x, at.y); if (t) showToast(`${X.FURN[t.key].name}・${X.FURN[t.key].colors[t.c].n}`); return; }
                // 擺放：點到擺好的家具 → 拿起來移動；不然把選好的那件放在這格
                const t = (!pm.k || pm.move) ? furnAt(at.r, at.x, at.y) : null;
                if (t && t.id !== pm.move) { pm = { snap: pm.snap, k: t.key, c: t.c, rot: t.rot, move: t.id, ghost: { room: at.r.id, x: t.at[0], y: t.at[1], rot: t.rot } }; checkGhost(); renderRoom(); checkGhost(); return; }
                if (!pm.k) { rHint('先點下面一件家具'); return; }
                if (X.FURN[pm.k].kind !== 'pic' && at.y === -1) at.y = 0;
                pm.ghost = aimAt(at.r, at.x, at.y); checkGhost(); renderRoom(); checkGhost();
            });
            function rotateGhost() {
                if (!pm.k) return; const f = X.FURN[pm.k];
                if (f.kind === 'one' || f.kind === 'rugone' || f.kind === 'pic') { showToast('這件不用轉'); return; }
                if (f.kind === 'wall') { showToast('貼牆的家具會自動轉向，換一面牆放就好'); return; }
                pm.rot = (pm.rot + 1) % (f.kind === 'two' || f.kind === 'rug' ? 2 : 4);
                if (pm.ghost) { const r = rlay.rooms.find(q => q.id === pm.ghost.room), [w, h] = X.fpOf(pm.k, pm.rot); pm.ghost.rot = pm.rot; pm.ghost.x = Math.max(0, Math.min(r.w - w, pm.ghost.x)); pm.ghost.y = Math.max(0, Math.min(r.h - h, pm.ghost.y)); checkGhost(); }
                renderRoom(); if (pm.ghost) checkGhost();
            }
            function putGhost() {
                const g = pm.ghost; if (!g || g.bad) return;
                const r = pm.move ? act({ t: 'move', id: pm.move, room: g.room, x: g.x, y: g.y, rot: g.rot }) : act({ t: 'place', k: pm.k, c: pm.c, room: g.room, x: g.x, y: g.y, rot: g.rot });
                if (!r || !r.ok) return;
                const left = S.items.find(t => t.key === pm.k && t.in === 'depot' && t.c === pm.c);
                pm = { k: !pm.move && left ? pm.k : null, c: pm.c, rot: pm.rot, ghost: null, move: null };
                showToast('放好了'); renderRoom();
            }
            async function shotRoom() {
                const o = RM.render(S, rfl, {}), z = 3, pad = 24, W = o.layout.W * z + pad * 2, H = o.layout.H * z + pad * 2 + 54;
                const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
                x.fillStyle = '#fcfaf8'; x.fillRect(0, 0, W, H); x.drawImage(o.canvas, pad, pad, o.layout.W * z, o.layout.H * z);
                x.fillStyle = '#2c2c2c'; x.font = '600 26px "Noto Serif TC", serif'; x.textBaseline = 'middle'; x.fillText(`我的小島・${X.FAC.house.levels[X.level(S, 'house') - 1]}・${o.layout.n}`, pad, H - 32);
                x.fillStyle = '#b33a2f'; x.font = '16px "Noto Sans TC", sans-serif'; x.textAlign = 'right'; x.fillText('DONGBULI・27F', W - pad, H - 32);
                const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
                await SaveImg.save(new File([blob], 'dongbuli-xiaodao-room.png', { type: 'image/png' }), { title: '我的小島', text: '我的小島的房間' });
            }
            new ResizeObserver(() => { if (roomOn) renderRoom(); }).observe($('rStage'));

            // ----- 商店、倉庫的家具分頁 -----
            function renderFurnTab(body) {
                const cats = [...new Set(X.FURN_KEYS.map(k => X.FURN[k].cat))];
                if (smode === 'shop') {
                    const keys = X.FURN_KEYS.filter(k => X.FURN[k].cat === fcat);
                    body.innerHTML = `<div class="subk" style="flex-wrap:wrap">${cats.map(c => `<button type="button" class="stab ${c === fcat ? 'on' : ''}" data-fcat="${c}">${c}</button>`).join('')}</div>
                        <p class="sm" style="margin-top:6px">買了先放倉庫，進屋按「擺放」拿出來。一樣的會疊起來記數量。${X.level(S, 'house') < X.FURN_LUX_HOUSE ? `豪華的家具要先有「${X.FAC.house.levels[X.FURN_LUX_HOUSE - 1]}」。` : ''}</p>` + keys.map(k => {
                        const f = X.FURN[k], c = fcol[k] || 0, i = X.furnInfo(S, k), have = S.items.filter(t => t.key === k).reduce((n, t) => n + (t.in === 'depot' ? t.qty : 1), 0), can = i.ok && money >= f.price;
                        const label = !i.ok ? (f.tier === '豪華' && X.level(S, 'house') < X.FURN_LUX_HOUSE ? `要先有<br>「${X.FAC.house.levels[X.FURN_LUX_HOUSE - 1]}」` : '買不了') : money < f.price ? '錢包不夠' : `${have ? '再買' : '買'}<br>${fmt(f.price)}`;
                        return `<div class="row"><div class="thumb f"><img src="${RM.thumb(k, c)}" alt="" style="${furnImgStyle(k)}"></div>
                            <div class="info"><p class="nm">${f.name}${have ? `<span class="sm" style="margin-left:6px">有 ${have}</span>` : ''}</p><p class="sm">${f.tier}${f.note ? '・' + f.note : ''}・${f.kind === 'pic' ? `寬 ${f.w} 格` : `${f.w}×${f.h} 格`}・${fmt(f.price)}</p>
                            <p class="sm">${f.colors.length > 1 ? `<span class="cdots">${f.colors.map((cc, j) => `<button type="button" class="${j === c ? 'on' : ''}" style="background:${cc.sw}" data-fk="${k}" data-fc="${j}" aria-label="${cc.n}"></button>`).join('')}</span> ` : ''}${f.colors[c].n}</p></div>
                            <button type="button" class="buy" data-buyf="${k}" ${can ? '' : 'disabled'}>${label}</button></div>`;
                    }).join('') + LEGAL;
                    body.querySelectorAll('[data-fcat]').forEach(b => b.onclick = () => { fcat = b.dataset.fcat; renderSheet(); });
                    body.querySelectorAll('[data-fk]').forEach(b => b.onclick = () => { fcol[b.dataset.fk] = +b.dataset.fc; renderSheet(); });
                    body.querySelectorAll('[data-buyf]').forEach(b => b.onclick = () => act({ t: 'buyf', k: b.dataset.buyf, c: fcol[b.dataset.buyf] || 0 }));
                } else {
                    const stacks = S.items.filter(t => X.FURN[t.key] && t.in === 'depot'), placed = S.items.filter(t => X.FURN[t.key] && t.in !== 'depot').length;
                    body.innerHTML = `<p class="sm" style="margin-top:6px">倉庫裡 ${stacks.reduce((n, t) => n + t.qty, 0)} 件、擺在屋裡 ${placed} 件（最多 ${X.FURN_MAX} 件）。${X.level(S, 'house') ? '' : '要先有家才能進屋擺。'}</p>` + stacks.map(t => {
                        const f = X.FURN[t.key], armed = sellArm && sellArm.k === t.key + ':' + t.c && performance.now() - sellArm.t < 4000;
                        return `<div class="row"><div class="thumb f"><img src="${RM.thumb(t.key, t.c)}" alt="" style="${furnImgStyle(t.key)}"></div>
                            <div class="info"><p class="nm">${f.name} <span class="sm">×${t.qty}</span></p><p class="sm">${f.colors[t.c].n}・${f.kind === 'pic' ? '掛北牆' : `${f.w}×${f.h} 格`}</p><p class="sm">賣一件拿回 ${fmt(X.furnSell(t.key))}</p></div>
                            <div class="acts"><button type="button" class="buy" data-putf="${t.key}" data-c="${t.c}" ${X.level(S, 'house') ? '' : 'disabled'}>擺到屋內</button><button type="button" class="buy ${armed ? 'warn' : 'ghost'}" data-sellf="${t.key}" data-c="${t.c}">${armed ? '確定賣一件' : '賣一件'}</button></div></div>`;
                    }).join('') + (stacks.length ? '' : `<button type="button" class="btn main" id="goShopF" style="width:100%;margin-top:14px">去商店買家具</button>`) + LEGAL;
                    body.querySelectorAll('[data-putf]').forEach(b => b.onclick = () => openRoom('place', { k: b.dataset.putf, c: +b.dataset.c }));
                    body.querySelectorAll('[data-sellf]').forEach(b => b.onclick = () => {
                        const id = b.dataset.sellf + ':' + b.dataset.c;
                        if (sellArm && sellArm.k === id && performance.now() - sellArm.t < 4000) { sellArm = null; act({ t: 'sellf', k: b.dataset.sellf, c: +b.dataset.c }); }
                        else { sellArm = { k: id, t: performance.now() }; renderSheet(); showToast(`再按一次就賣一件，拿回 ${fmt(X.furnSell(b.dataset.sellf))}`); }
                    });
                    const g = $('goShopF'); if (g) g.onclick = () => { fcat = '床'; openSheet('shop', 'furn'); };
                }
            }

            // ----- 開始 -----
            size();
            new ResizeObserver(() => { if (size()) { if (world) { if (zoomed()) { clampCam(); draw(); } else fit(); } } }).observe(view);
            renderTop();
            D.load('assets/xiaodao/', '20261122a').then(() => setTimeout(() => rebuild(true), 30));
            roomLoaded = RM.load('assets/xiaodao/', '20261122a');   // 家具的圖先載好（商店、倉庫的小圖要用）
            roomLoaded.then(() => { if ($('sheet').classList.contains('on')) renderSheet(); if (roomOn) renderRoom(); });
        }
    </script>
