    <style>
        /* 這頁走彩券行的熱鬧風格，不跟網站的侘寂風；彩券是紙本，顏色固定 */
        .shop {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .money {
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        /* ===== 架上 ===== */
        .cover {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(150deg, var(--c1), var(--c2));
            box-shadow: 0 14px 30px -16px rgba(0, 0, 0, 0.55);
        }

        .cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.06) 0 8px, transparent 8px 16px);
            pointer-events: none;
        }

        .cover-name {
            font-weight: 900;
            font-size: 1.45rem;
            letter-spacing: 0.06em;
            color: var(--hi);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
        }

        .cover-price {
            min-width: 3.6rem;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            background: var(--hi);
            color: var(--c2);
            font-weight: 900;
            text-align: center;
        }

        .buy {
            position: relative;
            z-index: 1;
            flex: 1;
            min-height: 44px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--c2);
            font-weight: 900;
            font-size: 0.85rem;
            touch-action: manipulation;
        }

        .buy:active {
            transform: scale(0.97);
        }

        .buy:disabled {
            opacity: 0.4;
        }

        /* ===== 彩券本體 ===== */
        .tk {
            position: relative;
            border-radius: 12px;
            padding: 0.9rem 0.8rem 0.8rem;
            color: #fff;
            background: linear-gradient(160deg, var(--c1), var(--c2));
            box-shadow: 0 0 0 3px var(--hi) inset, 0 24px 50px -20px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .tk::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.05) 0 10px, transparent 10px 20px);
            pointer-events: none;
        }

        .tk>* {
            position: relative;
        }

        .tk-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .tk-name {
            font-weight: 900;
            font-size: 1.7rem;
            line-height: 1.1;
            letter-spacing: 0.04em;
            color: var(--hi);
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
        }

        .tk-price {
            flex-shrink: 0;
            width: 3.4rem;
            height: 3.4rem;
            border-radius: 9999px;
            background: var(--hi);
            color: var(--c2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1rem;
            transform: rotate(-10deg);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
        }

        .tk-jackpot {
            margin-top: 0.2rem;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .tk-jackpot b {
            font-weight: 900;
            font-size: 1.25rem;

        }

        .tk-panel {
            margin-top: 0.6rem;
            padding: 0.45rem;
            border-radius: 8px;
            background: #fffaf0;
            color: #3a2a1a;
        }

        .tk-label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 0.15rem 0.3rem;
            font-weight: 900;
            font-size: 0.8rem;
            color: var(--c2);
        }

        .tk-label small {
            font-weight: 500;
            font-size: 0.65rem;
            color: #8a7560;
        }

        .tk-rule {
            margin-top: 0.55rem;
            font-size: 0.65rem;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.9);
        }

        .tk-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.6rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.75);

        .tk-code {
            width: 9.5rem;
            height: 1.6rem;

        .tk-code-in {
            height: 100%;
            border-radius: 4px;
            background: #fffaf0;
            color: #3a2a1a;
            font-size: 0.6rem;
            letter-spacing: 0.08em;

        .zone {

        }

        .foil {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;

            touch-action: none;
            transition: opacity 0.4s;

        .foil.is-done {
            opacity: 0;

        /* 格子 */
        .g {
            display: grid;
            gap: 0.3rem;
        }

        .c {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;

            background: #fff;

            font-size: 1.35rem;

        .c-amt {

            color: #c0261d;
        }

        .c-cap {

        .c-sym {

        /* 21 點：撲克牌 */
        .card-pt {

        /* 賓果卡 */
        .bingo {

            grid-template-columns: repeat(5, 1fr);
            gap: 0.2rem;
        }

        .bingo .h {
            text-align: center;
            font-weight: 900;
            font-size: 0.9rem;
            color: var(--c2);
        }

        .bingo .b {
            position: relative;
            height: 2.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: #fff;
            border: 1px solid #e5d6f5;
            font-weight: 900;
            font-size: 0.95rem;
            color: #2a1d12;
            transition: background-color 0.25s, color 0.25s;
        }

        .bingo .b.is-free {
            background: var(--c2);
            color: var(--hi);
            font-size: 0.6rem;
        }

        .bingo .b.is-dab::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 9999px;
            background: rgba(192, 38, 29, 0.5);
        }

        .bingo .b.is-line {
            background: #ffe14d;
        }

        .bingo .b.is-line::after {
            background: rgba(192, 38, 29, 0.8);
        }

        .prize-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.15rem 0.4rem;
            margin-top: 0.4rem;
            font-size: 0.62rem;
            color: #5a4630;
        }

        .prize-list b {
            color: #c0261d;
        }

        /* ===== 開獎結果 ===== */
        .result-amt {
            font-weight: 900;
            font-size: 2.6rem;
            line-height: 1.1;
            color: #c0261d;
        }

        html.night .result-amt {
            color: #ff6b5e;
        }

        .act {
            min-height: 48px;
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            font-weight: 900;
            font-size: 0.9rem;
            border: 2px solid rgb(var(--wabi-dark));
            color: rgb(var(--wabi-dark));
            touch-action: manipulation;

        .act.is-main {
            background: #c0261d;
            border-color: #c0261d;
            color: #fff;
        }

        .act.is-gold {
            background: linear-gradient(180deg, #ffe27a, #f5b700);
            border-color: #d99a00;
            color: #7a2a00;
            box-shadow: 0 6px 0 #b37b00;
        }

        .act.is-gold:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #b37b00;
        }

        .act:disabled {
            opacity: 0.35;
        }

        .delta {
            animation: delta 1.2s ease-out forwards;
        }

        @keyframes delta {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }

            15% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-14px);

        #bigwin .amt {
            font-weight: 900;
            font-size: 3rem;
            line-height: 1.1;
            background: linear-gradient(180deg, #fff6c2, #ffd34d 50%, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        @media (prefers-reduced-motion: reduce) {

            .c.is-win,
            .delta {
                animation: none;
            }
        }
    </style>

    <script>
        // ===== 0. 小工具 =====
        const $ = id => document.getElementById(id);
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const pick = list => list[Math.floor(Math.random() * list.length)];
        const randint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
        const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
        const shuffle = list => { for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; } return list; };
        const sample = (list, k) => shuffle(list.slice()).slice(0, k);
        const fmt = n => '$' + n.toLocaleString('en-US');
        const two = n => String(n).padStart(2, '0');
        const wan = n => n >= 10000 ? (n / 10000).toLocaleString('en-US') + '萬' : n.toLocaleString('en-US');

        // 大寫金額（真的彩券印在獎金下面防塗改）：2000 → 貳仟元、20000000 → 貳仟萬元
        const DIG = '零壹貳參肆伍陸柒捌玖';
        function cap4(n) {
            const ds = [Math.floor(n / 1000), Math.floor(n / 100) % 10, Math.floor(n / 10) % 10, n % 10];
            const units = ['仟', '佰', '拾', ''];
            let s = '', zero = false;
            ds.forEach((d, i) => {
                if (!d) { if (s) zero = true; return; }
                if (zero) { s += '零'; zero = false; }
                s += DIG[d] + units[i];
            });
            return s;
        }
        function capital(n) {
            const hi = Math.floor(n / 10000), lo = n % 10000;
            let s = hi ? cap4(hi) + '萬' : '';
            if (lo) s += (hi && lo < 1000 ? '零' : '') + cap4(lo);
            return (s || '零') + '元';
        }

        // 照機率表抽獎金：[[金額, 機率], ...]，都沒抽到是 0
        function rollT(table) {
            let r = Math.random();
            for (const [v, p] of table) { if (r < p) return v; r -= p; }
            return 0;
        }

        // 把總獎金拆成幾格（最多 maxParts 格），例如 500 → 200+200+100
        function split(T, denoms, maxParts) {
            const ds = denoms.filter(d => d <= T).sort((a, b) => a - b), out = [];
            (function dfs(start, left, acc) {
                if (!left) { out.push(acc.slice()); return; }
                if (acc.length === maxParts) return;
                for (let i = start; i < ds.length && ds[i] <= left; i++) { acc.push(ds[i]); dfs(i, left - ds[i], acc); acc.pop(); }
            })(0, T, []);
            const single = out.find(c => c.length === 1);
            if (single && Math.random() < 0.5) return single;
            return out.length ? pick(out) : [T];
        }

        // 沒中的格子也要有獎金（大的偶爾出現，看了心癢）
        function decoy(denoms, weights) {
            const sum = weights.reduce((a, b) => a + b, 0);
            let r = Math.random() * sum;
            for (let i = 0; i < denoms.length; i++) { if (r < weights[i]) return denoms[i]; r -= weights[i]; }
            return denoms[0];
        }

        // 十萬以上寫成「$10萬」，格子才放得下
        const amtHTML = v => `<span class="c-amt">${v >= 100000 ? '$' + wan(v) : fmt(v)}</span><span class="c-cap">${capital(v)}</span>`;

        // ===== 1. 五種刮刮樂 =====
        // 每種：gen() 開獎（買的時候就決定，回傳票面和 T 總獎金）、score() 照規則從票面算獎金、html() 票面
        const SUITS = [['♠', 'b'], ['♥', 'r'], ['♦', 'r'], ['♣', 'b']];
        const BINGO_LINES = (() => {
            const L = [];
            for (let r = 0; r < 5; r++) L.push(range(0, 4).map(c => r * 5 + c));
            for (let c = 0; c < 5; c++) L.push(range(0, 4).map(r => r * 5 + c));
            L.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
            return L;
        })();
        const BINGO_PRIZE = [0, 500, 1000, 3000, 10000, 50000, 5000000];

        const GAMES = {
            luck: {
                name: '好運連連', price: 100, jackpot: 1000000, c1: '#e8382f', c2: '#a8141b', hi: '#ffd34d',
                desc: '號碼對中就中',
                table: [[1000000, 0.00002], [100000, 0.0001], [10000, 0.0008], [2000, 0.004], [1000, 0.01], [500, 0.02], [200, 0.06], [100, 0.18]],
                denoms: [100, 200, 500, 1000, 2000, 10000, 100000, 1000000],
                weights: [30, 25, 15, 10, 8, 5, 4, 3],
                gen() {
                    const T = rollT(this.table);
                    const W = sample(range(1, 30), 2);
                    const nonW = shuffle(range(1, 30).filter(n => !W.includes(n)));
                    const cells = [];
                    if (T) split(T, this.denoms, 3).forEach(v => cells.push(Math.random() < 0.25 ? { star: true, prize: v } : { n: pick(W), prize: v }));
                    while (cells.length < 10) cells.push({ n: nonW.pop(), prize: decoy(this.denoms, this.weights) });
                    return { T, W, cells: shuffle(cells) };
                },
                score: t => t.cells.reduce((s, c) => s + (c.star || t.W.includes(c.n) ? c.prize : 0), 0),
                html(t) {
                    return `
                    <div class="tk-panel">
                        <div class="tk-label">中獎號碼</div>
                        <div class="zone g grid-cols-2" data-zone>
                            ${t.W.map(n => `<div class="c h-12" data-cell ${t.cells.some(c => c.n === n) ? 'data-win' : ''}><span class="c-num">${two(n)}</span></div>`).join('')}
                        </div>
                    </div>

                revealAll(step, start = 0) {
                    const rest = cells.filter(k => !k.open);
                    rest.forEach((k, i) => setTimeout(() => open(k), start + i * step));
                    return rest.length;
                },
                get done() { return done; },
            };
        }

        // ===== 5. 錢包、架上 =====
        let shown = S.money;
        function setMoney(to, delta) {
            S.money = to;
            save();
            if (delta) {
                const el = $('delta');
                el.textContent = (delta > 0 ? '+' : '−') + fmt(Math.abs(delta));
                el.style.color = delta > 0 ? '#c0261d' : '#8a8a8a';
                el.classList.remove('delta');
                void el.offsetWidth;
                el.classList.add('delta');
            }
            if (reduceMotion) { shown = to; $('money').textContent = fmt(to); return; }
            const from = shown, t0 = performance.now(), dur = Math.min(1500, 400 + Math.abs(to - from) / 50);
            const step = now => {
                const k = Math.min(1, (now - t0) / dur);
                shown = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
                $('money').textContent = fmt(shown);
                if (k < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        }

        function renderStats() {
            const rate = S.spent ? Math.round(S.won / S.spent * 100) + '%' : '—';
            $('stats').innerHTML = `刮了 ${S.count} 張・回收率 ${rate}<br>花 ${fmt(S.spent)}・中 ${fmt(S.won)}<br>最大一筆 ${S.best ? fmt(S.best) : '—'}${S.atm ? `・提款 ${S.atm} 次` : ''}`;
        }

        function renderShelf() {
            $('pending').classList.toggle('hidden', !S.queue.length);
            $('pending').innerHTML = S.queue.length ? `<button type="button" class="act is-main w-full" data-resume>還有 ${S.queue.length} 張沒刮，繼續刮</button>` : '';
            $('covers').innerHTML = Object.entries(GAMES).map(([key, g]) => `
                <div class="cover p-3" style="--c1:${g.c1};--c2:${g.c2};--hi:${g.hi}">
                    <div class="relative z-[1] flex items-start justify-between gap-2">
                        <div class="min-w-0">
                            <div class="cover-name">${g.name}</div>
                            <div class="text-[11px] font-bold opacity-90">${g.desc}</div>
                        </div>
                        <div class="cover-price">${fmt(g.price)}</div>
                    </div>
                    <div class="relative z-[1] mt-1 text-xs font-bold">頭獎 <span class="text-lg font-black" style="color:var(--hi)">${wan(g.jackpot)}</span></div>
                    <div class="relative z-[1] mt-2 flex gap-2">
                        <button type="button" class="buy" data-buy="${key}" data-n="1" ${S.money < g.price ? 'disabled' : ''}>買 1 張</button>
                        <button type="button" class="buy" data-buy="${key}" data-n="5" ${S.money < g.price * 5 ? 'disabled' : ''}>買 5 張・${fmt(g.price * 5)}</button>
                    </div>
                </div>`).join('');
            $('broke').classList.toggle('hidden', S.money >= 100 || S.queue.length > 0);
            $('bigs').innerHTML = S.bigs.length ? `
                <p class="text-xs font-black text-wabi-dark tracking-widest mb-2">中獎紀錄（$2,000 以上）</p>
                <ul class="text-xs text-stone-500 leading-relaxed">${S.bigs.slice(0, 10).map(b => `<li class="flex justify-between border-b border-stone-100 py-1"><span>${b.date}・${b.name}</span><span class="money text-wabi-dark">${fmt(b.amt)}</span></li>`).join('')}</ul>` : '';
            renderStats();
        }

        $('covers').addEventListener('click', e => {
            const btn = e.target.closest('[data-buy]');
            if (!btn || btn.disabled) return;
            unlockAudio();
            buy(btn.dataset.buy, Number(btn.dataset.n));
        });
        $('pending').addEventListener('click', e => {
            if (!e.target.closest('[data-resume]')) return;
            unlockAudio();
            next();
        });

        $('atmBtn').addEventListener('click', () => {
            unlockAudio();
            S.atm++;
            setMoney(S.money + 2000, 2000);
            sfx.cash();
            showToast(pick(['提款成功。', '這是這個月最後一次了吧。', '提款機說：你又來了。']));
            renderShelf();
        });

        // ===== 6. 買、刮、對獎、兌獎 =====
        let foils = [];

        function buy(type, n) {
            const g = GAMES[type];
            if (S.money < g.price * n) return;
            redeem(true); // 上一張還沒兌的先兌掉
            for (let i = 0; i < n; i++) S.queue.push(newTicket(type));
            S.spent += g.price * n;
            setMoney(S.money - g.price * n, -g.price * n);
            sfx.buy();
            next();
        }

        function next() {
            redeem(true);
            S.current = S.queue.shift() || null;
            save();
            if (!S.current) { backToShelf(); return; }
            openTicket();
        }

        function actions(list) {
            const box = $('playActions');
            box.innerHTML = '';
            list.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'act' + (item.cls ? ' ' + item.cls : '');
                btn.textContent = item.label;
                if (item.disabled) btn.disabled = true;
                btn.addEventListener('click', () => { unlockAudio(); item.onClick(btn); });
                box.appendChild(btn);
            });
        }

        function openTicket() {
            const t = S.current, g = GAMES[t.type];
            $('shelf').classList.add('hidden');
            $('play').classList.remove('hidden');
            const host = $('ticketHost');
            host.innerHTML = `
                <div class="tk" style="--c1:${g.c1};--c2:${g.c2};--hi:${g.hi}">
                    <div class="tk-head">
                        <div>
                            <div class="tk-name">${g.name}</div>
                            <div class="tk-jackpot">頭獎 <b>${wan(g.jackpot)}</b></div>
                        </div>
                        <div class="tk-price">${fmt(g.price)}</div>
                    </div>
                    ${g.html(t)}
                    <div class="tk-foot">
                        <span>27 樓彩券行<br>No. ${t.code.slice(0, 9)}</span>
                        <div class="zone tk-code" data-zone data-optional><div class="tk-code-in" data-cell>${t.code}</div></div>
                    </div>
                </div>`;
            $('playHint').textContent = (S.queue.length ? `後面還有 ${S.queue.length} 張。` : '') + '用手指刮開銀漆，每格刮掉一半就會整格打開';
            actions([{
                label: '全部刮開', onClick: btn => {
                    btn.disabled = true;
                    let start = 0;
                    foils.filter(f => !f.optional).forEach(f => { start += f.revealAll(70, start) * 70; });
                },
            }]);
            $('wallet').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
            requestAnimationFrame(() => {
                foils = [...host.querySelectorAll('[data-zone]')].map(zone => makeFoil(zone,
                    el => {
                        g.onOpen?.(el, host);
                        if (zone.hasAttribute('data-optional')) showToast(pick(['這裡是給店員刮的啦。', '兌獎區刮開了，店員會皺眉。']));
                    },
                    () => { if (foils.filter(f => !f.optional).every(f => f.done)) settle(); }
                ));
            });
        }

        // 全部刮開了：一格一格亮起中獎的格子，再出現兌獎
        function settle() {
            const t = S.current;
            if (!t || t.settled) return;
            t.settled = true;
            const g = GAMES[t.type], host = $('ticketHost');
            t.total = g.score(t);
            save();
            const wins = [...host.querySelectorAll('[data-win]')];
            wins.forEach((el, i) => setTimeout(() => { el.classList.add('is-win'); sfx.ding(i % 6); }, 250 + i * 160));
            setTimeout(() => {
                if (t.total > 0) {
                    $('playHint').innerHTML = `<span class="block text-xs font-black text-wabi-dark tracking-widest">中獎</span><span class="result-amt money block">${fmt(t.total)}</span><span class="block font-serif text-xs text-stone-500 mt-1">${capital(t.total)}</span>`;
                    sfx.win();
                    actions([{ label: `兌獎 ${fmt(t.total)}`, cls: 'is-gold', onClick: () => { redeem(); afterRedeem(); } }]);
                } else {
                    $('playHint').innerHTML = `<span class="block text-lg font-black text-stone-400 tracking-widest">沒中</span><span class="block text-xs text-stone-500 mt-1">${pick(['差一點。', '下一張一定中。（沒有保證）', '槓龜。', '銀漆屑掃一掃。', '老闆說：再一張就中了。'])}</span>`;
                    sfx.lose();
                    redeem(true);
                    afterRedeem();
                }
            }, 400 + wins.length * 160);
        }

        // 兌獎：錢進錢包（silent：換張或回架上時自動兌，不演）
        function redeem(silent) {
            const t = S.current;
            if (!t || !t.settled || t.redeemed) return;
            t.redeemed = true;
            S.count++;
            if (t.total) {
                S.won += t.total;
                S.best = Math.max(S.best, t.total);
                if (t.total >= 2000) S.bigs = [{ date: new Date().toLocaleDateString('zh-TW'), name: GAMES[t.type].name, amt: t.total }, ...S.bigs].slice(0, 30);
                setMoney(S.money + t.total, t.total);
                if (!silent) {
                    sfx.cash();
                    if (t.total >= GAMES[t.type].price * 10) bigWin(t.total);
                }
            }
            save();
            renderStats();
        }

        function afterRedeem() {
            const t = S.current, g = GAMES[t.type];
            const list = [];
            if (S.queue.length) list.push({ label: `下一張（還有 ${S.queue.length} 張）`, cls: 'is-main', onClick: next });
            else list.push({ label: S.money >= g.price ? `再買一張 ${fmt(g.price)}` : '錢不夠了', cls: 'is-main', disabled: S.money < g.price, onClick: () => buy(t.type, 1) });
            list.push({ label: '回彩券行', onClick: backToShelf });
            actions(list);
        }

        function backToShelf() {
            redeem(true);
            S.current = null;
            save();
            renderShelf();
            $('play').classList.add('hidden');
            $('shelf').classList.remove('hidden');
        }

        // ===== 7. 中大獎：全螢幕、彩帶 =====
        function bigWin(amount) {
            $('bigCap').textContent = capital(amount);
            $('bigwin').classList.remove('hidden');
            sfx.fanfare();
            confetti();
            if (reduceMotion) { $('bigAmt').textContent = fmt(amount); return; }
            const t0 = performance.now(), dur = 1600;
            const step = now => {
                const k = Math.min(1, (now - t0) / dur);
                $('bigAmt').textContent = fmt(Math.round(amount * (1 - Math.pow(1 - k, 3))));
                if (k < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        }
        $('bigwin').addEventListener('click', () => $('bigwin').classList.add('hidden'));

        function confetti() {
            if (reduceMotion) return;
            const cv = $('confetti'), c = cv.getContext('2d');
            const W = innerWidth, H = innerHeight;
            cv.width = W * dpr;
            cv.height = H * dpr;
            c.setTransform(dpr, 0, 0, dpr, 0, 0);
            const colors = ['#ffd34d', '#c0261d', '#ffffff', '#f59e0b', '#ff6b5e'];
            const ps = Array.from({ length: 140 }, () => ({
                x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
                r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, col: pick(colors),
            }));
            const t0 = performance.now();
            const step = now => {
                c.clearRect(0, 0, W, H);
                ps.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.r += p.vr;
                    c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.col; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore();
                });
                if (now - t0 < 3500) requestAnimationFrame(step);
                else c.clearRect(0, 0, W, H);
            };
            requestAnimationFrame(step);
        }

        // ===== 8. 開店 =====
        $('money').textContent = fmt(S.money);
        if (S.current && !S.current.redeemed) {
            // 上次刮到一半就離開：接著刮（重新上銀漆，結果不變）
            S.current.settled = false;
            renderStats();
            openTicket();
        } else {
            S.current = null;
            save();
            renderShelf();
        }
    </script>
</body>
