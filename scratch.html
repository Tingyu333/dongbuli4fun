<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刮刮樂 | 丼步喱</title>
    <!-- 分享到 LINE、FB 時的預覽（標題、介紹、圖片）。圖片要用完整網址 -->
    <meta name="description" content="27 樓彩券行：好運連連、三個一樣、21 點、賓果、大紅包，頭獎 2000 萬。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="丼步喱・絆">
    <meta property="og:title" content="刮刮樂｜27 樓彩券行">
    <meta property="og:description" content="好運連連、三個一樣、21 點、賓果、大紅包，頭獎 2000 萬。">
    <meta property="og:image" content="https://tingyu333.github.io/dongbuli4fun/assets/og.png?v=2">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="1200">
    <meta property="og:url" content="https://tingyu333.github.io/dongbuli4fun/scratch.html">
    <meta name="twitter:card" content="summary">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/theme.css?v=20261113">
    <script src="assets/theme.js?v=20261113"></script>
    <script src="assets/line.js?v=20261113"></script>
    <script src="assets/wallet.js?v=20261113"></script>
    <style>
        /* 這頁走彩券行的熱鬧風格，不跟網站的侘寂風；彩券是紙本，顏色固定 */
        .shop {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .line-btn {
            min-height: 36px;
            padding: 0 0.9rem;
            border-radius: 8px;
            background: #06c755;
            color: #fff;
            font-weight: 900;
            font-size: 0.8rem;
            touch-action: manipulation;
        }

        .money {
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        /* ===== 架上 ===== */
        .cover {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(150deg, var(--c1), var(--c2));
            box-shadow: 0 14px 30px -16px rgba(0, 0, 0, 0.55);
        }

        .cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.06) 0 8px, transparent 8px 16px);
            pointer-events: none;
        }

        .cover-name {
            font-weight: 900;
            font-size: 1.2rem;
            line-height: 1.3;
            letter-spacing: 0.02em;
            white-space: nowrap;
            color: var(--hi);
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
        }

        .cover-price {
            padding: 0 0.55rem;
            font-size: 0.8rem;
            line-height: 1.5rem;
            border-radius: 9999px;
            background: var(--hi);
            color: var(--c2);
            font-weight: 900;
            text-align: center;
        }

        .cover-odds {
            position: relative;
            z-index: 1;
            margin-top: 0.35rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.25rem;
            width: 100%;
            min-height: 28px;
            padding: 0 0.45rem;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.22);
            font-size: 10px;
            font-weight: 700;
            text-align: left;
            touch-action: manipulation;
        }

        .cover-odds b {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--hi);
        }

        .cover-odds span {
            flex: none;
            font-size: 9px;
            opacity: 0.85;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .tk-odds {
            margin-top: 2px;
            padding: 2px 0;
            font: inherit;
            font-weight: 900;
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .pk-grid {
            display: grid;
            gap: 4px;
        }

        .pk-n {
            height: 2.35rem;
            border-radius: 6px;
            background: #f5f5f4;
            color: #44403c;
            font-size: 0.8rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .pk-n.is-big {
            height: 3rem;
            font-size: 1.05rem;
        }

        .pk-n.on {
            background: linear-gradient(150deg, var(--c1), var(--c2));
            color: #fff;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
        }

        .pk-n.is-sold {
            background: transparent;
            color: #d6d3d1;
            text-decoration: line-through;
        }

        .pk-grid.is-full .pk-n:not(.on):not(.is-sold) {
            opacity: 0.45;
        }

        .tk-num {
            font-size: 0.95em;
            font-weight: 900;
        }

        #picker,
        #odds {
            background: rgba(0, 0, 0, 0);
            transition: background 0.22s;
        }

        #picker.on,
        #odds.on {
            background: rgba(0, 0, 0, 0.5);
        }

        .odds-sheet {
            transform: translateY(100%);
            transition: transform 0.22s ease-out;
            color: #3f3f46;
        }

        #picker.on .odds-sheet,
        #odds.on .odds-sheet {
            transform: none;
        }

        @media (prefers-reduced-motion: reduce) {
            #odds, #picker, .odds-sheet { transition: none; }
        }

        .odds-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1rem;
            background: linear-gradient(150deg, var(--c1), var(--c2));
        }

        .odds-big {
            padding: 0.7rem 0.4rem;
            border-radius: 10px;
            background: #f5f5f4;
        }

        .odds-big span {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #78716c;
        }

        .odds-big b {
            display: block;
            font-size: 1.6rem;
            font-weight: 900;
            line-height: 1.2;
            color: #1c1917;
        }

        .odds-big small {
            display: block;
            font-size: 10px;
            color: #a8a29e;
        }

        .odds-t {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
        }

        .odds-t th {
            padding: 0.3rem 0.4rem;
            font-size: 10px;
            font-weight: 700;
            color: #a8a29e;
            text-align: right;
            border-bottom: 1px solid #e7e5e4;
        }

        .odds-t td {
            padding: 0.45rem 0.4rem;
            text-align: right;
            border-bottom: 1px solid #f5f5f4;
            white-space: nowrap;
        }

        .odds-t th:first-child,
        .odds-t td:first-child {
            text-align: left;
        }

        .odds-t td small {
            margin-left: 0.4rem;
            font-size: 10px;
            font-weight: 700;
            color: #a8a29e;
        }

        .odds-t td b {
            margin-left: 0.35rem;
            padding: 1px 5px;
            border-radius: 4px;
            background: #dc2626;
            color: #fff;
            font-size: 10px;
        }

        .odds-t tr.is-top td:first-child,
        .odds-t tr.is-best td {
            color: #dc2626;
            font-weight: 900;
        }

        .odds-t tr.is-none td {
            color: #a8a29e;
        }

        .buy {
            position: relative;
            z-index: 1;
            flex: 1;
            min-height: 44px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--c2);
            font-weight: 900;
            font-size: 0.85rem;
            touch-action: manipulation;
        }

        .buy:active {
            transform: scale(0.97);
        }

        .buy:disabled {
            opacity: 0.4;
        }

        /* ===== 彩券本體 ===== */
        .tk {
            position: relative;
            border-radius: 12px;
            padding: 0.9rem 0.8rem 0.8rem;
            color: #fff;
            background: linear-gradient(160deg, var(--c1), var(--c2));
            box-shadow: 0 0 0 3px var(--hi) inset, 0 24px 50px -20px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .tk::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.05) 0 10px, transparent 10px 20px);
            pointer-events: none;
        }

        .tk>* {
            position: relative;
        }

        .tk-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .tk-name {
            font-weight: 900;
            font-size: 1.7rem;
            line-height: 1.1;
            letter-spacing: 0.04em;
            color: var(--hi);
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
        }

        .tk-price {
            flex-shrink: 0;
            width: 3.4rem;
            height: 3.4rem;
            border-radius: 9999px;
            background: var(--hi);
            color: var(--c2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1rem;
            transform: rotate(-10deg);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
        }

        .tk-jackpot {
            margin-top: 0.2rem;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .tk-jackpot b {
            font-weight: 900;
            font-size: 1.25rem;
            color: var(--hi);
        }

        .tk-panel {
            margin-top: 0.6rem;
            padding: 0.45rem;
            border-radius: 8px;
            background: #fffaf0;
            color: #3a2a1a;
        }

        .tk-label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 0.15rem 0.3rem;
            font-weight: 900;
            font-size: 0.8rem;
            color: var(--c2);
        }

        .tk-label small {
            font-weight: 500;
            font-size: 0.65rem;
            color: #8a7560;
        }

        .tk-rule {
            margin-top: 0.55rem;
            font-size: 0.65rem;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.9);
        }

        .tk-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.6rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.75);
        }

        .tk-code {
            width: 9.5rem;
            height: 1.6rem;
        }

        .tk-code-in {
            height: 100%;
            border-radius: 4px;
            background: #fffaf0;
            color: #3a2a1a;
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zone {
            position: relative;
        }

        .foil {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 5px;
            touch-action: none;
            transition: opacity 0.4s;
        }

        .foil.is-done {
            opacity: 0;
            pointer-events: none;
        }

        /* 格子 */
        .g {
            display: grid;
            gap: 0.3rem;
        }

        .c {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            background: #fff;
            border: 1px solid #ead9bf;
            line-height: 1.1;
            transition: background-color 0.25s, transform 0.25s, box-shadow 0.25s;
        }

        .c-num {
            font-weight: 900;
            font-size: 1.35rem;
            color: #2a1d12;
        }

        .c-amt {
            font-weight: 900;
            font-size: 0.75rem;
            color: #c0261d;
        }

        .c-cap {
            margin-top: 0.1rem;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.55rem;
            color: #8a7560;
            white-space: nowrap;
        }

        .c-sym {
            font-weight: 900;
            font-size: 1.15rem;
            color: #fff;
            background: #c0261d;
            border-radius: 9999px;
            width: 1.9rem;
            height: 1.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 2px #ffd34d;
        }

        .c.is-win {
            background: #ffe14d;
            border-color: #c0261d;
            box-shadow: 0 0 0 2px #c0261d;
            animation: pop 0.4s ease;
        }

        @keyframes pop {
            50% {
                transform: scale(1.12);
            }
        }

        /* 21 點：撲克牌 */
        .card-pt {
            font-weight: 900;
            font-size: 1.5rem;
            color: #2a1d12;
        }

        .suit-r {
            color: #c0261d;
        }

        .suit-b {
            color: #1f1f1f;
        }

        /* 賓果卡 */
        .bingo {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.2rem;
        }

        .bingo .h {
            text-align: center;
            font-weight: 900;
            font-size: 0.9rem;
            color: var(--c2);
        }

        .bingo .b {
            position: relative;
            height: 2.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: #fff;
            border: 1px solid #e5d6f5;
            font-weight: 900;
            font-size: 0.95rem;
            color: #2a1d12;
            transition: background-color 0.25s, color 0.25s;
        }

        .bingo .b.is-free {
            background: var(--c2);
            color: var(--hi);
            font-size: 0.6rem;
        }

        .bingo .b.is-dab::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 9999px;
            background: rgba(192, 38, 29, 0.5);
        }

        .bingo .b.is-line {
            background: #ffe14d;
        }

        .bingo .b.is-line::after {
            background: rgba(192, 38, 29, 0.8);
        }

        .prize-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.15rem 0.4rem;
            margin-top: 0.4rem;
            font-size: 0.62rem;
            color: #5a4630;
        }

        .prize-list b {
            color: #c0261d;
        }

        /* 井字樂 */
        .ox {
            font-weight: 900;
            font-size: 2.6rem;
            line-height: 1;
        }

        .ox.o {
            color: #c0261d;
        }

        .ox.x {
            color: #1e3a8a;
        }

        /* 骰子 */
        .die {
            width: 2.1rem;
            height: 2.1rem;
            padding: 3px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-radius: 6px;
            background: #fff;
            border: 2px solid #2a1d12;
        }

        .die i {
            margin: auto;
            width: 5px;
            height: 5px;
            border-radius: 9999px;
            background: #2a1d12;
        }

        .die i.off {
            visibility: hidden;
        }

        .die.is-you {
            border-color: #c0261d;
        }

        .die.is-you i {
            background: #c0261d;
        }

        .who {
            font-size: 0.55rem;
            font-weight: 700;
            color: #8a7560;
        }

        /* 拉霸的圖案 */
        .sy {
            width: 2.3rem;
            height: 2.3rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.05rem;
            color: #fff;
        }

        .sy.s7 {
            background: none;
            color: #c0261d;
            font-size: 2.3rem;
            font-style: italic;
            text-shadow: 2px 2px 0 #ffd34d;
        }

        .sy.bar {
            width: 2.8rem;
            height: 1.5rem;
            border-radius: 4px;
            background: #111;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        /* 挖金礦 */
        .c-bomb {
            width: 2.1rem;
            height: 2.1rem;
            border-radius: 9999px;
            background: #1f1f1f;
            color: #ff6b5e;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .c.is-bomb {
            background: #c0261d;
            border-color: #1f1f1f;
            box-shadow: 0 0 0 2px #1f1f1f;
            animation: pop 0.4s ease;
        }

        .c.is-rest {
            opacity: 0.45;
        }

        /* 加倍區 */
        .c-mult {
            font-weight: 900;
            font-size: 1.7rem;
            color: #c0261d;
        }

        /* ===== 開獎結果 ===== */
        .result-amt {
            font-weight: 900;
            font-size: 2.6rem;
            line-height: 1.1;
            color: #c0261d;
        }

        html.night .result-amt {
            color: #ff6b5e;
        }

        .act {
            min-height: 48px;
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            font-weight: 900;
            font-size: 0.9rem;
            border: 2px solid rgb(var(--wabi-dark));
            color: rgb(var(--wabi-dark));
            touch-action: manipulation;
        }

        .act.is-main {
            background: #c0261d;
            border-color: #c0261d;
            color: #fff;
        }

        .act.is-gold {
            background: linear-gradient(180deg, #ffe27a, #f5b700);
            border-color: #d99a00;
            color: #7a2a00;
            box-shadow: 0 6px 0 #b37b00;
        }

        .act.is-gold:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #b37b00;
        }

        .act:disabled {
            opacity: 0.35;
        }

        .delta {
            animation: delta 1.2s ease-out forwards;
        }

        @keyframes delta {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }

            15% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-14px);
            }
        }

        #bigwin .amt {
            font-weight: 900;
            font-size: 3rem;
            line-height: 1.1;
            background: linear-gradient(180deg, #fff6c2, #ffd34d 50%, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        @media (prefers-reduced-motion: reduce) {

            .c.is-win,
            .delta {
                animation: none;
            }
        }
    </style>
</head>

        class="fixed top-0 w-full px-4 py-5 md:p-8 flex justify-between items-center z-40 bg-wabi-bg/90 backdrop-blur-sm border-b border-stone-100">

            class="text-base md:text-xl font-bold tracking-[0.1em] md:tracking-widest-xl uppercase whitespace-nowrap hover:text-black transition-colors duration-300">DongBuLi</a>
        <div class="flex gap-3 md:gap-8">
            <a href="index.html"
                class="text-xs tracking-normal md:tracking-widest whitespace-nowrap hover:text-wabi-dark transition-colors duration-500 text-stone-400">首頁・歸</a>

        <!-- LINE 登入：錢跟著帳號走 -->
        <div id="acct" class="-mt-2 mb-2 min-h-[36px] flex items-center justify-between gap-2 text-[11px] text-stone-500"></div>
        <div class="mb-4 flex items-center justify-between gap-2 text-[11px] text-stone-500">
            <button id="hbToggle" type="button" class="min-h-[32px] font-bold text-wabi-dark underline underline-offset-4">有紅包碼？</button>

    <script>
        // ===== 0. 小工具 =====
        const $ = id => document.getElementById(id);
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const pick = list => list[Math.floor(Math.random() * list.length)];
        const randint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
        const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
        const shuffle = list => { for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; } return list; };
        const sample = (list, k) => shuffle(list.slice()).slice(0, k);
        const fmt = n => '$' + n.toLocaleString('en-US');
        const two = n => String(n).padStart(2, '0');
        const wan = n => n >= 10000 ? (n / 10000).toLocaleString('en-US') + '萬' : n.toLocaleString('en-US');

        // 大寫金額（真的彩券印在獎金下面防塗改）：2000 → 貳仟元、20000000 → 貳仟萬元
        const DIG = '零壹貳參肆伍陸柒捌玖';
        function cap4(n) {
            const ds = [Math.floor(n / 1000), Math.floor(n / 100) % 10, Math.floor(n / 10) % 10, n % 10];
            const units = ['仟', '佰', '拾', ''];
            let s = '', zero = false;
            ds.forEach((d, i) => {
                if (!d) { if (s) zero = true; return; }
                if (zero) { s += '零'; zero = false; }
                s += DIG[d] + units[i];
            });
            return s;
        }
        function capital(n) {
            const hi = Math.floor(n / 10000), lo = n % 10000;
            let s = hi ? cap4(hi) + '萬' : '';
            if (lo) s += (hi && lo < 1000 ? '零' : '') + cap4(lo);
            return (s || '零') + '元';
        }

        // 照機率表抽獎金：[[金額, 機率], ...]，都沒抽到是 0
        function rollT(table) {
            let r = Math.random();
            for (const [v, p] of table) { if (r < p) return v; r -= p; }
            return 0;
        }

        // 把總獎金拆成幾格（最多 maxParts 格），例如 500 → 200+200+100
        function split(T, denoms, maxParts) {
            const ds = denoms.filter(d => d <= T).sort((a, b) => a - b), out = [];
            (function dfs(start, left, acc) {
                if (!left) { out.push(acc.slice()); return; }
                if (acc.length === maxParts) return;
                for (let i = start; i < ds.length && ds[i] <= left; i++) { acc.push(ds[i]); dfs(i, left - ds[i], acc); acc.pop(); }
            })(0, T, []);
            const single = out.find(c => c.length === 1);
            if (single && Math.random() < 0.5) return single;
            return out.length ? pick(out) : [T];
        }

        // 沒中的格子也要有獎金（大的偶爾出現，看了心癢）
        function decoy(denoms, weights) {
            const sum = weights.reduce((a, b) => a + b, 0);
            let r = Math.random() * sum;
            for (let i = 0; i < denoms.length; i++) { if (r < weights[i]) return denoms[i]; r -= weights[i]; }
            return denoms[0];
        }

        // 十萬以上寫成「$10萬」，格子才放得下
        const amtHTML = v => `<span class="c-amt">${v >= 100000 ? '$' + wan(v) : fmt(v)}</span><span class="c-cap">${capital(v)}</span>`;

        // ===== 1. 五種刮刮樂 =====
        // 每種：gen() 開獎（買的時候就決定，回傳票面和 T 總獎金）、score() 照規則從票面算獎金、html() 票面
        const SUITS = [['♠', 'b'], ['♥', 'r'], ['♦', 'r'], ['♣', 'b']];
        const BINGO_LINES = (() => {
            const L = [];
            for (let r = 0; r < 5; r++) L.push(range(0, 4).map(c => r * 5 + c));
            for (let c = 0; c < 5; c++) L.push(range(0, 4).map(r => r * 5 + c));
            L.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
            return L;
        })();
        const BINGO_PRIZE = [0, 500, 1000, 3000, 10000, 50000, 5000000];

        const GAMES = {
            luck: {
                name: '好運連連', price: 100, jackpot: 1000000, c1: '#e8382f', c2: '#a8141b', hi: '#ffd34d',
                desc: '號碼對中就中',
                table: [[1000000, 0.00002], [100000, 0.0001], [10000, 0.0008], [2000, 0.004], [1000, 0.01], [500, 0.02], [200, 0.06], [100, 0.18]],
                denoms: [100, 200, 500, 1000, 2000, 10000, 100000, 1000000],
                weights: [30, 25, 15, 10, 8, 5, 4, 3],
                gen() {
                    const T = rollT(this.table);
                    const W = sample(range(1, 30), 2);
                    const nonW = shuffle(range(1, 30).filter(n => !W.includes(n)));
                    const cells = [];
                    if (T) split(T, this.denoms, 3).forEach(v => cells.push(Math.random() < 0.25 ? { star: true, prize: v } : { n: pick(W), prize: v }));
                    while (cells.length < 10) cells.push({ n: nonW.pop(), prize: decoy(this.denoms, this.weights) });
                    return { T, W, cells: shuffle(cells) };
                },
                score: t => t.cells.reduce((s, c) => s + (c.star || t.W.includes(c.n) ? c.prize : 0), 0),
                html(t) {
                    return `
                    <div class="tk-panel">

                        <div class="zone g grid-cols-2" data-zone>
                            ${t.W.map(n => `<div class="c h-12" data-cell ${t.cells.some(c => c.n === n) ? 'data-win' : ''}><span class="c-num">${two(n)}</span></div>`).join('')}
                        </div>
                    </div>
                    <div class="tk-panel">
                        <div class="tk-label">我的號碼 <small>刮到 <b class="text-[#c0261d]">★</b> 直接得獎金</small></div>
                        <div class="zone g grid-cols-5" data-zone>
                            ${t.cells.map(c => `<div class="c h-[4.1rem]" data-cell ${c.star || t.W.includes(c.n) ? 'data-win' : ''}>${c.star ? '<span class="c-sym">★</span>' : `<span class="c-num">${two(c.n)}</span>`}${amtHTML(c.prize)}</div>`).join('')}
                        </div>
                    </div>
                    <p class="tk-rule">刮開「中獎號碼」及「我的號碼」，我的號碼與任一中獎號碼相同，即可獲得該號碼下方獎金；刮出「★」直接獲得該獎金。可多重中獎，獎金累計。</p>`;
                },
            },

            same3: {
                name: '三個一樣', price: 200, jackpot: 2000000, c1: '#ffb020', c2: '#d9480f', hi: '#fff3c4',
                desc: '三個一樣的金額就中',
                table: [[2000000, 0.00001], [100000, 0.00005], [20000, 0.0004], [5000, 0.002], [2000, 0.006], [1000, 0.015], [500, 0.04], [400, 0.06], [200, 0.17]],
                amounts: [200, 400, 500, 1000, 2000, 5000, 20000, 100000, 2000000],
                gen() {
                    const T = rollT(this.table);
                    const cells = [], count = {};
                    const add = v => { cells.push(v); count[v] = (count[v] || 0) + 1; };
                    if (T) for (let i = 0; i < 3; i++) add(T);
                    // 頭獎常常只差一個，刺激
                    if (T !== 2000000 && Math.random() < 0.4) { add(2000000); add(2000000); }
                    while (cells.length < 12) {
                        const v = pick(this.amounts);
                        if (v === T || (count[v] || 0) >= 2) continue;
                        add(v);
                    }
                    return { T, cells: shuffle(cells) };
                },
                score(t) {
                    const count = {};
                    t.cells.forEach(v => { count[v] = (count[v] || 0) + 1; });
                    return Object.keys(count).filter(v => count[v] >= 3).reduce((s, v) => s + Number(v), 0);
                },
                html(t) {
                    const win = this.score(t);
                    return `
                    <div class="tk-panel">

                        <div class="zone g grid-cols-4" data-zone>
                            ${t.cells.map(v => `<div class="c h-[3.9rem]" data-cell ${v === win ? 'data-win' : ''}><span class="c-amt !text-[1.05rem]">${v >= 10000 ? wan(v) : fmt(v)}</span><span class="c-cap">${capital(v)}</span></div>`).join('')}
                        </div>
                    </div>
                    <p class="tk-rule">刮開全部 12 格，刮出 3 個相同金額，即可獲得該金額。</p>`;
                },
            },

            bj: {
                name: '21 點', price: 300, jackpot: 3000000, c1: '#139a55', c2: '#0a5a31', hi: '#ffd34d',
                desc: '比莊家大就中，21 點加倍',
                table: [[3000000, 0.000008], [100000, 0.00005], [30000, 0.0003], [10000, 0.001], [5000, 0.003], [3000, 0.006], [2000, 0.012], [1000, 0.03], [600, 0.06], [300, 0.2]],
                denoms: [300, 500, 1000, 2000, 3000, 5000, 10000, 30000, 100000, 3000000],
                weights: [30, 22, 15, 10, 8, 6, 4, 3, 2, 1],
                gen() {
                    const T = rollT(this.table);

                        else hands.push({ pt: randint(dealer + 1, 20), prize: v });

                    while (hands.length < 6) hands.push({ pt: randint(4, dealer), prize: decoy(this.denoms, this.weights) });
                    hands.forEach(h => { h.suit = pick(SUITS); });

                },
                score: t => t.hands.reduce((s, h) => s + (h.pt > t.dealer ? (h.pt === 21 ? 2 : 1) * h.prize : 0), 0),
                html(t) {

                        <div class="zone g grid-cols-3" data-zone>
                            ${t.hands.map(h => `<div class="c h-[4.6rem]" data-cell ${h.pt > t.dealer ? 'data-win' : ''}>${card(h.pt, h.suit)}${amtHTML(h.prize)}</div>`).join('')}
                        </div>
                    </div>
                    <p class="tk-rule">刮開「莊家點數」及「你的點數」，你的點數大於莊家點數，即可獲得該點數下方獎金；刮出 21 點，獲得該獎金 2 倍。平手不算。</p>`;
                },
            },

            bingo: {
                name: '27 樓賓果', price: 500, jackpot: 5000000, c1: '#7c3aed', c2: '#4c1d95', hi: '#fde047',
                desc: '刮出號碼連成線就中',
                table: [[6, 0.00001], [5, 0.0005], [4, 0.003], [3, 0.02], [2, 0.08], [1, 0.2]],
                gen() {
                    let k = rollT(this.table);
                    for (let tries = 0; tries < 2000; tries++) {
                        if (tries > 0 && tries % 400 === 0 && k > 0) k--;  // 太難湊就降一級
                        const card = [];
                        for (let col = 0; col < 5; col++) {
                            const nums = sample(range(col * 15 + 1, col * 15 + 15), 5);
                            nums.forEach((n, row) => { card[row * 5 + col] = n; });
                        }
                        card[12] = 0; // FREE
                        const target = new Set();
                        sample(BINGO_LINES, k).forEach(L => L.forEach(i => target.add(i)));

                        if (target.size > 20) continue;

                        for (const n of shuffle(range(1, 75))) {

                            if (onCard.has(n) && bingoLines(card, calls).length > k) calls.delete(n);
                        }
                        if (calls.size === 20 && bingoLines(card, calls).length === k) {
                            return { T: BINGO_PRIZE[Math.min(k, 6)], card, calls: shuffle([...calls]) };
                        }
                    }
                    return null;
                },
                score: t => BINGO_PRIZE[Math.min(bingoLines(t.card, new Set(t.calls)).length, 6)],
                html(t) {
                    return `
                    <div class="tk-panel">
                        <div class="tk-label">幸運號碼 <small>刮出來會在賓果卡上自動圈起來</small></div>
                        <div class="zone g grid-cols-5" data-zone>
                            ${t.calls.map(n => `<div class="c h-9" data-cell data-call="${n}"><span class="c-num !text-[1.05rem]">${two(n)}</span></div>`).join('')}
                        </div>
                    </div>
                    <div class="tk-panel">
                        <div class="bingo">
                            ${'BINGO'.split('').map(ch => `<div class="h">${ch}</div>`).join('')}
                            ${t.card.map((n, i) => n ? `<div class="b" data-num="${n}" data-i="${i}">${n}</div>` : `<div class="b is-free is-dab" data-i="${i}">FREE</div>`).join('')}

                            ${BINGO_PRIZE.slice(1).map((v, i) => `<span>${i + 1 === 6 ? '6 條以上' : (i + 1) + ' 條線'} <b>${wan(v)}</b></span>`).join('')}

                    </div>
                    <p class="tk-rule">刮開 20 個「幸運號碼」，與賓果卡相同的號碼圈起來（FREE 算已圈），橫、直、斜連成一條線即中獎，依連線數計獎，不累計。</p>`;
                },
                // 刮開一個號碼：賓果卡上圈起來，連成線就亮
                onOpen(el, host) {
                    const n = el.dataset.call;
                    if (!n) return;
                    const b = host.querySelector(`.bingo [data-num="${n}"]`);
                    if (!b) return;
                    b.classList.add('is-dab');
                    const dabbed = new Set([...host.querySelectorAll('.bingo .is-dab')].map(x => Number(x.dataset.i)));
                    BINGO_LINES.forEach(L => {
                        if (!L.every(i => dabbed.has(i))) return;
                        L.forEach(i => {
                            const cell = host.querySelector(`.bingo [data-i="${i}"]`);
                            if (!cell.classList.contains('is-line')) { cell.classList.add('is-line'); }
                        });
                    });
                },
            },

            hongbao: {
                name: '27 樓大紅包', price: 2000, book: 25, jackpot: 20000000, c1: '#c81e1e', c2: '#6f0f0f', hi: '#fcd34d',
                desc: '張張有獎，刮到「全」通通中',
                // 張張有獎（中獎率 100%），但平均只拿回 43%：大多是 $200、$500
                table: [[20000000, 0.000001], [1000000, 0.00001], [100000, 0.0001], [20000, 0.002], [10000, 0.008], [5000, 0.02], [3000, 0.03], [2000, 0.062], [1000, 0.155], [500, 0.29], [200, 0.432889]],
                denoms: [200, 500, 1000, 2000, 3000, 4000, 5000, 10000, 20000, 100000, 1000000, 20000000],
                weights: [30, 26, 20, 12, 8, 6, 5, 3, 2, 1.5, 0.8, 0.5],
                gen() {
                    const T = rollT(this.table) || 200;  // 張張有獎：小數誤差抽空了也給最小獎
                    const W = sample(range(1, 50), 5);
                    const nonW = shuffle(range(1, 50).filter(n => !W.includes(n)));
                    let cells = [];
                    // 刮到「全」：20 格獎金加起來剛好是 T
                    if ([10000, 20000, 100000].includes(T) && Math.random() < 0.35) {
                        const all = fillAll(T, 20, [200, 500, 1000, 2000, 5000, 10000]);
                        if (all) {
                            cells = all.map(v => ({ n: nonW.pop(), prize: v }));
                            const i = randint(0, 19);
                            cells[i] = { all: true, prize: cells[i].prize };
                            return { T, W, cells };
                        }
                    }
                    if (T) split(T, this.denoms, 4).forEach(v => cells.push(Math.random() < 0.2 ? { star: true, prize: v } : { n: pick(W), prize: v }));

                },
                score(t) {

                    return t.cells.reduce((s, c) => s + (c.star || t.W.includes(c.n) ? c.prize : 0), 0);
                },
                html(t) {
                    const allIn = t.cells.some(c => c.all);
                    const isWin = c => allIn || c.star || t.W.includes(c.n);
                    return `
                    <div class="tk-panel">
                        <div class="tk-label">中獎號碼</div>
                        <div class="zone g grid-cols-5" data-zone>
                            ${t.W.map(n => `<div class="c h-11" data-cell ${!allIn && t.cells.some(c => c.n === n) ? 'data-win' : ''}><span class="c-num">${two(n)}</span></div>`).join('')}
                        </div>
                    </div>
                    <div class="tk-panel">

                    const cost = V[idx[i] + 1] - V[idx[i]];

            cv.className = 'foil';
            cv.width = Math.round(w * dpr);
            cv.height = Math.round(h * dpr);
            zone.appendChild(cv);
            const c = cv.getContext('2d', { willReadFrequently: true });
            c.setTransform(dpr, 0, 0, dpr, 0, 0);
            const cells = [...zone.querySelectorAll('[data-cell]')].map(el => {
                const b = el.getBoundingClientRect();
                return { el, x: b.left - zr.left, y: b.top - zr.top, w: b.width, h: b.height, open: false };
            });
            const optional = zone.hasAttribute('data-optional');
            const tap = zone.hasAttribute('data-tap');  // 點一下整格就開（挖金礦：不能刮一點偷看）
            paintFoil(c, w, h, cells, optional);
            cells.forEach(k => {
                if (!k.el.hasAttribute('data-pre')) return;  // 上次已經開過的
                k.open = true;
                c.clearRect(k.x - 1, k.y - 1, k.w + 2, k.h + 2);
            });
            const brush = Math.max(18, Math.min(28, Math.min(...cells.map(k => k.w)) * 0.45));

            let pid = null, last = null, lastCheck = 0, lastSound = 0, done = false;
            const pt = e => {
                const r = cv.getBoundingClientRect();
                return { x: (e.clientX - r.left) * w / r.width, y: (e.clientY - r.top) * h / r.height };
            };
            function line(a, b) {
                c.save();
                c.globalCompositeOperation = 'destination-out';
                c.strokeStyle = '#000';  // 要不透明才擦得乾淨（畫格線時留下的是半透明）
                c.lineWidth = brush;
                c.lineCap = 'round';
                c.lineJoin = 'round';
                c.beginPath();
                c.moveTo(a.x, a.y);
                c.lineTo(b.x + 0.01, b.y);
                c.stroke();
                c.restore();
            }
            function check() {
                cells.forEach(cell => {
                    if (cell.open) return;
                    const x = Math.round(cell.x * dpr), y = Math.round(cell.y * dpr);
                    const cw = Math.max(1, Math.round(cell.w * dpr)), ch = Math.max(1, Math.round(cell.h * dpr));
                    const d = c.getImageData(x, y, cw, ch).data;
                    let clear = 0, total = 0;
                    for (let i = 3; i < d.length; i += 4 * 5) { total++; if (d[i] < 128) clear++; }
                    if (clear / total >= 0.45) open(cell);
                });
            }
            function open(cell) {
                if (cell.open) return;
                cell.open = true;
                c.clearRect(cell.x - 1, cell.y - 1, cell.w + 2, cell.h + 2);
                sfx.open();
                onCell(cell.el);
                if (!done && cells.every(k => k.open)) {
                    done = true;
                    cv.classList.add('is-done');
                    onDone();
                }
            }
            cv.addEventListener('pointerdown', e => {
                unlockAudio();
                if (pid !== null || done) return;
                if (tap) {
                    const q = pt(e);
                    const cell = cells.find(k => !k.open && q.x >= k.x && q.x <= k.x + k.w && q.y >= k.y && q.y <= k.y + k.h);
                    if (cell) open(cell);
                    return;
                }
                pid = e.pointerId;
                try { cv.setPointerCapture(e.pointerId); } catch (err) { }
                last = pt(e);
                line(last, last);
            });
            cv.addEventListener('pointermove', e => {
                if (e.pointerId !== pid) return;
                const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
                (evs.length ? evs : [e]).forEach(ev => { const p = pt(ev); line(last, p); last = p; });
                const now = performance.now();
                if (now - lastSound > 70) { sfx.scratch(); lastSound = now; }
                if (now - lastCheck > 110) { check(); lastCheck = now; }
            });
            const lift = e => { if (e.pointerId !== pid) return; pid = null; check(); };
            cv.addEventListener('pointerup', lift);
            cv.addEventListener('pointercancel', lift);
            cv.addEventListener('contextmenu', e => e.preventDefault());
            return {
                optional,
                revealAll(step, start = 0) {
                    const rest = cells.filter(k => !k.open);
                    rest.forEach((k, i) => setTimeout(() => open(k), start + i * step));
                    return rest.length;
                },
                get done() { return done; },
            };
        }

        // ===== 5. 錢包、架上 =====
        let shown = S.money;
        function setMoney(to, delta, source) {
            if (delta > 0) Wallet.earn(delta, source || 'scratch');
            else if (delta < 0) Wallet.spend(-delta);
            S.money = to = Wallet.money;
            save();
            if (delta) {
                const el = $('delta');
                el.textContent = (delta > 0 ? '+' : '−') + fmt(Math.abs(delta));
                el.style.color = delta > 0 ? '#c0261d' : '#8a8a8a';
                el.classList.remove('delta');
                void el.offsetWidth;
                el.classList.add('delta');
            }
            if (reduceMotion) { shown = to; $('money').textContent = fmt(to); return; }
            const from = shown, t0 = performance.now(), dur = Math.min(1500, 400 + Math.abs(to - from) / 50);
            const step = now => {
                const k = Math.min(1, (now - t0) / dur);
                shown = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
                $('money').textContent = fmt(shown);
                if (k < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        }

        function renderStats() {
            const rate = S.spent ? Math.round(S.won / S.spent * 100) + '%' : '—';
            $('stats').innerHTML = `刮了 ${S.count} 張・回收率 ${rate}<br>花 ${fmt(S.spent)}・中 ${fmt(S.won)}<br>最大一筆 ${S.best ? fmt(S.best) : '—'}`;
        }

        // ===== 中獎機率（照機率表算，不是猜的；改了機率表這裡自己會跟著變） =====
        const pct = p => { const v = p * 100; return String(parseFloat(v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(1) : v >= 0.1 ? v.toFixed(2) : v.toPrecision(1))) + '%'; };
        const oneIn = p => { const n = Math.round(1 / p); return '1/' + (n >= 10000 ? wan(n) : n.toLocaleString('en-US')); };
        const choose = (n, k) => { let r = 1; for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1); return r; };
        function odds(g) {
            if (g.manual) {  // 挖金礦：看你挖幾格才收手
                const ev = g.values.reduce((s, [v, p]) => s + v * p, 0);
                const rows = [1, 2, 3, 4, 5, 6].map(k => { const live = choose(12, k) / choose(16, k); return { k, live, ret: live * k * ev / g.price }; });
                const best = rows.reduce((a, b) => (b.ret > a.ret ? b : a));
                return { manual: true, win: rows[0].live, rows, best, values: g.values };
            }
            const rows = g.table.map(([v, p]) => ({ v: g === GAMES.bingo ? BINGO_PRIZE[v] : v, p, k: g === GAMES.bingo ? v : 0 }));
            const win = rows.reduce((s, r) => s + r.p, 0), ret = rows.reduce((s, r) => s + r.v * r.p, 0) / g.price;
            return { win, ret, rows, top: rows[0] };
        }

        function showOdds(key) {
            const g = GAMES[key], o = odds(g);
            const body = o.manual ? `
                <p class="text-xs text-stone-500 leading-relaxed">16 格裡有 4 顆炸彈。挖越多格，碰到炸彈的機會越大；收手時挖到的金子全部兌現。</p>
                <table class="odds-t mt-3"><thead><tr><th>挖幾格就收手</th><th>都沒碰到炸彈</th><th>平均拿回</th></tr></thead><tbody>
                ${o.rows.map(r => `<tr class="${r === o.best ? 'is-best' : ''}"><td>${r.k} 格</td><td>${pct(r.live)}</td><td>${pct(r.ret)}${r === o.best ? '<b>最划算</b>' : ''}</td></tr>`).join('')}
                </tbody></table>
                <p class="mt-4 text-xs font-black text-wabi-dark tracking-widest">每格金子多少錢</p>
                <table class="odds-t mt-2"><thead><tr><th>金額</th><th>機率</th></tr></thead><tbody>
                ${o.values.map(([v, p]) => `<tr><td class="money">${fmt(v)}</td><td>${pct(p)}</td></tr>`).join('')}
                </tbody></table>` : `
                <div class="grid grid-cols-2 gap-2 text-center">
                    <div class="odds-big"><span>中獎率</span><b>${pct(o.win)}</b><small>${o.win > 0.9999 ? '張張有獎' : `大約每 ${(1 / o.win).toFixed(1)} 張中 1 張`}</small></div>
                    <div class="odds-big"><span>回收率</span><b>${pct(o.ret)}</b><small>平均一張拿回 ${fmt(Math.round(o.ret * g.price))}</small></div>
                </div>
                <table class="odds-t mt-4"><thead><tr><th>獎金</th><th>機率</th><th></th></tr></thead><tbody>
                ${o.rows.map((r, i) => `<tr class="${i === 0 ? 'is-top' : ''}"><td class="money">${r.v >= 100000 ? '$' + wan(r.v) : fmt(r.v)}${r.k ? `<small>${r.k === 6 ? '6 條以上' : r.k + ' 條'}連線</small>` : ''}${r.v === g.price ? '<small>回本</small>' : ''}</td><td>${oneIn(r.p)}</td><td>${pct(r.p)}</td></tr>`).join('')}
                ${1 - o.win > 1e-9 ? `<tr class="is-none"><td>沒中</td><td></td><td>${pct(1 - o.win)}</td></tr>` : '<tr class="is-none"><td colspan="3">張張有獎，沒有「沒中」</td></tr>'}
                </tbody></table>`;
            $('oddsBody').innerHTML = `
                <div class="odds-head" style="--c1:${g.c1};--c2:${g.c2};--hi:${g.hi}">
                    <span class="cover-name">${g.name}</span><span class="cover-price">${fmt(g.price)}</span>
                </div>
                <div class="p-4">${body}
                    <p class="mt-4 text-[11px] text-stone-400 leading-relaxed">每一張在買的時候就照這張表抽好了，刮的順序、刮多快都不會改變結果。</p>
                </div>`;
            $('odds').classList.remove('hidden');
            requestAnimationFrame(() => $('odds').classList.add('on'));
        }
        function hideOdds() {
            const el = $('odds'); el.classList.remove('on');
            setTimeout(() => el.classList.add('hidden'), reduceMotion ? 0 : 220);
        }
        document.addEventListener('click', e => {
            const b = e.target.closest('[data-odds]');
            if (b) { e.preventDefault(); showOdds(b.dataset.odds); return; }
            if (e.target.closest('[data-odds-close]') || e.target.id === 'odds') hideOdds();
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('odds').classList.contains('hidden')) hideOdds(); });

        function renderShelf() {
            $('pending').classList.toggle('hidden', !S.queue.length);
            $('pending').innerHTML = S.queue.length ? `<button type="button" class="act is-main w-full" data-resume>還有 ${S.queue.length} 張沒刮，繼續刮</button>` : '';
            $('covers').innerHTML = Object.entries(GAMES).sort((a, b) => a[1].price - b[1].price).map(([key, g]) => `
                <div class="cover p-2.5 flex flex-col" style="--c1:${g.c1};--c2:${g.c2};--hi:${g.hi}">
                    <div class="relative z-[1] cover-name">${g.name}</div>
                    <div class="relative z-[1] text-[10px] font-bold opacity-90 leading-snug min-h-[1.9rem]">${g.desc}</div>
                    <button type="button" class="cover-odds" data-odds="${key}">${(o => o.manual ? `第一格是金子 <b>${pct(o.win)}</b>` : `中獎率 <b>${pct(o.win)}</b>`)(odds(g))}<span>獎金表</span></button>
                    <div class="relative z-[1] mt-1 flex items-center justify-between gap-1">
                        <span class="cover-price">${fmt(g.price)}</span>
                        <span class="text-[10px] font-bold text-right leading-tight">${g.jackpotText ? `<span class="text-sm font-black" style="color:var(--hi)">${g.jackpotText}</span>` : `頭獎 <span class="text-sm font-black" style="color:var(--hi)">${wan(g.jackpot)}</span>`}</span>
                    </div>
                    <div class="relative z-[1] mt-2 flex gap-1.5">
                        <button type="button" class="buy" data-buy="${key}" data-n="1" ${S.money < g.price ? 'disabled' : ''}>挑一張</button>
                        <button type="button" class="buy !flex-none w-12" data-buy="${key}" data-n="5" aria-label="買 5 張" ${S.money < g.price * 5 ? 'disabled' : ''}>×5</button>
                    </div>
                </div>`).join('');
            $('broke').classList.toggle('hidden', S.money >= 50 || S.queue.length > 0);
            $('bigs').innerHTML = S.bigs.length ? `
                <p class="text-xs font-black text-wabi-dark tracking-widest mb-2">中獎紀錄（$2,000 以上）</p>
                <ul class="text-xs text-stone-500 leading-relaxed">${S.bigs.slice(0, 10).map(b => `<li class="flex justify-between border-b border-stone-100 py-1"><span>${b.date}・${b.name}</span><span class="money text-wabi-dark">${fmt(b.amt)}</span></li>`).join('')}</ul>` : '';
            renderStats();
        }

        $('covers').addEventListener('click', e => {
            const btn = e.target.closest('[data-buy]');
            if (!btn || btn.disabled) return;
            unlockAudio();
            if (btn.dataset.n === '1') openBook(btn.dataset.buy);
            else buy(btn.dataset.buy, Number(btn.dataset.n));
        });

        // ===== 挑一張：一本刮刮樂有編號，自己挑要幾號 =====
        // 好運連連這些一本 100 張、超級加倍 50 張、大紅包 25 張；賣完換下一本。
        // 每一張的結果還是買的時候才抽（跟挑哪一號無關），所以機率跟獎金表一樣。
        const bookSize = key => GAMES[key].book || 100;
        function curBook(key) {
            S.books = S.books || {};
            let b = S.books[key];
            if (!b || b.sold.length >= bookSize(key)) {
                b = S.books[key] = { no: (b ? b.no : randint(10, 300)) + 1, sold: [] };
                save();
            }
            return b;
        }
        // 從這本拿 k 張（不夠就賣完這本、開下一本）
        function takeNums(key, nums) {
            const b = curBook(key), out = nums.map(num => ({ book: b.no, num }));
            b.sold.push(...nums);
            save();
            return out;
        }
        function takeRandom(key, k) {
            let out = [];
            while (out.length < k) {
                const b = curBook(key), left = range(1, bookSize(key)).filter(n => !b.sold.includes(n));
                out = out.concat(takeNums(key, sample(left, Math.min(k - out.length, left.length)).sort((a, b) => a - b)));
            }
            return out;
        }

        let BK = null;  // { key, sel: [] }
        function openBook(key) {
            const g = GAMES[key], b = curBook(key), N = bookSize(key);
            BK = { key, sel: [] };
            $('pickerBody').innerHTML = `
                <div class="odds-head" style="--c1:${g.c1};--c2:${g.c2};--hi:${g.hi}">
                    <span class="cover-name">${g.name}</span><span class="cover-price">${fmt(g.price)}</span>
                </div>
                <div class="p-4">
                    <div class="flex items-baseline justify-between">
                        <p class="text-sm font-black text-[#1c1917]">第 ${String(b.no).padStart(4, '0')} 本 <small class="font-bold text-stone-400">一本 ${N} 張</small></p>
                        <p class="text-xs font-bold text-stone-500">還剩 <b class="text-base text-[#1c1917]">${N - b.sold.length}</b> 張</p>
                    </div>
                    <p class="mt-1 text-[11px] text-stone-400">挑你覺得會中的號碼，最多一次 5 張。灰色的是賣掉的。</p>
                    <div id="pkGrid" class="pk-grid mt-3 ${N <= 25 ? 'grid-cols-5' : 'grid-cols-10'}" style="--c1:${g.c1};--c2:${g.c2}">
                        ${range(1, N).map(n => { const sold = b.sold.includes(n); return `<button type="button" class="pk-n ${N <= 25 ? 'is-big' : ''} ${sold ? 'is-sold' : ''}" data-pk="${n}" ${sold ? 'disabled aria-label="已賣出"' : 'aria-pressed="false"'}>${String(n).padStart(2, '0')}</button>`; }).join('')}
                    </div>
                    <div class="mt-3 flex gap-2">
                        <button type="button" class="act flex-1 !px-2" data-pk-auto>隨便抽一張</button>
                        <button type="button" class="act flex-1 !px-2" data-pk-clear>清除</button>
                    </div>
                </div>`;
            bkRender();
            $('picker').classList.remove('hidden');
            requestAnimationFrame(() => $('picker').classList.add('on'));
        }
        function bkMax() {
            const g = GAMES[BK.key], b = curBook(BK.key);
            return Math.max(0, Math.min(5, bookSize(BK.key) - b.sold.length, Math.floor(S.money / g.price)));
        }
        function bkRender() {
            const g = GAMES[BK.key], k = BK.sel.length, max = bkMax();
            $('pkGrid').classList.toggle('is-full', k >= max);
            $('pkGrid').querySelectorAll('[data-pk]:not(.is-sold)').forEach(btn => { const on = BK.sel.includes(Number(btn.dataset.pk)); btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on); });
            const go = $('pkBuy');
            go.disabled = !k;
            go.textContent = k ? `買 ${BK.sel.slice().sort((a, b) => a - b).map(n => String(n).padStart(2, '0') + ' 號').join('、')}・${fmt(g.price * k)}` : (max ? '點一個號碼' : (S.money < g.price ? '錢不夠' : '這本賣完了'));
        }
        function hidePicker() {
            const el = $('picker'); el.classList.remove('on');
            setTimeout(() => el.classList.add('hidden'), reduceMotion ? 0 : 220);
        }
        $('picker').addEventListener('click', e => {
            if (!BK) return;
            const g = GAMES[BK.key];
            const num = e.target.closest('[data-pk]');
            if (num) {
                if (num.disabled) return;
                const n = Number(num.dataset.pk), i = BK.sel.indexOf(n);
                if (i >= 0) BK.sel.splice(i, 1);
                else if (BK.sel.length < bkMax()) BK.sel.push(n);
                else {
                    if (!reduceMotion) num.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(3px)' }, { transform: 'translateX(0)' }], { duration: 200 });
                    if (window.showToast) showToast(S.money < g.price * (BK.sel.length + 1) ? '錢包不夠再多買一張' : '一次最多 5 張，先點掉一張再換');
                }
                bkRender(); return;
            }
            if (e.target.closest('[data-pk-auto]')) {
                const b = curBook(BK.key), left = range(1, bookSize(BK.key)).filter(n => !b.sold.includes(n) && !BK.sel.includes(n));
                if (left.length && BK.sel.length < bkMax()) BK.sel.push(pick(left));
                bkRender(); return;
            }
            if (e.target.closest('[data-pk-clear]')) { BK.sel = []; bkRender(); return; }
            if (e.target.closest('#pkBuy')) {
                if (!BK.sel.length || S.money < g.price * BK.sel.length) return;
                const key = BK.key, nums = takeNums(key, BK.sel.slice().sort((a, b) => a - b));
                unlockAudio();
                hidePicker();
                buy(key, nums.length, nums);
                return;
            }
            if (e.target.closest('[data-pk-close]') || e.target.id === 'picker') hidePicker();
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('picker').classList.contains('hidden')) hidePicker(); });
        $('pending').addEventListener('click', e => {
            if (!e.target.closest('[data-resume]')) return;
            unlockAudio();
            next();
        });

        // 從別頁回來（例如剛洗完頭領了工資）：錢包重新讀一次
        function syncMoney() {
            const now = Wallet.money;
            if (now === S.money) return;
            const diff = now - S.money;
            S.money = now;
            save();
            setMoney(now, 0);
            if (diff > 0) showToast(`錢包多了 ${fmt(diff)}`);
            if (!$('shelf').classList.contains('hidden')) renderShelf();
        }
        window.addEventListener('pageshow', syncMoney);

        // ===== LINE 登入 =====
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        function renderAcct() {
            const box = $('acct');
            if (Line.loggedIn) {
                const p = Line.profile || {};
                box.innerHTML = `<span class="flex items-center gap-2 min-w-0">${p.picture ? `<img src="${esc(p.picture)}" alt="" class="w-6 h-6 rounded-full shrink-0" referrerpolicy="no-referrer">` : ''}<span class="truncate">錢存在 <b class="text-wabi-dark">${esc(p.name || 'LINE 帳號')}</b> 的帳號</span></span><button type="button" data-logout class="shrink-0 min-h-[32px] px-1 underline underline-offset-4">登出</button>`;
            } else {
                box.innerHTML = `<span>錢只存在這支手機，換手機就沒了</span><button type="button" data-login class="line-btn shrink-0">LINE 登入</button>`;
            }
        }
        function refreshMoney() {
            S.money = Wallet.money;
            save();
            setMoney(S.money, 0);
            if (!$('shelf').classList.contains('hidden')) renderShelf();
        }
        $('acct').addEventListener('click', e => {
            if (e.target.closest('[data-login]')) { unlockAudio(); Line.login(); }
            if (e.target.closest('[data-logout]') && confirm('登出以後，這支手機會換回登入前的錢包。帳號裡的錢不會不見，下次登入就回來。')) Line.logout();
        });
        Wallet.on((type, d) => {
            if (type === 'server') syncMoney();
            if (type === 'login') {
                renderAcct();
                refreshMoney();
                showToast(d.isNew ? `登入了，這支手機的 ${fmt(d.left)} 存進帳號了` : `登入了，換成 ${d.name} 帳號的錢包`);
            }
            if (type === 'logout') {
                renderAcct();
                refreshMoney();
                showToast(d && d.expired ? '登入過期了，再登入一次' : '登出了，換回這支手機原本的錢包');
            }
        });
        renderAcct();
        document.addEventListener('visibilitychange', () => { if (!document.hidden) syncMoney(); });

        // ===== 6. 買、刮、對獎、兌獎 =====
        let foils = [];

        function buy(type, n, nums) {
            const g = GAMES[type];
            if (S.money < g.price * n) return;
            redeem(true); // 上一張還沒兌的先兌掉
            const at = nums || takeRandom(type, n);
            at.forEach(a => S.queue.push(newTicket(type, a)));
            S.spent += g.price * n;
            setMoney(S.money - g.price * n, -g.price * n);
            sfx.buy();
            next();
        }

        function next() {
            redeem(true);
            S.current = S.queue.shift() || null;
            save();
            if (!S.current) { backToShelf(); return; }
            openTicket();
        }

        function actions(list) {
            const box = $('playActions');
            box.innerHTML = '';
            list.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'act' + (item.cls ? ' ' + item.cls : '');
                btn.textContent = item.label;
                if (item.disabled) btn.disabled = true;
                btn.addEventListener('click', () => { unlockAudio(); item.onClick(btn); });
                box.appendChild(btn);
            });
        }

        function openTicket() {
            const t = S.current, g = GAMES[t.type];
            $('shelf').classList.add('hidden');
            $('play').classList.remove('hidden');
            const host = $('ticketHost');
            host.innerHTML = `
                <div class="tk" style="--c1:${g.c1};--c2:${g.c2};--hi:${g.hi}">
                    <div class="tk-head">
                        <div>
                            <div class="tk-name">${g.name}</div>
                            <div class="tk-jackpot">${g.jackpotText ? `<b>${g.jackpotText}</b>` : `頭獎 <b>${wan(g.jackpot)}</b>`}</div>
                        </div>
                        <div class="tk-price">${fmt(g.price)}</div>
                    </div>
                    ${g.html(t)}
                    <div class="tk-foot">
                        <span>27 樓彩券行<br>${t.num ? `第 ${String(t.book).padStart(4, '0')} 本・<b class="tk-num">${String(t.num).padStart(2, '0')}</b> 號` : `No. ${t.code.slice(0, 9)}`}<br><button type="button" class="tk-odds" data-odds="${t.type}">${g.manual ? '挖幾格最划算？' : `中獎率 ${pct(odds(g).win)}`}</button></span>
                        <div class="zone tk-code" data-zone data-optional><div class="tk-code-in" data-cell>${t.code}</div></div>
                    </div>
                </div>`;
            $('playHint').textContent = (S.queue.length ? `後面還有 ${S.queue.length} 張。` : '') + (g.hint || '用手指刮開銀漆，每格刮掉一半就會整格打開');
            actions(g.manual ? [] : [{
                label: '全部刮開', onClick: btn => {
                    btn.disabled = true;
                    let start = 0;
                    foils.filter(f => !f.optional).forEach(f => { start += f.revealAll(70, start) * 70; });
                },
            }]);
            $('wallet').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
            requestAnimationFrame(() => {
                foils = [...host.querySelectorAll('[data-zone]')].map(zone => makeFoil(zone,
                    el => {
                        g.onOpen?.(el, host, t);
                        if (zone.hasAttribute('data-optional')) showToast(pick(['這裡是給店員刮的啦。', '兌獎區刮開了，店員會皺眉。']));
                    },
                    () => { if (foils.filter(f => !f.optional).every(f => f.done)) settle(); }
                ));
                g.resume?.(t, host);
            });
        }

        // 全部刮開了：一格一格亮起中獎的格子，再出現兌獎
        function settle() {
            const t = S.current;
            if (!t || t.settled) return;
            t.settled = true;
            const g = GAMES[t.type], host = $('ticketHost');
            t.total = g.score(t);
            save();
            const wins = [...host.querySelectorAll('[data-win]')];
            wins.forEach((el, i) => setTimeout(() => { el.classList.add('is-win'); sfx.ding(i % 6); }, 250 + i * 160));
            setTimeout(() => {
                if (t.total > 0) {
                    $('playHint').innerHTML = `<span class="block text-xs font-black text-wabi-dark tracking-widest">中獎</span><span class="result-amt money block">${fmt(t.total)}</span><span class="block font-serif text-xs text-stone-500 mt-1">${capital(t.total)}</span>`;
                    sfx.win();
                    if (g.manual) { redeem(); afterRedeem(); }  // 自己按收手的，直接兌
                    else actions([{ label: `兌獎 ${fmt(t.total)}`, cls: 'is-gold', onClick: () => { redeem(); afterRedeem(); } }]);
                } else {
                    $('playHint').innerHTML = `<span class="block text-lg font-black text-stone-400 tracking-widest">沒中</span><span class="block text-xs text-stone-500 mt-1">${g.loseLine ? g.loseLine(t) : pick(['差一點。', '下一張一定中。（沒有保證）', '槓龜。', '銀漆屑掃一掃。', '老闆說：再一張就中了。'])}</span>`;
                    sfx.lose();
                    redeem(true);
                    afterRedeem();
                }
            }, 400 + wins.length * 160);
        }

        // 兌獎：錢進錢包（silent：換張或回架上時自動兌，不演）
        function redeem(silent) {
            const t = S.current;
            if (!t || !t.settled || t.redeemed) return;
            t.redeemed = true;
            S.count++;
            if (t.total) {
                S.won += t.total;
                S.best = Math.max(S.best, t.total);
                if (t.total >= 2000) S.bigs = [{ date: new Date().toLocaleDateString('zh-TW'), name: GAMES[t.type].name, amt: t.total }, ...S.bigs].slice(0, 30);
                setMoney(S.money + t.total, t.total);
                if (!silent) {
                    sfx.cash();
                    if (t.total >= GAMES[t.type].price * 10) bigWin(t.total);
                }
            }
            save();
            renderStats();
        }

        function afterRedeem() {
            const t = S.current, g = GAMES[t.type];
            const list = [];
            if (S.queue.length) list.push({ label: `下一張（還有 ${S.queue.length} 張）`, cls: 'is-main', onClick: next });
            else list.push({ label: S.money >= g.price ? `再買一張 ${fmt(g.price)}` : '錢不夠了', cls: 'is-main', disabled: S.money < g.price, onClick: () => buy(t.type, 1) });
            list.push({ label: '回彩券行', onClick: backToShelf });
            actions(list);
        }

        function backToShelf() {
            redeem(true);
            S.current = null;
            save();
            renderShelf();
            $('play').classList.add('hidden');
            $('shelf').classList.remove('hidden');
        }

        // ===== 7. 中大獎：全螢幕、彩帶 =====
        function bigWin(amount, title, cap) {
            $('bigTitle').textContent = title || '恭喜中大獎';
            $('bigCap').textContent = cap || capital(amount);
            $('bigwin').classList.remove('hidden');
            sfx.fanfare();
            confetti();
            if (reduceMotion) { $('bigAmt').textContent = fmt(amount); return; }
            const t0 = performance.now(), dur = 1600;
            const step = now => {
                const k = Math.min(1, (now - t0) / dur);
                $('bigAmt').textContent = fmt(Math.round(amount * (1 - Math.pow(1 - k, 3))));
                if (k < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        }
        $('bigwin').addEventListener('click', () => $('bigwin').classList.add('hidden'));

        function confetti() {
            if (reduceMotion) return;
            const cv = $('confetti'), c = cv.getContext('2d');
            const W = innerWidth, H = innerHeight;
            cv.width = W * dpr;
            cv.height = H * dpr;
            c.setTransform(dpr, 0, 0, dpr, 0, 0);
            const colors = ['#ffd34d', '#c0261d', '#ffffff', '#f59e0b', '#ff6b5e'];
            const ps = Array.from({ length: 140 }, () => ({
                x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
                r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, col: pick(colors),
            }));
            const t0 = performance.now();
            const step = now => {
                c.clearRect(0, 0, W, H);
                ps.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.r += p.vr;
                    c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.col; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore();
                });
                if (now - t0 < 3500) requestAnimationFrame(step);
                else c.clearRect(0, 0, W, H);
            };
            requestAnimationFrame(step);
        }

        // ===== 7b. 主人發的紅包（後台發，這裡領）=====
        const API_URL = "https://script.google.com/macros/s/AKfycbz6TWDms090u7iS_Xk0lmbbz6mlpfbCoK2mffmpRootu2Hv2lYiASpDbb7n8COwnr_K/exec";
        const HB_KEY = 'dongbuli-hongbao';  // 這支手機領過哪些紅包碼

        // 這支手機的代號（亂數，不是個資）：後端用來擋同一支手機重複領
        function deviceId() {
            let id = '';
            try { id = localStorage.getItem('dongbuli-device') || ''; } catch (e) { }
            if (!id) {
                id = window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'd-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
                try { localStorage.setItem('dongbuli-device', id); } catch (e) { }
            }
            return id;
        }
        function hbClaimed() {
            try { return JSON.parse(localStorage.getItem(HB_KEY)) || []; } catch (e) { return []; }
        }
        function hbRemember(code) {
            try { localStorage.setItem(HB_KEY, JSON.stringify([...new Set([...hbClaimed(), code])].slice(-200))); } catch (e) { }
        }

        let hbBusy = false;
        async function claimHongbao(raw) {
            const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
            if (!code) return showToast('要輸入紅包碼');
            if (hbBusy) return;
            if (hbClaimed().includes(code)) return showToast('這包紅包你領過了');
            hbBusy = true;
            showToast('正在拆紅包……');
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ type: 'bonusClaim', code, device: deviceId() }) });
                const r = await res.json();
                if (r.result === 'success') {
                    hbRemember(code);
                    document.querySelectorAll('.toast').forEach(t => t.remove());  // 「正在拆紅包」不要蓋在紅包上
                    setMoney(S.money + r.amount, r.amount, 'bonus');
                    sfx.cash();
                    bigWin(r.amount, '主人發紅包', r.note ? `「${r.note}」` : '主人說：不用謝。');
                    $('hbForm').classList.add('hidden');
                    $('hbCode').value = '';
                    if (!$('shelf').classList.contains('hidden')) renderShelf();
                } else if (r.result === 'claimed') {
                    hbRemember(code);
                    showToast('這包紅包你領過了');
                } else if (r.result === 'empty') {
                    showToast('這包紅包被領完了，下次手腳要快');
                } else {
                    showToast(r.error === '不認得的請求' ? '紅包還沒開放，跟主人說一聲' : (r.error || '領不到，等一下再試'));
                }
            } catch (e) {
                showToast('領不到，等一下再試');
            }
            hbBusy = false;
        }

        $('hbToggle').addEventListener('click', () => {
            const hidden = $('hbForm').classList.toggle('hidden');
            if (!hidden) $('hbCode').focus();
        });
        $('hbForm').addEventListener('submit', e => {
            e.preventDefault();
            unlockAudio();
            claimHongbao($('hbCode').value);
        });

        // ===== 8. 開店 =====
        $('money').textContent = fmt(S.money);
        if (S.current && !S.current.redeemed) {
            // 上次刮到一半就離開：接著刮（重新上銀漆，結果不變）
            S.current.settled = false;
            renderStats();
            openTicket();
        } else {
            S.current = null;
            save();
            renderShelf();
        }
        // 從會員中心「有紅包碼？」過來（scratch.html#hb）：直接打開輸入框
        if (location.hash === '#hb') { $('hbForm').classList.remove('hidden'); $('hbCode').focus(); }
        // 從主人給的連結進來（scratch.html?hb=紅包碼）：直接領，網址上的紅包碼拿掉
        const hbParam = new URLSearchParams(location.search).get('hb');
        if (hbParam) {
            history.replaceState(null, '', location.pathname);
            claimHongbao(hbParam);
        }
    </script>
</body>
