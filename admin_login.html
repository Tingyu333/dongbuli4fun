<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主人・確認 | 丼步喱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/theme.css?v=20261119">
    <script src="assets/theme.js?v=20261119"></script>
    <style>
        .vertical-rl {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.25em;
        }
    </style>
    <!-- 先打包好的 Tailwind（CDN 被擋或太慢時排版也不會跑掉；放在 head 最後，跟 CDN 插入的位置一樣） -->
    <link rel="stylesheet" href="assets/tailwind.css?v=20261119">
</head>

<body class="min-h-screen min-h-[100dvh] w-full flex items-center justify-center text-wabi-text font-serif">

    <!-- 手機上不放卡片（滿版的白卡會把畫面切成上中下三條），內容直接寫在紙上；電腦版才是一張卡 -->
    <div
        class="w-full max-w-md px-10 py-10 md:p-16 md:bg-white md:shadow-[0_20px_50px_-10px_rgba(0,0,0,0.05)] relative md:overflow-hidden">
        <!-- 裝飾：電腦版卡片頂端一條枯茶色；手機上「主」字放在畫面右下角 -->
        <div class="hidden md:block absolute top-0 left-0 w-full h-1 bg-wabi-accent"></div>
        <div
            class="fixed md:absolute -right-6 -bottom-6 text-[8rem] text-stone-100 md:text-stone-50 select-none pointer-events-none font-serif z-0">
            主</div>

        <div class="relative z-10">
            <div class="text-center mb-12">
                <div class="md:hidden mx-auto mb-8 w-8 h-px bg-wabi-accent"></div>
                <span class="text-xs font-sans tracking-[0.3em] text-stone-400 uppercase block mb-3">Admin Access</span>
                <h1 class="text-2xl font-light tracking-widest text-wabi-dark">歸人・確認</h1>
            </div>

            <form id="loginForm" class="space-y-8">

                <div class="space-y-1">
                    <label class="block text-[10px] font-sans tracking-widest text-stone-400">密碼</label>
                    <input type="password" id="password" required autocomplete="current-password"
                        class="w-full bg-transparent border-b border-stone-200 py-2 text-wabi-dark focus:outline-none focus:border-wabi-accent transition-colors font-sans placeholder-stone-200"
                        placeholder="Password">
                </div>

                <div class="pt-6">
                    <button type="submit" id="loginBtn"
                        class="w-full bg-wabi-dark text-white py-4 hover:bg-black transition-all duration-500 tracking-[0.3em] font-sans text-xs uppercase shadow-lg group">
                        <span class="group-hover:mr-2 transition-all">進入</span> ➔
                    </button>
                    <p id="errorMsg"
                        class="text-[10px] leading-relaxed text-wabi-shu text-center mt-4 tracking-widest opacity-0 [overflow-wrap:anywhere] transition-opacity duration-300">
                        密碼不對</p>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz6TWDms090u7iS_Xk0lmbbz6mlpfbCoK2mffmpRootu2Hv2lYiASpDbb7n8COwnr_K/exec";

        // 密碼送到後端比對（密碼存在 Apps Script 的指令碼屬性，不寫在這裡），對了會拿到 6 小時的通行證
        // 連不上後端時，說得出是哪裡卡住（Apps Script 出錯會回一頁 HTML，不是 JSON）
        async function callApi(body) {
            let res;
            try {
                res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
            } catch (e) {
                throw new Error('網路連不到 Google。手機網路正常的話，多半是部署的「誰可以存取」不是「所有人」，或部署被封存了');
            }
            const text = await res.text();
            try { return JSON.parse(text); } catch (e) { }
            const plain = text.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
            const why =
                /authoriz|授權|權限/i.test(plain) ? 'Apps Script 要重新授權：打開編輯器，隨便執行一個函式（例如 authorizeLine），按「允許」' :
                /simultaneous|同時/i.test(plain) ? '同時太多人在用（Google 一個帳號最多同時跑 30 個），等一兩分鐘再試' :
                /too many times|超出|quota|配額/i.test(plain) ? 'Google 今天的用量到上限了，明天會自己恢復' :
                /function not found|找不到.*函式|doPost/i.test(plain) ? '部署的版本裡沒有 doPost：Code.gs 可能沒貼完整，貼好後部署新版本' :
                /syntax|語法/i.test(plain) ? 'Code.gs 有語法錯誤，貼上時可能少了一段，重貼後部署新版本' :
                `後端回了一頁錯誤（HTTP ${res.status}）`;
            throw new Error(why + (plain ? `。Google 說：${plain.slice(0, 120)}` : ''));
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            try {
                const result = await callApi({ type: 'adminLogin', password });
                if (result.result === 'success') {
                    localStorage.setItem('adminToken', result.token);
                    localStorage.removeItem('isAdmin'); // 舊版的登入記號
                    window.location.href = 'admin_dashboard.html';
                    return;
                }
                msg.textContent = result.error || '密碼不對';
            } catch (err) {
                console.error('登入失敗', err);
                msg.textContent = '連不上後端：' + err.message;
                msg.dataset.keep = '1';
            }
            btn.disabled = false;
            msg.classList.remove('opacity-0');
            // 密碼不對 3 秒後隱藏；連不上後端的原因留著，方便截圖
            clearTimeout(msg._t);
            if (!msg.dataset.keep) msg._t = setTimeout(() => msg.classList.add('opacity-0'), 3000);
            delete msg.dataset.keep;
        });
    </script>
</body>

</html>
